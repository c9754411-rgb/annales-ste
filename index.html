 y a [[plus]] de facteurs de risque cardiovasculaires."], "4": ["T", "Équilibre vie professionnelle / privée difficile."], "5": ["F", "Le risque accidentel [[augmente]]."]}, "key": ["1", "2", "4"], "fmt": "QCM", "o": [["of2/o_2024-37_0.png", 4], ["of2/o_2024-37_1.png", 5]]}, {"id": "2024-38", "exam": "2024", "label": "2024", "n": 38, "stem": "Le travail en horaires atypiques entraine des troubles du sommeil (...)", "case": null, "tables": [], "imgs": [], "c": "hor", "s": ["p18-13", "p18-21"], "t": [], "g": "Sommeil de jour :\n• court et fragmenté, troubles d'endormissement, réveil précoce ;\n• on perd surtout le sommeil léger et paradoxal.\nLe **sommeil lent profond** est préservé.", "warn": ["Énoncé en partie illisible (...) : réponse donnée en supposant une question « sauf »."], "type": "single", "opts": [["A", "Troubles de l’endormissement"], ["B", "Réveil précoce"], ["C", "Perte de sommeil lent profond"], ["D", "Hypersomnie"], ["E", "Perte de sommeil paradoxal"]], "key": ["C"], "p": {"A": ["T", "Troubles de l'endormissement."], "B": ["T", "Réveil précoce."], "C": ["F", "Le sommeil [[lent profond]] est préservé."], "D": ["T", "Somnolence / hypersomnie."], "E": ["T", "Perte de sommeil paradoxal."]}, "fmt": "QCS", "o": [["of2/o_2024-38_0.png", 3]]}, {"id": "2024-39", "exam": "2024", "label": "2024", "n": 39, "stem": "L’article 12 de la loi 88/07 stipule que la médecine du travail dont la double mission est préventive essentiellement, et curative accessoirement, a pour but de :", "case": null, "tables": [], "imgs": [], "c": "intro", "s": ["p2-22", "p2-24"], "t": [], "g": "Art. 12 et activités du médecin :\n• promouvoir, prévenir, identifier, évaluer la santé, **réduire l'invalidité** ;\n• curatif accessoire (soins d'urgence, ambulatoire, MP/MCP).", "warn": [], "type": "multi", "opts": [["1", "Promouvoir et maintenir le plus haut degré de bien-être physique et mental des travailleurs."], ["2", "Prévenir et protéger les travailleurs des risques pouvant engendrer des AT-MP"], ["3", "Identifier, surveiller, en vue de réduire ou d’éliminer tous les facteurs de risque"], ["4", "Evaluer le niveau de santé des travailleurs en milieu du travail, pour réduire les cas d’aptitude des travailleurs"], ["5", "Organiser les soins d’urgence aux travailleurs, la prise en charge des traitements ambulatoires, le traitement des MP/MCP"]], "p": {"1": ["T", "Bien-être physique et mental."], "2": ["T", "Prévenir les AT-MP."], "3": ["T", "Identifier et surveiller les facteurs de risque."], "4": ["F", "La loi dit réduire les cas d'[[invalidité]], pas d'aptitude."], "5": ["T", "Soins d'urgence et traitements ambulatoires (curatif accessoire)."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_2024-39_0.png", 7]]}, {"id": "2024-40", "exam": "2024", "label": "2024", "n": 40, "stem": "La prévention tertiaire consiste à :", "case": null, "tables": [], "imgs": [], "c": "intro", "s": ["p2-33"], "t": [], "g": "Tertiaire :\n• soigner ;\n• limiter les séquelles ;\n• maintenir dans l'emploi.\n• Évaluer les dangers = primaire ;\n• dépister = secondaire.", "warn": [], "type": "multi", "opts": [["1", "Évalue les dangers des facteurs de risque sur l’homme"], ["2", "Dépister les maladies professionnelles avant qu’apparaissent des signes cliniques."], ["3", "Soigner des problèmes de santé déjà bien identifiés (conséquences d’accidents ou de maladies)"], ["4", "Minimiser les conséquences des atteintes à la santé du fait du travail."], ["5", "Prévenir le risque de perte d’emploi des salariés ayant un problème de santé lié ou non à son travail."]], "p": {"1": ["F", "Évaluer les dangers = [[primaire]]."], "2": ["F", "Dépister = [[secondaire]]."], "3": ["T", "Soigner les problèmes installés."], "4": ["T", "Minimiser les conséquences."], "5": ["T", "Prévenir la perte d'emploi."]}, "key": ["3", "4", "5"], "fmt": "QCM", "o": [["of2/o_2024-40_0.png", 7], ["of2/o_2024-40_1.png", 13]]}, {"id": "2024-41", "exam": "2024", "label": "2024", "n": 41, "stem": "Lors de l’intoxication aigue :", "case": null, "tables": [], "imgs": [], "c": "toxi", "s": ["p4-23", "p5-11"], "t": [], "g": "Intoxication aiguë :\n• exposition brève, absorption massive, signes dans les 24 h, évolution vers la mort ou la guérison ;\n• elle se déclare comme un **AT** (fait soudain).\nSommation et accumulation décrivent la chronique.", "warn": [], "type": "multi", "opts": [["1", "L’exposition est de courte durée avec absorption massive du toxique."], ["2", "L’évolution se fait soit vers la mort soit vers la guérison souvent sans séquelles."], ["3", "Les manifestations cliniques apparaissent dans les 24 premières heures."], ["4", "Les manifestations cliniques surviennent soit par effet de sommation ou par effet cumulatif."], ["5", "La déclaration se fait en accident du travail"]], "p": {"1": ["T", "Exposition courte, absorption massive."], "2": ["T", "Mort ou guérison souvent sans séquelles."], "3": ["T", "Signes dans les 24 premières heures."], "4": ["F", "Sommation et effet cumulatif décrivent l'intoxication [[chronique]]."], "5": ["T", "Déclaration en **accident du travail**."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_2024-41_0.png", 9]]}, {"id": "2024-42", "exam": "2024", "label": "2024", "n": 42, "stem": "L’intoxication chronique au mercure se caractérise par :", "case": null, "tables": [], "imgs": [], "c": "metaux", "s": ["p6-21", "p6-12"], "t": [2], "g": "Mercure chronique :\n• **tremblement intentionnel** ;\n• éréthisme ;\n• **stomatite** ;\n• **mercurialentis** (reflet du cristallin).\nLiseré de Burton et coliques sont des signes du plomb.", "warn": [], "type": "multi", "opts": [["1", "Un tremblement intentionnel"], ["2", "Un liséré de Burton"], ["3", "Une colique saturnine"], ["4", "Des mercurialentis"], ["5", "Une stomatite mercurielle"]], "p": {"1": ["T", "Tremblement intentionnel."], "2": ["F", "Le liseré de [[Burton]] est saturnin."], "3": ["F", "La colique [[saturnine]] est due au plomb."], "4": ["T", "Mercurialentis."], "5": ["T", "Stomatite mercurielle."]}, "key": ["1", "4", "5"], "fmt": "QCM", "o": [["of2/o_2024-42_0.png", 14]]}, {"id": "2024-43", "exam": "2024", "label": "2024", "n": 43, "stem": "Les effets muscariniques lors de l’intoxication aigue aux pesticides organophosphorés sont", "case": null, "tables": [], "imgs": [], "c": "pest", "s": ["p8-21", "p8-22"], "t": [], "g": "Même question que la 16 :\n• muscariniques = parasympathique post-ganglionnaire ;\n• précoces ;\n• hypersécrétion ;\n• sensibles à l'atropine.", "warn": [], "type": "multi", "opts": [["1", "Dus à l’inhibition de l’enzyme acétylcholinestérase avec accumulation subséquente d’acétylcholine au niveau des fibres post ganglionnaires parasympathiques"], ["2", "Dus à l’inhibition de l’enzyme acétylcholinestérase avec accumulation subséquente d’acétylcholine au niveau de la plaque motrice (jonction neuromusculaire)"], ["3", "Apparaissent habituellement les premiers"], ["4", "Représentés par des signes d’hypersécrétion généralisée, et des troubles de la régulation n(erveuse)"], ["5", "Régressent sous l’effet de l’Atropine"]], "p": {"1": ["T", "Post-ganglionnaires parasympathiques."], "2": ["F", "Plaque motrice = [[nicotinique]]."], "3": ["T", "Les premiers."], "4": ["T", "Hypersécrétion."], "5": ["T", "Atropine."]}, "key": ["1", "3", "4", "5"], "fmt": "QCM", "o": [["of2/o_2024-43_0.png", 4], ["of2/o_2024-43_1.png", 3]]}, {"id": "2024-44", "exam": "2024", "label": "2024", "n": 44, "stem": "Quels sont les effets des agents biologiques sur la santé ? (CRJ)", "case": null, "tables": [], "imgs": [], "c": "bio", "s": ["p16-14"], "t": [], "g": "Infectieux, immuno-allergiques, toxiniques, cancérogènes.", "warn": [], "type": "multi", "opts": [["1", "Toxinique"], ["2", "Métabolique"], ["3", "Immunoallergique"], ["4", "Cancérogènes"], ["5", "Infectieux"]], "p": {"1": ["T", "Effets **toxiniques** (endotoxines, mycotoxines)."], "2": ["F", "L'effet [[métabolique]] n'est pas décrit ; on retient infectieux, immuno-allergique, toxinique, cancérogène."], "3": ["T", "Effets **immuno-allergiques** (asthme, PHS)."], "4": ["T", "Effets **cancérogènes** (VHB, VHC)."], "5": ["T", "Effets **infectieux**."]}, "key": ["1", "3", "4", "5"], "fmt": "QCM", "o": [["of2/o_2024-44_0.png", 3]]}, {"id": "2024-45", "exam": "2024", "label": "2024", "n": 45, "stem": "Un eczéma peut être rattaché à un exercice professionnel devant", "case": null, "tables": [], "imgs": [], "c": "derm", "s": ["p13-22", "p13-24"], "t": [64], "g": "Arguments d'eczéma professionnel :\n• **patch-test positif** à un produit du poste ;\n• **régression** à l'arrêt ;\n• **rechute** à la reprise.\nLa localisation seule et les antécédents familiaux ne prouvent rien.", "warn": [], "type": "multi", "opts": [["1", "Localisation au dos des mains"], ["2", "Test épicutané positif à une substance utilisée pendant le travail"], ["3", "Régression de l’eczéma à l’arrêt du travail"], ["4", "Antécédents familiaux d’eczéma"], ["5", "Rechute de l’eczéma à la reprise du travail"]], "p": {"1": ["F", "La localisation au dos des mains [[ne suffit pas]]."], "2": ["T", "Patch-test positif à une substance du travail."], "3": ["T", "Régression à l'arrêt."], "4": ["F", "Les antécédents familiaux orientent vers l'[[atopie]]."], "5": ["T", "Rechute à la reprise."]}, "key": ["2", "3", "5"], "fmt": "QCM", "o": [["of2/o_2024-45_0.png", 6]]}, {"id": "2024-46", "exam": "2024", "label": "2024", "n": 46, "stem": "Parmi ces propositions, lesquelles sont relative au 3ème stade de surdité professionnelle :", "case": null, "tables": [], "imgs": [], "c": "bruit", "s": ["p15-22"], "t": [], "g": "3e stade :\n• surdité **confirmée** ;\n• extension aux fréquences conversationnelles ;\n• début de **gêne sociale**.\n• Encoche à 30 dB = 1er stade ;\n• handicap = 4e stade.", "warn": [], "type": "multi", "opts": [["1", "C’est une surdité confirmée"], ["2", "A ce stade, l’encoche ou scotome auditif aux 4000 Hz s’approfondit jusqu’à 30 dB(A)."], ["3", "Le travailleur commence à subir une gêne dans sa vie sociale et professionnelle."], ["4", "La perte auditive atteint 100 voire 110 dB (A) à la fréquence 4000 Hz."], ["5", "A ce stade le travailleur devient un handicapé sensoriel et professionnel."]], "p": {"1": ["T", "Surdité confirmée."], "2": ["F", "L'encoche à 30 dB est le [[1er stade]] ; au 3e stade, l'atteinte s'étend à **1 000-2 000 Hz**."], "3": ["T", "Gêne sociale et professionnelle."], "4": ["F", "100-110 dB à 4 000 Hz correspond à une surdité profonde, au-delà du 3e stade (≈ 60-70 dB)."], "5": ["F", "Le handicap sensoriel et professionnel est le [[4e stade]] ; au 3e : gêne sociale."]}, "key": ["1", "3"], "fmt": "QCM", "o": [["of2/o_2024-46_0.png", 4]]}, {"id": "2024-47", "exam": "2024", "label": "2024", "n": 47, "stem": "Le travail en horaires atypiques comprend : (CRF)", "case": null, "tables": [], "imgs": [], "c": "hor", "s": ["p18-11"], "t": [], "g": "Horaires atypiques = hors modèle diurne régulier :\n• horaires variables ;\n• 3×8 ;\n• nuit ;\n• posté.\nLa semaine standard de jour est la **référence**.", "warn": [], "type": "single", "opts": [["A", "Le travail en horaires variables"], ["B", "Le travail en semaine standard de 8 à 16 h, 5jours/semaine"], ["C", "Le travail en 3x8"], ["D", "Le travail de nuit"], ["E", "Le travail posté"]], "key": ["B"], "p": {"A": ["T", "Horaires variables."], "B": ["F", "La [[semaine standard]] de jour est la norme."], "C": ["T", "3×8."], "D": ["T", "Nuit."], "E": ["T", "Posté."]}, "fmt": "QCS", "o": [["of2/o_2024-47_0.png", 1]]}, {"id": "2024-48", "exam": "2024", "label": "2024", "n": 48, "stem": "Toutes les affections suivantes liées à l’exposition professionnelle aux rayonnements ionis(ants) sont réparées par le tableau N° 06 de la réglementation Algérienne sauf laquelle :", "case": null, "tables": [], "imgs": [], "c": "ri", "s": ["p9-33"], "t": [6], "g": "TMP 6 :\n• cytopénies ;\n• radiodermites aiguës et chroniques ;\n• cataracte ;\n• radionécrose osseuse ;\n• leucémies ;\n• CBP par inhalation ;\n• sarcome osseux.\nLes avortements n'y figurent pas.", "warn": [], "type": "single", "opts": [["A", "Radiodermites aiguës ou chronique"], ["B", "Cataracte"], ["C", "Radionécrose osseuse et sarcome osseux"], ["D", "Avortements à répétition"], ["E", "Leucémies"]], "key": ["D"], "p": {"A": ["T", "Radiodermites."], "B": ["T", "Cataracte."], "C": ["T", "Radionécrose et sarcome osseux."], "D": ["F", "Les [[avortements]] ne figurent pas au TMP 6."], "E": ["T", "Leucémies."]}, "fmt": "QCS", "o": [["of2/o_2024-48_0.png", 10]]}, {"id": "blanc1-01", "exam": "blanc1", "label": "Examen blanc n°1", "n": 1, "stem": "Concernant cet accident, quelles propositions sont exactes ?", "case": "blanc1-c1", "tables": [], "imgs": [], "c": "bio", "s": [], "t": [], "g": "AES : définition et facteurs de risque (cours Dr Lebouabi) :\n• **définition** : contact **percutané** (piqûre, coupure) ou sur **muqueuse / peau lésée** avec du sang ou un liquide visiblement sanglant ;\n• **agents principaux** : **VIH, VHB, VHC** ;\n• **déterminants du risque** : prévalence chez les patients, portage chronique, taux de transmission ;\n• **gravité** : piqûre profonde, aiguille creuse, sang visible.", "warn": [], "type": "multi", "opts": [["1", "Il s'agit d'un accident exposant au sang (AES) par effraction percutanée."], ["2", "Une projection de sang sur une peau saine et intacte aurait aussi constitué un AES."], ["3", "Les agents le plus souvent en cause sont le VIH, le VHB et le VHC."], ["4", "Le risque de transmission dépend notamment de la prévalence de l'infection chez les patients et de l'existence d'un portage chronique."], ["5", "L'aiguille creuse ayant servi à un prélèvement veineux est un facteur de gravité."]], "p": {"1": ["T", "Un AES est tout contact **percutané (piqûre, coupure)** ou sur muqueuse / peau lésée avec du sang : la piqûre profonde en fait partie."], "2": ["F", "La définition exige une **muqueuse ou une peau lésée** ; une peau saine et intacte n'en fait pas partie."], "3": ["T", "Le cours cite ces **trois virus** comme les plus souvent en cause lors d'un AES."], "4": ["T", "Les déterminants du risque sont : **prévalence** chez les patients, **portage chronique** et **taux de transmission** après exposition."], "5": ["T", "Une **piqûre profonde** avec une **aiguille creuse** remplie de sang veineux augmente l'inoculum, donc le risque."]}, "key": ["1", "3", "4", "5"], "fmt": "QCM", "o": [["of2/o_blanc1-01_0.png", 5]]}, {"id": "blanc1-02", "exam": "blanc1", "label": "Examen blanc n°1", "n": 2, "stem": "Quelle est la première conduite à tenir immédiate sur le lieu de l'accident ?", "case": "blanc1-c1", "tables": [], "imgs": [], "c": "bio", "s": [], "t": [], "g": "CAT immédiate devant un AES :\n1. **nettoyer** immédiatement : eau courante + savon ;\n2. **désinfecter par trempage ≥ 5 min** : dérivé chloré (Dakin, Javel 12° chl. diluée au 1/10e), à défaut polyvidone iodée ou alcool 70° ;\n3. **projection muqueuse** : rinçage sérum physiologique ou eau **≥ 10 min** ;\n4. **évaluation urgente** du risque (VIH, VHB, VHC) par le médecin référent ;\n5. **déclarer** l'accident et prévenir le médecin de prévention.", "warn": [], "type": "single", "opts": [["A", "Faire saigner la plaie en pressant fortement le doigt, puis appliquer de l'alcool."], ["B", "Nettoyer immédiatement à l'eau courante et au savon, puis désinfecter par trempage au moins 5 minutes dans un dérivé chloré."], ["C", "Rincer au sérum physiologique pendant 10 minutes."], ["D", "Appliquer de l'eau de Javel pure non diluée pendant 1 minute."], ["E", "Attendre la fin de la garde pour consulter le médecin référent."]], "p": {"A": ["F", "Le cours ne recommande pas de faire saigner : on **nettoie à l'eau courante et au savon**, puis on désinfecte par trempage."], "B": ["T", "C'est la CAT du cours : lavage **eau + savon**, puis **trempage ≥ 5 min** dans un dérivé chloré (Dakin, Javel 12° diluée au 1/10e), à défaut polyvidone iodée ou alcool à 70°."], "C": ["F", "Le rinçage ≥ 10 min au sérum ou à l'eau concerne les **projections sur les muqueuses** (yeux), pas la piqûre."], "D": ["F", "La Javel s'utilise **diluée au 1/10e** et avec un temps de contact d'**au moins 5 minutes**."], "E": ["F", "L'évaluation du risque doit être **urgente** : le traitement prophylactique se commence si possible **dans les 4 heures**."]}, "key": ["B"], "fmt": "QCS", "o": [["of2/o_blanc1-02_0.png", 5]]}, {"id": "blanc1-03", "exam": "blanc1", "label": "Examen blanc n°1", "n": 3, "stem": "Concernant la prise en charge médicale de cette infirmière, quelles propositions sont exactes ?", "case": "blanc1-c1", "tables": [], "imgs": [], "c": "bio", "s": [], "t": [], "g": "Prise en charge médicale d'un AES :\n• **évaluation urgente** par le médecin référent : VIH, VHB, VHC ;\n• **prophylaxie antirétrovirale** proposée **selon le risque**, à débuter **si possible dans les 4 h** ;\n• **protocole d'urgence affiché** dans le service (référent, suivi sérologique) ;\n• **suivi sérologique** et vérification du statut vaccinal VHB (anti-HBs).", "warn": [], "type": "multi", "opts": [["1", "Le délai de 6 heures écoulé est préjudiciable : la prophylaxie doit débuter si possible dans les 4 heures."], ["2", "La prophylaxie antirétrovirale est systématique quel que soit le risque évalué."], ["3", "Le protocole d'urgence, avec les coordonnées du médecin référent, doit être affiché dans le service."], ["4", "L'évaluation du risque infectieux doit porter sur le VIH, le VHB et le VHC."], ["5", "Une vaccination complète contre l'hépatite B dispense de tout contrôle sérologique."]], "p": {"1": ["T", "Le cours insiste : le **délai rapide** de mise en route du traitement (**si possible dans les 4 heures**) est un élément capital de son efficacité."], "2": ["F", "Le traitement par antirétroviraux est **proposé en fonction du risque** évalué par le médecin référent, il n'est pas systématique."], "3": ["T", "Le protocole est **rédigé avec le médecin de prévention** et **affiché** dans le service (coordonnées du référent, suivi sérologique)."], "4": ["T", "L'évaluation urgente porte sur les **trois virus** VIH, VHC et VHB."], "5": ["F", "Une vaccination à 3 doses sans contrôle des **anti-HBs** ne garantit pas la protection : le statut immunitaire doit être vérifié."]}, "key": ["1", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc1-03_0.png", 5]]}, {"id": "blanc1-04", "exam": "blanc1", "label": "Examen blanc n°1", "n": 4, "stem": "Quelles erreurs de prévention sont mises en évidence dans ce cas ?", "case": "blanc1-c1", "tables": [], "imgs": [], "c": "bio", "s": [], "t": [], "g": "Précautions standard (à respecter pour **tout** patient) :\n• **mains** : lavage ou friction hydroalcoolique, après retrait des gants, entre 2 patients ;\n• **gants** si risque de contact avec du sang ou une peau lésée ;\n• **lunettes, masque, surblouse** si risque de projection ;\n• **piquants-tranchants** : ne pas recapuchonner, ne pas désadapter à la main, conteneur **au plus près du soin**, niveau de remplissage vérifié ;\n• pas de tri des prélèvements « à risque » : **fausse sécurité**.", "warn": [], "type": "multi", "opts": [["1", "Le recapuchonnage de l'aiguille après usage."], ["2", "Un collecteur d'objets piquants non situé au plus près du soin."], ["3", "Un collecteur dont le niveau maximal de remplissage n'était pas vérifié."], ["4", "L'absence de port de surblouse pendant le prélèvement."], ["5", "L'identification des prélèvements « à risque » qui aurait évité l'accident."]], "p": {"1": ["T", "Le cours est formel : **ne pas recapuchonner** les aiguilles ni les désadapter à la main."], "2": ["T", "Le conteneur doit être **situé au plus près du soin**."], "3": ["T", "Le **niveau maximal de remplissage** du conteneur doit être vérifié : ici il était plein."], "4": ["F", "Lunettes, masque et surblouse sont réservés aux soins à **risque de projection ou d'aérosolisation** ; ce n'est pas l'erreur ici."], "5": ["F", "Au contraire, identifier des prélèvements « à risque » est **dangereux** car cela donne une **fausse sécurité** : les précautions s'appliquent à tous."]}, "key": ["1", "2", "3"], "fmt": "QCM", "o": [["of2/o_blanc1-04_0.png", 6]]}, {"id": "blanc1-05", "exam": "blanc1", "label": "Examen blanc n°1", "n": 5, "stem": "Sur le plan médico-légal et préventif, quelles propositions sont exactes ?", "case": "blanc1-c1", "tables": [], "imgs": [], "c": "bio", "s": [], "t": [], "g": "Prévention médicale du risque biologique :\n• **surveillance** obligatoire, au minimum **annuelle** ;\n• **vaccinations obligatoires** (Algérie) : **hépatite B**, **DT** ;\n• **recommandées** : grippe saisonnière… ;\n• la vaccination **complète** mais ne **remplace jamais** la prévention technique ;\n• tout AES est **déclaré** (AT) et suivi.", "warn": [], "type": "multi", "opts": [["1", "Cet accident doit être déclaré en accident du travail."], ["2", "La vaccination contre l'hépatite B est obligatoire en Algérie pour ce personnel."], ["3", "La vaccination contre la grippe saisonnière est obligatoire pour le personnel des urgences."], ["4", "La vaccination peut remplacer les mesures de prévention technique si la couverture est complète."], ["5", "La surveillance médicale du personnel exposé au risque biologique est au minimum annuelle."]], "p": {"1": ["T", "Le cours demande de **prévenir le médecin de prévention et de déclarer l'accident** : survenu au travail, c'est un AT."], "2": ["T", "Vaccinations **obligatoires en Algérie** : **hépatite B** et **tétanos (DT)**."], "3": ["F", "La grippe saisonnière est une vaccination **recommandée**, pas obligatoire."], "4": ["F", "La vaccination **ne peut en aucun cas se substituer** aux mesures de prévention : elle les **complète**."], "5": ["T", "Surveillance médicale **obligatoire**, rythme **au minimum annuel**."]}, "key": ["1", "2", "5"], "fmt": "QCM", "cs": "Infirmière de 29 ans, **piqûre profonde par aiguille creuse** lors d'un recapuchonnage, patient source à statut inconnu : **AES**. CAT : **lavage eau-savon + trempage ≥ 5 min** dans un dérivé chloré, évaluation **urgente** VIH/VHB/VHC (prophylaxie si possible **< 4 h**), **déclaration en AT**, contrôle des anti-HBs, et correction des erreurs (recapuchonnage, collecteur plein et éloigné).", "o": [["of2/o_blanc1-05_0.png", 5]]}, {"id": "blanc1-06", "exam": "blanc1", "label": "Examen blanc n°1", "n": 6, "stem": "Quel diagnostic évoquez-vous en priorité ?", "case": "blanc1-c2", "tables": [], "imgs": [], "c": "derm", "s": [], "t": [], "g": "La **gale du ciment** (cours Dr Lebouabi) :\n• **type parfait** de l'eczéma de contact : fréquent, grave, chronique ;\n• chez les ouvriers qui **gâchent le ciment** et la moitié des **vieux cimentiers** ;\n• **début** : doigts, face dorsale de l'**index et du médius**, autour des ongles, prurit ;\n• **évolution** : **main du cimentier** (œdème, hyperkératose, callosités, crevasses), puis impétiginisation, lichénification, surinfections.", "warn": [], "type": "single", "opts": [["A", "Dermatite d'irritation simple par les détergents domestiques."], ["B", "Gale du ciment : eczéma de contact professionnel du cimentier."], ["C", "Gale sarcoptique contractée sur le chantier."], ["D", "Psoriasis palmaire révélé par les microtraumatismes."], ["E", "Dermatite atopique de l'adulte."]], "p": {"A": ["F", "La topographie **professionnelle**, le rythme avec les congés et l'aspect de **main du cimentier** orientent vers la gale du ciment."], "B": ["T", "La **gale du ciment** est le type parfait de l'eczéma de contact : début aux **doigts autour des ongles** (index, médius), puis **main du cimentier** (œdème, hyperkératose, crevasses)."], "C": ["F", "Malgré son nom, la « gale du ciment » n'est **pas une parasitose** : c'est un eczéma de contact."], "D": ["F", "Le rythme travail / congés et l'exposition au ciment orientent vers une dermatose **professionnelle**, pas vers un psoriasis."], "E": ["F", "Le patient n'a **aucun antécédent d'atopie** et l'atteinte suit l'exposition professionnelle."]}, "key": ["B"], "fmt": "QCS", "o": [["of2/o_blanc1-06_0.png", 5]]}, {"id": "blanc1-07", "exam": "blanc1", "label": "Examen blanc n°1", "n": 7, "stem": "Quels facteurs favorisent l'apparition de cette dermatose ?", "case": "blanc1-c2", "tables": [], "imgs": [], "c": "derm", "s": [], "t": [], "g": "Facteurs favorisants de la gale du ciment :\n• **sécheresse** ou **macération** de la peau ;\n• **traumatismes répétés** ;\n• **lésions préexistantes** (mycoses) ;\n• **gâchage** manuel du ciment, sans protection.", "warn": [], "type": "multi", "opts": [["1", "La sécheresse de la peau."], ["2", "La macération dans des gants humides."], ["3", "Les traumatismes répétés des mains."], ["4", "Les lésions préexistantes comme les mycoses."], ["5", "Une exposition limitée au seul ciment sec, sans eau."]], "p": {"1": ["T", "Le cours cite la **sécheresse ou la macération** de la peau."], "2": ["T", "La **macération** est un facteur favorisant, d'où l'intérêt de gants adaptés et secs."], "3": ["T", "Les **traumatismes répétés** fragilisent la barrière cutanée."], "4": ["T", "Les **lésions préexistantes** (mycoses) sont citées comme facteur favorisant."], "5": ["F", "C'est le **gâchage** (ciment humide) qui expose ; le ciment sec n'est pas le facteur décrit."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc1-07_0.png", 5]]}, {"id": "blanc1-08", "exam": "blanc1", "label": "Examen blanc n°1", "n": 8, "stem": "Quelles propositions concernant les tests épicutanés (patch-tests) sont exactes ?", "case": "blanc1-c2", "tables": [], "imgs": [], "c": "derm", "s": [], "t": [], "g": "Tests épicutanés (patch-tests) :\n• **but** : reproduire l'eczéma sur **peau saine** ;\n• **technique** : produit sur **pastille adhésive** ;\n• **lecture** : **48 h** ;\n• **positif** : placard prurigineux, **érythème œdémateux + fines vésicules** ;\n• à distinguer du **prick-test** (immédiat, lecture rapide).", "warn": [], "type": "multi", "opts": [["1", "Ils reproduisent artificiellement l'eczéma sur une zone de peau saine."], ["2", "Le produit est appliqué sur une pastille adhésive et la lecture se fait 48 heures après."], ["3", "Une réaction positive associe un érythème œdémateux couvert de fines vésicules, prurigineux."], ["4", "Ils se lisent à 20 minutes comme un prick-test."], ["5", "Ils se pratiquent en pleine poussée, sur la zone atteinte."]], "p": {"1": ["T", "Ils ont pour but de **reproduire artificiellement l'eczéma** sur une **peau saine**."], "2": ["T", "Application sur **pastille adhésive**, **lecture à 48 h**."], "3": ["T", "Positif = **petit placard prurigineux** : **érythème œdémateux** se couvrant de **fines vésicules**."], "4": ["F", "La lecture à 20 min concerne le **prick-test** (hypersensibilité immédiate) ; le patch-test se lit à **48 h**."], "5": ["F", "On teste sur une **peau saine**, en dehors de la zone lésée."]}, "key": ["1", "2", "3"], "fmt": "QCM", "o": [["of2/o_blanc1-08_0.png", 5]]}, {"id": "blanc1-09", "exam": "blanc1", "label": "Examen blanc n°1", "n": 9, "stem": "Quels éléments de l'anamnèse orientent vers l'origine professionnelle de cette dermatose ?", "case": "blanc1-c2", "tables": [], "imgs": [], "c": "derm", "s": [], "t": [], "g": "Diagnostic d'une dermatose professionnelle :\n• **anamnèse** : date et mode de début, évolution **rythmée par le travail** et les **congés**, poussées liées aux changements professionnels ;\n• **antécédents** : eczéma atopique, dyshidrose ;\n• **enquête professionnelle** : produits manipulés, poste ;\n• **tests** : patch-tests orientés par les produits.", "warn": [], "type": "multi", "opts": [["1", "Une évolution rythmée par le travail, avec amélioration pendant les congés."], ["2", "Des poussées liées à des changements de poste ou de produits."], ["3", "Une topographie correspondant aux zones de contact avec le produit."], ["4", "L'absence d'antécédent d'eczéma atopique ou de dyshidrose."], ["5", "Une aggravation pendant les vacances."]], "p": {"1": ["T", "Le cours demande de rechercher une évolution **rythmée par le travail** (journée, semaine, **congés**)."], "2": ["T", "Les **épisodes de poussées** liés à certains **événements ou changements professionnels** sont à rechercher."], "3": ["T", "L'atteinte des **zones de contact** (doigts, mains) est cohérente avec l'exposition."], "4": ["T", "Les **antécédents dermatologiques** (atopie, dyshidrose) sont recherchés : leur absence renforce l'hypothèse professionnelle."], "5": ["F", "Une aggravation en vacances oriente vers une cause **extra-professionnelle** ; ici c'est une **amélioration**."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc1-09_0.png", 2]]}, {"id": "blanc1-10", "exam": "blanc1", "label": "Examen blanc n°1", "n": 10, "stem": "Quelles complications évolutives peut-on observer dans ce cas ?", "case": "blanc1-c2", "tables": [], "imgs": [], "c": "derm", "s": [], "t": [], "g": "Évolution de la gale du ciment :\n• **chronique** si l'exposition continue ;\n• vers l'**impétiginisation**, la **lichénification**, les **surinfections** ;\n• prévention : **gants adaptés**, hygiène cutanée, soins des lésions, éviction si sensibilisation.", "warn": [], "type": "multi", "opts": [["1", "L'impétiginisation."], ["2", "La lichénification."], ["3", "Les surinfections."], ["4", "La guérison spontanée malgré la poursuite de l'exposition."], ["5", "Une cyanose professionnelle des extrémités."]], "p": {"1": ["T", "Les lésions croûteuses jaunâtres traduisent l'**impétiginisation**, complication citée."], "2": ["T", "L'évolution chronique se fait vers la **lichénification**."], "3": ["T", "Les **surinfections** font partie de l'évolution décrite."], "4": ["F", "La gale du ciment a une **évolution chronique** tant que l'exposition persiste."], "5": ["F", "La cyanose professionnelle est liée à l'**arsenic** ou au **thallium**, pas au ciment."]}, "key": ["1", "2", "3"], "fmt": "QCM", "cs": "Maçon de 47 ans qui gâche le ciment sans gants : prurit des doigts autour des ongles (index, médius), puis **main du cimentier** (œdème, hyperkératose, crevasses), amélioration en congés → **gale du ciment**, eczéma de contact. Facteurs favorisants : sécheresse, macération, traumatismes, mycoses. Confirmation par **patch-tests** (lecture à 48 h). Complications : impétiginisation, lichénification, surinfections.", "o": [["of2/o_blanc1-10_0.png", 5]]}, {"id": "blanc1-11", "exam": "blanc1", "label": "Examen blanc n°1", "n": 11, "stem": "Quels mécanismes expliquent ses troubles ?", "case": "blanc1-c3", "tables": [], "imgs": [], "c": "hor", "s": [], "t": [], "g": "Travail de nuit : deux mécanismes principaux :\n• **désalignement circadien** : la lumière nocturne inhibe / retarde la **mélatonine** ; sommeil diurne difficile, court, fragmenté ; somnolence maximale en **fin de nuit** ;\n• **dette de sommeil** (pression homéostatique ↑) : fatigue, irritabilité, troubles de concentration, **micro-sommeils** ;\n• conséquence : baisse de vigilance → **erreurs et incidents**.", "warn": [], "type": "multi", "opts": [["1", "L'exposition à la lumière la nuit inhibe ou retarde la sécrétion de mélatonine."], ["2", "Le sommeil diurne est plus difficile à initier, plus court et plus fragmenté."], ["3", "La somnolence est maximale en fin de nuit (creux circadien)."], ["4", "La dette de sommeil vient d'une pression homéostatique augmentée."], ["5", "Après 9 ans, l'horloge biologique s'est totalement adaptée au travail de nuit."]], "p": {"1": ["T", "Le cours : la **lumière nocturne inhibe / retarde la mélatonine** et perturbe les rythmes biologiques."], "2": ["T", "C'est exactement la description du cours du **sommeil diurne**."], "3": ["T", "La **somnolence est maximale en fin de nuit** : ses erreurs surviennent justement en fin de nuit."], "4": ["T", "Éveil prolongé + mauvaise récupération = **dette de sommeil** (pression homéostatique ↑)."], "5": ["F", "La lumière du jour et les jours de repos **empêchent l'adaptation complète** : le désalignement circadien persiste."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc1-11_0.png", 2]]}, {"id": "blanc1-12", "exam": "blanc1", "label": "Examen blanc n°1", "n": 12, "stem": "Quelles conséquences de santé, liées au travail de nuit, sont présentes ou à rechercher chez elle ?", "case": "blanc1-c3", "tables": [], "imgs": [], "c": "hor", "s": [], "t": [], "g": "Conséquences du travail de nuit :\n• **sommeil** : dette, sommeil fragmenté ;\n• **vigilance** : micro-sommeils, erreurs, accidents (surtout en **fin de nuit**) ;\n• **digestif** et **métabolique** : épigastralgies, prise de poids ;\n• **psychique** : irritabilité, troubles de l'humeur.", "warn": [], "type": "multi", "opts": [["1", "Des troubles de la vigilance avec risque d'erreurs."], ["2", "Des troubles digestifs."], ["3", "Une prise de poids et des troubles métaboliques."], ["4", "Des troubles de l'humeur (irritabilité)."], ["5", "Une amélioration de la vigilance grâce au café en fin de nuit."]], "p": {"1": ["T", "La baisse d'attention et du temps de réaction augmente la **probabilité d'incidents et d'erreurs**, comme ici."], "2": ["T", "Les **épigastralgies** font partie des troubles digestifs du travail de nuit (horaires de repas décalés)."], "3": ["T", "La **prise de poids** et le risque **métabolique** (désynchronisation des repas) sont décrits."], "4": ["T", "L'**irritabilité** est une manifestation de la dette de sommeil."], "5": ["F", "La caféine masque un temps la somnolence, mais n'efface pas la **dette de sommeil** et perturbe le sommeil diurne."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc1-12_0.png", 2]]}, {"id": "blanc1-13", "exam": "blanc1", "label": "Examen blanc n°1", "n": 13, "stem": "Quelles mesures d'organisation et de prévention sont pertinentes ?", "case": "blanc1-c3", "tables": [], "imgs": [], "c": "hor", "s": [], "t": [], "g": "Prévention pour les travailleurs de nuit :\n• **organisation** : moins de nuits consécutives, rotation **horaire** et rapide, repos suffisant ;\n• **pauses** et **sieste** programmée ;\n• **tâches critiques** hors du creux circadien (fin de nuit) ;\n• **hygiène du sommeil** : chambre sombre et calme, horaires réguliers, caféine modérée ;\n• **surveillance médicale** renforcée.", "warn": [], "type": "multi", "opts": [["1", "Limiter le nombre de nuits consécutives."], ["2", "Favoriser une rotation rapide dans le sens horaire (matin → après-midi → nuit)."], ["3", "Prévoir des pauses et, si possible, une courte sieste pendant la nuit."], ["4", "Conseiller un environnement de sommeil diurne sombre et calme."], ["5", "Placer les tâches les plus délicates (préparation de médicaments) en fin de nuit."]], "p": {"1": ["T", "Réduire les **nuits consécutives** limite l'accumulation de dette de sommeil."], "2": ["T", "La rotation dans le **sens horaire** respecte mieux la tendance naturelle de l'horloge à retarder."], "3": ["T", "Des **pauses** et une **sieste programmée** réduisent la somnolence de fin de nuit."], "4": ["T", "Une chambre **sombre et silencieuse** améliore le sommeil de récupération ; ici elle est exposée au bruit."], "5": ["F", "C'est l'inverse : la fin de nuit est le **creux circadien**, il faut éviter d'y placer les tâches à risque."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc1-13_0.png", 6]]}, {"id": "blanc1-14", "exam": "blanc1", "label": "Examen blanc n°1", "n": 14, "stem": "Quel est le rôle du médecin du travail dans ce cas ?", "case": "blanc1-c3", "tables": [], "imgs": [], "c": "hor", "s": [], "t": [], "g": "Rôle du médecin du travail pour un travailleur de nuit :\n• **surveillance médicale** régulière ;\n• **aménagements** proposés (nuits limitées, passage de jour) ;\n• **conseil** à l'employeur sur l'organisation des horaires ;\n• **secret médical** préservé ;\n• analyse **collective** des incidents.", "warn": [], "type": "multi", "opts": [["1", "Assurer une surveillance médicale régulière de ce travailleur de nuit."], ["2", "Proposer un aménagement ou un passage temporaire en poste de jour si son état l'exige."], ["3", "Conseiller l'employeur sur l'organisation des horaires."], ["4", "Communiquer à l'employeur le détail de ses symptômes et de ses traitements."], ["5", "Analyser les erreurs de fin de nuit comme un signal d'alerte collectif."]], "p": {"1": ["T", "Le travailleur de nuit relève d'une **surveillance médicale** régulière."], "2": ["T", "Le médecin du travail peut proposer des **aménagements de poste**, y compris un passage de jour."], "3": ["T", "Il a un rôle de **conseiller** de l'employeur sur l'organisation du travail."], "4": ["F", "Il est tenu au **secret médical** : l'employeur ne reçoit que l'avis d'aptitude et les propositions d'aménagement."], "5": ["T", "Des erreurs en fin de nuit sont un **signal organisationnel** qui concerne toute l'équipe."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "cs": "Infirmière de réanimation de 38 ans, 9 ans de nuits de 12 h : fatigue, irritabilité, troubles de concentration, **erreurs en fin de nuit**, sommeil diurne court et fragmenté, prise de poids, épigastralgies. Mécanismes : **désalignement circadien** (mélatonine) et **dette de sommeil**. Conduite : limiter les nuits consécutives, rotation horaire, pauses et sieste, tâches critiques hors fin de nuit, hygiène du sommeil, surveillance et aménagement de poste.", "o": [["of2/o_blanc1-14_0.png", 1]]}, {"id": "blanc1-15", "exam": "blanc1", "label": "Examen blanc n°1", "n": 15, "stem": "Quel diagnostic retenez-vous ?", "case": "blanc1-c4", "tables": [], "imgs": [], "c": "pneumo", "s": [], "t": [], "g": "Formes cliniques de la silicose (cours Dr Lebouabi) :\n• **d'après l'évolution** : formes discrètes / latentes ; formes **suraiguës** mortelles en quelques mois par **empoussiérage massif** riche en silice ;\n• **sablage** (jeans, métal), taille de pierre, mines, fonderies = sources classiques ;\n• **radio** : opacités nodulaires des **sommets**, adénopathies hilaires ;\n• **EFR** : syndrome restrictif ou mixte.", "warn": [], "type": "single", "opts": [["A", "Asbestose."], ["B", "Silicose d'évolution rapide due à un empoussiérage massif en silice."], ["C", "Sarcoïdose."], ["D", "Asthme professionnel."], ["E", "Tuberculose pulmonaire isolée."]], "p": {"A": ["F", "L'asbestose est due à l'**amiante** et donne une fibrose **basale** ; ici l'exposition est à la silice et les lésions sont aux sommets."], "B": ["T", "Sablage au jet de sable en local fermé = **empoussiérage massif** en silice : forme **rapide**, grave, chez un sujet jeune."], "C": ["F", "La sarcoïdose peut donner des images voisines mais l'**exposition massive à la silice** et le cas collectif orientent vers la silicose."], "D": ["F", "L'asthme donne un **syndrome obstructif** réversible, pas des nodules ni un syndrome restrictif."], "E": ["F", "La tuberculose est une **complication** à rechercher (silico-tuberculose), mais n'explique pas seule le tableau et le cas collectif."]}, "key": ["B"], "fmt": "QCS", "o": [["of2/o_blanc1-15_0.png", 5]]}, {"id": "blanc1-16", "exam": "blanc1", "label": "Examen blanc n°1", "n": 16, "stem": "Quelles complications de la silicose faut-il rechercher chez ce patient ?", "case": "blanc1-c4", "tables": [], "imgs": [], "c": "pneumo", "s": [], "t": [], "g": "Complications de la silicose :\n• **infectieuses** : **silico-tuberculose** (favorisée, traitement plus difficile) ;\n• **mécaniques** : **pneumothorax** ;\n• **fonctionnelles** : insuffisance respiratoire chronique, cœur pulmonaire chronique ;\n• **cancer broncho-pulmonaire** (silice = cancérogène) ;\n• **auto-immunes** : syndrome de **Caplan-Colinet**, Erasmus.", "warn": [], "type": "multi", "opts": [["1", "La silico-tuberculose."], ["2", "Le pneumothorax."], ["3", "L'insuffisance respiratoire chronique."], ["4", "Le cancer broncho-pulmonaire."], ["5", "Le mésothéliome pleural."]], "p": {"1": ["T", "La silicose **favorise la tuberculose** et en rend le traitement plus difficile."], "2": ["T", "Le **pneumothorax** est une complication classique de la silicose."], "3": ["T", "L'évolution se fait vers l'**insuffisance respiratoire chronique**, comme chez son collègue."], "4": ["T", "La **silice cristalline** est cancérogène pulmonaire (CIRC groupe 1)."], "5": ["F", "Le mésothéliome est le cancer sentinelle de l'**amiante**, pas de la silice."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc1-16_0.png", 6]]}, {"id": "blanc1-17", "exam": "blanc1", "label": "Examen blanc n°1", "n": 17, "stem": "Quelles propositions concernant la reconnaissance de cette maladie sont exactes ?", "case": "blanc1-c4", "tables": [], "imgs": [], "c": "pneumo", "s": [], "t": [], "g": "Reconnaissance d'une silicose :\n• **TMP n° 25** (silice) ;\n• diagnostic : **exposition documentée + radiographie** ;\n• **présomption d'origine** : pas de preuve du lien à apporter si le tableau est rempli ;\n• **déclaration par la victime** à la CNAS ;\n• cas groupés → **dépistage** des collègues et alerte.", "warn": [], "type": "multi", "opts": [["1", "La silicose est réparée par le tableau de maladie professionnelle n° 25."], ["2", "Le diagnostic repose sur l'exposition documentée et les images radiologiques."], ["3", "La victime doit prouver le lien entre la maladie et son travail."], ["4", "La déclaration est faite par la victime à l'organisme de sécurité sociale."], ["5", "Le décès du collègue impose de rechercher d'autres cas dans l'atelier."]], "p": {"1": ["T", "La silicose relève du **TMP n° 25** (affections dues à la silice)."], "2": ["T", "Le diagnostic est **radiologique** sur une **exposition documentée** à la silice."], "3": ["F", "Grâce à la **présomption d'origine**, la victime n'a pas à prouver ce lien si les conditions du tableau sont remplies."], "4": ["T", "En Algérie, la MP est **déclarée par la victime** à la CNAS."], "5": ["T", "Un **cas collectif** impose un **dépistage** des autres exposés et une action sur le poste."]}, "key": ["1", "2", "4", "5"], "fmt": "QCM", "o": [["of2/o_blanc1-17_0.png", 2]]}, {"id": "blanc1-18", "exam": "blanc1", "label": "Examen blanc n°1", "n": 18, "stem": "Quelles mesures de prévention auraient dû être appliquées dans cet atelier ?", "case": "blanc1-c4", "tables": [], "imgs": [], "c": "pneumo", "s": [], "t": [], "g": "Prévention de la silicose :\n1. **substitution** (abrasifs sans silice) ;\n2. **prévention technique collective** : travail à l'**humide**, **captage** à la source, **encoffrement**, ventilation ;\n3. **protection individuelle** : appareil respiratoire adapté (pas de masque papier) ;\n4. **surveillance médicale** : radiographie, EFR, recherche de tuberculose.", "warn": [], "type": "multi", "opts": [["1", "Substituer le sable siliceux par un abrasif sans silice libre."], ["2", "Travailler à l'humide et capter les poussières à la source."], ["3", "Encoffrer le poste de sablage (cabine fermée)."], ["4", "Fournir un simple masque en papier."], ["5", "Organiser une surveillance radiologique et fonctionnelle des exposés."]], "p": {"1": ["T", "La **substitution** est la mesure la plus efficace : supprimer la silice à la source."], "2": ["T", "L'**humidification** et l'**aspiration à la source** réduisent l'empoussiérage."], "3": ["T", "L'**encoffrement** isole le procédé du travailleur."], "4": ["F", "Un masque en papier ne protège pas : il faut un **appareil de protection respiratoire** adapté, en complément des mesures collectives."], "5": ["T", "La **surveillance médicale** (radio, EFR) permet le dépistage précoce."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "cs": "Ouvrier de 31 ans, 6 ans de **sablage de jeans** au jet de sable en local fermé, sans protection : dyspnée rapidement progressive, nodules des **sommets**, adénopathies hilaires, syndrome restrictif → **silicose d'évolution rapide** par empoussiérage massif. Rechercher **silico-tuberculose**, pneumothorax, insuffisance respiratoire, cancer. Reconnaissance au **TMP 25** ; prévention par **substitution**, travail humide, captage, encoffrement, protection respiratoire et dépistage des collègues.", "o": [["of2/o_blanc1-18_0.png", 7]]}, {"id": "blanc1-19", "exam": "blanc1", "label": "Examen blanc n°1", "n": 19, "stem": "Concernant la qualification de cet accident, quelles propositions sont exactes ?", "case": "blanc1-c5", "tables": [], "imgs": [], "c": "atmp", "s": [], "t": [], "g": "Accident de trajet (cours Dr Lebouabi) :\n• **assimilé à un AT** s'il survient sur le **trajet normal** aller ou retour ;\n• **quel que soit le mode de transport** ;\n• trajet protégé : lieu de travail ↔ **résidence**, ou lieu habituel (**repas, motif familial**) ;\n• perte de protection si **interruption ou détour pour un motif étranger**, sauf **urgence, nécessité, cas fortuit, force majeure** ;\n• documenter : lieu, heure, parcours, mode de transport.", "warn": [], "type": "multi", "opts": [["1", "Il peut être assimilé à un accident du travail au titre d'accident de trajet."], ["2", "Le mode de transport (voiture personnelle) exclut la protection."], ["3", "Le détour pour un motif d'ordre familial habituel peut rester couvert."], ["4", "Tout détour, quel qu'en soit le motif, fait perdre la protection."], ["5", "Il faut documenter le lieu, l'heure, le parcours et le mode de transport."]], "p": {"1": ["T", "L'accident de trajet est **assimilé à un AT** s'il survient sur le **trajet normal** entre travail et domicile."], "2": ["F", "La protection s'applique **quel que soit le mode de transport utilisé**."], "3": ["T", "Le trajet protégé inclut un lieu où le travailleur se rend habituellement, **notamment pour des motifs d'ordre familial**."], "4": ["F", "Seul un parcours **interrompu ou détourné pour un motif étranger** au travail fait perdre la protection, sauf urgence, nécessité, cas fortuit ou force majeure."], "5": ["T", "Le cours cite les éléments à documenter : **lieu, heure, parcours, mode de transport**."]}, "key": ["1", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc1-19_0.png", 2]]}, {"id": "blanc1-20", "exam": "blanc1", "label": "Examen blanc n°1", "n": 20, "stem": "Quels sont les délais de déclaration applicables à cet accident ?", "case": "blanc1-c5", "tables": [], "imgs": [], "c": "atmp", "s": [], "t": [], "g": "Déclaration de l'AT :\n• **victime → employeur** : **24 h** (sauf force majeure) ;\n• **employeur → CNAS** : **48 h**, hors jours non ouvrables ;\n• **carence de l'employeur** : déclaration par la victime, ses ayants droit, le syndicat ou l'inspection du travail dans un délai de **4 ans** ;\n• l'employeur déclare **tout accident**, même s'il le juge non imputable (il peut émettre des réserves motivées).", "warn": [], "type": "single", "opts": [["A", "La victime informe l'employeur dans les 24 heures ; l'employeur déclare à la CNAS dans les 48 heures."], ["B", "La victime informe l'employeur dans les 48 heures ; l'employeur déclare dans les 24 heures."], ["C", "L'employeur dispose de 15 jours pour déclarer."], ["D", "La victime ne peut jamais déclarer elle-même."], ["E", "Aucune déclaration n'est nécessaire pour un accident de trajet."]], "p": {"A": ["T", "Victime → employeur : **24 h** ; employeur → CNAS : **48 h** (hors jours non ouvrables)."], "B": ["F", "Les délais sont inversés : **24 h** pour la victime, **48 h** pour l'employeur."], "C": ["F", "15 jours ne correspond à aucun délai de l'AT ; l'employeur a **48 h**."], "D": ["F", "En cas de **carence** de l'employeur, la victime peut déclarer dans un délai de **4 ans**."], "E": ["F", "L'accident de trajet étant assimilé à un AT, il **doit être déclaré**."]}, "key": ["A"], "fmt": "QCS", "o": [["of2/o_blanc1-20_0.png", 5]]}, {"id": "blanc1-21", "exam": "blanc1", "label": "Examen blanc n°1", "n": 21, "stem": "Concernant la suite de son évolution, quelles propositions sont exactes ?", "case": "blanc1-c5", "tables": [], "imgs": [], "c": "atmp", "s": [], "t": [], "g": "Évolution d'un AT :\n• **incapacité temporaire** : période de soins et d'arrêt ;\n• **guérison** : disparition des lésions, sans séquelle, **sans IPP** ;\n• **consolidation** : lésions stabilisées, séquelles possibles → **IPP** ;\n• **rechute / aggravation** : réapparition ou aggravation des lésions, **rattachée à l'accident initial**.", "warn": [], "type": "multi", "opts": [["1", "La raideur persistante de la cheville après stabilisation des lésions correspond à une consolidation avec séquelles."], ["2", "Ces séquelles peuvent donner lieu à une incapacité permanente partielle (IPP)."], ["3", "La réapparition de la douleur 6 mois plus tard peut être prise en charge comme une rechute."], ["4", "La guérison implique obligatoirement une IPP."], ["5", "La rechute doit être déclarée comme un nouvel accident sans lien avec le premier."]], "p": {"1": ["T", "La **consolidation** = lésions **stabilisées** avec possibles séquelles."], "2": ["T", "Les séquelles après consolidation sont indemnisées par une **IPP**."], "3": ["T", "Le cours prévoit l'**aggravation et la rechute** de l'AT : la réapparition des lésions après consolidation est une **rechute**."], "4": ["F", "La **guérison** est la disparition des lésions, **sans IPP**."], "5": ["F", "La rechute est **rattachée à l'accident initial**, ce n'est pas un nouvel accident."]}, "key": ["1", "2", "3"], "fmt": "QCM", "o": [["of2/o_blanc1-21_0.png", 4]]}, {"id": "blanc1-22", "exam": "blanc1", "label": "Examen blanc n°1", "n": 22, "stem": "Quel est l'intérêt de la déclaration de cet accident ?", "case": "blanc1-c5", "tables": [], "imgs": [], "c": "atmp", "s": [], "t": [], "g": "Intérêts de la déclaration :\n• **travailleur** : soins, indemnités, IPP, protection en cas de **rechute** ;\n• **employeur** : obligation légale ;\n• **médecin** : traçabilité ;\n• **prévention** : statistiques des AT, accidents de trajet et accidents mortels, impact socio-économique.", "warn": [], "type": "multi", "opts": [["1", "Pour le travailleur : la prise en charge des soins et l'indemnisation."], ["2", "Pour la prévention : alimenter les statistiques des AT et des accidents de trajet."], ["3", "Pour l'employeur : remplir une obligation légale."], ["4", "Elle est sans intérêt si le travailleur reprend rapidement."], ["5", "Elle permet de faire valoir ses droits en cas de rechute."]], "p": {"1": ["T", "La déclaration ouvre droit à la **prise en charge** et à l'**indemnisation**."], "2": ["T", "Les **données statistiques** des AT et des accidents de trajet orientent la prévention."], "3": ["T", "La déclaration est une **obligation** de l'employeur."], "4": ["F", "Elle est utile même sans arrêt prolongé : rechute possible, traçabilité, prévention."], "5": ["T", "Sans déclaration initiale, la **rechute** serait difficile à faire reconnaître."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "cs": "Technicien de 42 ans accidenté sur son **trajet de retour** avec un détour habituel pour un **motif familial** : **accident de trajet assimilé à un AT**. Déclaration : **24 h** (victime → employeur), **48 h** (employeur → CNAS), **4 ans** en cas de carence. Raideur de cheville = **consolidation avec séquelles → IPP** ; la douleur réapparue 6 mois plus tard est une **rechute** rattachée à l'accident initial.", "o": [["of2/o_blanc1-22_0.png", 5]]}, {"id": "blanc1-23", "exam": "blanc1", "label": "Examen blanc n°1", "n": 23, "stem": "Concernant ce tableau, quelles propositions sont exactes ?", "case": "blanc1-c6", "tables": [], "imgs": [], "c": "asthme", "s": [], "t": [], "g": "Asthme professionnel (Pr Kaced-Benazzouz) :\n• **définition** : maladie inflammatoire des voies aériennes, obstruction **variable** et / ou **hyperréactivité bronchique**, induites par un agent présent **exclusivement en milieu professionnel** ;\n• **avec période de latence** : forme **la plus fréquente**, agents de **haut poids moléculaire** (protéines : farines) ou de **faible poids moléculaire** (chimiques) ;\n• **sans latence** : **RADS** ;\n• **équivalents d'asthme** : rhinite, conjonctivite précédant l'asthme.", "warn": [], "type": "multi", "opts": [["1", "La rhinite et la conjonctivite précédant l'asthme sont des équivalents d'asthme."], ["2", "Il s'agit d'un asthme professionnel avec période de latence, forme la plus fréquente."], ["3", "Les farines sont des agents de haut poids moléculaire (protéines)."], ["4", "Il s'agit d'un RADS."], ["5", "L'absence de variation saisonnière est un argument en faveur de l'origine professionnelle."]], "p": {"1": ["T", "Le cours cite **rhinite, conjonctivite, rhino-conjonctivite** précédant ou associées à l'asthme comme **équivalents d'asthme**."], "2": ["T", "L'AP **avec période de latence** est la **forme la plus fréquente** ; ici, symptômes après 2 ans d'exposition."], "3": ["T", "Les agents de **haut poids moléculaire** sont des **protéines** (farines) ; les produits chimiques sont de faible poids moléculaire."], "4": ["F", "Le RADS suit une **exposition unique à forte concentration** à un **irritant** ; ici l'exposition est répétée et allergique."], "5": ["T", "Le cours cite **« pas de variation saisonnière »** dans l'anamnèse d'un AP (à l'inverse d'un asthme pollinique)."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc1-23_0.png", 4], ["of2/o_blanc1-23_1.png", 5]]}, {"id": "blanc1-24", "exam": "blanc1", "label": "Examen blanc n°1", "n": 24, "stem": "L'EFR étant normale en dehors du travail, quels examens permettent d'objectiver l'asthme et son lien avec le travail ?", "case": "blanc1-c6", "tables": [], "imgs": [], "c": "asthme", "s": [], "t": [], "g": "Diagnostic positif et professionnel :\n• examen et **EFR souvent normaux** en intercritique (obstruction réversible) → **HRBNS** (carbachol, métacholine) ;\n• **lien avec le travail** : DEP / VEMS au travail et hors travail ;\n• **agent** : prick-tests, **IgE spécifiques**, **test de provocation spécifique** en laboratoire ;\n• **éviction-réintroduction** : réactions retardées, asthmes modérés à sévères (arrêt jusqu'à **30 jours**).", "warn": [], "type": "multi", "opts": [["1", "Un test d'hyperréactivité bronchique non spécifique (HRBNS) au carbachol ou à la métacholine."], ["2", "Des mesures répétées du débit expiratoire de pointe (DEP) au travail et hors travail."], ["3", "Des prick-tests et des IgE spécifiques à la farine."], ["4", "Un test de provocation bronchique spécifique en laboratoire, avec la substance en cause."], ["5", "Une EFR normale un jour de repos élimine l'asthme."]], "p": {"1": ["T", "Si l'**EFR est normale**, on pratique une **HRBNS au carbachol ou à la métacholine**."], "2": ["T", "Le **DEP** (et le VEMS) en milieu de travail objective les **variations fonctionnelles liées au travail**."], "3": ["T", "Les **investigations immunologiques** (prick-tests, IgE spécifiques) sont orientées par les produits manipulés."], "4": ["T", "Le **test de provocation bronchique spécifique** se pratique **en laboratoire** avec la substance mise en cause."], "5": ["F", "Le syndrome obstructif **intercritique est réversible** : un examen et une EFR normaux n'éliminent pas l'asthme."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc1-24_0.png", 12]]}, {"id": "blanc1-25", "exam": "blanc1", "label": "Examen blanc n°1", "n": 25, "stem": "Quels autres professionnels sont exposés au même type d'agent que ce boulanger ?", "case": "blanc1-c6", "tables": [], "imgs": [], "c": "asthme", "s": [], "t": [], "g": "Groupe « graines et farines » (tableau des agents d'origine végétale) :\n• **agents** : farines (blé, seigle, orge, sarrasin), poussières de céréales, luzerne, ricin, soja, café vert ;\n• **exposés** : **boulangers, meuniers**, agriculteurs, **silos à grains**, huileries, engrais, agroalimentaire, **torréfaction**.", "warn": [], "type": "multi", "opts": [["1", "Les meuniers."], ["2", "Les travailleurs des silos à grains."], ["3", "Les agriculteurs."], ["4", "Les peintres au pistolet en carrosserie."], ["5", "Les travailleurs des huileries et de la torréfaction."]], "p": {"1": ["T", "Le cours cite les **meuniers** parmi les exposés aux farines."], "2": ["T", "Les **silos à grains** exposent aux poussières de céréales."], "3": ["T", "Les **agriculteurs** sont cités pour les graines et farines."], "4": ["F", "Les peintres au pistolet sont exposés aux **isocyanates**, agents chimiques, pas aux farines."], "5": ["T", "Le cours cite **huileries** (ricin, soja) et **torréfaction** (café vert) dans le groupe « graines et farines »."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc1-25_0.png", 15]]}, {"id": "blanc1-26", "exam": "blanc1", "label": "Examen blanc n°1", "n": 26, "stem": "Quelles mesures de prévention sont adaptées à cette boulangerie ?", "case": "blanc1-c6", "tables": [], "imgs": [], "c": "asthme", "s": [], "t": [], "g": "Prévention primaire de l'asthme professionnel :\n• **substituer** les agents à risque ;\n• **ventilation**, **automatisation**, **cloisonnement**, modification des procédures, **réduction des poussières** ;\n• **réduire le nombre d'exposés** ;\n• **sensibiliser** apprentis et travailleurs.", "warn": [], "type": "multi", "opts": [["1", "Réduire l'émission de poussières de farine (techniques de réduction de la poussière, versement lent, pétrin couvert)."], ["2", "Favoriser une meilleure ventilation."], ["3", "Automatiser les procédures et cloisonner les espaces de travail."], ["4", "Sensibiliser les apprentis aux risques."], ["5", "Augmenter le nombre de travailleurs affectés au pesage de la farine."]], "p": {"1": ["T", "Le cours : **utiliser des techniques de réduction de la poussière** et modifier les procédures."], "2": ["T", "**Ventilation** améliorée : mesure citée par le cours."], "3": ["T", "**Automatiser** et **cloisonner** les espaces sont des mesures de réduction de l'exposition à la source."], "4": ["T", "Le cours cite la **sensibilisation des apprentis** et des travailleurs."], "5": ["F", "Il faut au contraire **réduire le nombre de travailleurs exposés**."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc1-26_0.png", 18]]}, {"id": "blanc1-27", "exam": "blanc1", "label": "Examen blanc n°1", "n": 27, "stem": "Le diagnostic d'asthme professionnel aux farines est confirmé. Quelle est la conduite la plus adaptée ?", "case": "blanc1-c6", "tables": [], "imgs": [], "c": "asthme", "s": [], "t": [], "g": "Prise en charge d'un asthme professionnel confirmé :\n• **prévention tertiaire** : **retrait de l'exposition** à l'agent causal + **traitement optimal** ;\n• **réorientation professionnelle** ;\n• **déclaration en MP** (16 tableaux sur 85 réparent l'AP) ; le **RADS** est réparé en **AT** ;\n• dépistage des collègues exposés.", "warn": [], "type": "single", "opts": [["A", "Maintenir le poste sans changement sous traitement de fond."], ["B", "Retirer le travailleur de l'exposition, traiter de façon optimale, envisager une réorientation professionnelle et déclarer la maladie professionnelle."], ["C", "Fournir un simple masque en papier et poursuivre l'activité."], ["D", "Attendre l'apparition d'un syndrome obstructif fixé pour déclarer."], ["E", "Déclarer la maladie comme un accident du travail."]], "p": {"A": ["F", "Le traitement seul ne suffit pas : la prévention **tertiaire** repose sur le **retrait de l'exposition**."], "B": ["T", "Le cours : prévention **tertiaire** = **retrait de l'exposition** + **traitement optimal**, **réorientation professionnelle** ; l'asthme aux farines est réparable."], "C": ["F", "Un masque en papier ne protège pas d'une sensibilisation installée ; le **retrait de l'exposition** est nécessaire."], "D": ["F", "Attendre aggrave le pronostic ; la déclaration et le retrait se font **dès la confirmation**."], "E": ["F", "Seul le **RADS** est réparé au titre d'un AT ; l'asthme allergique relève des **tableaux de MP**."]}, "key": ["B"], "fmt": "QCS", "cs": "Apprenti boulanger de 24 ans, verse la farine à la main sans masque : **rhinite** au fournil puis **asthme** en fin de matinée, disparaissant en congés, sans variation saisonnière → **asthme professionnel avec période de latence** aux **farines** (haut poids moléculaire). EFR normale en intercritique → **HRBNS**, DEP au travail, **prick-tests / IgE spécifiques**, test de provocation spécifique. Prévention : réduction des poussières, ventilation, automatisation, moins d'exposés ; conduite : **retrait de l'exposition**, traitement, réorientation, **déclaration en MP**.", "o": [["of2/o_blanc1-27_0.png", 17]]}, {"id": "blanc1-28", "exam": "blanc1", "label": "Examen blanc n°1", "n": 28, "stem": "Concernant la lecture de cet audiogramme, quelles propositions sont exactes ?", "case": "blanc1-c7", "tables": [], "imgs": [], "c": "bruit", "s": [], "t": [], "g": "Lecture d'un audiogramme :\n• **tracé noir** = conduction aérienne (CA), **rouge** = conduction osseuse (CO) ;\n• CA = CO superposées → **perception** ; écart CA-CO → **transmission** ;\n• surdité due au bruit : **bilatérale, symétrique**, encoche (**scotome**) à **4000 Hz**, remontée à 8000 Hz.", "warn": [], "type": "multi", "opts": [["1", "Les conductions aérienne et osseuse sont superposées."], ["2", "Le tracé présente une encoche maximale à 4000 Hz avec remontée à 8000 Hz."], ["3", "L'atteinte est bilatérale et quasi symétrique, l'oreille gauche étant un peu plus touchée."], ["4", "L'écart entre les deux tracés traduit une surdité de transmission."], ["5", "La courbe est plate, toutes les fréquences étant atteintes de façon égale."]], "p": {"1": ["T", "Pas d'écart aérien-osseux : surdité de **perception**."], "2": ["T", "**Encoche à 4 kHz**, typique du bruit."], "3": ["T", "OG ≈ 85 dB à 4000 Hz contre 75 dB à droite."], "4": ["F", "Les tracés sont **superposés** : pas de composante de transmission."], "5": ["F", "Le tracé est **descendant** vers les aigus avec une encoche."]}, "key": ["1", "2", "3"], "fmt": "QCM", "o": [["of2/o_blanc1-28_0.png", 3], ["of2/o_blanc1-28_1.png", 4]]}, {"id": "blanc1-29", "exam": "blanc1", "label": "Examen blanc n°1", "n": 29, "stem": "À quel stade de la surdité professionnelle correspond ce tableau ?", "case": "blanc1-c7", "tables": [], "imgs": [], "c": "bruit", "s": [], "t": [], "g": "Stades de la surdité professionnelle :\n| Stade | Audiométrie | Retentissement |\n| 1 | scotome > 30 dB à 4000 Hz | aucun |\n| 2 | 50-60 dB à 4000 ; 30 dB à 2000 Hz | fait répéter, pas de gêne sociale nette |\n| 3 | extension à 1000 et 8000 ; 30 dB à 1000 Hz | gêne sociale et professionnelle, acouphènes |\n| 4 | 100-110 dB à 4000 ; ≈ 70 dB à 1000 Hz | voix normale non perçue, handicap |", "warn": [], "type": "single", "opts": [["A", "Stade 1."], ["B", "Stade 2."], ["C", "Stade 3."], ["D", "Stade 4."], ["E", "Traumatisme sonore aigu."]], "p": {"A": ["F", "Au stade 1 seule la zone de 4000 Hz est touchée, sans plainte."], "B": ["F", "Au stade 2, la perte atteint 30 dB à 2000 Hz sans gêne sociale nette."], "C": ["T", "Perte **≥ 30 dB à 1000 Hz** (40-45 dB) et **gêne en réunion** : **surdité confirmée**."], "D": ["F", "Au stade 4, la voix normale n'est plus perçue (≈ 70 dB à 1000 Hz)."], "E": ["F", "Le traumatisme sonore aigu a un début **brutal**."]}, "key": ["C"], "fmt": "QCS", "o": [["of2/o_blanc1-29_0.png", 4]]}, {"id": "blanc1-30", "exam": "blanc1", "label": "Examen blanc n°1", "n": 30, "stem": "Quel est le déficit auditif réglementaire à retenir ?", "case": "blanc1-c7", "tables": [], "imgs": [], "c": "bruit", "s": [], "t": [], "g": "Calcul du déficit auditif (TMP n°42) :\n**DA = [2 × (500 Hz) + 4 × (1000 Hz) + 3 × (2000 Hz) + 1 × (4000 Hz)] / 10**\n• calculé pour **chaque oreille** ; on retient la **meilleure oreille** ;\n• reconnaissance si **DA ≥ 35 dB**.", "warn": [], "type": "single", "opts": [["A", "42 dB."], ["B", "49 dB."], ["C", "45,5 dB."], ["D", "46,25 dB."], ["E", "35 dB."]], "p": {"A": ["T", "OD = (2×25 + 4×40 + 3×45 + 75) / 10 = **42 dB** ; OG = (2×30 + 4×45 + 3×55 + 85) / 10 = 49 dB ; meilleure oreille : **droite, 42 dB**."], "B": ["F", "C'est l'oreille **gauche**, la plus atteinte."], "C": ["F", "C'est la moyenne des deux oreilles, qui n'est pas retenue."], "D": ["F", "C'est la moyenne arithmétique simple de l'OD, non pondérée."], "E": ["F", "35 dB est le **seuil** de reconnaissance."]}, "key": ["A"], "fmt": "QCS", "o": [["of2/o_blanc1-30_0.png", 7]]}, {"id": "blanc1-31", "exam": "blanc1", "label": "Examen blanc n°1", "n": 31, "stem": "Concernant le diagnostic différentiel de cette surdité, quelles propositions sont exactes ?", "case": "blanc1-c7", "tables": [], "imgs": [], "c": "bruit", "s": [], "t": [], "g": "Diagnostics différentiels d'une surdité de perception :\n• **endocochléaire** : surdité brusque, toxique (aminosides, CO, Pb, CS₂, benzol), **presbyacousie**, Ménière ;\n• **infectieuse** : syphilis, méningite, oreillons, rougeole… ;\n• **traumatique** : fracture du rocher, explosion ;\n• **rétrocochléaire** : **schwannome** (atteinte unilatérale) ; centrale.", "warn": [], "type": "multi", "opts": [["1", "Une presbyacousie est plus tardive et ne donne pas d'encoche nette à 4000 Hz."], ["2", "Un traumatisme sonore aigu a un début brutal, souvent unilatéral."], ["3", "Un schwannome du nerf auditif est évoqué devant une atteinte unilatérale."], ["4", "La superposition des tracés oriente vers une otospongiose."], ["5", "La co-exposition aux solvants est un cofacteur aggravant à rechercher."]], "p": {"1": ["T", "La presbyacousie est liée au **vieillissement**, sans encoche nette."], "2": ["T", "Exposition **brutale**, explosion ou bruit impulsionnel unique."], "3": ["T", "Il est évoqué devant une **anomalie unilatérale** de la VIIIe paire."], "4": ["F", "L'otospongiose donne un **écart aérien-osseux** (transmission)."], "5": ["T", "Les **solvants aromatiques** fragilisent l'oreille interne."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc1-31_0.png", 4]]}, {"id": "blanc1-32", "exam": "blanc1", "label": "Examen blanc n°1", "n": 32, "stem": "Concernant la reconnaissance de cette surdité en maladie professionnelle, quelles propositions sont exactes ?", "case": "blanc1-c7", "tables": [], "imgs": [], "c": "bruit", "s": [], "t": [], "g": "TMP n°42 :\n• déficit bilatéral cochléaire, irréversible, **≥ 35 dB** sur la meilleure oreille ;\n• confirmé **3 semaines à 1 an** après l'arrêt de l'exposition ;\n• DPC **1 an** ; exposition **≥ 1 an** (30 j pour propulseurs, réacteurs, moteurs à pistons) ;\n• liste **limitative**.", "warn": [], "type": "multi", "opts": [["1", "L'audiométrie réalisée 2 mois après la mutation respecte la fenêtre de 3 semaines à 1 an."], ["2", "La durée d'exposition minimale d'1 an est remplie."], ["3", "Le critère de 35 dB sur la meilleure oreille est rempli."], ["4", "Les travaux sur métaux par percussion et l'usage de marteaux pneumatiques figurent dans la liste limitative."], ["5", "Le délai de prise en charge est de 3 ans."]], "p": {"1": ["T", "Confirmation **3 semaines à 1 an** après l'arrêt de l'exposition : 2 mois convient."], "2": ["T", "18 ans d'exposition ≥ **1 an**."], "3": ["T", "42 dB ≥ **35 dB**."], "4": ["T", "Emboutissage, meulage, **marteaux pneumatiques** sont listés au TMP 42."], "5": ["F", "DPC : **1 an**."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc1-32_0.png", 7]]}, {"id": "blanc1-33", "exam": "blanc1", "label": "Examen blanc n°1", "n": 33, "stem": "Concernant l'évaluation de l'exposition sonore à son ancien poste, quelles propositions sont exactes ?", "case": "blanc1-c7", "tables": [], "imgs": [], "c": "bruit", "s": [], "t": [], "g": "Mesure du bruit :\n• instrument : **sonomètre** ;\n• **dB(A)** : niveau perçu ; **dB(C)** : niveaux très élevés ;\n• repères : 50 dB(A) conversation, **80 dB(A)** seuil de nocivité sur 8 h, 120 dB(A) douleur ;\n• **85** alerte, **90** danger ; échelle logarithmique (2 machines = + 3 dB).", "warn": [], "type": "multi", "opts": [["1", "Le sonomètre est l'instrument de mesure de base du bruit."], ["2", "Le décibel pondéré A, dB(A), tient compte du niveau réellement perçu par l'oreille."], ["3", "Pour les niveaux très élevés, comme les pics impulsionnels, on utilise le dB(C)."], ["4", "Arrêter une machine sur deux machines identiques baisse le niveau de 6 dB(A)."], ["5", "85 dB(A) est la cote d'alerte et 90 dB(A) la cote de danger."]], "p": {"1": ["T", "Le **sonomètre** est l'instrument de mesure basique."], "2": ["T", "**dB(A)** : niveau perçu."], "3": ["T", "Niveaux très élevés : **dB(C)**."], "4": ["F", "La baisse n'est que de **3 dB(A)**."], "5": ["T", "Instruction ministérielle de 1986."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc1-33_0.png", 2]]}, {"id": "blanc1-34", "exam": "blanc1", "label": "Examen blanc n°1", "n": 34, "stem": "Quelle conduite le médecin du travail doit-il tenir ?", "case": "blanc1-c7", "tables": [], "imgs": [], "c": "bruit", "s": [], "t": [], "g": "Conduite à tenir :\n• **travailleur** : poste calme, audiométrie de confirmation, déclaration (TMP 42), information, suivi ;\n• **entreprise** : mesure du bruit, **réduction à la source**, propagation (encoffrement, écrans), organisation (rotation), **PICB en complément**, formation, surveillance semestrielle.", "warn": [], "type": "multi", "opts": [["1", "Maintenir le travailleur à un poste non exposé au bruit."], ["2", "Agir en priorité sur la réduction du bruit à la source dans l'atelier."], ["3", "Proposer les protecteurs individuels en complément des mesures collectives."], ["4", "Considérer que la mutation de poste a pour but d'ouvrir le droit à l'indemnisation."], ["5", "Assurer aux collègues exposés une surveillance médicale au moins semestrielle avec audiométrie annuelle."]], "p": {"1": ["T", "La **mutation** évite l'aggravation."], "2": ["T", "Solution **collective** la plus efficace."], "3": ["T", "Les PICB **complètent** les mesures collectives."], "4": ["F", "Elle vise à **éviter l'aggravation**, non à indemniser."], "5": ["T", "> 85 dB(A) : **SMS tous les 6 mois**, audiométrie **annuelle**."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "cs": "Métallurgiste de 49 ans, 18 ans à 92-95 dB(A) avec pics impulsionnels : **surdité de perception bilatérale** (CA = CO, encoche à 4 kHz), **stade 3**. DA : OD **42 dB**, OG 49 dB → meilleure oreille **42 dB** (≥ 35). Audiométrie à 2 mois de la mutation (fenêtre respectée) : reconnaissance au **TMP n°42**. Prévention : source d'abord, PICB en complément.", "o": [["of2/o_blanc1-34_0.png", 5]]}, {"id": "blanc1-35", "exam": "blanc1", "label": "Examen blanc n°1", "n": 35, "stem": "Concernant la classification des agents biologiques selon la gravité du risque, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "bio", "s": [], "t": [], "g": "Classification des agents biologiques (gravité croissante) :\n| Groupe | Maladie | Propagation | Traitement/prophylaxie |\n| 1 | non | — | — |\n| 2 | oui | peu probable | oui |\n| 3 | grave | possible | oui |\n| 4 | grave | risque élevé | non |", "warn": [], "type": "multi", "opts": [["1", "Un agent du groupe 1 n'est pas susceptible de provoquer une maladie chez l'homme."], ["2", "Un agent du groupe 4 provoque une maladie grave sans prophylaxie ni traitement efficace."], ["3", "Pour un agent du groupe 3, la propagation dans la collectivité est possible."], ["4", "Pour un agent du groupe 2, la propagation dans la collectivité est probable."], ["5", "Le risque est surtout important pour les groupes 3 et 4."]], "p": {"1": ["T", "Groupe 1 : **non susceptible** de provoquer une maladie."], "2": ["T", "Groupe 4 : maladie **grave**, risque élevé de propagation, **pas de prophylaxie ni de traitement efficace**."], "3": ["T", "Groupe 3 : maladie grave, propagation **possible**, prophylaxie ou traitement **existants**."], "4": ["F", "Groupe 2 : propagation **peu probable**."], "5": ["T", "Le cours : le risque est important pour les **3e et 4e groupes**, qui nécessitent des protections adéquates."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc1-35_0.png", 1]]}, {"id": "blanc1-36", "exam": "blanc1", "label": "Examen blanc n°1", "n": 36, "stem": "Concernant les déchets d'activités de soins (DAS), quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "bio", "s": [], "t": [], "g": "Typologie des DAS :\n• **non dangereux** : **DMA** (emballages, papiers, restes alimentaires) → **filière noire** ;\n• **dangereux**, 4 catégories :\n1. **DASRI** : OPCT + déchets mous souillés (+ assimilés : biopsies, placentas, produits sanguins) ;\n2. **DRCT** : cytotoxiques, médicaments périmés, mercure, réactifs, solvants, piles… ;\n3. **déchets anatomiques** : organes, membres ;\n4. **déchets radioactifs** → **filière blanche**.", "warn": [], "type": "multi", "opts": [["1", "Les aiguilles, lames et la verrerie cassée sont des objets piquants coupants tranchants (OPCT)."], ["2", "Les compresses souillées de sang sont des DASRI."], ["3", "Les médicaments périmés et les cytotoxiques sont des déchets à risque chimique et toxique (DRCT)."], ["4", "Les papiers administratifs et les emballages sont des déchets ménagers et assimilés (filière noire)."], ["5", "Les déchets radioactifs de médecine nucléaire suivent la filière noire des ordures ménagères."]], "p": {"1": ["T", "Les **OPCT** (rasoirs, lames, bistouris, aiguilles, verrerie cassée…) sont des **DASRI** classés déchets spéciaux dangereux."], "2": ["T", "Les **déchets mous** ayant été en contact avec un produit biologique (coton, compresses) sont des DASRI."], "3": ["T", "Les **cytotoxiques** et les **médicaments périmés** sont des **DRCT**."], "4": ["T", "Les **DMA** (emballages, papiers, restes alimentaires) suivent la **filière noire**."], "5": ["F", "Les déchets **radioactifs** suivent la **filière blanche**, pas la filière noire."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc1-36_0.png", 7]]}, {"id": "blanc1-37", "exam": "blanc1", "label": "Examen blanc n°1", "n": 37, "stem": "Concernant les effets toxiniques des agents biologiques, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "bio", "s": [], "t": [], "g": "Effets toxiniques :\n• **endotoxines** : lyse des bactéries **G-**, eaux usées, ordures → **ODTS** (fièvre, courbatures, oppression, **réversible**), SDRA, atteintes hépatobiliaires ;\n• **mycotoxines** (Aspergillus, Penicillium) : humidité, céréales, épices → **aflatoxines cancérogènes** par ingestion.", "warn": [], "type": "multi", "opts": [["1", "Les endotoxines sont libérées lors de la lyse des bactéries Gram négatif."], ["2", "Le syndrome toxique des poussières organiques (ODTS) associe fièvre et courbatures après un pic d'exposition."], ["3", "L'ODTS laisse habituellement des séquelles respiratoires définitives."], ["4", "Les aflatoxines sont des mycotoxines cancérogènes par ingestion d'aliments contaminés."], ["5", "Les égoutiers et le personnel des stations d'épuration sont exposés aux endotoxines."]], "p": {"1": ["T", "Les **endotoxines** sont libérées lors de la **lyse des bactéries G-**."], "2": ["T", "L'**ODTS** = « simple » fièvre + courbatures, état grippal, oppression thoracique après un **pic d'exposition**."], "3": ["F", "Les manifestations sont **réversibles sans séquelles**."], "4": ["T", "Les **aflatoxines** (mycotoxines d'Aspergillus) ont des effets **cancérogènes par ingestion**."], "5": ["T", "Les endotoxines persistent dans les **eaux usées** et les ordures ménagères : égoutiers, stations d'épuration, éboueurs."]}, "key": ["1", "2", "4", "5"], "fmt": "QCM", "o": [["of2/o_blanc1-37_0.png", 3]]}, {"id": "blanc1-38", "exam": "blanc1", "label": "Examen blanc n°1", "n": 38, "stem": "Concernant les voies de pénétration et les effets des nanoparticules, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "nano", "s": [], "t": [], "g": "Nanomatériaux et santé (Pr Fernane) :\n• **taille** : 1 à 100 nm ;\n• **voie principale** : **respiratoire** → dépôt alvéolaire ;\n• **surface spécifique** élevée → réactivité, inflammation, stress oxydant ;\n• **translocation** possible vers d'autres organes ;\n• la toxicité dépend de la taille, de la forme, de la surface, pas seulement de la masse.", "warn": [], "type": "multi", "opts": [["1", "La voie respiratoire est la principale voie de pénétration en milieu professionnel."], ["2", "Leur petite taille leur permet d'atteindre les alvéoles pulmonaires."], ["3", "Leur surface spécifique élevée augmente leur réactivité biologique."], ["4", "Elles peuvent passer dans la circulation sanguine et atteindre d'autres organes."], ["5", "À masse égale, une nanoparticule est moins toxique que la même substance sous forme micrométrique."]], "p": {"1": ["T", "L'**inhalation** est la voie principale d'exposition professionnelle."], "2": ["T", "La taille nanométrique favorise un **dépôt alvéolaire** profond."], "3": ["T", "La **grande surface spécifique** explique leurs **propriétés uniques** et leur réactivité (inflammation, stress oxydant)."], "4": ["T", "Une **translocation** vers la circulation et d'autres organes est décrite."], "5": ["F", "C'est souvent l'inverse : à masse égale, la **surface** et le **nombre** de particules sont bien plus grands, d'où une réactivité accrue."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc1-38_0.png", 6], ["of2/o_blanc1-38_1.png", 26]]}, {"id": "blanc1-39", "exam": "blanc1", "label": "Examen blanc n°1", "n": 39, "stem": "Quels secteurs exposent aux nanomatériaux ?", "case": null, "tables": [], "imgs": [], "c": "nano", "s": [], "t": [], "g": "Secteurs exposant aux nanomatériaux :\n• **cosmétique**, **BTP**, **électronique**, **textile**, automobile, alimentation, peintures ;\n• usage **surtout industriel**, la médecine n'est qu'un secteur parmi d'autres.", "warn": [], "type": "multi", "opts": [["1", "La cosmétique."], ["2", "Le bâtiment et les travaux publics."], ["3", "L'électronique."], ["4", "Le textile."], ["5", "Uniquement la recherche médicale."]], "p": {"1": ["T", "La **cosmétique** utilise des nanomatériaux (ex. filtres solaires)."], "2": ["T", "Le **BTP** (ciments, peintures, revêtements) est un secteur d'usage."], "3": ["T", "L'**électronique** est un secteur majeur."], "4": ["T", "Le **textile** (tissus techniques, antibactériens) en utilise."], "5": ["F", "Les usages sont **surtout industriels**, pas limités à la médecine."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc1-39_0.png", 13]]}, {"id": "blanc1-40", "exam": "blanc1", "label": "Examen blanc n°1", "n": 40, "stem": "Quelles populations sont les plus sensibles à la pollution atmosphérique ?", "case": null, "tables": [], "imgs": [], "c": "pollu", "s": [], "t": [], "g": "Populations sensibles à la pollution :\n• **enfants**, **personnes âgées**, **femmes enceintes** ;\n• **malades** respiratoires (asthme, BPCO) et **cardiovasculaires** ;\n• la sensibilité dépend de l'individu ; la **concentration**, elle, dépend des émissions et de la météo.", "warn": [], "type": "multi", "opts": [["1", "Les enfants."], ["2", "Les personnes âgées."], ["3", "Les asthmatiques et les insuffisants respiratoires."], ["4", "Les personnes souffrant de maladies cardiovasculaires."], ["5", "Les adultes jeunes en bonne santé sont totalement protégés."]], "p": {"1": ["T", "Les **enfants** (poumons en développement, ventilation élevée) sont plus sensibles."], "2": ["T", "Les **personnes âgées** sont plus vulnérables."], "3": ["T", "Les **malades respiratoires** chroniques sont aggravés par la pollution."], "4": ["T", "Les **cardiaques** sont une population sensible."], "5": ["F", "Personne n'est totalement protégé : les adultes sains sont **moins sensibles**, pas immunisés."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc1-40_0.png", 27]]}, {"id": "blanc1-41", "exam": "blanc1", "label": "Examen blanc n°1", "n": 41, "stem": "Concernant les périodes de vulnérabilité aux perturbateurs endocriniens, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "pe", "s": [], "t": [], "g": "Fenêtres de susceptibilité aux PE :\n• **grossesse** (vie fœtale) ;\n• **petite enfance** ;\n• **puberté** ;\n• effets **différés** et **transgénérationnels** possibles ;\n• d'où l'intérêt d'une prévention chez les **femmes enceintes** exposées.", "warn": [], "type": "multi", "opts": [["1", "La grossesse
