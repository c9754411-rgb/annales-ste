est une fenêtre de susceptibilité."], ["2", "La petite enfance est une fenêtre de susceptibilité."], ["3", "La puberté est une fenêtre de susceptibilité."], ["4", "Des effets peuvent apparaître à distance de l'exposition, voire sur les générations suivantes."], ["5", "L'âge adulte est la période la plus sensible."]], "p": {"1": ["T", "La **vie fœtale** est la fenêtre la plus sensible."], "2": ["T", "La **petite enfance** fait partie des fenêtres de susceptibilité."], "3": ["T", "La **puberté** est une période de vulnérabilité hormonale."], "4": ["T", "Des effets **différés** et **transgénérationnels** sont décrits."], "5": ["F", "L'adulte est **moins sensible** que le fœtus, l'enfant ou l'adolescent."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc1-41_0.png", 7], ["of2/o_blanc1-41_1.png", 9]]}, {"id": "blanc1-42", "exam": "blanc1", "label": "Examen blanc n°1", "n": 42, "stem": "Selon Maslach et Jackson, quelles sont les dimensions du syndrome d'épuisement professionnel ?", "case": null, "tables": [], "imgs": [], "c": "burn", "s": [], "t": [], "g": "Le burn-out selon **Maslach et Jackson (1981)** (Dr Belkassa) :\n• modèle **tridimensionnel et séquentiel**, chez les professionnels impliqués auprès d'autrui ;\n1. **épuisement émotionnel** : composante clé ;\n2. **dépersonnalisation** : cynisme, déshumanisation ;\n3. **réduction de l'accomplissement personnel** : sentiment d'inefficacité.", "warn": [], "type": "multi", "opts": [["1", "L'épuisement émotionnel."], ["2", "La dépersonnalisation (cynisme, déshumanisation)."], ["3", "La réduction de l'accomplissement personnel."], ["4", "L'hyperactivité euphorique."], ["5", "Les idées délirantes."]], "p": {"1": ["T", "Première dimension : **épuisement émotionnel** (« je me sens vidé »)."], "2": ["T", "Deuxième dimension : **dépersonnalisation**, cynisme, détachement excessif."], "3": ["T", "Troisième dimension : **réduction de l'accomplissement personnel**."], "4": ["F", "L'euphorie est à l'opposé du burn-out et n'en fait pas partie."], "5": ["F", "Le burn-out n'est pas un trouble psychotique."]}, "key": ["1", "2", "3"], "fmt": "QCM", "o": [["of2/o_blanc1-42_0.png", 11]]}, {"id": "blanc1-43", "exam": "blanc1", "label": "Examen blanc n°1", "n": 43, "stem": "Concernant l'histoire et les facteurs de risque individuels du burn-out, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "burn", "s": [], "t": [], "g": "Burn-out : origine et facteurs individuels (Dr Belkassa) :\n• **Freudenberger (1974)** : première description, chez de jeunes **bénévoles idéalistes** ;\n• **1980** : « état de fatigue chronique, de dépression et de frustration » quand l'engagement ne produit pas les récompenses attendues ;\n• **surengagement** : facteur clé individuel (travail au centre de la vie, attentes élevées, idéalisme extrême) ;\n• les facteurs individuels **ne servent jamais à sélectionner** les travailleurs ni à exonérer l'employeur.", "warn": [], "type": "multi", "opts": [["1", "Herbert Freudenberger, psychanalyste américain, en a donné la première description en 1974."], ["2", "Il l'a observé chez de jeunes bénévoles enthousiastes et idéalistes d'une clinique accueillant des toxicomanes."], ["3", "Le surengagement est un facteur clé de l'épuisement professionnel."], ["4", "Les facteurs individuels peuvent servir à sélectionner les travailleurs à l'embauche."], ["5", "Les facteurs individuels exonèrent l'employeur des facteurs de risque liés à l'environnement de travail."]], "p": {"1": ["T", "Le cours : **Freudenberger (1974)**, « père spirituel » du burn-out."], "2": ["T", "Il décrit de **jeunes bénévoles enthousiastes, idéalistes**, dans une clinique de jour new-yorkaise pour **toxicomanes**."], "3": ["T", "Le **surengagement** est présenté comme le **facteur clef** individuel."], "4": ["F", "Le cours est clair : ils **ne sauraient en aucun cas constituer un élément de sélection** des travailleurs."], "5": ["F", "Ils ne servent qu'à renforcer la prévention et **n'exonèrent pas** la responsabilité des facteurs de risque du travail."]}, "key": ["1", "2", "3"], "fmt": "QCM", "o": [["of2/o_blanc1-43_0.png", 7]]}, {"id": "blanc1-44", "exam": "blanc1", "label": "Examen blanc n°1", "n": 44, "stem": "Concernant les risques liés à l'hyperconnexion et aux TIC, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "tic", "s": [], "t": [], "g": "Risques des TIC :\n• **biomécaniques** : posture, TMS (canal carpien, lombalgies, épaule) ;\n• **visuels** : fatigue oculaire ;\n• **cognitifs** : surcharge informationnelle, interruptions ;\n• **psychosociaux** : **hyperconnexion**, frontière vie pro / vie privée, stress, burn-out.", "warn": [], "type": "multi", "opts": [["1", "L'hyperconnexion brouille la frontière entre vie professionnelle et vie privée."], ["2", "La surcharge informationnelle et les interruptions fréquentes augmentent la charge cognitive."], ["3", "Elles peuvent favoriser le stress et l'épuisement professionnel."], ["4", "Le travail sur écran expose à une fatigue visuelle."], ["5", "Les TIC ne comportent que des risques physiques."]], "p": {"1": ["T", "L'**hyperconnexion** fait déborder le travail sur la vie privée."], "2": ["T", "La **surcharge informationnelle** et les **interruptions** sont des risques cognitifs."], "3": ["T", "Ce sont des **atteintes psychosociales** (stress, burn-out)."], "4": ["T", "La **fatigue oculaire** est un risque classique du travail sur écran."], "5": ["F", "Les TIC comportent aussi des risques **psychosociaux et cognitifs**."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc1-44_0.png", 8], ["of2/o_blanc1-44_1.png", 7]]}, {"id": "blanc1-45", "exam": "blanc1", "label": "Examen blanc n°1", "n": 45, "stem": "Quelles mesures de prévention sont adaptées au travail prolongé sur écran ?", "case": null, "tables": [], "imgs": [], "c": "tic", "s": [], "t": [], "g": "Prévention du travail sur écran :\n• **poste** : écran à hauteur des yeux, à une longueur de bras, sans reflets ;\n• **posture** : avant-bras en appui, poignets dans l'axe, siège réglable ;\n• **organisation** : pauses, alternance des tâches ;\n• **psychosocial** : règles de connexion, **droit à la déconnexion**.", "warn": [], "type": "multi", "opts": [["1", "Placer le haut de l'écran à hauteur des yeux, à environ une longueur de bras."], ["2", "Limiter les reflets et les éblouissements sur l'écran."], ["3", "Alterner les tâches et faire des pauses régulières."], ["4", "Garder les avant-bras en appui et les poignets dans l'axe."], ["5", "Organiser un droit à la déconnexion n'a aucun intérêt en prévention."]], "p": {"1": ["T", "La bonne **hauteur** et la bonne **distance** de l'écran réduisent la fatigue visuelle et cervicale."], "2": ["T", "Les **reflets** et éblouissements augmentent la fatigue visuelle : orientation de l'écran et éclairage adaptés."], "3": ["T", "Les **pauses** et l'**alternance** des tâches réduisent les risques visuels et musculosquelettiques."], "4": ["T", "L'**appui des avant-bras** et des **poignets neutres** préviennent les TMS."], "5": ["F", "La **déconnexion** limite l'hyperconnexion et ses effets psychosociaux."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc1-45_0.png", 9], ["of2/o_blanc1-45_1.png", 10]]}, {"id": "blanc1-46", "exam": "blanc1", "label": "Examen blanc n°1", "n": 46, "stem": "Concernant la biométrologie (surveillance biologique des expositions), quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "toxi", "s": [], "t": [], "g": "Évaluation des expositions :\n• **métrologie d'ambiance** : concentration dans l'**air** du poste ;\n• **biométrologie** : toxique ou métabolites dans le **sang / urines** → dose absorbée, **toutes voies** ;\n• prélèvement selon la **cinétique** (fin de poste, fin de semaine) ;\n• résultats individuels sous **secret médical**.", "warn": [], "type": "multi", "opts": [["1", "Elle mesure le toxique ou ses métabolites dans un milieu biologique (sang, urines)."], ["2", "Elle intègre toutes les voies de pénétration, y compris cutanée."], ["3", "Le moment du prélèvement doit tenir compte de la cinétique du toxique."], ["4", "Elle remplace la métrologie d'ambiance."], ["5", "Ses résultats individuels sont couverts par le secret médical."]], "p": {"1": ["T", "La **biométrologie** dose le toxique ou ses **métabolites** dans le sang ou les urines."], "2": ["T", "Elle reflète la **dose réellement absorbée**, toutes voies confondues."], "3": ["T", "Le **moment** du prélèvement (fin de poste, fin de semaine) dépend de la **cinétique**."], "4": ["F", "Elle **complète** la métrologie d'ambiance, qui mesure la concentration dans l'air."], "5": ["T", "Les résultats **individuels** sont des données **médicales**, couvertes par le secret."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc1-46_0.png", 13]]}, {"id": "blanc1-47", "exam": "blanc1", "label": "Examen blanc n°1", "n": 47, "stem": "Concernant le RADS (syndrome de dysfonctionnement réactif des voies aériennes), quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "asthme", "s": [], "t": [], "g": "Le RADS (irritant-induced asthma) :\n• **exposition unique**, **forte concentration**, agent **irritant** ;\n• sujet **sans antécédent** d'asthme ;\n• symptômes persistant **≥ 3 mois** ;\n• AP **sans période de latence** ;\n• réparé en **accident du travail**.", "warn": [], "type": "multi", "opts": [["1", "Il survient après une exposition unique à de fortes concentrations d'un agent irritant."], ["2", "Il survient chez un sujet préalablement indemne d'antécédents asthmatiques."], ["3", "Les symptômes persistent pendant au moins trois mois."], ["4", "C'est une forme d'asthme professionnel sans période de latence."], ["5", "Il est réparé comme une maladie professionnelle au titre d'un tableau."]], "p": {"1": ["T", "Le RADS suit une **exposition unique**, à **fortes concentrations**, à un **agent irritant**."], "2": ["T", "Le sujet était **indemne d'antécédents asthmatiques**."], "3": ["T", "Le cours précise une persistance **d'au moins trois mois**."], "4": ["T", "Le RADS est l'AP **sans période de latence** (irritant-induced asthma)."], "5": ["F", "Le RADS est réparé au titre d'un **accident du travail**."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc1-47_0.png", 4]]}, {"id": "blanc1-48", "exam": "blanc1", "label": "Examen blanc n°1", "n": 48, "stem": "Quelles associations « agent asthmogène → secteurs exposés » sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "asthme", "s": [], "t": [], "g": "Exemples d'agents d'asthme professionnel :\n| Agent | Secteurs |\n| Farines | boulangers, meuniers, silos à grains |\n| Enzymes (alcalase, trypsine) | détergents, pharmacie, agroalimentaire |\n| Latex | personnel médical, chaussure, caoutchouc |\n| Gommes végétales | imprimeurs, tapis, pharmacie |\n| Isocyanates | peinture au pistolet, mousses polyuréthanes, fonderies |", "warn": [], "type": "multi", "opts": [["1", "Enzymes biologiques (alcalase, trypsine) → industrie des détergents et industrie pharmaceutique."], ["2", "Latex → personnel médical et paramédical, industrie de la chaussure."], ["3", "Isocyanates → fabricants de mousses polyuréthanes."], ["4", "Gommes végétales (gomme arabique, guar) → imprimeurs."], ["5", "Farines → fonderies."]], "p": {"1": ["T", "Le cours associe les **enzymes** (alcalase, trypsine, chymotrypsine) à l'**industrie des détergents**, pharmaceutique et agroalimentaire."], "2": ["T", "Le **latex** expose le **personnel médical et paramédical** et l'**industrie de la chaussure**."], "3": ["T", "Les **isocyanates** exposent les fabricants de **mousses polyuréthanes** et les peintres au pistolet."], "4": ["T", "Les **gommes végétales** concernent les **imprimeurs**, manufactures de tapis, pharmacie, additifs."], "5": ["F", "Les fonderies exposent aux **isocyanates** ; les farines concernent boulangers, meuniers, silos."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc1-48_0.png", 15]]}, {"id": "blanc1-49", "exam": "blanc1", "label": "Examen blanc n°1", "n": 49, "stem": "Concernant la classification du CIRC, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "cancer", "s": [], "t": [], "g": "Classification du **CIRC** :\n| Groupe | Signification | Exemples |\n| 1 | certains | amiante, chrome, nickel, arsenic, benzène, cadmium |\n| 2A | probables | travail de nuit posté, trichloréthylène |\n| 2B | possibles | acétaldéhyde, champs EM très basse fréquence |\n| 3 | inclassables | laines de verre et de roche |\n| 4 | probablement non cancérogènes | — |", "warn": [], "type": "multi", "opts": [["1", "Le groupe 1 regroupe les agents cancérogènes certains pour l'homme, comme l'amiante, le chrome ou le benzène."], ["2", "Le travail de nuit posté et le trichloréthylène sont classés dans le groupe 2A."], ["3", "Les champs électromagnétiques de très basse fréquence sont classés dans le groupe 2B."], ["4", "Les laines de verre et de roche sont des cancérogènes certains."], ["5", "La classification du CIRC porte aussi sur des situations d'exposition et des procédés industriels."]], "p": {"1": ["T", "**Groupe 1** : cancérogènes **certains** (amiante, chrome, nickel, arsenic, benzène, cadmium, 2-naphtylamine)."], "2": ["T", "Le cours cite le **travail de nuit posté** et le **trichloréthylène** comme exemples du **groupe 2A** (probables)."], "3": ["T", "**Groupe 2B** (possibles) : acétaldéhyde, **champs électromagnétiques de très basse fréquence**."], "4": ["F", "Les **laines de verre et de roche** sont dans le **groupe 3** : **inclassables**."], "5": ["T", "Elle porte sur des **agents**, des **situations d'exposition** et certains **procédés industriels**."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc1-49_0.png", 3]]}, {"id": "blanc1-50", "exam": "blanc1", "label": "Examen blanc n°1", "n": 50, "stem": "Concernant la classification européenne (UE) des cancérogènes, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "cancer", "s": [], "t": [], "g": "Classification européenne (UE) :\n• uniquement les **cancérogènes chimiques** ;\n• **3 catégories** : **1A** (connus chez l'homme, ancienne 1), **1B** (à assimiler, ancienne 2), **2** (suspectés) ;\n• à distinguer du **CIRC** (4 groupes, agents chimiques, biologiques, physiques, situations, procédés).", "warn": [], "type": "multi", "opts": [["1", "Elle ne porte que sur les cancérogènes chimiques."], ["2", "Elle comporte trois catégories."], ["3", "La catégorie 1A regroupe les substances que l'on sait être cancérogènes pour l'homme."], ["4", "La catégorie 1B regroupe les substances devant être assimilées à des substances cancérogènes pour l'homme."], ["5", "Elle classe aussi les agents biologiques et physiques."]], "p": {"1": ["T", "La classification de l'UE ne porte **que sur les cancérigènes chimiques**."], "2": ["T", "Elle répartit les substances en **trois catégories**."], "3": ["T", "**Catégorie 1A** (ancienne 1) : substances **que l'on sait** cancérogènes pour l'homme."], "4": ["T", "**Catégorie 1B** (ancienne 2) : substances **devant être assimilées** à des cancérogènes."], "5": ["F", "C'est le **CIRC** qui classe aussi les agents biologiques et physiques ; l'UE se limite aux **chimiques**."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc1-50_0.png", 3]]}, {"id": "blanc1-51", "exam": "blanc1", "label": "Examen blanc n°1", "n": 51, "stem": "Concernant l'intensité et la nocivité du bruit, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "bruit", "s": [], "t": [], "g": "Échelle et nocivité du bruit :\n• **80 dB(A)** : seuil de nocivité (8 h/j) ;\n• **120 dB(A)** : douleur ;\n• niveaux très élevés : **dB(C)** ;\n• échelle **logarithmique** : 2 sources identiques = **+3 dB(A)** ;\n• **facteurs individuels** : sensibilité, antécédents, âge (< 20 ans, > 50 ans) ; la nocivité dépend aussi de la **fréquence**, de l'intensité et de la durée.", "warn": [], "type": "multi", "opts": [["1", "80 dB(A) correspond au seuil de nocivité pour une exposition de 8 heures par jour."], ["2", "120 dB(A) provoque une sensation douloureuse."], ["3", "Pour les niveaux très élevés, on utilise le décibel pondéré C, noté dB(C)."], ["4", "Arrêter l'une de deux machines identiques divise le niveau sonore par deux."], ["5", "L'âge (moins de 20 ans ou plus de 50 ans) fait partie des facteurs individuels de sensibilité."]], "p": {"1": ["T", "Le cours : **80 dB(A)** = seuil de nocivité pour **8 h/j**."], "2": ["T", "**120 dB(A)** = bruit provoquant une **sensation douloureuse**."], "3": ["T", "Aux niveaux très élevés, on utilise le **dB(C)**."], "4": ["F", "Cela ne diminue le niveau que de **3 dB(A)**."], "5": ["T", "Le cours cite l'**âge (< 20 ans ; > 50 ans)** parmi les caractères non modifiables."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc1-51_0.png", 2]]}, {"id": "blanc1-52", "exam": "blanc1", "label": "Examen blanc n°1", "n": 52, "stem": "Concernant la classification des solvants, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "solv", "s": [], "t": [], "g": "Solvants oxygénés (hydrophiles **et** lipophiles) :\n| Famille | Exemple |\n| Alcools | méthanol |\n| Cétones | acétone |\n| Esters | acétate d'éthyle |\n| Éthers | anisole |\n| Éthers de glycol | 2-butoxyéthanol |\nAutres solvants : acétonitrile, DMF, **disulfure de carbone**, nitroparaffines.", "warn": [], "type": "multi", "opts": [["1", "Les solvants oxygénés sont à la fois hydrophiles et lipophiles."], ["2", "Le méthanol est un alcool."], ["3", "L'acétone est une cétone."], ["4", "Le 2-butoxyéthanol est un éther de glycol."], ["5", "Le disulfure de carbone est un solvant oxygéné."]], "p": {"1": ["T", "Le cours : les solvants **oxygénés** sont **hydrophiles et lipophiles**."], "2": ["T", "**Méthanol** = exemple des **alcools**."], "3": ["T", "**Acétone** = exemple des **cétones**."], "4": ["T", "**2-butoxyéthanol** = exemple des **éthers de glycol**."], "5": ["F", "Le **disulfure de carbone** est classé parmi les **autres solvants** (avec l'acétonitrile, le DMF, les nitroparaffines)."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc1-52_0.png", 1]]}, {"id": "blanc1-53", "exam": "blanc1", "label": "Examen blanc n°1", "n": 53, "stem": "Quelles associations « dermatose professionnelle → agent » sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "derm", "s": [], "t": [], "g": "Dermatoses dues à des agents chimiques :\n| Lésion | Agents |\n| Brûlures chimiques | acides forts (HCl, HF), bases fortes (potasse, ammoniac, chaux) |\n| Pigeonneaux | nickel, cobalt, chrome |\n| Dépigmentation | composés phénoliques |\n| Cyanose | arsenic, thallium |\n| Acné | huiles industrielles, chlore |\n| Cancer | goudron, arsenic |", "warn": [], "type": "multi", "opts": [["1", "Pigeonneaux (ulcérations) → nickel, cobalt, chrome."], ["2", "Cyanose professionnelle → arsenic, thallium."], ["3", "Acné professionnelle → huiles industrielles, chlore."], ["4", "Dépigmentation (achromie) → composés phénoliques."], ["5", "Brûlures chimiques → laines de verre."]], "p": {"1": ["T", "Les **pigeonneaux** sont dus à la manipulation du **nickel, cobalt, chrome**."], "2": ["T", "La **cyanose professionnelle** est liée à l'**arsenic** et au **thallium**."], "3": ["T", "L'**acné professionnelle** est due aux **huiles industrielles** et au **chlore**."], "4": ["T", "La **dépigmentation** est due aux **composés phénoliques**."], "5": ["F", "Les **brûlures chimiques** sont dues aux **acides forts** (HCl, acide fluorhydrique) et **bases fortes** (potasse, ammoniac, chaux)."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc1-53_0.png", 2]]}, {"id": "blanc1-54", "exam": "blanc1", "label": "Examen blanc n°1", "n": 54, "stem": "Concernant les réservoirs des agents biologiques, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "bio", "s": [], "t": [], "g": "Chaîne de transmission — les réservoirs :\n• **vivants** : **humain** (rougeole, gale, grippe), **animal** (cuir, laine, cervelle : encéphalite à tiques, vache folle) ;\n• **inanimés** : **sol** (tétanos), **eau** (hépatite A, amibes, choléra), **objets contaminés** (seringue) ;\n• **hôte** : le travailleur, contaminé si exposition importante, protection insuffisante ou immunité déficiente.", "warn": [], "type": "multi", "opts": [["1", "Un être humain infecté peut contaminer un soignant (rougeole, gale, grippe)."], ["2", "Le cuir, la laine et la cervelle sont des réservoirs d'origine animale."], ["3", "Le sol est un réservoir inanimé, par exemple pour l'agent du tétanos."], ["4", "L'eau peut être un réservoir du virus de l'hépatite A et de l'agent du choléra."], ["5", "Une seringue abandonnée ne peut pas constituer un réservoir."]], "p": {"1": ["T", "Réservoir **vivant humain** : peau, appareil respiratoire, salive, sang (rougeole, gale, grippe)."], "2": ["T", "Réservoir **animal** : cuir, laine, cervelle (encéphalite à tiques, vache folle)."], "3": ["T", "Réservoir **inanimé** : **sol** (tétanos)."], "4": ["T", "Réservoir **eau** : hépatite A, amibes, choléra."], "5": ["F", "Un **objet contaminé** (seringue abandonnée) est un réservoir inanimé."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc1-54_0.png", 1]]}, {"id": "blanc1-55", "exam": "blanc1", "label": "Examen blanc n°1", "n": 55, "stem": "Parmi les déchets suivants, lesquels sont des déchets de soins à risque chimique et toxique (DRCT) ?", "case": null, "tables": [], "imgs": [], "c": "bio", "s": [], "t": [], "g": "Les **DRCT** (déchets à risque chimique et toxique) :\n• **cytotoxiques** et déchets contaminés par eux ;\n• **médicaments** entamés, périmés ;\n• **métaux lourds** : mercure (amalgames, thermomètres, tensiomètres) ;\n• **films radiologiques**, fixateurs, révélateurs ; **réactifs** de laboratoire ;\n• acides, bases, solvants, désinfectants ; **DEEE** ; **piles** ;\n• les **placentas** et biopsies sont **assimilés aux DASRI**.", "warn": [], "type": "multi", "opts": [["1", "Les amalgames dentaires contenant du mercure."], ["2", "Les films radiologiques, fixateurs et révélateurs."], ["3", "Les piles et accumulateurs."], ["4", "Les placentas issus des maternités."], ["5", "Les réactifs des laboratoires d'analyses médicales."]], "p": {"1": ["T", "Les déchets contenant des **métaux lourds** (mercure des amalgames, thermomètres, tensiomètres) sont des **DRCT**."], "2": ["T", "**Films radiologiques, fixateurs, révélateurs** : DRCT."], "3": ["T", "**Piles et accumulateurs** : DRCT."], "4": ["F", "Les **placentas** sont **assimilés aux DASRI**."], "5": ["T", "Les **réactifs de laboratoire** sont des DRCT."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc1-55_0.png", 7]]}, {"id": "blanc1-56", "exam": "blanc1", "label": "Examen blanc n°1", "n": 56, "stem": "Concernant les obligations de l'employeur devant un accident du travail, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "atmp", "s": [], "t": [], "g": "Obligations de l'employeur après un AT :\n• déclarer à la CNAS dans les **48 h** ;\n• déclarer **tout accident**, même **sans incapacité** ou jugé **non imputable** ;\n• possibilité de **réserves motivées** ;\n• la CNAS **informe l'inspection du travail** ;\n• objectif : protection de la victime et **traçabilité collective** des risques.", "warn": [], "type": "multi", "opts": [["1", "Il doit déclarer tout accident, même s'il n'a pas entraîné d'incapacité de travail."], ["2", "Il doit déclarer l'accident même s'il estime qu'il n'est pas imputable au travail."], ["3", "Il peut accompagner sa déclaration de réserves motivées."], ["4", "Il peut refuser de déclarer un accident survenu à un travailleur temporaire."], ["5", "L'organisme de sécurité sociale transmet l'information à l'inspection du travail."]], "p": {"1": ["T", "Le cours : l'employeur déclare **tout accident**, **même sans incapacité**."], "2": ["T", "Il déclare **même s'il estime** que l'accident n'est **pas imputable** au travail."], "3": ["T", "Il peut joindre des **réserves motivées**."], "4": ["F", "L'obligation porte sur **tout accident** ; elle protège la victime et la **traçabilité** des risques."], "5": ["T", "L'organisme de sécurité sociale **transmet l'information à l'inspection du travail** compétente."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc1-56_0.png", 5]]}, {"id": "blanc1-57", "exam": "blanc1", "label": "Examen blanc n°1", "n": 57, "stem": "Concernant les formes cliniques et radiologiques particulières de la silicose, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "pneumo", "s": [], "t": [], "g": "Formes particulières de la silicose :\n• **selon l'évolution** : formes **discrètes / latentes** (découverte fortuite), formes **suraiguës** mortelles (empoussiérage massif) ;\n• **selon la radiologie** : formes **unilatérales** (**exceptionnelles**, anomalies vasculaires), formes **calcifiées** (**rares**, sels calciques + silice).", "warn": [], "type": "multi", "opts": [["1", "Des silicoses discrètes peuvent être découvertes fortuitement chez des sujets anciennement exposés."], ["2", "Les formes suraiguës, mortelles en quelques mois, sont dues à un empoussiérage massif riche en silice."], ["3", "Les formes nodulaires unilatérales sont exceptionnelles et s'expliquent par des anomalies vasculaires."], ["4", "Les formes nodulaires calcifiées s'expliquent par l'inhalation concomitante de sels calciques et de silice."], ["5", "Les formes nodulaires calcifiées sont la forme radiologique la plus fréquente."]], "p": {"1": ["T", "Formes **discrètes, latentes**, **découvertes fortuitement** chez des sujets jadis exposés."], "2": ["T", "Formes **suraiguës mortelles** en quelques mois par **empoussiérage massif**."], "3": ["T", "Formes **nodulaires unilatérales** : **exceptionnelles**, par **anomalies vasculaires**."], "4": ["T", "Formes **calcifiées**, **rares**, par inhalation de **sels calciques + silice**."], "5": ["F", "Les formes calcifiées sont **rares**."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc1-57_0.png", 5]]}, {"id": "blanc1-58", "exam": "blanc1", "label": "Examen blanc n°1", "n": 58, "stem": "Concernant les grandeurs opérationnelles mesurées par les dosimètres, quelles associations sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "ri", "s": [], "t": [], "g": "Dosimétrie individuelle — grandeurs opérationnelles **Hp(d)** :\n| Grandeur | Profondeur | Représente |\n| Hp(10) | 10 mm | corps entier (≈ dose efficace) |\n| Hp(3) | 3 mm | cristallin |\n| Hp(0,07) | 0,07 mm | peau et extrémités |\nLes grandeurs de **protection** (dose équivalente, efficace) ne se mesurent pas directement.", "warn": [], "type": "multi", "opts": [["1", "Hp(10) → exposition « corps entier », approximation de la dose efficace."], ["2", "Hp(0,07) → dose à la peau et aux extrémités."], ["3", "Hp(3) → dose au cristallin."], ["4", "Les dosimètres mesurent directement la dose efficace."], ["5", "Hp(d) désigne la dose individuelle équivalente à la profondeur d."]], "p": {"1": ["T", "**Hp(10)** (profondeur 10 mm) représente l'exposition **corps entier**."], "2": ["T", "**Hp(0,07)** (0,07 mm) représente la dose à la **peau et aux extrémités**."], "3": ["T", "**Hp(3)** (3 mm) représente la dose au **cristallin**."], "4": ["F", "Les grandeurs de protection (dose équivalente, efficace) sont **difficiles à mesurer directement** : on utilise des **grandeurs opérationnelles** Hp(d)."], "5": ["T", "**Hp(d)** : **dose individuelle équivalente** à la profondeur d (mm)."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc1-58_0.png", 3]]}, {"id": "blanc1-59", "exam": "blanc1", "label": "Examen blanc n°1", "n": 59, "stem": "Concernant l'hôte dans la chaîne de transmission des agents biologiques en milieu professionnel, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "bio", "s": [], "t": [], "g": "L'hôte (fin de la chaîne de transmission) :\n• en milieu professionnel : **le travailleur** ;\n• il développe une maladie si :\n1. l'**exposition** est suffisamment importante ;\n2. il n'est **pas suffisamment protégé** ;\n3. son **état immunitaire** est déficient.", "warn": [], "type": "multi", "opts": [["1", "L'hôte se trouve au bout de la chaîne de transmission."], ["2", "En milieu professionnel, l'hôte est le travailleur."], ["3", "Il peut développer une maladie si l'exposition est suffisamment importante."], ["4", "Il peut développer une maladie s'il n'est pas suffisamment protégé."], ["5", "Un état immunitaire déficient protège contre la contamination."]], "p": {"1": ["T", "Le cours : l'**hôte se trouve au bout** de la chaîne."], "2": ["T", "En milieu professionnel, il s'agit du **travailleur**."], "3": ["T", "Première condition : **exposition suffisamment importante**."], "4": ["T", "Deuxième condition : **protection insuffisante**."], "5": ["F", "Au contraire, un **état immunitaire déficient** favorise la maladie."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc1-59_0.png", 1]]}, {"id": "blanc1-60", "exam": "blanc1", "label": "Examen blanc n°1", "n": 60, "stem": "Concernant les dermatoses professionnelles dues à des agents physiques, quelles associations sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "derm", "s": [], "t": [], "g": "Dermatoses dues à des agents **physiques** :\n• **froid** : gelures, engelures ;\n• **rayonnements ionisants** : radiodermites **aiguës et chroniques** ;\n• **UV** : élastose, kératose ;\n• à distinguer des agents **chimiques** (brûlures, pigeonneaux, acné, cyanose, dépigmentation).", "warn": [], "type": "multi", "opts": [["1", "Froid → gelures, engelures."], ["2", "Ultraviolets → élastose, kératose."], ["3", "Rayonnements ionisants → radiodermites aiguës et chroniques."], ["4", "Ultraviolets → acné professionnelle."], ["5", "Rayonnements ionisants → cyanose professionnelle."]], "p": {"1": ["T", "Le cours : **froid** → **gelures, engelures**."], "2": ["T", "**UV** → **élastose, kératose**."], "3": ["T", "**Ionisations radiologiques** → **dermites aiguës et chroniques**."], "4": ["F", "L'**acné** professionnelle est due aux **huiles industrielles** et au **chlore** (agents chimiques)."], "5": ["F", "La **cyanose** est due à l'**arsenic** et au **thallium**."]}, "key": ["1", "2", "3"], "fmt": "QCM", "o": [["of2/o_blanc1-60_0.png", 2]]}, {"id": "blanc2-01", "exam": "blanc2", "label": "Examen blanc n°2", "n": 1, "stem": "Concernant le tableau clinico-biologique de M. B. S., quelles propositions sont exactes ?", "case": "blanc2-c1", "tables": [], "imgs": [], "c": "solv", "s": [], "t": [], "g": "Aplasie médullaire benzénique :\n| Lignée | Traduction clinique |\n| Rouge | anémie : asthénie, céphalées, vertiges, pâleur |\n| Blanche | leucopénie (ou leucocytose) : gingivite, stomatite, angine |\n| Plaquettes | thrombopénie : purpura, gingivorragies, épistaxis, ecchymoses, ménorragies |\n• latence : **mois à années** ; forme sévère : **pancytopénie** ;\n• moelle : **hypocellulaire**, prédominance lymphocytaire, **tissu graisseux**.", "warn": [], "type": "multi", "opts": [["1", "Il réalise une pancytopénie, forme sévère de l'atteinte médullaire."], ["2", "Les angines et la stomatite traduisent l'atteinte de la lignée blanche."], ["3", "L'aspect de la biopsie ostéomédullaire est celui d'une aplasie médullaire."], ["4", "L'aplasie benzénique apparaît typiquement quelques jours après le début de l'exposition."], ["5", "Une hyperleucocytose aurait permis d'écarter une intoxication par le benzène."]], "p": {"1": ["T", "Anémie + leucopénie + thrombopénie : **pancytopénie**, forme **sévère** de l'aplasie benzénique."], "2": ["T", "La **leucopénie** se manifeste par des **infections** (gingivite, stomatite, angine)."], "3": ["T", "**Hypocellularité** à prédominance **lymphocytaire**, tissu **graisseux** remplaçant le tissu hématopoïétique : aplasie."], "4": ["F", "Elle survient **après un temps de latence de plusieurs mois à plusieurs années**."], "5": ["F", "L'atteinte de la lignée blanche peut être une **leucopénie ou une leucocytose** : une hyperleucocytose n'écarte rien."]}, "key": ["1", "2", "3"], "fmt": "QCM", "o": [["of2/o_blanc2-01_0.png", 4]]}, {"id": "blanc2-02", "exam": "blanc2", "label": "Examen blanc n°2", "n": 2, "stem": "Concernant la pénétration et le devenir du benzène chez ce patient, quelles propositions sont exactes ?", "case": "blanc2-c1", "tables": [], "imgs": [], "c": "solv", "s": [], "t": [], "g": "Métabolisme des solvants :\n• **pénétration** : respiratoire (principale), cutanée (non négligeable), digestive (hygiène déficiente, autolyse) ;\n• **distribution** : tissus vascularisés et **riches en lipides** (SNC, foie, cœur, reins) ;\n• **biotransformation** : oxydation hépatique ;\n• **élimination** : air expiré (inchangé), urines (métabolites hydrosolubles), selles.", "warn": [], "type": "multi", "opts": [["1", "La voie respiratoire est la voie principale de pénétration, du fait de la volatilité du solvant."], ["2", "Le lavage des mains au solvant constitue une voie de pénétration non négligeable."], ["3", "La voie digestive se limite aux tentatives d'autolyse."], ["4", "Une partie du benzène inhalé est éliminée sous forme inchangée dans l'air expiré."], ["5", "Les solvants se fixent préférentiellement sur les tissus peu vascularisés et pauvres en lipides."]], "p": {"1": ["T", "Voie **respiratoire** = voie **principale** (volatilité)."], "2": ["T", "La voie **cutanée** est **non négligeable**."], "3": ["F", "Elle est surtout **accidentelle**, par **hygiène déficiente** (boire, fumer, manger au poste) ; l'autolyse n'est qu'une circonstance parmi d'autres."], "4": ["T", "Élimination par l'**air expiré**, sous forme **inchangée** (exemple type : benzène)."], "5": ["F", "Ils se fixent sur les tissus **bien vascularisés et riches en lipides** : SNC, foie, cœur, reins."]}, "key": ["1", "2", "4"], "fmt": "QCM", "o": [["of2/o_blanc2-02_0.png", 2]]}, {"id": "blanc2-03", "exam": "blanc2", "label": "Examen blanc n°2", "n": 3, "stem": "Pour objectiver l'exposition de ses collègues encore en poste, quels indicateurs urinaires faut-il doser ?", "case": "blanc2-c1", "tables": [], "imgs": [], "c": "solv", "s": [], "t": [], "g": "Métabolites urinaires des solvants :\n| Solvant | Métabolites urinaires |\n| Benzène | acide S-phénylmercapturique (S-PMA), acide t,t-muconique (t,t-MA) |\n| n-hexane | 2-hexanol, 2,5-hexanedione |", "warn": [], "type": "single", "opts": [["A", "L'acide S-phénylmercapturique (S-PMA) et l'acide t,t-muconique."], ["B", "Le 2-hexanol et la 2,5-hexanedione."], ["C", "L'acide δ-aminolévulinique urinaire."], ["D", "Les protoporphyrines-zinc."], ["E", "Le mercure urinaire."]], "p": {"A": ["T", "Métabolites urinaires du **benzène** : **S-PMA** et **acide t,t-muconique**."], "B": ["F", "Ce sont les métabolites du **n-hexane**."], "C": ["F", "L'**ALA-U** est un test d'effet du **plomb**."], "D": ["F", "Les **PPZ** sont un indicateur d'effet du **plomb** (sanguin)."], "E": ["F", "Indicateur de l'exposition au **mercure**."]}, "key": ["A"], "fmt": "QCS", "o": [["of2/o_blanc2-03_0.png", 2]]}, {"id": "blanc2-04", "exam": "blanc2", "label": "Examen blanc n°2", "n": 4, "stem": "Concernant le pouvoir cancérogène du benzène, quelles propositions sont exactes ?", "case": "blanc2-c1", "tables": [], "imgs": [], "c": "cancer", "s": [], "t": [], "g": "Benzène et hémopathies malignes (CIRC groupe 1) :\n| Forme | Hémopathies |\n| Aiguë | leucémies myéloblastique, myélomonocytaire, promyélocytaire |\n| Chronique | LMC, LLC, érythroleucémie |\n| Autres | lymphomes hodgkiniens et non hodgkiniens, myélome |", "warn": [], "type": "multi", "opts": [["1", "Le benzène est classé dans le groupe 1 du CIRC."], ["2", "Les leucémies aiguës myéloblastiques, myélomonocytaires et promyélocytaires sont décrites."], ["3", "La leucémie myéloïde chronique et la leucémie lymphoïde chronique sont décrites."], ["4", "Les lymphomes hodgkiniens et non hodgkiniens ainsi que le myélome sont également cités."], ["5", "Le benzène est classé dans le groupe 2A, comme cancérogène probable."]], "p": {"1": ["T", "**Groupe 1** : substance **certainement cancérogène** pour l'homme."], "2": ["T", "Ce sont les formes **aiguës** citées."], "3": ["T", "Formes **chroniques** : **LMC, LLC**, érythroleucémie."], "4": ["T", "Ils figurent dans la liste des hémopathies liées au benzène."], "5": ["F", "Le benzène est en **groupe 1** ; le 2A regroupe les cancérogènes **probables** (ex. travail de nuit posté)."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc2-04_0.png", 3]]}, {"id": "blanc2-05", "exam": "blanc2", "label": "Examen blanc n°2", "n": 5, "stem": "Concernant la réparation de l'affection de M. B. S., quelles propositions sont exactes ?", "case": "blanc2-c1", "tables": [], "imgs": [], "c": "solv", "s": [], "t": [], "g": "TMP n°4 — benzène, toluène, xylènes :\n| Maladie | DPC |\n| Anémie progressive grave hypo- ou aplasique | 3 ans |\n| Leucémie | 15 ans |\n| Syndrome myéloprolifératif | 15 ans |\n| Hypercytose myélodysplasique, leucopénie avec neutropénie, anémie légère, syndrome hémorragique, thrombopénie | 3 ans |\n| Troubles gastro-intestinaux avec vomissements à répétition | 3 mois |\n| Accidents aigus (coma, convulsions) hors AT | 3 jours |", "warn": [], "type": "multi", "opts": [["1", "Elle relève du tableau de maladie professionnelle n°4."], ["2", "Le délai de prise en charge de l'anémie progressive grave de type aplasique est de 3 ans."], ["3", "Le délai de prise en charge de la leucémie est de 15 ans."], ["4", "Muté depuis 2 ans, il est hors délai de prise en charge pour son aplasie."], ["5", "L'aplasie médullaire benzénique relève du tableau n°84."]], "p": {"1": ["T", "**TMP n°4** : maladies causées par le **benzène**, le toluène, les xylènes et les produits en renfermant."], "2": ["T", "Anémie progressive **grave** hypoplasique ou aplasique : DPC **3 ans**."], "3": ["T", "**Leucémie** : DPC **15 ans**."], "4": ["F", "2 ans < **3 ans** : le DPC est **respecté**."], "5": ["F", "Le **TMP 84** répare les **effets communs** des solvants (syndrome ébrieux, dermites) ; l'aplasie relève du **TMP 4**."]}, "key": ["1", "2", "3"], "fmt": "QCM", "o": [["of2/o_blanc2-05_0.png", 6]]}, {"id": "blanc2-06", "exam": "blanc2", "label": "Examen blanc n°2", "n": 6, "stem": "Concernant les autres affections inscrites au tableau n°4, quelles propositions sont exactes ?", "case": "blanc2-c1", "tables": [], "imgs": [], "c": "solv", "s": [], "t": [], "g": "Pièges du TMP n°4 :\n• **15 ans** : leucémie et **syndrome myéloprolifératif** ;\n• **3 ans** : toutes les autres atteintes hématologiques ;\n• **3 mois** : troubles gastro-intestinaux ;\n• **3 jours** : accidents aigus hors AT ;\n• liste des travaux **indicative**.", "warn": [], "type": "multi", "opts": [["1", "La leucopénie avec neutropénie a un délai de prise en charge de 3 ans."], ["2", "Les troubles gastro-intestinaux accompagnés de vomissements à répétition ont un délai de 3 mois."], ["3", "Les accidents aigus (coma, convulsions) sont pris en charge en dehors des cas considérés comme accidents du travail."], ["4", "Le syndrome myéloprolifératif a un délai de prise en charge de 3 ans."], ["5", "La liste des travaux du tableau n°4 est limitative."]], "p": {"1": ["T", "Leucopénie avec neutropénie : **3 ans**."], "2": ["T", "Troubles GI avec vomissements : **3 mois**."], "3": ["T", "Accidents aigus : **3 jours**, **en dehors des cas considérés comme AT**."], "4": ["F", "Syndrome **myéloprolifératif** : **15 ans**, comme la leucémie."], "5": ["F", "Le TMP 4 comporte une **liste indicative** des principaux travaux."]}, "key": ["1", "2", "3"], "fmt": "QCM", "o": [["of2/o_blanc2-06_0.png", 6]]}, {"id": "blanc2-07", "exam": "blanc2", "label": "Examen blanc n°2", "n": 7, "stem": "Quelles mesures de prévention technique auraient dû être appliquées à ce poste ?", "case": "blanc2-c1", "tables": [], "imgs": [], "c": "solv", "s": [], "t": [], "g": "Prévention technique — solvants :\n• **substitution** (éliminer les CMR, éviter les neurotoxiques) ;\n• éloigner toute **flamme** (incendie, explosion) ;\n• **aspiration** des vapeurs à la source, loin des sources de chaleur ;\n• EPI : vêtements imperméables, **gants**, **masques à cartouches** (voire ARI), lunettes ;\n• stockage : **aéré, petites quantités, hermétique, étiqueté** ;\n• ne jamais pipeter à la bouche, ne pas manger/boire/fumer au poste, formation.", "warn": [], "type": "multi", "opts": [["1", "Choisir des solvants moins toxiques en éliminant au maximum les solvants CMR."], ["2", "Aspirer les vapeurs à la source."], ["3", "Interdire le lavage des mains avec un solvant."], ["4", "Stocker les solvants en grandes quantités dans un local clos et chauffé."], ["5", "Fournir de simples masques anti-poussières en papier."]], "p": {"1": ["T", "Premier levier : **substitution**, éliminer les **CMR** et éviter les neurotoxiques."], "2": ["T", "Éviter toute dispersion : **aspiration à la source**."], "3": ["T", "Mesure explicite : **éviter de se laver les mains avec un solvant**."], "4": ["F", "Stockage dans un **lieu aéré**, en **petites quantités**, récipients **hermétiques et étiquetés**, loin de la chaleur."], "5": ["F", "Il faut des **masques à cartouches**, voire des **appareils respiratoires isolants**."]}, "key": ["1", "2", "3"], "fmt": "QCM", "o": [["of2/o_blanc2-07_0.png", 4], ["of2/o_blanc2-07_1.png", 5]]}, {"id": "blanc2-08", "exam": "blanc2", "label": "Examen blanc n°2", "n": 8, "stem": "Concernant la surveillance médicale des travailleurs exposés au benzène dans cette unité, quelles propositions sont exactes ?", "case": "blanc2-c1", "tables": [], "imgs": [], "c": "solv", "s": [], "t": [], "g": "Prévention médicale — solvants :\n1. **Visite d'embauche** : écarter anomalies de l'hémogramme, cardiopathies, atteintes neurologiques et cutanées, **femmes enceintes et en âge de concevoir** ; FNS, ECG, bilan rénal et hépatique de référence.\n2. **Visite périodique** : examen minutieux, **FNS complète**, ECG, **EEG, EMG**, bilan rénal et hépatique.\n3. **Visite spontanée** : toujours rechercher une cause professionnelle.", "warn": [], "type": "multi", "opts": [["1", "À l'embauche, on évite d'exposer les sujets présentant des anomalies de l'hémogramme."], ["2", "On évite d'exposer les femmes enceintes et même les femmes en âge de concevoir."], ["3", "FNS, ECG, bilans rénal et hépatique initiaux servent de référence."], ["4", "À la visite périodique, la FNS complète vise à écarter le sujet avant la survenue de la maladie."], ["5", "L'EEG et l'EMG n'ont aucune place dans la surveillance périodique."]], "p": {"1": ["T", "Contre-indications : anomalies de l'**hémogramme**, pathologies cardiaques, neurologiques, cutanées."], "2": ["T", "En raison de l'**action tératogène potentielle**."], "3": ["T", "Bilans **de référence** pour les examens périodiques."], "4": ["T", "But : détecter toute perturbation pour **écarter du poste avant la maladie**."], "5": ["F", "La visite périodique est complétée par **ECG, EEG, EMG**, bilans rénal et hépatique."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "cs": "Opérateur de 47 ans, 19 ans en rectification des benzols, lavage des mains au solvant : **aplasie médullaire benzénique** (pancytopénie, moelle hypocellulaire graisseuse). **TMP n°4** : aplasie grave DPC **3 ans** (respecté, muté depuis 2 ans), leucémie et syndrome myéloprolifératif **15 ans**. Indicateurs : **S-PMA, t,t-MA**. Prévention : substitution, aspiration, EPI adaptés, FNS périodique.", "o": [["of2/o_blanc2-08_0.png", 5]]}, {"id": "blanc2-09", "exam": "blanc2", "label": "Examen blanc n°2", "n": 9, "stem": "Concernant le syndrome douloureux abdominal de M. D. K., quelles propositions sont exactes ?", "case": "blanc2-c2", "tables": [], "imgs": [], "c": "metaux", "s": [], "t": [], "g": "Colique de plomb :\n• contamination **massive** (aiguë ou chronique grave) ;\n• douleurs **péri-ombilicales** très vives, diffusant à tout l'abdomen ;\n• vomissements, arrêt du transit (simulant une occlusion) ;\n• **apyrexie, ventre souple**, sueurs, pâleur, **poussée hypertensive** ;\n• ASP : **distension colique aérique** ;\n• mécanisme : dysfonctionnement du **SN autonome** ; formes atténuées aujourd'hui les plus fréquentes.", "warn": [], "type": "multi", "opts": [["1", "Il implique une contamination massive par le plomb."], ["2", "L'apyrexie et la souplesse abdominale orientent vers la colique de plomb plutôt qu'une urgence chirurgicale."], ["3", "La poussée hypertensive fait partie du tableau classique."], ["4", "Les troubles digestifs résultent d'une lésion inflammatoire de la muqueuse colique."], ["5", "Une fièvre et une défense abdominale sont habituelles."]], "p": {"1": ["T", "La **colique de plomb** implique une **contamination massive**."], "2": ["T", "Tableau **pseudo-chirurgical** mais malade **apyrétique**, ventre **souple**."], "3": ["T", "Sueurs, pâleur et **poussée hypertensive** accompagnent la colique."], "4": ["F", "Ils résultent d'un **dysfonctionnement du système nerveux autonome**."], "5": ["F", "Le malade est **apyrétique** et le ventre **souple**."]}, "key": ["1", "2", "3"], "fmt": "QCM", "o": [["of2/o_blanc2-09_0.png", 3]]}, {"id": "blanc2-10", "exam": "blanc2", "label": "Examen blanc n°2", "n": 10, "stem": "Concernant l'atteinte de la main droite, quelles propositions sont exactes ?", "case": "blanc2-c2", "tables": [], "imgs": [], "c": "metaux", "s": [], "t": [], "g": "Neuropathie saturnine :\n• **motrice**, axonale, **bilatérale**, réversible lentement ;\n• début : extenseurs des **3e et 4e doigts**, long supinateur respecté (« fait les cornes ») ;\n• puis tous les doigts → **chute du poignet** (main en col de cygne) ;\n• autres territoires : bras, épaules, extenseurs des pieds, larynx (dysphonie) ;\n• souvent précédée d'un **tremblement** ; sensitif **inconstant**.", "warn": [], "type": "multi", "opts": [["1", "Il s'agit d'une polyneuropathie motrice par dégénérescence axonale."], ["2", "Elle réalise une paralysie pseudo-radiale respectant le long supinateur."], ["3", "Le déficit sensitif est constant et au premier plan."], ["4", "Elle est souvent précédée d'un tremblement des extrémités."], ["5", "L'atteinte est habituellement unilatérale et définitive."]], "p": {"1": ["T", "Polyneuropathie **motrice** par **dégénérescence axonale**."], "2": ["T", "Paralysie des extenseurs des **3e et 4e doigts** **respectant le long supinateur** : signe des « cornes »."], "3": ["F", "Le déficit est **seulement ou surtout moteur** ; le déficit sensitif est **inconstant**."], "4": ["T", "Elle est **souvent précédée d'un tremblement** des extrémités."], "5": ["F", "Elle est **bilatérale** et généralement **réversible**, avec régression lente après l'arrêt de l'exposition."]}, "key": ["1", "2", "4"], "fmt": "QCM", "o": [["of2/o_blanc2-10_0.png", 4]]}, {"id": "blanc2-11", "exam": "blanc2", "label": "Examen blanc n°2", "n": 11, "stem": "Le liseré gingival observé chez ce patient :", "case": "blanc2-c2", "tables": [], "imgs": [], "c": "metaux", "s": [], "t": [], "g": "Signes buccaux des métaux :\n| Signe | Métal |\n| Liseré de Burton (bleu ardoisé, 1 mm du rebord, sulfure de Pb) | plomb |\n| Taches de Gubler (face interne des joues) | plomb |\n| Gingivite sèche, hypersialorrhée, goût métallique, dents grisâtres | mercure |", "warn": [], "type": "single", "opts": [["A", "Se situe à 1 mm du rebord gingival et traduit la présence de sulfure de plomb dans la salive."], ["B", "Correspond aux taches de Gubler."], ["C", "Est un signe de stomatogingivite mercurielle."], ["D", "N'apparaît qu'au stade d'intoxication confirmée."], ["E", "Correspond à une coloration grisâtre uniforme des dents."]], "p": {"A": ["T", "**Liseré de Burton** : bleu ardoisé, à **1 mm** du rebord gingival, **sulfure de plomb** salivaire."], "B": ["F", "Les **taches de Gubler** siègent sur la **face interne des joues**."], "C": ["F", "C'est un signe **saturnin** ; la stomatite mercurielle donne une gingivite sèche et des dents grisâtres."], "D": ["F", "Il peut se voir dès la phase d'**imprégnation (présaturnisme)**."], "E": ["F", "La « **dent mercurielle** » est grisâtre et uniforme : signe du **mercure**."]}, "key": ["A"], "fmt": "QCS", "o": [["of2/o_blanc2-11_0.png", 3]]}, {"id": "blanc2-12", "exam": "blanc2", "label": "Examen blanc n°2", "n": 12, "stem": "Concernant l'interprétation du bilan biologique, quelles propositions sont exactes ?", "case": "blanc2-c2", "tables": [], "imgs": [], "c": "metaux", "s": [], "t": [], "g": "Biologie du saturnisme :\n| Test | Repères |\n| Plombémie | référence ; OMS : femme < 300, homme < 400 µg/L ; effets > 700 µg/L |\n| Plomburie spontanée 24 h | médiocre, non recommandée |\n| Plomburie provoquée (EDTA) | pool actif, diagnostic de certitude, centres spécialisés |\n| ALA-U | normal < 5 ; dangereux > 15 ; écartement > 20 mg/g créat |\n| PPZ | normal < 3 µg/g Hb ; précoce, moins spécifique |\n| HGB | pathologique > 50/100 000 ; peu spécifique |", "warn": [], "type": "multi", "opts": [["1", "La plombémie est le meilleur indicateur d'exposition au plomb."], ["2", "Une plombémie de 820 µg/L dépasse le seuil d'apparition des effets pathologiques."], ["3", "Un ALA-U supérieur à 20 mg/g de créatinine impose l'écartement du risque."], ["4", "La plomburie spontanée des 24 h est le paramètre recommandé pour le suivi."], ["5", "Les hématies à granulations basophiles sont plus spécifiques que l'ALA-U."]], "p": {"1": ["T", "La **plombémie** est l'**indicateur de référence**."], "2": ["T", "Les effets pathologiques apparaissent à partir de **700 µg/L**."], "3": ["T", "**> 15** : imprégnation dangereuse ; **> 20 mg/g créat** : écartement du risque."], "4": ["F", "C'est un **médiocre indicateur**, **non recommandé** pour le dépistage ou le suivi."], "5": ["F", "Les HGB sont **beaucoup moins spécifiques** (thalassémie, drépanocytose…)."]}, "key": ["1", "2", "3"], "fmt": "QCM", "o": [["of2/o_blanc2-12_0.png", 5]]}, {"id": "blanc2-13", "exam": "blanc2", "label": "Examen blanc n°2", "n": 13, "stem": "Concernant les autres tests biologiques du saturnisme, quelles propositions sont exactes ?", "case": "blanc2-c2", "tables": [], "imgs": [], "c": "metaux", "s": [], "t": [], "g": "Tests d'exposition et d'effet :\n• **exposition** : plombémie, plomburie (spontanée, provoquée), plomb osseux, phanères, salive ;\n• **effet** : ALA-U (dépistage précoce), PPZ, FNS, frottis (HGB).", "warn": [], "type": "multi", "opts": [["1", "L'élévation des PPZ est précoce mais moins spécifique que celle de l'ALA, car elle se voit aussi dans les anémies ferriprives et hémolytiques."], ["2", "Chez un sujet non exposé, les PPZ sont inférieures à 3 µg/g d'hémoglobine."], ["3", "La plomburie provoquée à l'EDTA reflète le pool de plomb biologiquement actif."], ["4", "La plomburie provoquée est un examen de routine du médecin du travail."], ["5", "Les hématies à granulations basophiles sont pathologiques au-delà de 50 pour 100 000 hématies."]], "p": {"1": ["T", "Les **PPZ** s'élèvent tôt mais aussi en cas d'**anémie ferriprive ou hémolytique**."], "2": ["T", "Normale : **PPZ < 3 µg/g d'Hb**."], "3": ["T", "Elle reflète le **pool biologiquement actif** : diagnostic de certitude de l'imprégnation."], "4": ["F", "Elle se fait **uniquement en centres spécialisés** et ses indications doivent être **limitées**."], "5": ["T", "Seuil : **> 50 HGB / 100 000**."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc2-13_0.png", 5]]}, {"id": "blanc2-14", "exam": "blanc2", "label": "Examen blanc n°2", "n": 14, "stem": "Concernant la distribution et l'élimination du plomb, quelles propositions sont exactes ?", "case": "blanc2-c2", "tables": [], "imgs": [], "c": "metaux", "s": [], "t": [], "g": "Plomb — trois compartiments :\n| Compartiment | Part | Demi-vie |\n| Sang | 1-2 % (99 % dans les hématies) | 36 j |\n| Tissus mous | 5-10 % (plomb actif) | 40 j |\n| Os | ≈ 95 % | 27 ans |\n• excrétion **urinaire > 75 %**, fécale 15-20 % ; demi-vie allongée si **insuffisance rénale**.", "warn": [], "type": "multi", "opts": [["1", "Près de 95 % du plomb de l'organisme est stocké dans l'os."], ["2", "Le plomb sanguin se trouve à 99 % dans les hématies."], ["3", "Les demi-vies d'élimination sont d'environ 36 jours dans le sang et 27 ans dans l'os."], ["4", "Une immobilisation prolongée peut relarguer le plomb osseux."], ["5", "L'excrétion du plomb est principalement fécale."]], "p": {"1": ["T", "L'**os** contient près de **95 %** du plomb (reflet de l'exposition cumulative)."], "2": ["T", "Sang : 1-2 % du plomb total, dont **99 % dans les hématies**."], "3": ["T", "Sang **36 j**, tissus mous **40 j**, os **27 ans**."], "4": ["T", "Toute **déminéralisation** (grossesse, allaitement, ostéoporose, **immobilisation**) redistribue le plomb."], "5": ["F", "Elle est principalement **urinaire (> 75 %)**, fécale 15-20 %."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc2-14_0.png", 2]]}, {"id": "blanc2-15", "exam": "blanc2", "label": "Examen blanc n°2", "n": 15, "stem": "Compte tenu de la plombémie et du tableau clinique, quelle est la conduite la plus adaptée ?", "case": "blanc2-c2", "tables": [], "imgs": [], "c": "metaux", "s": [], "t": [], "g": "Surveillance des exposés au plomb :\n| Plombémie | Conduite |\n| < 110 µg/L | contrôle tous les 6 mois |\n| 110-199 µg/L | contrôle tous les 3 mois |\n| 200-249 µg/L | contrôle à 1 mois puis tous les 2 mois |\n| > 450 µg/L | médecine interne et/ou réanimation pour chélation |\n• **l'éviction du poste est le meilleur traitement**.", "warn": [], "type": "single", "opts": [["A", "Écarter le patient du poste et l'orienter vers un service de médecine interne ou de réanimation pour un traitement chélateur."], ["B", "Le maintenir au poste et contrôler la plombémie dans 3 mois."], ["C", "Le maintenir au poste avec un masque respiratoire."], ["D", "Contrôler la plombémie après 1 mois puis tous les 2 mois, sans traitement."], ["E", "Débuter un traitement chélateur en ambulatoire au service de médecine du travail."]], "p": {"A": ["T", "Plombémie **> 450 µg/L** : orientation vers **médecine interne / réanimation** ; l'**éviction** est le meilleur traitement."], "B": ["F", "Conduite réservée aux plombémies de **110 à 199 µg/L**, sans traitement."], "C": ["F", "Le tableau impose l'**éviction**."], "D": ["F", "Schéma de la tranche **200-249 µg/L**."], "E": ["F", "Le traitement chélateur est initié **en milieu hospitalier**."]}, "key": ["A"], "fmt": "QCS", "o": [["of2/o_blanc2-15_0.png", 6]]}, {"id": "blanc2-16", "exam": "blanc2", "label": "Examen blanc n°2", "n": 16, "stem": "Concernant la réparation et l'aptitude de M. D. K., quelles propositions sont exactes ?", "case": "blanc2-c2", "tables": [], "imgs": [], "c": "metaux", "s": [], "t": [], "g": "TMP n°1 — plomb et composés :\n1. coliques de plomb ;\n2. paralysie des extenseurs des doigts / petits muscles de la main ;\n3. encéphalopathie aiguë (sans symptômes préalables si plomb **tétraéthyle**) ;\n4. néphrite azotémique ou hypertensive ;\n5. anémie avec HGB ;\n6. syndrome biologique : Hb < 13 g/dl, hématies ponctuées > 1/1000, ALA-U > 20 mg/L.\n**Inaptitude** : plombémie > 700 µg/L renouvelée, PPZ > 20 µg/g Hb ou ALA-U > 20 mg/g créat, signe clinique.", "warn": [], "type": "multi", "opts": [["1", "La colique de plomb est inscrite au tableau de maladie professionnelle n°1."], ["2", "La paralysie des extenseurs des doigts est inscrite au même tableau."], ["3", "Le grattage et le découpage au chalumeau de matières recouvertes de peintures plombifères figurent dans la liste des travaux."], ["4", "Une plombémie supérieure à 700 µg/L constatée de façon renouvelée justifie un avis d'inaptitude."], ["5", "L'encéphalopathie due au plomb tétraéthyle n'est reconnue que si elle est précédée d'autres symptômes du tableau."]], "p": {"1": ["T", "Syndrome douloureux abdominal paroxystique apyrétique : **TMP n°1**."], "2": ["T", "**Paralysie des extenseurs des doigts** ou des petits muscles de la main."], "3": ["T", "Travail explicitement cité : **grattage, brûlage, découpage au chalumeau** de peintures plombifères."], "4": ["T", "Inaptitude si : plombémie **> 700 µg/L renouvelée**, PPZ > 20 µg/g Hb (ou ALA-U > 20), ou manifestation clinique."], "5": ["F", "Pour les **dérivés alcoylés** (plomb tétraéthyle), l'encéphalopathie est reconnue **sans** ces symptômes."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "cs": "Décapeur de 39 ans, peintures au minium, sans protection : **colique de plomb** (apyrétique, ventre souple, HTA), **liseré de Burton**, **paralysie pseudo-radiale**, anémie à HGB. Plombémie **820 µg/L** (> 700) et ALA-U **24 mg/g** (> 20) : **éviction**, orientation hospitalière pour chélation, **inaptitude**, déclaration au **TMP n°1**.", "o": [["of2/o_blanc2-16_0.png", 9]]}, {"id": "blanc2-17", "exam": "blanc2", "label": "Examen blanc n°2", "n": 17, "stem": "À quel stade de la surdité professionnelle correspond le tableau de M. R. T. ?", "case": "blanc2-c3", "tables": [], "imgs": [], "c": "bruit", "s": [], "t": [], "g": "Stades de la surdité professionnelle :\n| Stade | Audiométrie | Retentissement |\n| 1 | scotome > 30 dB à 4000 Hz | aucun |\n| 2 | 50-60 dB à 4000 ; 30 dB à 2000 Hz | fait répéter, pas de gêne sociale nette |\n| 3 | extension à 1000 et 8000 ; 30 dB à 1000 Hz | gêne sociale et professionnelle, acouphènes |\n| 4 | 100-110 dB à 4000 ; ≈ 70 dB à 1000 Hz | voix normale non perçue, handicap |", "warn": [], "type": "single", "opts": [["A", "Stade 1 : scotome auditif isolé à 4000 Hz."], ["B", "Stade 2 : surdité débutante."], ["C", "Stade 3 : surdité confirmée."], ["D", "Stade 4 : surdité sévère."], ["E", "Traumatisme sonore aigu."]], "p": {"A": ["F", "Au stade 1 le sujet **ne se rend compte de rien** ; seule la zone 4000 Hz est touchée."], "B": ["F", "Au stade 2, la perte atteint 30 dB à **2000 Hz** sans gêne sociale nette."], "C": ["T", "Perte **≥ 30 dB à 1000 Hz**, mauvaise intelligibilité, **gêne quand plusieurs personnes parlent**, acouphènes : **stade 3**."], "D": ["F", "Au stade 4 la perte atteint 100-110 dB à 4000 Hz et la voix normale n'est plus perçue."], "E": ["F", "Le traumatisme sonore aigu suit une exposition **brutale** (explosion, bruit impulsionnel)."]}, "key": ["C"], "fmt": "QCS", "o": [["of2/o_blanc2-17_0.png", 4]]}, {"id": "blanc2-18", "exam": "blanc2", "label": "Examen blanc n°2", "n": 18, "stem": "Quels éléments de l'audiogramme sont compatibles avec une surdité professionnelle ?", "case": "blanc2-c3", "tables": [], "imgs": [], "c": "bruit", "s": [], "t": [], "g": "Critères de la surdité professionnelle :\n1. scotome initial à **4000 Hz** ;\n2. **bilatérale et symétrique** ;\n3. **perception pure** (CA = CO), cochléaire ;\n4. **recrutement** ;\n5. plus marquée en **vocale** qu'en tonale ;\n6. **irréversible** ;\n7. pas d'aggravation après l'arrêt de l'exposition (non constant).", "warn": [], "type": "multi", "opts": [["1", "Les courbes en conduction aérienne et osseuse superposées."], ["2", "La présence d'un recrutement."], ["3", "Un déficit plus marqué en audiométrie vocale qu'en audiométrie tonale."], ["4", "Une atteinte maximale à 4000 Hz."], ["5", "Une aggravation constante après l'arrêt de l'exposition."]], "p": {"1": ["T", "Surdité de **perception pure** : CA et CO superposées."], "2": ["T", "**Recrutement** sur les fréquences lésées."], "3": ["T", "Critère diagnostique : surdité **plus marquée en vocale** qu'en tonale."], "4": ["T", "Le scotome débute à **4000 Hz**."], "5": ["F", "Elle **cesse d'évoluer** à l'arrêt de l'exposition (caractère non constant, mais l'aggravation n'est pas la règle)."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc2-18_0.png", 3]]}, {"id": "blanc2-19", "exam": "blanc2", "label": "Examen blanc n°2", "n": 19, "stem": "Quel est le déficit auditif moyen réglementaire retenu pour la reconnaissance ?", "case": "blanc2-c3", "tables": [], "imgs": [], "c": "bruit", "s": [], "t": [], "g": "Calcul du déficit auditif (TMP n°42) :\n**DA = [2 × (500 Hz) + 4 × (1000 Hz) + 3 × (2000 Hz) + 1 × (4000 Hz)] / 10**\n• calculé pour **chaque oreille** ;\n• on retient la **meilleure oreille** ;\n• reconnaissance si **DA ≥ 35 dB**.", "warn": [], "type": "single", "opts": [["A", "40 dB."], ["B", "45 dB."], ["C", "43,75 dB."], ["D", "42,5 dB."], ["E", "35 dB."]], "p": {"A": ["T", "DA OD = (2×20 + 4×35 + 3×50 + 1×70) / 10 = **40 dB** ; OG = 45 dB. On retient la **meilleure oreille** : **40 dB**."], "B": ["F", "C'est le DA de l'oreille **gauche**, la plus atteinte ; on retient la **meilleure**."], "C": ["F", "C'est la moyenne **arithmétique simple** de l'OD, non pondérée."], "D": ["F", "C'est la moyenne des deux oreilles, qui n'est pas la règle."], "E": ["F", "35 dB est le **seuil minimal** de reconnaissance, pas le résultat."]}, "key": ["A"], "fmt": "QCS", "o": [["of2/o_blanc2-19_0.png", 7]]}, {"id": "blanc2-20", "exam": "blanc2", "label": "Examen blanc n°2", "n": 20, "stem": "Concernant la reconnaissance de cette surdité au titre du tableau n°42, quelles propositions sont exactes ?", "case": "blanc2-c3", "tables": [], "imgs": [], "c": "bruit", "s": [], "t": [], "g": "Conditions du TMP n°42 :\n• **médicales** : déficit bilatéral cochléaire, irréversible, **≥ 35 dB sur la meilleure oreille**, confirmé **3 semaines à 1 an** après l'arrêt ;\n• **administratives** : DPC **1 an**, exposition **≥ 1 an** (30 j propulseurs, réacteurs, moteurs à pistons) ;\n• **professionnelles** : travaux de la **liste limitative**.", "warn": [], "type": "multi", "opts": [["1", "Le déficit doit être confirmé par une audiométrie réalisée de 3 semaines à 1 an après la cessation de l'exposition."], ["2", "Le délai de prise en charge est d'1 an, sous réserve d'une exposition d'au moins 1 an."], ["3", "Le martelage, le rivetage et le meulage figurent dans la liste des travaux."], ["4", "La liste des travaux du tableau n°42 est indicative."], ["5", "Un audiogramme réalisé pendant l'exposition ne suffit pas à constituer le dossier."]], "p": {"1": ["T", "Audiométrie de **confirmation** : **3 semaines à 1 an** après l'arrêt de l'exposition."], "2": ["T", "DPC **1 an**, durée d'exposition **≥ 1 an** (30 j pour la mise au point des propulseurs, réacteurs et moteurs à pistons)."], "3": ["T", "Travaux sur métaux par **percussion, abrasion** : martelage, rivetage, meulage cités."], "4": ["F", "Le TMP 42 comporte une **liste limitative**."], "5": ["T", "Sans audiogramme de confirmation après cessation de l'exposition, la surdité n'est **pas reconnue**."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc2-20_0.png", 7]]}, {"id": "blanc2-21", "exam": "blanc2", "label": "Examen blanc n°2", "n": 21, "stem": "Quels facteurs ont pu aggraver le retentissement auditif chez ce patient ?", "case": "blanc2-c3", "tables": [], "imgs": [], "c": "bruit", "s": [], "t": [], "g": "Nocivité du bruit :\n• **fréquence** : aigus (> 1000 Hz) > graves ;\n• **pureté** : bruit pur > mélange ;\n• **intensité** (seuil 85-90 dB), **durée**, **répétition**, **émergence** ;\n• cofacteurs : solvants, **vibrations**, CO, acide cyanhydrique ; extraprofessionnels : **aminosides**, diurétiques, salicylates, antitumoraux ;\n• terrain : âge < 20 ou > 50 ans, sensibilité individuelle.", "warn": [], "type": "multi", "opts": [["1", "Le traitement antérieur par aminosides."], ["2", "Une exposition associée aux vibrations des outils."], ["3", "La nature grave (basses fréquences) des bruits de chaudronnerie."], ["4", "Un bruit pur plutôt qu'un mélange de fréquences variées."], ["5", "Le caractère intermittent des chocs, qui empêche toute accumulation des effets."]], "p": {"1": ["T", "Les **aminosides** fragilisent l'oreille interne."], "2": ["T", "L'exposition combinée **bruit + vibrations** est plus dommageable."], "3": ["F", "Les bruits **aigus** (> 1000 Hz) sont **plus nocifs** que les graves."], "4": ["T", "Un **bruit pur** est plus dangereux qu'un mélange."], "5": ["F", "Les traumatismes sonores **intermittents accumulent** leurs effets."]}, "key": ["1", "2", "4"], "fmt": "QCM", "o": [["of2/o_blanc2-21_0.png", 3]]}, {"id": "blanc2-22", "exam": "blanc2", "label": "Examen blanc n°2", "n": 22, "stem": "Quel est le niveau sonore global approximatif de l'atelier (4 machines de 86 dB(A) chacune) ?", "case": "blanc2-c3", "tables": [], "imgs": [], "c": "bruit", "s": [], "t": [], "g": "Addition des niveaux sonores (sources identiques) :\n| Nombre de machines | Augmentation |\n| 2 | + 3 dB |\n| 3 | + 5 dB |\n| 4 | + 6 dB |\n| 5 | + 7 dB |\n| 10 | + 10 dB |\nArrêter une machine sur deux ne baisse le niveau que de **3 dB**.", "warn": [], "type": "single", "opts": [["A", "92 dB(A)."], ["B", "344 dB(A)."], ["C", "89 dB(A)."], ["D", "96 dB(A)."], ["E", "86 dB(A)."]], "p": {"A": ["T", "Échelle **logarithmique** : 4 machines identiques ajoutent **≈ 6 dB** → 86 + 6 = **92 dB(A)**."], "B": ["F", "Les décibels **ne s'additionnent pas** arithmétiquement."], "C": ["F", "+3 dB correspond à **2** machines."], "D": ["F", "+10 dB correspond à **10** machines."], "E": ["F", "Le niveau augmente avec le nombre de sources."]}, "key": ["A"], "fmt": "QCS", "o": [["of2/o_blanc2-22_0.png", 2]]}, {"id": "blanc2-23", "exam": "blanc2", "label": "Examen blanc n°2", "n": 23, "stem": "Concernant la prévention dans cet atelier, quelles propositions sont exactes ?", "case": "blanc2-c3", "tables": [], "imgs": [], "c": "bruit", "s": [], "t": [], "g": "Prévention du bruit :\n• **réglementaire** : loi 88-07 ; instruction 1986 (85 alerte / 90 danger) ; DE 91-05 ; AIM 1997 (> 85 dB(A) : SMS ≥ tous les 6 mois) ;\n• **technique** : conception, **réduction à la source**, propagation (éloignement, traitement acoustique, cloisonnement, encoffrement, écrans), récepteur (cabine, rotation, PICB) ;\n• **information** si exposition > 85 dB(A) ;\n• **médicale** : VE avec audiométrie de référence, VP tous les 6 mois, audiométrie annuelle, mutation si hypoacousie.", "warn": [], "type": "multi", "opts": [["1", "L'instruction ministérielle de 1986 fixe 85 dB(A) comme cote d'alerte et 90 dB(A) comme cote de danger."], ["2", "Au-delà de 85 dB(A), une surveillance médicale spéciale au moins tous les 6 mois s'impose."], ["3", "L'audiométrie est renouvelée en général chaque année chez les exposés."], ["4", "Les protecteurs individuels passent avant la réduction du bruit à la source."], ["5", "La mutation de poste vise d'abord à ouvrir le droit à l'indemnisation."]], "p": {"1": ["T", "Instruction n°9 du **28/06/1986** : **85** alerte, **90** danger."], "2": ["T", "AIM du 09-06-1997 : bruit **> 85 dB(A)** → surveillance médicale spéciale **au moins tous les 6 mois**."], "3": ["T", "Examen audiométrique **annuel**, porté sur une **fiche audiométrique de référence**."], "4": ["F", "Les solutions **collectives**, en premier lieu la **réduction à la source**, sont prioritaires."], "5": ["F", "Elle vise à **éviter l'aggravation**, **non** à ouvrir le droit à l'indemnisation."]}, "key": ["1", "2", "3"], "fmt": "QCM", "cs": "Chaudronnier de 48 ans, 24 ans de martelage et meulage, atelier à **92 dB(A)** (4 × 86 dB) : **surdité professionnelle stade 3** (30 dB à 1000 Hz, gêne en groupe). DA de la meilleure oreille = **40 dB** (≥ 35) ; reconnaissance au **TMP n°42** après audiométrie de confirmation **3 semaines à 1 an** après arrêt. Aminosides et vibrations aggravent. Prévention : réduction à la source d'abord.", "o": [["of2/o_blanc2-23_0.png", 5]]}, {"id": "blanc2-24", "exam": "blanc2", "label": "Examen blanc n°2", "n": 24, "stem": "Concernant les déchets en cause dans cet accident, quelles propositions sont exactes ?", "case": "blanc2-c4", "tables": [], "imgs": [], "c": "bio", "s": [], "t": [], "g": "Déchets d'activités de soins (DAS) :\n• **non dangereux** : déchets ménagers et assimilés (DMA) — emballages, papiers, couches de patients **non infectés** ;\n• **dangereux** :\n1. **DASRI** : OPCT (aiguilles, lames, verrerie cassée) + déchets mous souillés ; assimilés : biopsies, **placentas**, produits sanguins périmés ;\n2. **DRCT** : chimiques et toxiques ;\n3. **anatomiques** humains identifiables ;\n4. **radioactifs**.", "warn": [], "type": "multi", "opts": [["1", "L'aiguille est un objet piquant ou coupant tranchant (OPCT), classé déchet spécial dangereux."], ["2", "Elle aurait dû être éliminée dans la filière des DASRI."], ["3", "Les couches de patients infectés sont assimilées aux déchets ménagers."], ["4", "Les compresses souillées de sang rejoignent la filière noire."], ["5", "Les placentas issus des maternités sont assimilés aux DASRI."]], "p": {"1": ["T", "Les **OPCT** sont des **déchets spéciaux dangereux**."], "2": ["T", "L'aiguille relève des **DASRI** (filière **jaune**)."], "3": ["F", "Seules les couches de patients **non infectés** sont assimilées aux **DMA**."], "4": ["F", "Les déchets mous ayant été en contact avec un produit biologique sont des **DASRI**."], "5": ["T", "Sont assimilés aux DASRI les déchets anatomiques **non reconnaissables**, dont les **placentas**."]}, "key": ["1", "2", "5"], "fmt": "QCM", "o": [["of2/o_blanc2-24_0.png", 7]]}, {"id": "blanc2-25", "exam": "blanc2", "label": "Examen blanc n°2", "n": 25, "stem": "Concernant le code couleur des déchets d'activités de soins, quelles propositions sont exactes ?", "case": "blanc2-c4", "tables": [], "imgs": [], "c": "bio", "s": [], "t": [], "g": "Code couleur des DAS :\n| Couleur | Déchets |\n| Noir | ménagers et assimilés |\n| Jaune | à risque infectieux (DASRI) |\n| Rouge | à risque chimique et toxique (DRCT) |\n| Vert | anatomiques humains identifiables |\n| Blanc | radioactifs |", "warn": [], "type": "multi", "opts": [["1", "Le rouge correspond aux déchets à risque chimique et toxique."], ["2", "Le blanc correspond aux déchets à risque radioactif."], ["3", "Le vert correspond aux déchets anatomiques humains identifiables."], ["4", "Le jaune correspond aux déchets ménagers et assimilés."], ["5", "Les films radiologiques, fixateurs et révélateurs sont des déchets à risque chimique et toxique."]], "p": {"1": ["T", "**Rouge** = DRCT."], "2": ["T", "**Blanc** = radioactifs (filière blanche)."], "3": ["T", "**Vert** = anatomiques identifiables."], "4": ["F", "**Jaune** = **DASRI** ; les DMA sont en **noir**."], "5": ["T", "Ils figurent parmi les **DRCT**, comme les cytotoxiques, le mercure, les réactifs."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc2-25_0.png", 7], ["of2/o_blanc2-25_1.png", 8]]}, {"id": "blanc2-26", "exam": "blanc2", "label": "Examen blanc n°2", "n": 26, "stem": "Quelle est la conduite immédiate devant la piqûre ?", "case": "blanc2-c4", "tables": [], "imgs": [], "c": "bio", "s": [], "t": [], "g": "CAT immédiate devant un AES :\n1. piqûre/coupure : **eau courante + savon** ;\n2. **trempage ≥ 5 min** : Dakin ou Javel 12° au 1/10e (à défaut PVP iodée, alcool 70°) ;\n3. projection muqueuse/œil : **rinçage ≥ 10 min** (sérum physiologique ou eau) ;\n4. évaluation **urgente** VIH/VHB/VHC par le médecin référent ;\n5. prophylaxie **si possible < 4 h**, selon le risque ;\n6. prévenir le médecin de prévention, **déclarer**.", "warn": [], "type": "single", "opts": [["A", "Nettoyer à l'eau courante et au savon, puis désinfecter par trempage au moins 5 minutes dans un dérivé chloré."], ["B", "Désinfecter la plaie avec de l'eau de Javel à 9° diluée au 1/5e."], ["C", "Faire saigner la plaie puis appliquer de l'alcool."], ["D", "Terminer le programme opératoire puis consulter."], ["E", "Tremper la main 30 secondes dans l'alcool à 70° en première intention."]], "p": {"A": ["T", "**Eau + savon**, puis **trempage ≥ 5 min** dans un dérivé chloré (Dakin, Javel 12° diluée au 1/10e), à défaut polyvidone iodée ou alcool à 70°."], "B": ["F", "La Javel **9° au 1/5e** sert à désinfecter les **surfaces** souillées, pas la plaie."], "C": ["F", "On ne fait pas saigner : **nettoyage eau + savon** puis trempage."], "D": ["F", "L'évaluation est **urgente** (prophylaxie si possible **dans les 4 h**)."], "E": ["F", "L'alcool n'est qu'**à défaut** et le temps de contact est **≥ 5 min**."]}, "key": ["A"], "fmt": "QCS", "o": [["of2/o_blanc2-26_0.png", 5]]}, {"id": "blanc2-27", "exam": "blanc2", "label": "Examen blanc n°2", "n": 27, "stem": "Concernant la projection oculaire, quelles propositions sont exactes ?", "case": "blanc2-c4", "tables": [], "imgs": [], "c": "bio", "s": [], "t": [], "g": "AES — définition et risque :\n• contact **percutané** ou sur **muqueuse / peau lésée** avec du sang ou un liquide visiblement sanglant ;\n• agents principaux : **VIH, VHB, VHC** ;\n• risque selon : prévalence chez les patients, portage chronique, taux de transmission ;\n• protocole d'urgence **affiché** dans le service.", "warn": [], "type": "multi", "opts": [["1", "Il faut rincer immédiatement au sérum physiologique ou à l'eau pendant au moins 10 minutes."], ["2", "Elle constitue un accident exposant au sang."], ["3", "L'évaluation du risque VIH, VHB et VHC doit être faite en urgence par un médecin référent."], ["4", "Un traitement antirétroviral est systématique, quel que soit le risque."], ["5", "La prophylaxie doit être débutée si possible dans les 4 heures."]], "p": {"1": ["T", "Projection sur muqueuse : rinçage **≥ 10 min**."], "2": ["T", "Un AES inclut le contact du sang avec une **muqueuse**."], "3": ["T", "Évaluation **urgente** par le **médecin référent**."], "4": ["F", "La prophylaxie est **proposée en fonction du risque**."], "5": ["T", "Le **délai < 4 h** est capital pour l'efficacité."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc2-27_0.png", 5]]}, {"id": "blanc2-28", "exam": "blanc2", "label": "Examen blanc n°2", "n": 28, "stem": "Concernant la vaccination et la surveillance de cette employée, quelles propositions sont exactes ?", "case": "blanc2-c4", "tables": [], "imgs": [], "c": "bio", "s": [], "t": [], "g": "Prévention médicale du risque biologique :\n• surveillance **obligatoire**, au minimum **annuelle** ;\n• vaccins **obligatoires** : hépatite B, tétanos (DT) ;\n• vaccins **recommandés** : grippe saisonnière… ;\n• la vaccination **complète** la prévention, ne la remplace pas.", "warn": [], "type": "multi", "opts": [["1", "La vaccination contre l'hépatite B est obligatoire en Algérie."], ["2", "La vaccination antitétanique fait partie des vaccinations obligatoires."], ["3", "La vaccination contre la grippe saisonnière est obligatoire."], ["4", "La vaccination ne peut pas se substituer aux mesures de prévention."], ["5", "La surveillance médicale du personnel exposé est au minimum annuelle."]], "p": {"1": ["T", "Vaccinations **obligatoires** : **hépatite B** et **tétanos (DT)**."], "2": ["T", "**DT** obligatoire."], "3": ["F", "Elle est **recommandée**, non obligatoire."], "4": ["T", "Elle **complète** les mesures de prévention, sans les remplacer."], "5": ["T", "Rythme **au minimum annuel**."]}, "key": ["1", "2", "4", "5"], "fmt": "QCM", "o": [["of2/o_blanc2-28_0.png", 5]]}, {"id": "blanc2-29", "exam": "blanc2", "label": "Examen blanc n°2", "n": 29, "stem": "Concernant la gestion des déchets d'activités de soins, quelles propositions sont exactes ?", "case": "blanc2-c4", "tables": [], "imgs": [], "c": "bio", "s": [], "t": [], "g": "Gestion des DAS — 7 étapes :\n1. tri ;\n2. conditionnement ;\n3. collecte primaire ;\n4. stockage sur site (intermédiaire, centralisé) ;\n5. collecte secondaire ;\n6. transport ;\n7. traitement et élimination (in situ ou ex situ).", "warn": [], "type": "multi", "opts": [["1", "Le tri à la source est la première étape de la gestion."], ["2", "Le stockage sur site comprend un stockage intermédiaire et un stockage centralisé."], ["3", "Le transport précède la collecte secondaire."], ["4", "Le traitement et l'élimination peuvent se faire in situ ou ex situ."], ["5", "Les DASRI peuvent rejoindre la filière ménagère après un simple compactage."]], "p": {"1": ["T", "Étape 1 : **tri**, celle qui a fait défaut ici."], "2": ["T", "Étape 4 : stockage **intermédiaire** puis **centralisé**."], "3": ["F", "Ordre : collecte primaire → stockage → **collecte secondaire** → **transport** → traitement."], "4": ["T", "Dernière étape : traitement **in situ ou ex situ**."], "5": ["F", "Les DASRI suivent leur **propre filière** (jaune)."]}, "key": ["1", "2", "4"], "fmt": "QCM", "o": [["of2/o_blanc2-29_0.png", 8]]}, {"id": "blanc2-30", "exam": "blanc2", "label": "Examen blanc n°2", "n": 30, "stem": "Concernant la réparation, quelles propositions sont exactes ?", "case": "blanc2-c4", "tables": [], "imgs": [], "c": "bio", "s": [], "t": [], "g": "Réparation du risque infectieux — groupe 2 (16 tableaux) :\n• exemples : TMP 7 tétanos, 18 charbon, 19 leptospiroses, 24 brucelloses, 40 tuberculose, **45 hépatites virales**, 46 mycoses, **75** personnel de santé ;\n• **liste limitative** des travaux ;\n• **aucun risque cancérogène** réparé dans ce groupe ;\n• TMP 75 : **13 infections** reconnues, DPC variables.", "warn": [], "type": "multi", "opts": [["1", "Cet accident survenu au travail doit être déclaré comme accident du travail."], ["2", "Une hépatite virale contractée à la suite relèverait du tableau n°45."], ["3", "Le tableau n°75 concerne aussi les agents d'entretien, de nettoyage du linge et de gestion des déchets."], ["4", "Les tableaux du groupe 2 comportent une liste indicative des travaux."], ["5", "Le risque cancérogène des hépatites est réparé dans le groupe 2."]], "p": {"1": ["T", "Tout AES survenu au travail est **déclaré** en AT."], "2": ["T", "**TMP n°45** : hépatites virales professionnelles."], "3": ["T", "TMP 75 : infections liées aux activités de **soins, d'hygiène, d'entretien, du linge, de gestion des déchets**."], "4": ["F", "Les tableaux du groupe 2 ont une **liste limitative** des situations professionnelles."], "5": ["F", "Le risque cancérogène **n'apparaît dans aucun** tableau du groupe 2, même pour les hépatites."]}, "key": ["1", "2", "3"], "fmt": "QCM", "cs": "Agent d'hygiène de 34 ans : **piqûre par aiguille jetée dans un sac noir** (erreur de tri : OPCT → filière **jaune**) et **projection oculaire**. CAT : eau + savon puis **trempage ≥ 5 min** en dérivé chloré, **rinçage oculaire ≥ 10 min**, évaluation urgente VIH/VHB/VHC (prophylaxie **< 4 h**), **déclaration en AT**, mise à jour des vaccins obligatoires (**VHB, DT**). Réparation éventuelle : TMP 45, 75 (liste limitative).", "o": [["of2/o_blanc2-30_0.png", 9]]}, {"id": "blanc2-31", "exam": "blanc2", "label": "Examen blanc n°2", "n": 31, "stem": "Concernant l'étape d'initiation de la cancérogenèse, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "cancer", "s": [], "t": [], "warn": [], "g": "Cancérogenèse : **initiation → promotion → prolifération** :\n• **initiation** : étape **ponctuelle**, altération du **génome** d'une cellule normale (erreurs de duplication, radicaux libres, cancérogènes) ;\n• la mutation est **transmise** aux cellules filles ;\n• puis **promotion** et **prolifération**.", "type": "multi", "opts": [["1", "C'est une étape ponctuelle."], ["2", "Elle correspond à l'altération du génome d'une cellule normale."], ["3", "Cette altération permet à la cellule d'échapper aux régulations cellulaires."], ["4", "Elle peut être due aux radicaux libres ou à des facteurs environnementaux cancérogènes."], ["5", "La mutation n'est jamais transmise aux cellules dérivées."]], "p": {"1": ["T", "L'initiation est une **étape ponctuelle**."], "2": ["T", "**Altération du génome** d'une **cellule normale**."], "3": ["T", "Elle confère la propriété d'**échapper aux régulations cellulaires**."], "4": ["T", "Causes : erreurs de duplication, **radicaux libres**, **facteurs environnementaux** cancérogènes."], "5": ["F", "La mutation est **transmise aux cellules dérivant** de la cellule initiée."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc2-31_0.png", 2]]}, {"id": "blanc2-32", "exam": "blanc2", "label": "Examen
