 7]]}, {"id": "2026a-32", "exam": "2026a", "label": "Janvier 2026", "n": 32, "stem": "Pour affirmer l’origine professionnelle par bruit chez ce travailleur, quels critères audiométriques/clinico-évolutifs sont les plus évocateurs ?", "case": "2026a-c2", "tables": [], "imgs": [], "c": "bruit", "s": ["p15-21", "p15-22"], "t": [], "g": "Critères d'une surdité professionnelle par le bruit :\n• **scotome initial à 4 000 Hz** ;\n• atteinte **bilatérale et symétrique** ;\n• surdité de **perception pure** (CA = CO) ;\n• **irréversible**, qui **ne s'aggrave plus** après l'arrêt de l'exposition ; recrutement sur les **aigus**.", "warn": [], "type": "multi", "opts": [["1", "Au début, scotome centré à 4000 Hz"], ["2", "Atteinte le plus souvent bilatérale et symétrique"], ["3", "Surdité de perception pure : CA et CO superposées"], ["4", "Recrutement sur les fréquences graves"], ["5", "Vocale toujours plus atteinte que la tonale"], ["6", "Réversibilité (cellules ciliées de Corti)"], ["7", "Aggravation après cessation d’exposition (caractère inconstant)"]], "p": {"1": ["T", "Au début, le **scotome est centré sur 4 000 Hz**."], "2": ["T", "L'atteinte est le plus souvent **bilatérale et symétrique**."], "3": ["T", "C'est une surdité de **perception pure** : CA et CO superposées."], "4": ["F", "Le recrutement porte sur les [[aigus]], pas sur les graves."], "5": ["F", "La vocale n'est pas [[toujours]] plus atteinte que la tonale ; ce n'est pas un critère."], "6": ["F", "La destruction des cellules ciliées de Corti est [[irréversible]]."], "7": ["F", "La surdité au bruit [[ne s'aggrave plus]] après la cessation de l'exposition."]}, "key": ["1", "2", "3"], "fmt": "QCM", "o": [["of2/o_2026a-32_0.png", 3]]}, {"id": "2026a-33", "exam": "2026a", "label": "Janvier 2026", "n": 33, "stem": "Quelle est la formule réglementaire la plus juste pour calculer le déficit auditif (DA) selon TMP N°42 ?", "case": "2026a-c2", "tables": [], "imgs": [], "c": "bruit", "s": ["p15-32"], "t": [42], "g": "Formule du déficit auditif (TMP 42) :\n• **DA = [2 × 500 + 4 × 1000 + 3 × 2000 + 1 × 4000] / 10** ;\n• somme des coefficients = **10** ;\n• le plus fort coefficient (4) va sur **1 000 Hz**, fréquence de la parole ;\n• seuil : **≥ 35 dB** sur la meilleure oreille.", "warn": [], "type": "single", "opts": [["A", "DA = [4(500) + 2(1000) + 3(2000) + 1(4000)] / 10 (>35 dB)"], ["B", "DA = [2(500) + 3(1000) + 4(2000) + 1(4000)] / 10 (>35 dB)"], ["C", "DA = [2(500) + 4(1000) + 3(2000) + 1(4000)] / 10 (>35 dB)"], ["D", "DA = [4(500) + 3(1000) + 2(2000) + 1(4000)] / 10 (>35 dB)"], ["E", "DA = [3(500) + 4(1000) + 4(2000) + 1(4000)] / 10 (>35 dB)"]], "key": ["C"], "p": {"A": ["F", "Le 4 est mis sur [[500 Hz]] ; la bonne formule met **4 sur 1 000 Hz**."], "B": ["F", "3 et 4 sont inversés entre 1 000 et 2 000 Hz ; la bonne formule est **2-4-3-1**."], "C": ["T", "**2 × 500 + 4 × 1000 + 3 × 2000 + 1 × 4000**, divisé par 10 : c'est la formule réglementaire."], "D": ["F", "Les coefficients sont inversés ; la bonne formule est **2-4-3-1** sur 500-1000-2000-4000 Hz."], "E": ["F", "La somme des coefficients doit faire **10** (2 + 4 + 3 + 1) ; ici elle fait 12."]}, "fmt": "QCS", "o": [["of2/o_2026a-33_0.png", 4], ["of2/o_2026a-33_1.png", 7]]}, {"id": "2026a-34", "exam": "2026a", "label": "Janvier 2026", "n": 34, "stem": "Quelle proposition donne les valeurs correctes du DA (OD et OG) chez ce travailleur ?", "case": "2026a-c2", "tables": [], "imgs": [], "c": "bruit", "s": ["p15-32"], "t": [42], "g": "Calcul du DA chez ce menuisier :\n• **OD** : (2×20 + 4×35 + 3×50 + 70) / 10 = 400 / 10 = **40 dB** ;\n• **OG** : (2×15 + 4×35 + 3×45 + 65) / 10 = 370 / 10 = **37 dB** ;\n• meilleure oreille : **OG à 37 dB** ≥ 35 dB → critère rempli.", "warn": [], "type": "single", "opts": [["A", "OD = 37 dB ; OG = 33 dB"], ["B", "OD = 41,5 dB ; OG = 38 dB"], ["C", "OD = 35,5 dB ; OG = 32 dB"], ["D", "OD = 40 dB ; OG = 37 dB"], ["E", "OD = 47 dB ; OG = 43 dB"]], "key": ["D"], "p": {"A": ["F", "37 et 33 dB sont trop bas ; le calcul donne **OD = 40 dB, OG = 37 dB**."], "B": ["F", "41,5 et 38 dB sont faux ; le calcul donne **OD = 40 dB, OG = 37 dB**."], "C": ["F", "35,5 et 32 dB sont faux ; le calcul donne **OD = 40 dB, OG = 37 dB**."], "D": ["T", "OD : 40 + 140 + 150 + 70 = 400 → **40 dB** ; OG : 30 + 140 + 135 + 65 = 370 → **37 dB**."], "E": ["F", "47 et 43 dB sont trop hauts ; le calcul donne **OD = 40 dB, OG = 37 dB**."]}, "fmt": "QCS", "o": [["of2/o_2026a-34_0.png", 7]]}, {"id": "2026a-35", "exam": "2026a", "label": "Janvier 2026", "n": 35, "stem": "Le stade évolutif le plus compatible avec l’audiogramme de ce travailleur est :", "case": "2026a-c2", "tables": [], "imgs": [], "c": "bruit", "s": ["p15-22"], "t": [], "g": "Stade de cette surdité :\n• **1 000 Hz** atteint (35 dB) ;\n• extension vers **8 000 Hz** ;\n• gêne d'intelligibilité en ambiance bruyante ;\n→ **3e stade**. Le 4e stade est une surdité profonde avec perte de la voix normale.", "warn": [], "type": "single", "opts": [["A", "Stade de fatigue auditive"], ["B", "1er stade de surdité professionnelle"], ["C", "2e stade de surdité professionnelle"], ["D", "3e stade de surdité professionnelle"], ["E", "4e stade de surdité professionnelle"]], "key": ["D"], "p": {"A": ["F", "La fatigue auditive est réversible ; ici 1 000 Hz est atteint durablement : **3e stade**."], "B": ["F", "Au 1er stade, l'encoche est isolée et sans gêne ; ici : **3e stade**."], "C": ["F", "Au 2e stade, [[1 000 Hz]] n'est pas touché ; ici il est à 35 dB : **3e stade**."], "D": ["T", "Atteinte de **1 000 Hz**, extension vers 8 000 Hz et gêne dans le bruit : 3e stade."], "E": ["F", "Le 4e stade est une surdité profonde avec perte de la voix normale ; ici : **3e stade**."]}, "fmt": "QCS", "o": [["of2/o_2026a-35_0.png", 4]]}, {"id": "2026a-36", "exam": "2026a", "label": "Janvier 2026", "n": 36, "stem": "Le tracé audiométrique de cette pathologie objective (CRJ)", "case": "2026a-c2", "tables": [], "imgs": [], "c": "bruit", "s": ["p15-22"], "t": [], "g": "Tracé audiométrique de la surdité au bruit :\n• surdité de **perception pure** ;\n• **CA et CO abaissées et superposées** (pas d'écart air-os) ;\n• CA plus abaissée que CO, ou CO normale = surdité de **transmission**.", "warn": [], "type": "single", "opts": [["A", "Abaissement plus important de la conduction aérienne (CA) que de la conduction osseuse (CO)"], ["B", "Abaissement plus important de la CO que de la CA"], ["C", "Abaissement superposé de la CO et de la CA"], ["D", "CO normale et un abaissement de la CA"], ["E", "CA normale et un abaissement de la CO"]], "key": ["C"], "p": {"A": ["F", "CA plus abaissée que CO = écart air-os = surdité de [[transmission]]."], "B": ["F", "Une CO plus abaissée que la CA n'existe pas ; dans la surdité au bruit, **CA = CO**."], "C": ["T", "**CA et CO abaissées et superposées** : surdité de perception pure."], "D": ["F", "CO normale et CA abaissée = surdité de **transmission**, pas de perception."], "E": ["F", "CA normale avec CO abaissée n'existe pas ; au bruit, **CA = CO**."]}, "fmt": "QCS", "o": [["of2/o_2026a-36_0.png", 4], ["of2/o_2026a-36_1.png", 3]]}, {"id": "2026a-37", "exam": "2026a", "label": "Janvier 2026", "n": 37, "stem": "À ce stade, quelles affirmations sont correctes chez ce travailleur ?", "case": "2026a-c2", "tables": [], "imgs": [], "c": "bruit", "s": ["p15-22"], "t": [], "g": "Le 3e stade de la surdité professionnelle :\n• extension vers **1 000 et 8 000 Hz** ;\n• intelligibilité difficile, surtout quand **plusieurs personnes parlent** ;\n• début de **gêne sociale et professionnelle** ;\n• perte de la voix normale et handicap sensoriel = **4e stade**.", "warn": [], "type": "multi", "opts": [["1", "Déficit conversationnel très marqué avec perte de l’audition de la voix normale"], ["2", "Extension vers 8000 et 1000 Hz, intelligibilité des mots devient difficile"], ["3", "Handicapé sensoriel et professionnel d’emblée"], ["4", "Ne comprend plus distinctement surtout quand plusieurs personnes parlent"], ["5", "Commence à subir une gêne sociale et professionnelle"]], "p": {"1": ["F", "La perte de l'audition de la voix normale correspond au [[4e stade]]."], "2": ["T", "Au 3e stade, l'atteinte s'étend vers **8 000 et 1 000 Hz** et l'intelligibilité devient difficile."], "3": ["F", "Le handicap sensoriel et professionnel d'emblée correspond au [[4e stade]]."], "4": ["T", "Il ne comprend plus distinctement quand **plusieurs personnes parlent** (effet cocktail)."], "5": ["T", "Il commence à subir une **gêne sociale** et professionnelle."]}, "key": ["2", "4", "5"], "fmt": "QCM", "o": [["of2/o_2026a-37_0.png", 4]]}, {"id": "2026a-38", "exam": "2026a", "label": "Janvier 2026", "n": 38, "stem": "Quels diagnostics différentiels (surdité de perception) faut-il rechercher/éliminer en priorité chez ce travailleur ? (3 réponses justes)", "case": "2026a-c2", "tables": [], "imgs": [], "c": "bruit", "s": ["p15-23"], "t": [], "g": "Diagnostics différentiels d'une surdité de **perception** :\n• **presbyacousie** ;\n• surdités **toxiques** : aminosides, solvants, CO, plomb ;\n• **maladie de Ménière** ;\n• schwannome, surdité brusque. L'otosclérose et les surdités chroniques de l'oreille moyenne sont des surdités de **transmission**.", "warn": [], "type": "multi", "opts": [["1", "Presbyacousie"], ["2", "Surdité toxique (aminoglycosides, solvants/CO, plomb, etc.)"], ["3", "Maladie de Ménière"], ["4", "Otosclérose"], ["5", "Surdité de transmission chronique"]], "p": {"1": ["T", "La **presbyacousie** est le premier différentiel, surtout après 50 ans."], "2": ["T", "Les surdités **toxiques** (aminosides, solvants, CO, plomb) sont des surdités de perception."], "3": ["T", "La **maladie de Ménière** donne une surdité de perception avec vertiges."], "4": ["F", "L'[[otosclérose]] est une surdité de **transmission** : elle ne fait pas partie des différentiels de perception."], "5": ["F", "Une surdité de [[transmission]] chronique ne peut pas être un différentiel d'une surdité de perception."]}, "key": ["1", "2", "3"], "fmt": "QCM", "o": [["of2/o_2026a-38_0.png", 4]]}, {"id": "2026a-39", "exam": "2026a", "label": "Janvier 2026", "n": 39, "stem": "Quelles manifestations extra-auditives liées au bruit faut-il rechercher chez ce patient ?", "case": "2026a-c2", "tables": [], "imgs": [], "c": "bruit", "s": ["p15-24"], "t": [], "g": "Manifestations extra-auditives du bruit à rechercher :\n• **HTA** et troubles cardiovasculaires ;\n• **troubles du sommeil**, fatigue chronique ;\n• **stress**, irritabilité, anxiété ;\n• **baisse des performances cognitives** (attention, mémoire).", "warn": [], "type": "multi", "opts": [["1", "Hypertension et troubles cardiovasculaires"], ["2", "Troubles du sommeil avec fatigue chronique"], ["3", "Stress/irritabilité/anxiété"], ["4", "Amélioration de la mémoire à court terme"], ["5", "Baisse des performances cognitives"]], "p": {"1": ["T", "Le bruit chronique est associé à l'**HTA** et aux troubles cardiovasculaires."], "2": ["T", "Il perturbe le **sommeil** et entraîne une fatigue chronique."], "3": ["T", "Il provoque **stress**, irritabilité et anxiété."], "4": ["F", "Le bruit n'[[améliore]] pas la mémoire : il **diminue** les performances cognitives."], "5": ["T", "Il entraîne une **baisse** de l'attention et des performances cognitives."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_2026a-39_0.png", 5]]}, {"id": "2026a-40", "exam": "2026a", "label": "Janvier 2026", "n": 40, "stem": "Pour déclarer et faire reconnaître cette surdité en maladie professionnelle (TMP 42), quelles conditions sont exactes ?", "case": "2026a-c2", "tables": [], "imgs": [], "c": "bruit", "s": ["p15-32"], "t": [42], "g": "Conditions du TMP 42 :\n• **médicales** : déficit bilatéral de perception par lésion cochléaire, **≥ 35 dB** sur la meilleure oreille ;\n• **confirmation** 3 semaines à 1 an après l'arrêt ;\n• **administratives** : DPC 1 an, durée d'exposition 1 an ;\n• **professionnelles** : travaux d'une liste **limitative**.", "warn": [], "type": "multi", "opts": [["1", "Déficit audiométrique (DA) bilatéral de perception par lésion cochléaire sur DA >35 dB calculé sur la meilleure oreille"], ["2", "DA confirmé par une nouvelle audiométrie entre 3 semaines et 1 an après cessation d’exposition aux bruits lésionnels"], ["3", "Respect des conditions médicales/administratives/professionnelles"], ["4", "Travaux exercés sont figurés dans la liste indicative des travaux"], ["5", "Respect de délai de PEC 1 an, durée d’exposition 1 an"]], "p": {"1": ["T", "Déficit audiométrique **bilatéral** de perception par lésion cochléaire, DA ≥ 35 dB sur la meilleure oreille."], "2": ["T", "Le DA doit être **confirmé** par une nouvelle audiométrie 3 semaines à 1 an après l'arrêt."], "3": ["T", "Les conditions **médicales, administratives et professionnelles** doivent toutes être réunies."], "4": ["F", "La liste des travaux du TMP 42 est [[limitative]], pas indicative."], "5": ["T", "**DPC 1 an** et durée d'exposition **1 an** (réduite à 30 jours pour les propulseurs et moteurs)."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_2026a-40_0.png", 7]]}, {"id": "2026a-41", "exam": "2026a", "label": "Janvier 2026", "n": 41, "stem": "Quelles mesures relèvent spécifiquement d’une action sur le récepteur (travailleur) et/ou de l’organisation du travail visant à réduire la dose individuelle de bruit ?", "case": "2026a-c2", "tables": [], "imgs": [], "c": "bruit", "s": ["p15-31"], "t": [], "g": "Réduire la **dose individuelle** de bruit (récepteur et organisation) :\n• **cabine d'isolement** de l'opérateur ;\n• **rotation** entre postes bruyants et calmes ;\n• **PICB** adaptés et réellement portés.\nProgrammer les travaux bruyants hors des heures de base réduit le **nombre** d'exposés ; le revêtement absorbant agit sur la **propagation**.", "warn": ["Question ambiguë : le 3 relève aussi de l’organisation ; B est retenue car l’énoncé vise la dose individuelle."], "type": "multi", "opts": [["1", "Installer une cabine d’isolement pour l’opérateur au poste le plus bruyant."], ["2", "Mettre en place une rotation fréquente entre postes bruyants et non bruyants afin de limiter la durée d’exposition."], ["3", "Programmer les travaux bruyants en dehors des heures de base pour réduire le nombre de travailleurs exposés."], ["4", "Revêtir les murs/plafonds d’un matériau absorbant pour diminuer la réverbération."], ["5", "Mettre à disposition des PICB adaptés et confortables et en assurer le port effectif."]], "p": {"1": ["T", "La **cabine d'isolement** protège directement l'opérateur (action sur le récepteur)."], "2": ["T", "La **rotation** réduit la durée d'exposition de chaque travailleur (organisation)."], "3": ["F", "Cette mesure réduit le [[nombre]] de travailleurs exposés, pas la dose reçue par chacun."], "4": ["F", "Le revêtement absorbant agit sur la [[propagation]] (prévention technique collective), pas sur le récepteur."], "5": ["T", "Des **PICB** adaptés et réellement portés réduisent la dose individuelle."]}, "key": ["1", "2", "5"], "fmt": "QCM", "o": [["of2/o_2026a-41_0.png", 6]]}, {"id": "2026a-42", "exam": "2026a", "label": "Janvier 2026", "n": 42, "stem": "Quels conseils de prévention technique collective proposestu dans cet atelier ?", "case": "2026a-c2", "tables": [], "imgs": [], "c": "bruit", "s": ["p15-31"], "t": [], "g": "Prévention **technique collective** du bruit en menuiserie :\n• **à la source** : maintenance, machines moins bruyantes, silencieux pneumatiques ;\n• **traitement acoustique** du local (murs, plafond) ;\n• **encoffrement**, cloisons, écrans ;\n• **organisation** (rotation, planification). Les PICB sont une protection **individuelle**.", "warn": ["Strictement, l’organisation (5) n’est pas « technique » ; aucune combinaison ne donne 1, 3, 4 seuls, D est la plus juste."], "type": "multi", "opts": [["1", "Agir à la source : maintenance/choix machines moins bruyantes, silencieux pneumatiques"], ["2", "Mettre des PICB (bouchons/casque) adaptés et confortables"], ["3", "Traitement acoustique du local : matériaux absorbants sur murs/plafond"], ["4", "Cloisonnement/encoffrement/écrans acoustiques des machines bruyantes"], ["5", "Organisation : rotation des postes + planifier travaux bruyants hors horaires de base"]], "p": {"1": ["T", "**Agir à la source** (maintenance, choix de machines moins bruyantes, silencieux) est la priorité."], "2": ["F", "Les [[PICB]] relèvent de la protection **individuelle**, pas de la prévention technique collective."], "3": ["T", "Le **traitement acoustique** du local réduit la réverbération."], "4": ["T", "L'**encoffrement** et les écrans acoustiques limitent la propagation du bruit."], "5": ["T", "L'**organisation** (rotation, travaux bruyants hors des horaires de base) complète les mesures collectives (retenue par la clé)."]}, "key": ["1", "3", "4", "5"], "fmt": "QCM", "cs": "Menuisier de 44 ans en atelier réverbérant, PICB mal portés : **surdité de perception bilatérale** au 3e stade, DA = OD 40 dB / OG 37 dB (≥ 35 dB) → **TMP 42**. Prévention : action à la source, traitement acoustique, organisation et PICB.", "o": [["of2/o_2026a-42_0.png", 6]]}, {"id": "2026a-43", "exam": "2026a", "label": "Janvier 2026", "n": 43, "stem": "Quel élément, dans ce dossier, est le plus “red flag” orientant vers une tumeur naso-sinusienne plutôt qu’une rhinosinusite chronique/polypose ?", "case": "2026a-c3", "tables": [], "imgs": [], "c": "cancer", "s": ["p14-21"], "t": [], "g": "Red flags d'une tumeur naso-sinusienne :\n• atteinte **unilatérale** progressive ;\n• **épistaxis** répétées ;\n• **épiphora** du même côté (envahissement du canal lacrymo-nasal) ;\n• échec des traitements, cacosmie, céphalées inhabituelles. → endoscopie et biopsie.", "warn": [], "type": "single", "opts": [["A", "Rhinorrhée purulente améliorée sous antibiotique"], ["B", "Obstruction nasale chronique associée à diminution de l’odorat"], ["C", "Atteinte unilatérale progressive + épistaxis répétées + épiphora (larmoiement) du même côté"], ["D", "Céphalées frontales en fin de journée"], ["E", "Douleur sinusienne majorée au changement de saison"]], "key": ["C"], "p": {"A": ["F", "Une amélioration sous antibiotique oriente vers une **infection**, pas vers une tumeur."], "B": ["F", "Obstruction et hyposmie existent aussi dans la **polypose** : ce n'est pas un red flag."], "C": ["T", "**Unilatéralité + épistaxis + épiphora** homolatéral signent une tumeur qui envahit le canal lacrymal."], "D": ["F", "Des céphalées de fin de journée ne sont pas spécifiques ; le red flag est **unilatéral + épistaxis + épiphora**."], "E": ["F", "Une variation saisonnière oriente vers l'**allergie**, pas vers une tumeur."]}, "fmt": "QCS", "o": [["of2/o_2026a-43_0.png", 1]]}, {"id": "2026a-44", "exam": "2026a", "label": "Janvier 2026", "n": 44, "stem": "Dans une menuiserie, quels facteurs professionnels sont le plus classiquement associés au risque de cancer de l’ethmoïde ?", "case": "2026a-c3", "tables": [], "imgs": [], "c": "cancer", "s": ["p14-21", "p14-32"], "t": [47], "g": "Cancer de l'ethmoïde en menuiserie (TMP 47) :\n• agent : **poussières de bois** ;\n• surtout les **bois durs** (chêne, hêtre, bois exotiques) ;\n• exposition **prolongée** (latence longue) ;\n• type : adénocarcinome. Ni le bruit ni les solvants de vernis ne sont en cause.", "warn": [], "type": "multi", "opts": [["1", "Poussières de bois"], ["2", "Bois durs"], ["3", "Bruit lésionnel et pics impulsionnels"], ["4", "Solvants de vernis (toluène/xylène)"], ["5", "Exposition prolongée"]], "p": {"1": ["T", "Les **poussières de bois** sont le principal facteur de risque."], "2": ["T", "Les **bois durs** sont les plus cancérogènes pour l'ethmoïde."], "3": ["F", "Le [[bruit]] n'est pas cancérogène ; il donne la surdité."], "4": ["F", "Les [[solvants]] de vernis ne sont pas retenus comme cause du cancer de l'ethmoïde."], "5": ["T", "Une exposition **prolongée** (des années) est nécessaire."]}, "key": ["1", "2", "5"], "fmt": "QCM", "o": [["of2/o_2026a-44_0.png", 8], ["of2/o_2026a-44_1.png", 5]]}, {"id": "2026a-45", "exam": "2026a", "label": "Janvier 2026", "n": 45, "stem": "Au niveau du médecin généraliste, quelle conduite est la plus appropriée maintenant ?", "case": "2026a-c3", "tables": [], "imgs": [], "c": "cancer", "s": ["p14-31"], "t": [], "g": "Conduite du médecin généraliste devant un red flag naso-sinusien :\n• **orientation ORL rapide** ;\n• **endoscopie nasale avec biopsie** ;\n• **imagerie** TDM/IRM selon l'ORL ;\n• pas de traitement d'épreuve (antibiotiques, corticoïdes, antihistaminiques) qui retarde le diagnostic.", "warn": [], "type": "multi", "opts": [["1", "Orientation ORL rapide"], ["2", "Augmenter les lavages + prescrire 3 semaines d’antibiothérapie"], ["3", "Corticothérapie générale 7 jours puis réévaluation"], ["4", "Examen d’endoscopie nasale et biopsie"], ["5", "Imagerie (TDM/IRM) selon l’ORL"], ["6", "Antihistaminiques pendant 1 mois (épreuve thérapeutique)"]], "p": {"1": ["T", "Une **orientation ORL rapide** est la priorité devant un red flag."], "2": ["F", "Prolonger lavages et antibiotiques [[retarde]] le diagnostic d'une tumeur."], "3": ["F", "Une corticothérapie d'épreuve peut masquer les signes et retarde le diagnostic."], "4": ["T", "L'**endoscopie nasale avec biopsie** apporte la preuve histologique."], "5": ["T", "L'**imagerie** (TDM/IRM) précise l'extension, selon l'ORL."], "6": ["F", "Des antihistaminiques d'épreuve pendant 1 mois retardent le diagnostic et n'ont pas d'intérêt ici."]}, "key": ["1", "4", "5"], "fmt": "QCM", "o": [["of2/o_2026a-45_0.png", 1]]}, {"id": "2026a-46", "exam": "2026a", "label": "Janvier 2026", "n": 46, "stem": "Parmi les éléments suivants, lequel est le plus utile pour appuyer l’orientation et la dimension professionnelle ?", "case": "2026a-c3", "tables": [], "imgs": [], "c": "cancer", "s": ["p14-31"], "t": [], "g": "Éléments utiles pour la dimension professionnelle :\n• **ancienneté** de l'exposition (32 ans) ;\n• **tâches exposantes** (ponçage, usinage) ;\n• **conditions** de travail (aspiration insuffisante, soufflette) ;\n• **port du masque** ; **nature des poussières** (bois durs). Les arrêts maladie n'apportent rien.", "warn": [], "type": "multi", "opts": [["1", "Le nombre de jours d’arrêt maladie des 12 derniers mois"], ["2", "L’ancienneté (32 ans)"], ["3", "les tâches exposantes (ponçage/usinage)"], ["4", "les conditions du travail,"], ["5", "le port du masque"], ["6", "la nature des poussières"]], "p": {"1": ["F", "Le nombre de jours d'[[arrêt maladie]] ne renseigne pas sur l'exposition."], "2": ["T", "L'**ancienneté** de 32 ans dans le même atelier donne une exposition prolongée."], "3": ["T", "Le **ponçage** et l'usinage sont les tâches les plus émettrices de poussières."], "4": ["T", "Les **conditions** (aspiration insuffisante, nettoyage à la soufflette) augmentent l'exposition."], "5": ["T", "Le port **irrégulier du masque** laisse passer les poussières."], "6": ["T", "La **nature** des poussières (bois durs) conditionne le risque de cancer."]}, "key": ["2", "3", "4", "5", "6"], "fmt": "QCM", "cs": "Menuisier de 58 ans, 32 ans de ponçage de bois : obstruction nasale **unilatérale**, épistaxis, épiphora droit → suspicion d'**adénocarcinome de l'ethmoïde** (poussières de bois, **TMP 47**). Orientation ORL rapide pour endoscopie et biopsie.", "o": [["of2/o_2026a-46_0.png", 6]]}, {"id": "2026a-47", "exam": "2026a", "label": "Janvier 2026", "n": 47, "stem": "Quel élément clinique ou paraclinique oriente le plus vers une asbestose plutôt qu’une silicose dans ce cas ?", "case": "2026a-c4", "tables": [], "imgs": [], "c": "pneumo", "s": ["p12-25"], "t": [30], "g": "Asbestose ou silicose sur l'imagerie :\n• **asbestose** : fibrose réticulaire des **bases**, sous-pleurale, + plaques pleurales ;\n• **silicose** : nodules et masses des **sommets**, adénopathies en coquille d'œuf ;\n• syndrome restrictif, hippocratisme, perte de poids existent dans les deux.", "warn": [], "type": "single", "opts": [["A", "Présence d’un syndrome restrictif"], ["B", "Hippocratisme digital"], ["C", "Prédominance des lésions radiologiques aux bases pulmonaires"], ["D", "Existence d’un trouble ventilatoire mixte"], ["E", "Perte de poids"]], "key": ["C"], "p": {"A": ["F", "Le syndrome restrictif existe dans les deux ; c'est la **prédominance basale** qui oriente vers l'asbestose."], "B": ["F", "L'hippocratisme existe dans les deux ; c'est la **prédominance basale** qui oriente."], "C": ["T", "Des lésions prédominant aux **bases** évoquent l'asbestose ; la silicose touche les sommets."], "D": ["F", "Le trouble ventilatoire mixte ne départage pas ; c'est la **prédominance basale** qui oriente."], "E": ["F", "La perte de poids ne départage pas ; c'est la **prédominance basale** qui oriente."]}, "fmt": "QCS", "o": [["of2/o_2026a-47_0.png", 11]]}, {"id": "2026a-48", "exam": "2026a", "label": "Janvier 2026", "n": 48, "stem": "Quel signe radiologique est le plus spécifique d’une exposition à l’amiante dans ce contexte ?", "case": "2026a-c4", "tables": [], "imgs": [], "c": "pneumo", "s": ["p12-23", "p12-14"], "t": [30], "g": "Signe radiologique d'exposition à l'amiante :\n• **plaques pleurales** (souvent calcifiées, bilatérales) : marqueur d'exposition, ≠ asbestose ;\n• silicose : micronodules, **coquille d'œuf**, opacités confluentes (fibrose massive) ;\n• tabac : emphysème centro-lobulaire.", "warn": [], "type": "single", "opts": [["A", "Micronodules arrondis diffus"], ["B", "Plaques pleurales calcifiées"], ["C", "Calcifications en coquille d’œuf des adénopathies hilaires"], ["D", "Emphysème centro-lobulaire"], ["E", "Opacités nodulaires confluentes"]], "key": ["B"], "p": {"A": ["F", "Des micronodules arrondis diffus évoquent la **silicose**."], "B": ["T", "Les **plaques pleurales calcifiées** sont le marqueur le plus spécifique de l'exposition à l'amiante."], "C": ["F", "Les calcifications en [[coquille d'œuf]] des adénopathies hilaires évoquent la silicose."], "D": ["F", "L'emphysème centro-lobulaire évoque le **tabac**."], "E": ["F", "Des opacités nodulaires confluentes traduisent une fibrose massive **silicotique**."]}, "fmt": "QCS", "o": [["of2/o_2026a-48_0.png", 11], ["of2/o_2026a-48_1.png", 12]]}, {"id": "2026a-49", "exam": "2026a", "label": "Janvier 2026", "n": 49, "stem": "Quel aspect histologique distingue l’asbestose de la silicose ?", "case": "2026a-c4", "tables": [], "imgs": [], "c": "pneumo", "s": ["p12-22", "p12-12"], "t": [], "g": "Histologie des pneumoconioses :\n• **asbestose** : **fibrose interstitielle diffuse** sans nodules, avec **corps asbestosiques** ;\n• **silicose** : **nodules fibro-hyalins** concentriques ;\n• granulomes épithélioïdes : sarcoïdose, bérylliose.", "warn": [], "type": "single", "opts": [["A", "Nodules fibro-hyalins concentriques"], ["B", "Fibrose interstitielle diffuse sans nodules, avec présence de corps asbestosiques"], ["C", "Granulomes épithélioïdes"], ["D", "Fibrose sous-pleurale apicale"], ["E", "Présence d’histiocytes pigmentés"]], "key": ["B"], "p": {"A": ["F", "Les nodules fibro-hyalins concentriques sont [[silicotiques]]."], "B": ["T", "L'asbestose est une **fibrose interstitielle diffuse** avec **corps asbestosiques**, sans nodules."], "C": ["F", "Les granulomes épithélioïdes évoquent la **sarcoïdose** ou la **bérylliose**."], "D": ["F", "L'asbestose est [[basale]] et sous-pleurale, pas apicale."], "E": ["F", "Les histiocytes pigmentés ne départagent pas ; l'asbestose = **fibrose + corps asbestosiques**."]}, "fmt": "QCS", "o": [["of2/o_2026a-49_0.png", 11]]}, {"id": "2026a-50", "exam": "2026a", "label": "Janvier 2026", "n": 50, "stem": "Quel élément de l’anamnèse ou du contexte professionnel serait le plus utile pour différencier silicose et asbestose dans ce cas ?", "case": "2026a-c4", "tables": [], "imgs": [], "c": "pneumo", "s": ["p12-21"], "t": [], "g": "Anamnèse pour départager :\n• **calorifugeage**, isolation thermique, entretien de chaudières → **amiante** ;\n• **sablage**, taille de pierre → **silice** ;\n• ancienneté, tabac, EFR ne départagent pas.", "warn": [], "type": "single", "opts": [["A", "Ancienneté de l’exposition"], ["B", "Travail dans le sablage industriel"], ["C", "Manipulation de matériaux d’isolation thermique et calorifugeage"], ["D", "Absence de tabagisme"], ["E", "Présence d’un syndrome restrictif à l’EFR"]], "key": ["C"], "p": {"A": ["F", "L'ancienneté compte pour les deux ; ce qui départage est le **calorifugeage**."], "B": ["F", "Le sablage oriente vers la [[silice]], pas vers l'amiante."], "C": ["T", "L'**isolation thermique** et le **calorifugeage** (chaudières) sont les sources typiques d'amiante."], "D": ["F", "Le non-tabagisme ne départage pas ; ce qui départage est le **calorifugeage**."], "E": ["F", "Le syndrome restrictif existe dans les deux ; ce qui départage est le **calorifugeage**."]}, "fmt": "QCS", "cs": "Ouvrier de 58 ans, non-fumeur, matériaux de construction et chaudières (calorifugeage) : fibrose des **bases** en rayon de miel et **plaques pleurales calcifiées** → **asbestose** (TMP 30), à distinguer de la silicose (sommets).", "o": [["of2/o_2026a-50_0.png", 9]]}, {"id": "2025-01", "exam": "2025", "label": "Juin 2025", "n": 1, "stem": "Selon l’article 12 de la loi 88-07 sur la médecine du travail en Algérie, laquelle des propositions suivantes est inexacte ?", "case": null, "tables": [], "imgs": [], "c": "intro", "s": ["p2-22"], "t": [], "g": "Art. 12 de la loi 88-07, les finalités à connaître mot pour mot :\n• promouvoir le plus haut degré de **bien-être** physique et mental ;\n• **identifier et surveiller** les facteurs de risque pour les réduire ;\n• **placer et maintenir** les travailleurs dans un emploi adapté ; **adapter le travail à l'homme** ;\n• **réduire les cas d'invalidité** et prolonger la vie active ; contribuer à la sauvegarde de l'environnement.", "warn": [], "type": "single", "opts": [["A", "La médecine du travail vise à promouvoir le plus haut degré de bien-être physique et mental des travailleurs dans toutes les professions."], ["B", "Elle a pour mission d’identifier et de surveiller, en vue de réduire ou d’éliminer tous les facteurs qui, sur les lieux de travail, peuvent affecter la santé des travailleurs."], ["C", "Elle réduit les cas d’aptitude et assurer une prolongation de la vie active des travailleurs."], ["D", "Elle a pour but de placer et maintenir les travailleurs dans un emploi convenant à leurs aptitudes physiologiques et psychologiques."], ["E", "Elle contribue à la sauvegarde de l’environnement par rapport à l’homme et à la nature."]], "key": ["C"], "p": {"A": ["T", "Promouvoir le plus haut degré de **bien-être physique et mental** des travailleurs est la première finalité."], "B": ["T", "**Identifier et surveiller** les facteurs de risque pour les réduire ou les éliminer fait partie de l'article 12."], "C": ["F", "La loi dit réduire les cas d'[[invalidité]], pas d'aptitude ; réduire l'aptitude n'aurait aucun sens. C'est la proposition inexacte."], "D": ["T", "**Placer et maintenir** les travailleurs dans un emploi convenant à leurs aptitudes est une mission de la MT."], "E": ["T", "La médecine du travail contribue à la **sauvegarde de l'environnement**."]}, "fmt": "QCS", "rep": [["2026a", 1], ["2024", 1]], "o": [["of2/o_2025-01_0.png", 7]]}, {"id": "2025-02", "exam": "2025", "label": "Juin 2025", "n": 2, "stem": "Visite médicale d’embauche (VE) selon la réglementation algérienne Laquelle des propositions suivantes concernant la visite médicale d’embauche est inexacte ?", "case": null, "tables": [], "imgs": [], "c": "intro", "s": ["p2-31"], "t": [], "g": "Visite d'embauche :\n• **obligatoire** pour tout travailleur, quel que soit le contrat ;\n• **avant la prise de poste** ou pendant la période d'essai ;\n• juge l'**aptitude** au poste ; ouvre le **dossier médical** sous secret ;\n• le travailleur n'est pas encore exposé : le dépistage des MP relève des visites **périodiques**.", "warn": [], "type": "single", "opts": [["A", "Elle doit être réalisée avant la prise de poste ou durant la période d’essai."], ["B", "Elle est obligatoire pour tout travailleur, quel que soit le type ou la durée du contrat."], ["C", "Elle permet d’évaluer l’aptitude du travailleur au poste du travail."], ["D", "Elle permet de dépister les MP ou MCP"], ["E", "Elle implique la constitution d’un dossier médical individuel, conservé sous secret médical."]], "key": ["D"], "p": {"A": ["T", "Elle se fait **avant la prise de poste** ou durant la période d'essai."], "B": ["T", "Elle est **obligatoire** pour tout travailleur, quel que soit le type ou la durée du contrat."], "C": ["T", "Elle évalue l'**aptitude** du travailleur au poste de travail."], "D": ["F", "À l'embauche, le travailleur n'est pas encore exposé : le dépistage des MP/MCP relève des visites [[périodiques]]. C'est la proposition inexacte."], "E": ["T", "Elle implique la constitution d'un **dossier médical** individuel conservé sous secret."]}, "fmt": "QCS", "o": [["of2/o_2025-02_0.png", 10]]}, {"id": "2025-03", "exam": "2025", "label": "Juin 2025", "n": 3, "stem": "Laquelle des propositions suivantes concernant les visites médicales périodiques est inexacte ?", "case": null, "tables": [], "imgs": [], "c": "intro", "s": ["p2-31"], "t": [], "g": "Visites périodiques :\n• rythme **réglementaire** : au moins 1 fois/an, 2 fois/an pour les catégories à risque ;\n• entretien, examen clinique, examens paracliniques ciblés ;\n• obligatoires **tout au long de la carrière** ;\n• la visite faite « à la demande » du travailleur est la visite **spontanée**.", "warn": [], "type": "single", "opts": [["A", "Tout travailleur peut bénéficier à sa demande d'une visite médicale périodique assurée par le médecin du travail."], ["B", "Elles sont réalisées au moins une fois par an pour tous les travailleurs, et deux fois par an pour certaines catégories à risque."], ["C", "Elles comportent un entretien, un examen clinique et des examens paracliniques adaptés aux risques professionnels."], ["D", "Elles sont obligatoires tout au long de la carrière du travailleur dans l’entreprise."], ["E", "Elles permettent de vérifier le maintien de l’aptitude du travailleur au poste occupé."]], "key": ["A"], "p": {"A": ["F", "À la demande du travailleur, c'est une visite [[spontanée]], pas une visite périodique. C'est la proposition inexacte."], "B": ["T", "Au moins **1 fois/an** pour tous, **2 fois/an** pour les catégories à risque."], "C": ["T", "Elles comportent un **entretien**, un examen clinique et des examens adaptés aux risques."], "D": ["T", "Elles sont **obligatoires** tout au long de la carrière."], "E": ["T", "Elles vérifient le **maintien de l'aptitude** au poste occupé."]}, "fmt": "QCS", "o": [["of2/o_2025-03_0.png", 8]]}, {"id": "2025-04", "exam": "2025", "label": "Juin 2025", "n": 4, "stem": "Laquelle des propositions suivantes concernant la visite médicale de reprise est inexacte ?", "case": null, "tables": [], "imgs": [], "c": "intro", "s": ["p2-31", "p2-32"], "t": [], "g": "Visite de reprise :\n• après **AT, MP, maternité**, absence **≥ 21 jours** ou absences répétées ;\n• juge l'**aptitude à reprendre** ou le besoin d'**adapter** le poste ;\n• l'employeur doit **informer** le médecin du travail avant la reprise ;\n• le médecin du travail **ne contrôle pas** le bien-fondé ni la durée des arrêts.", "warn": [], "type": "single", "opts": [["A", "Elle a lieu après une absence pour maladie professionnelle, accident du travail, congé de maternité, ou absence de plus de 21 jours pour maladie ou accident non professionnel."], ["B", "Elle permet d’apprécier l’aptitude du travailleur à reprendre son poste ou la nécessité d’une adaptation des conditions de travail."], ["C", "Le médecin du travail n’est pas habilité à contrôler le bien-fondé des absences pour maladie ou accident."], ["D", "Elle autorise le médecin du travail à vérifier la justification et la durée de l’arrêt de travail prescrit par le médecin traitant."], ["E", "L’employeur doit informer le médecin du travail préalablement à la reprise du travail après une absence concernée."]], "key": ["D"], "p": {"A": ["T", "Elle a lieu après AT, MP, maternité, absence de plus de **21 jours** pour maladie ou accident non professionnel."], "B": ["T", "Elle apprécie l'**aptitude à reprendre** ou la nécessité d'adapter les conditions de travail."], "C": ["T", "Le médecin du travail **n'est pas habilité** à contrôler le bien-fondé des absences."], "D": ["F", "Vérifier la justification et la durée de l'arrêt relève du [[médecin contrôleur]] de la CNAS, jamais du médecin du travail. C'est la proposition inexacte."], "E": ["T", "L'employeur doit **informer** le médecin du travail avant la reprise."]}, "fmt": "QCS", "o": [["of2/o_2025-04_0.png", 8]]}, {"id": "2025-05", "exam": "2025", "label": "Juin 2025", "n": 5, "stem": "Laquelle des propositions suivantes concernant les examens complémentaires prescrits par le médecin du travail est inexacte ?", "case": null, "tables": [], "imgs": [], "c": "intro", "s": ["p2-14", "p2-23"], "t": [], "g": "Examens complémentaires en médecine du travail :\n• prescrits pour l'**aptitude** et le **dépistage** des MP/MCP ;\n• adaptés aux risques : radiologie, EFR, audiométrie, biologie ;\n• prescription laissée à l'**appréciation** du médecin du travail ;\n• **à la charge de l'employeur**, qui organise et finance la médecine du travail.", "warn": [], "type": "single", "opts": [["A", "Ils peuvent être prescrits pour déterminer l’aptitude médicale au poste de travail."], ["B", "Ils servent à dépister les MP ou MCP."], ["C", "Ils peuvent inclure des examens radiologiques, des explorations fonctionnelles respiratoires ou auditives selon les risques."], ["D", "Ils sont à la charge de des établissements hospitaliers."], ["E", "Leur prescription relève de l’appréciation du médecin du travail en fonction des risques professionnels présents."]], "key": ["D"], "p": {"A": ["T", "Ils peuvent être prescrits pour déterminer l'**aptitude** au poste."], "B": ["T", "Ils servent au **dépistage** des MP et MCP."], "C": ["T", "Ils incluent radiologie, **EFR**, audiométrie selon les risques du poste."], "D": ["F", "Ils sont à la charge de l'[[employeur]], pas des établissements hospitaliers. C'est la proposition inexacte."], "E": ["T", "Leur prescription relève de l'**appréciation** du médecin du travail."]}, "fmt": "QCS", "o": [["of2/o_2025-05_0.png", 7], ["of2/o_2025-05_1.png", 9]]}, {"id": "2025-06", "exam": "2025", "label": "Juin 2025", "n": 6, "stem": "Laquelle des propositions suivantes concernant la vaccination en milieu professionnel est inexacte ?", "case": null, "tables": [], "imgs": [], "c": "intro", "s": ["p2-33", "p16-21"], "t": [], "g": "Vaccination en milieu professionnel :\n• certaines sont **obligatoires** pour les catégories exposées (hépatite B chez le personnel de santé exposé au sang) ;\n• d'autres sont **recommandées** par le médecin du travail selon les risques ;\n• la vaccination **complète** la prévention technique et individuelle ;\n• elle ne la **remplace jamais**.", "warn": [], "type": "single", "opts": [["A", "Certaines vaccinations sont légalement ou réglementairement obligatoires pour des catégories de travailleurs exposés à des agents biologiques spécifiques."], ["B", "La vaccination recommandée vise à compléter les mesures de protection collective et individuelle, selon l’évaluation du médecin du travail."], ["C", "La vaccination obligatoire se substitue à toutes les autres mesures de prévention technique ou individuelle dans l’entreprise."], ["D", "Le médecin du travail propose les vaccinations recommandées en fonction des risques professionnels présents dans l’entreprise."], ["E", "La vaccination contre l’hépatite B est obligatoire pour le personnel hospitalier exposé au sang."]], "key": ["C"], "p": {"A": ["T", "Certaines vaccinations sont **légalement obligatoires** pour les catégories exposées à des agents biologiques."], "B": ["T", "La vaccination recommandée **complète** les mesures de protection collective et individuelle."], "C": ["F", "La vaccination ne se [[substitue]] jamais aux mesures techniques et individuelles ; elle les complète. C'est la proposition inexacte."], "D": ["T", "Le médecin du travail **propose** les vaccinations recommandées selon les risques présents."], "E": ["T", "La vaccination contre l'**hépatite B** est obligatoire pour le personnel hospitalier exposé au sang."]}, "fmt": "QCS", "o": [["of2/o_2025-06_0.png", 12]]}, {"id": "2025-07", "exam": "2025", "label": "Juin 2025", "n": 7, "stem": "Laquelle des propositions suivantes concernant le rôle de conseiller du médecin du travail auprès de l’organisme employeur est inexacte ?", "case": null, "tables": [], "imgs": [], "c": "intro", "s": ["p2-23"], "t": [], "g": "Rôle de conseiller du médecin du travail (art. 22, décret 93-120) :\n• amélioration des **conditions de vie et de travail** ;\n• **hygiène** des locaux et de la restauration ;\n• **formation** et information (port des EPI) ;\n• **adaptation** des postes et des rythmes ; participation à la CPHS.\nIl **conseille et alerte**, il n'impose pas.", "warn": [], "type": "single", "opts": [["A", "Il conseille sur l’amélioration des conditions de vie et de travail au sein de l’entreprise."], ["B", "Il participe à l’hygiène générale des lieux de travail et des services de restauration."], ["C", "Il sensibilise et forme les travailleurs au port des équipements de protection individuelle."], ["D", "Il peut proposer des adaptations des postes ou des rythmes de travail en fonction de l’état de santé du travailleur."], ["E", "Il peut imposer à l’employeur des mesures immédiates sans concertation préalable."]], "key": ["E"], "p": {"A": ["T", "Il conseille sur l'amélioration des **conditions de vie et de travail**."], "B": ["T", "Il participe à l'**hygiène générale** des lieux de travail et de la restauration."], "C": ["T", "Il **sensibilise et forme** les travailleurs au port des EPI."], "D": ["T", "Il propose des **adaptations** des postes ou des rythmes selon l'état de santé."], "E": ["F", "Le médecin du travail ne peut pas [[imposer]] de mesures à l'employeur ; il propose, conseille et alerte. C'est la proposition inexacte."]}, "fmt": "QCS", "o": [["of2/o_2025-07_0.png", 11]]}, {"id": "2025-08", "exam": "2025", "label": "Juin 2025", "n": 8, "stem": "Laquelle des propositions suivantes concernant les activités médicoadministratives du médecin du travail est inexacte ?", "case": null, "tables": [], "imgs": [], "c": "intro", "s": ["p2-24", "p2-32"], "t": [], "g": "Activités médico-administratives :\n• **dossier médical** individuel, consultable par le seul médecin du travail inspecteur ;\n• **registres** : activité, visites, vaccinations, MP, postes exposés, visites d'atelier ;\n• **rapport annuel** d'activité ;\n• le dossier médical n'est **jamais** transmis à l'employeur, même sur demande écrite.", "warn": [], "type": "single", "opts": [["A", "Il doit tenir un dossier médical individuel pour chaque travailleur, consultable uniquement par le médecin du travail inspecteur territorialement compétent."], ["B", "Il établit un registre d’activité quotidienne et de toutes les visites médicales (embauche, périodiques, spontanées, reprise)."], ["C", "Il rédige chaque année un rapport d’activité détaillé retraçant l’ensemble de ses interventions dans l’entreprise."], ["D", "Il peut transmettre le dossier médical individuel du travailleur à l’employeur en cas de demande écrite de ce dernier."], ["E", "Il tient à jour un registre des vaccinations et un registre des maladies professionnelles en milieu de travail."]], "key": ["D"], "p": {"A": ["T", "Le **dossier médical** individuel n'est consultable que par le médecin du travail inspecteur compétent."], "B": ["T", "Il tient un **registre** d'activité quotidienne et de toutes les visites."], "C": ["T", "Il rédige chaque année un **rapport d'activité** détaillé."], "D": ["F", "Même sur [[demande écrite]], l'employeur ne reçoit jamais le dossier médical : seulement la fiche d'aptitude. C'est la proposition inexacte."], "E": ["T", "Il tient à jour un **registre des vaccinations** et un **registre des MP**."]}, "fmt": "QCS", "o": [["of2/o_2025-08_0.png", 12], ["of2/o_2025-08_1.png", 10]]}, {"id": "2025-09", "exam": "2025", "label": "Juin 2025", "n": 9, "stem": "Laquelle des propositions suivantes concernant la prévention en santé au travail est inexacte ?", "case": null, "tables": [], "imgs": [], "c": "intro", "s": ["p2-33"], "t": [], "g": "Niveaux de prévention :\n• **primaire** : agir sur les facteurs de risque avant la maladie ;\n• **secondaire** : **dépister** précocement, avant les signes cliniques ;\n• **tertiaire** : limiter les **conséquences** d'une atteinte déjà installée (séquelles, maintien dans l'emploi) ;\n• la prévention technique collective agit à la source ; la prévention médicale passe par les visites.", "warn": [], "type": "single", "opts": [["A", "La prévention primaire vise à empêcher la survenue d’accidents ou de maladies en agissant sur les facteurs de risque."], ["B", "La prévention secondaire consiste à dépister précocement les maladies professionnelles, avant l’apparition des signes cliniques."], ["C", "La prévention tertiaire vise à empêcher l’apparition de nouveaux risques dans l’entreprise."], ["D", "La prévention technique collective concerne l’amélioration des ambiances de travail et la réduction des nuisances à la source."], ["E", "La prévention médicale comprend les visites d’embauche, les visites périodiques et les visites de reprise."]], "key": ["C"], "p": {"A": ["T", "La prévention **primaire** empêche la survenue des maladies en agissant sur les facteurs de risque."], "B": ["T", "La prévention **secondaire** dépiste les MP avant l'apparition des signes cliniques."], "C": ["F", "La prévention tertiaire limite les [[conséquences]] d'une atteinte installée ; empêcher de nouveaux risques relève du primaire. C'est la proposition inexacte."], "D": ["T", "La prévention **technique collective** améliore les ambiances et réduit les nuisances à la source."], "E": ["T", "La prévention **médicale** comprend les visites d'embauche, périodiques et de reprise."]}, "fmt": "QCS", "o": [["of2/o_2025-09_0.png", 13]]}, {"id": "2025-10", "exam": "2025", "label": "Juin 2025", "n": 10, "stem": "Laquelle des propositions suivantes concernant les formes d’intoxication est inexacte ?", "case": null, "tables": [], "imgs": [], "c": "toxi", "s": ["p4-23"], "t": [], "g": "Formes d'intoxication :\n• **aiguë** : exposition courte, absorption massive, signes < 24 h ;\n• **subaiguë** : expositions répétées sur jours ou semaines (pneumopathie au béryllium) ;\n• **chronique** : faibles doses prolongées, par **accumulation du toxique** (plomb) **ou** par **addition des effets** (CS₂).", "warn": [], "type": "single", "opts": [["A", "L’intoxication aiguë résulte d’une exposition de courte durée avec absorption massive du toxique, les signes apparaissent en moins de 24 heures."], ["B", "L’intoxication subaiguë correspond à des expositions répétées sur quelques jours ou semaines, à des doses modérées."], ["C", "L’intoxication chronique est liée à une exposition prolongée à des doses faibles, avec manifestations cliniques souvent retardées."], ["D", "L’intoxication chronique résulte uniquement d’une addition d’effets successifs, indépendamment de toute accumulation du toxique dans l’organisme."], ["E", "L’intoxication subaiguë peut se voir lors d’une pneumopathie d’hypersensibilité au béryllium."]], "key": ["D"], "p": {"A": ["T", "L'intoxication **aiguë** suit une exposition courte avec absorption massive ; signes en moins de 24 h."], "B": ["T", "L'intoxication **subaiguë** correspond à des expositions répétées sur quelques jours ou semaines."], "C": ["T", "L'intoxication **chronique** est liée à des doses faibles prolongées, avec signes retardés."], "D": ["F", "L'intoxication chronique se fait aussi par **accumulation du toxique** (plomb) ; le mot « [[uniquement]] » rend la phrase inexacte."], "E": ["T", "La pneumopathie d'hypersensibilité au **béryllium** peut avoir une forme subaiguë."]}, "fmt": "QCS", "o": [["of2/o_2025-10_0.png", 9]]}, {"id": "2025-11", "exam": "2025", "label": "Juin 2025", "n": 11, "stem": "La différence entre l'AT et la MP est que cette dernière est : (CRJ)", "case": null, "tables": [], "imgs": [], "c": "atmp", "s": ["p5-21", "p5-11"], "t": [], "g": "AT et MP :\n• **AT** : fait **soudain**, daté, extérieur, à l'origine d'une lésion ;\n• **MP** : exposition **plus ou moins prolongée** lors de l'exercice habituel ;\n• pour la MP, le **point de départ** est difficile à fixer et le **lien avec la profession** difficile à prouver, d'où le système des tableaux (présomption).", "warn": [], "type": "multi", "opts": [["1", "La conséquence d’un fait matériel fortuit à l’origine d’une lésion corporelle"], ["2", "La conséquence d’exposition, plus ou moins prolongée, à un risque lors de l’exercice habituel de la profession"], ["3", "La preuve de relation « cause à effet » est le plus souvent facile à apporter"], ["4", "Toujours difficile de fixer le point de départ de la maladie,"], ["5", "La relation avec la profession n’est toujours facile à matérialiser"]], "p": {"1": ["F", "Le fait matériel fortuit, soudain, définit l'[[accident du travail]], pas la MP."], "2": ["T", "La MP résulte d'une exposition **plus ou moins prolongée** lors de l'exercice habituel de la profession."], "3": ["F", "Pour la MP, la preuve du lien est au contraire [[difficile]] à apporter, d'où les tableaux."], "4": ["T", "Il est **difficile de dater** le début d'une maladie professionnelle, qui s'installe progressivement."], "5": ["T", "La relation avec la profession n'est **pas toujours facile** à matérialiser."]}, "key": ["2", "4", "5"], "fmt": "QCM", "rep": [["2024", 9]], "o": [["of2/o_2025-11_0.png", 6]]}, {"id": "2025-12", "exam": "2025", "label": "Juin 2025", "n": 12, "stem": "Le certificat médical descriptif de consolidation : (CRF)", "case": null, "tables": [], "imgs": [], "c": "atmp", "s": ["p5-31"], "t": [], "g": "Guérison ou consolidation :\n• **guérison** : disparition des lésions, retour à l'état antérieur, **sans IPP** ;\n• **consolidation** : lésions **stabilisées** avec séquelles possibles → **IPP** ;\n• le certificat de consolidation est établi en **2 exemplaires** et coïncide souvent avec la reprise du travail.", "warn": [], "type": "single", "opts": [["A", "Établit à la suite de l’état transitoire que constitue la période de soins"], ["B", "Etabli en 02 exemplaires, dont l'un est adressé à l'organisme de SS, et l'autre remis à la victime"], ["C", "Etabli lorsqu’il y a disparition apparente des lésions traumatiques ou morbides occasionnées par l’accident"], ["D", "Matérialise le caractère permanent de l’incapacité"], ["E", "En pratique, coïncide souvent avec une reprise du travail"]], "key": ["C"], "p": {"A": ["T", "La consolidation fait suite à l'**état transitoire** de la période de soins."], "B": ["T", "Le certificat est établi en **2 exemplaires** : un pour l'organisme de sécurité sociale, un pour la victime."], "C": ["F", "La [[disparition des lésions]] définit la **guérison** ; la consolidation correspond à des lésions fixées avec séquelles. C'est la proposition fausse."], "D": ["T", "La consolidation **matérialise** le caractère permanent de l'incapacité (IPP)."], "E": ["T", "En pratique, elle **coïncide souvent** avec la reprise du travail."]}, "fmt": "QCS", "rep": [["2024", 8]], "o": [["of2/o_2025-12_0.png", 4]]}, {"id": "2025-13", "exam": "2025", "label": "Juin 2025", "n": 13, "stem": "Parmi les affirmations suivantes concernant la définition des horaires atypiques en Algérie, laquelle est inexacte ?", "case": null, "tables": [], "imgs": [], "c": "hor", "s": ["p18-11"], "t": [], "g": "Horaires atypiques en Algérie :\n• tout travail **hors de la journée et de la semaine normales** (nuit, posté, week-end) ;\n• **travail de nuit** : de **21 h à 5 h** (loi 90-11, art. 27), interdit avant 19 ans ;\n• **travail posté** : continu (24 h/24), semi-continu (3 × 8 avec arrêt) ou discontinu (2 × 8) ;\n• secteurs à continuité de service : soins, sécurité, industrie continue.", "warn": [], "type": "single", "opts": [["A", "Les horaires atypiques incluent le travail de nuit, le travail posté et le travail durant le week-end."], ["B", "représentent l’ensemble des configurations du temps de travail situées en dehors du cadre de la journée et/ou de la semaine normale."], ["C", "Le travail de nuit est défini comme tout travail exécuté entre 21h et 7h."], ["D", "Le travail posté peut être continu, semi-continu ou discontinu selon l’organisation des équipes."], ["E", "Les horaires atypiques sont souvent mis en place dans les secteurs nécessitant une continuité de service."]], "key": ["C"], "p": {"A": ["T", "Travail de nuit, travail posté et travail du week-end font partie des **horaires atypiques**."], "B": ["T", "Ce sont toutes les configurations du temps de travail **hors de la journée et de la semaine normales**."], "C": ["F", "En Algérie, le travail de nuit est celui exécuté entre [[21 h et 5 h]], pas 21 h et 7 h. C'est la proposition inexacte."], "D": ["T", "Le travail posté peut être **continu, semi-continu ou discontinu**."], "E": ["T", "Ils sont mis en place dans les secteurs qui exigent une **continuité de service**."]}, "fmt": "QCS", "o": [["of2/o_2025-13_0.png", 1]]}, {"id": "2025-14", "exam": "2025", "label": "Juin 2025", "n": 14, "stem": "Parmi les manifestations cliniques suivantes, laquelle est la moins spécifique du burn-out ?", "case": null, "tables": [], "imgs": [], "c": "burn", "s": ["p19-12", "p19-22"], "t": [], "g": "Manifestations du burn-out (trois dimensions de Maslach) :\n• **épuisement** physique et émotionnel (fatigue, troubles du sommeil) ;\n• **distanciation** : cynisme, perte d'empathie ;\n• **baisse d'efficacité** : concentration, erreurs ;\n• signes physiques : douleurs, tensions musculaires. L'euphorie n'en fait pas partie.", "warn": [], "type": "single", "opts": [["A", "Troubles du sommeil et fatigue chronique"], ["B", "Diminution de la concentration et erreurs mineures"], ["C", "Perte d’empathie et cynisme"], ["D", "Euphorie persistante et hyperactivité"], ["E", "Douleurs rachidiennes et tensions musculaires"]], "key": ["D"], "p": {"A": ["T", "Les **troubles du sommeil** et la fatigue chronique traduisent l'épuisement."], "B": ["T", "La **baisse de concentration** et les erreurs traduisent la perte d'efficacité."], "C": ["T", "La **perte d'empathie** et le cynisme traduisent la distanciation."], "D": ["F", "Une [[euphorie]] persistante avec hyperactivité est à l'opposé de l'épuisement : c'est le signe le moins spécifique, la réponse attendue."], "E": ["T", "Les **douleurs rachidiennes** et tensions musculaires sont des signes physiques fréquents."]}, "fmt": "QCS", "o": [["of2/o_2025-14_0.png", 12], ["of2/o_2025-14_1.png", 24]]}, {"id": "2025-15", "exam": "2025", "label": "Juin 2025", "n": 15, "stem": "Parmi les facteurs suivants, lequel ne constitue pas un facteur de risque de Burn out :", "case": null, "tables": [], "imgs": [], "c": "burn", "s": ["p19-13", "p19-14"], "t": [], "g": "Facteurs de risque du burn-out :\n• **organisationnels** : surcharge, exigences émotionnelles, manque d'autonomie, conflits de valeurs, insécurité ;\n• **individuels** : surengagement, perfectionnisme ;\n• le **soutien du collectif** de travail est un facteur **protecteur** ; son absence est un facteur de risque.", "warn": [], "type": "single", "opts": [["A", "Le surengagement"], ["B", "Conflits de valeurs"], ["C", "Surcharge de travail"], ["D", "Exigences émotionnelles importantes"], ["E", "Présence de soutien du collectif de travail"]], "key": ["E"], "p": {"A": ["T", "Le **surengagement** (hyperinvestissement) est un facteur individuel de risque."], "B": ["T", "Les **conflits de valeurs** (travail empêché, conflit éthique) sont un facteur de risque."], "C": ["T", "La **surcharge de travail** est le facteur organisationnel principal."], "D": ["T", "Les **exigences émotionnelles** (souffrance, mort, violence) sont un facteur de risque."], "E": ["F", "Le [[soutien]] du collectif de travail est un facteur **protecteur** : c'est la réponse attendue."]}, "fmt": "QCS", "rep": [["2024", 24]], "o": [["of2/o_2025-15_0.png", 21], ["of2/o_2025-15_1.png", 22]]}, {"id": "2025-16", "exam": "2025", "label": "Juin 2025", "n": 16, "stem": "Quel risque professionnel des TIC est le moins directement lié à la posture de travail ?", "case": null, "tables": [], "imgs": [], "c": "tic", "s": ["p17-13"], "t": [], "g": "Risques professionnels des TIC :\n• **biomécaniques** liés à la posture : lombalgies, canal carpien, épaule, cervicalgies ;\n• **visuels** : fatigue oculaire (écran, distance, reflets) ;\n• **cognitifs et psychosociaux** : surcharge informationnelle, interruptions, technostress.", "warn": [], "type": "single", "opts": [["A", "Surcharge informationnelle"], ["B", "Fatigue oculaire"], ["C", "Lombalgies"], ["D", "Syndrome du canal carpien"], ["E", "Tendinopathie de la coiffe des rotateurs"]], "key": ["A"], "p": {"A": ["F", "La [[surcharge informationnelle]] est un risque **cognitif**, indépendant de la posture : c'est la réponse attendue."], "B": ["T", "La **fatigue oculaire** dépend de la position et de la distance de l'écran."], "C": ["T", "Les **lombalgies** sont liées à l'assise prolongée et à la posture."], "D": ["T", "Le **canal carpien** est favorisé par le poignet dévié et les gestes répétitifs."], "E": ["T", "La **tendinopathie de la coiffe** est favorisée par les bras sans appui."]}, "fmt": "QCS", "o": [["of2/o_2025-16_0.png", 4], ["of2/o_2025-16_1.png", 5]]}, {"id": "2025-17", "exam": "2025", "label": "Juin 2025", "n": 17, "stem": "Parmi les propositions suivantes, laquelle est inexacte concernant les effets de la pollution atmosphérique sur la santé ?", "case": null, "tables": [], "imgs": [], "c": "pollu", "s": ["p10-23"], "t": [], "g": "Effets de la pollution atmosphérique :\n• **particules fines** : maladies cardiovasculaires, respiratoires, cancers ;\n• **CO** : intoxications parfois mortelles ;\n• **NO₂, SO₂** : aggravation de l'asthme ;\n• **O₃** : irritant **respiratoire** et oculaire (smog) ; **benzène** cancérogène.", "warn": [], "type": "single", "opts": [["A", "Les particules fines peuvent provoquer des maladies cardiovasculaires et des cancers."], ["B", "Le monoxyde de carbone est responsable d’accidents mortels par inhalation."], ["C", "L’ozone provoque des allergies cutanées sans effet respiratoire."], ["D", "Les oxydes d’azote aggravent l’asthme et les maladies respiratoires."], ["E", "Le benzène est un polluant cancérigène pour l’Homme."]], "key": ["C"], "p": {"A": ["T", "Les **particules fines** provoquent des maladies cardiovasculaires et des cancers."], "B": ["T", "Le **monoxyde de carbone** est responsable d'intoxications mortelles."], "C": ["F", "L'ozone est un irritant [[respiratoire]] qui aggrave l'asthme ; il ne donne pas d'allergie cutanée. C'est la proposition inexacte."], "D": ["T", "Les **oxydes d'azote** aggravent l'asthme et les maladies respiratoires."], "E": ["T", "Le **benzène** est un polluant cancérogène pour l'Homme."]}, "fmt": "QCS", "o": [["of2/o_2025-17_0.png", 15], ["of2/o_2025-17_1.png", 16]]}, {"id": "2025-18", "exam": "2025", "label": "Juin 2025", "n": 18, "stem": "Les concentrations de polluants dans l'air extérieur peuvent être influencées par tous ces facteurs sauf un lequel ?", "case": null, "tables": [], "imgs": [], "c": "pollu", "s": ["p10-21"], "t": [], "g": "Concentration des polluants dans l'air extérieur :\n• dépend des **émissions** et de la **proximité** des sources ;\n• de la **météo** (vent, inversion thermique) et du relief ;\n• de l'**activité économique** ;\n• pas des caractéristiques de l'individu, qui jouent sur sa **sensibilité**.", "warn": [], "type": "single", "opts": [["A", "La quantité de polluants atmosphériques rejetés par les sources"], ["B", "La proximité des sources"], ["C", "Les conditions météorologiques"], ["D", "La croissance de l'économie"], ["E", "Les caractéristiques de l’individu"]], "key": ["E"], "p": {"A": ["T", "La **quantité rejetée** par les sources augmente la concentration."], "B": ["T", "La **proximité** des sources augmente la concentration respirée."], "C": ["T", "Les **conditions météorologiques** dispersent ou piègent les polluants."], "D": ["T", "La **croissance économique** augmente les émissions."], "E": ["F", "Les [[caractéristiques de l'individu]] ne changent pas la concentration dans l'air : c'est l'exception demandée."]}, "fmt": "QCS", "rep": [["2026a", 20], ["2024", 30]], "o": [["of2/o_2025-18_0.png", 21]]}, {"id": "2025-19", "exam": "2025", "label": "Juin 2025", "n": 19, "stem": "Laquelle des propositions suivantes est inexacte concernant les mécanismes d’action et les particularités des perturbateurs endocriniens (PE) ?", "case": null, "tables": [], "imgs": [], "c": "pe", "s": ["p20-13", "p20-14"], "t": [], "g": "Particularités des perturbateurs endocriniens :\n• agonistes, antagonistes ou **interférence** avec la régulation hormonale ;\n• **faibles doses** : effets possibles sans seuil ;\n• relations dose-réponse **non monotones** (en U ou U inversé) ;\n• **effets cocktails** et **fenêtres de susceptibilité** (grossesse, enfance, puberté).", "warn": [], "type": "single", "opts": [["A", "Ils peuvent agir comme des agonistes, des antagonistes ou par interférence avec la production, la dégradation ou la régulation hormonale"], ["B", "Ils présentent une relation dose-réponse monotone classique"], ["C", "Ils peuvent induire sans effet de seuil"], ["D", "L’exposition simultanée à plusieurs PE peut entraîner des effets cocktails : addition, potentialisation ou inhibition des effets."], ["E", "Certaines périodes de la vie, comme la grossesse, la petite enfance ou la puberté, constituent des fenêtres de susceptibilité accrue aux effets des PE, avec possibilité d’effets transgénérationnels."]], "key": ["B"], "p": {"A": ["T", "Les PE agissent comme **agonistes**, **antagonistes** ou en interférant avec la production ou la régulation hormonale."], "B": ["F", "Leur relation dose-réponse est souvent [[non monotone]] (effets à faible dose) ; « monotone classique » est inexact."], "C": ["T", "Ils peuvent agir **sans effet de seuil** pour certains couples substance-effet."], "D": ["T", "Les **effets cocktails** associent addition, potentialisation ou inhibition."], "E": ["T", "La grossesse, la petite enfance et la puberté sont des **fenêtres de susceptibilité**, avec effets transgénérationnels possibles."]}, "fmt": "QCS", "o": [["of2/o_2025-19_0.png", 9]]}, {"id": "2025-20", "exam": "2025", "label": "Juin 2025", "n": 20, "stem": "Parmi les substances suivantes, lesquelles sont reconnues comme responsables de cancer broncho-pulmonaire selon les TMP algériens, et quels sont les numéros de leurs tableaux respectifs ?", "case": null, "tables": [], "imgs": [], "c": "cancer", "s": ["p14-32"], "t": [], "g": "CBP indemnisables et leurs tableaux :\n• **amiante** → TMP **30** ; **nickel** → TMP **37** ;\n• **arsenic** → TMP **20** ; **chrome** → TMP **10 ter** ;\n• amines aromatiques → vessie (15) ; benzène → leucémies (4) ;\n• chlorure de vinyle → angiosarcome (51) ; bois → ethmoïde (47).", "warn": [], "type": "match", "opts": [], "p": {"1": [null, "L'**amiante** donne le CBP primitif réparé par le **TMP 30** (g)."], "2": [null, "Les amines aromatiques donnent la [[vessie]] (TMP 15) : pas de CBP."], "3": [null, "Le **nickel** donne le CBP et le cancer de l'ethmoïde : **TMP 37** (b)."], "4": [null, "Le benzène donne des [[leucémies]] (TMP 4) : pas de CBP."], "5": [null, "L'**arsenic** et ses composés minéraux : **TMP 20** (c)."], "6": [null, "Le chlorure de vinyle donne l'[[angiosarcome]] du foie (TMP 51) : pas de CBP."], "7": [null, "Le **chrome** (chromates) : **TMP 10 ter** (e)."], "8": [null, "Les poussières de bois donnent le cancer de l'[[ethmoïde]] (TMP 47) : pas de CBP."]}, "left": [["1", "Amiante"], ["2", "Amines aromatiques"], ["3", "Nickel"], ["4", "Benzène"], ["5", "Arsenic"], ["6", "Chlorure de vinyle monomère"], ["7", "Chrome"], ["8", "Poussière de bois"]], "right": [["a", "47"], ["b", "37"], ["c", "20"], ["d", "15"], ["e", "10 ter"], ["f", "4"], ["g", "30"], ["h", "51"], ["0", "Aucun (pas de CBP réparé)"]], "fmt": "Association", "corr": {"1": ["g"], "2": ["0"], "3": ["b"], "4": ["0"], "5": ["c"], "6": ["0"], "7": ["e"], "8": ["0"]}, "o": [["of2/o_2025-20_0.png", 8]]}, {"id": "2025-21", "exam": "2025", "label": "Juin 2025", "n": 21, "stem": "Les anomalies du développement liées au PEE englobent : (CRJ)", "case": null, "tables": [], "imgs": [], "c": "pe", "s": ["p20-31"], "t": [], "g": "Anomalies du développement liées aux PE :\n• **faible poids** de naissance ;\n• **prématurité** ;\n• troubles du **comportement** (neurodéveloppement).\nQuestion identique en 2024 et janvier 2026.", "warn": [], "type": "multi", "opts": [["1", "Faible poids de naissance"], ["2", "Gros poids de naissance"], ["3", "Prématurité"], ["4", "Retard de dentition"], ["5", "Troubles du comportement"]], "p": {"1": ["T", "Le **faible poids de naissance** traduit une croissance fœtale réduite."], "2": ["F", "On décrit un [[faible]] poids de naissance, pas un gros poids."], "3": ["T", "La **prématurité** est une anomalie décrite."], "4": ["F", "Le [[retard de dentition]] n'est pas décrit dans le cours."], "5": ["T", "Les **troubles du comportement** reflètent l'atteinte du neurodéveloppement."]}, "key": ["1", "3", "5"], "fmt": "QCM", "rep": [["2026a", 22], ["2024", 32]], "o": [["of2/o_2025-21_0.png", 7]]}, {"id": "2025-22", "exam": "2025", "label": "Juin 2025", "n": 22, "stem": "L’exposome : (CRJ)", "case": null, "tables": [], "imgs": [], "c": "env", "s": ["p3-11"], "t": [], "g": "L'exposome :\n• toutes les expositions non génétiques **de la conception à la mort** ;\n• de **toutes natures** (chimiques, physiques, biologiques, psychosociales) ;\n• représentation **complexe et dynamique**.", "warn": [], "type": "multi", "opts": [["1", "Est la totalité des expositions d’un individu de sa naissance à sa mort"], ["2", "Est la totalité des expositions d’un individu de sa conception à sa mort"], ["3", "Intègre toutes les natures des expositions"], ["4", "Est une représentation complexe et dynamique des expositions"], ["5", "Ne considère que les expositions chimiques"]], "p": {"1": ["F", "L'exposome commence dès la [[conception]], pas à la naissance."], "2": ["T", "Il couvre les expositions **de la conception à la mort**."], "3": ["T", "Il intègre **toutes les natures** d'exposition."], "4": ["T", "C'est une représentation **complexe et dynamique**."], "5": ["F", "Il ne se limite [[pas aux expositions chimiques]]."]}, "key": ["2", "3", "4"], "fmt": "QCM", "rep": [["2026a", 23], ["2024", 33]], "o": [["of2/o_2025-22_0.png", 9]]}, {"id": "2025-23", "exam": "2025", "label": "Juin 2025", "n": 23, "stem": "Concernant l’intoxication mixte organophosphorés/carbamates, quelle affirmation est correcte ?", "case": "2025-c1", "tables": [], "imgs": [], "c": "pest", "s": ["p8-12", "p8-24", "p8-31"], "t": [], "g": "Organophosphorés et carbamates :\n• **OP** : phosphorylation **irréversible** de l'AChE (vieillissement de l'enzyme) ;\n• **carbamates** : carbamylation **réversible**, plus brève ;\n• **atropine** : antidote des effets muscariniques pour les **deux** ;\n• **oximes** (pralidoxime) : utiles pour les OP, **non systématiques** pour les carbamates.", "warn": [], "type": "single", "opts": [["A", "Les deux inhibent irréversiblement la cholinestérase"], ["B", "Les réactivateurs de la cholinestérase sont efficaces dans les deux cas"], ["C", "Les carbamates provoquent une inhibition réversible de la cholinestérase"], ["D", "L’atropine est contre-indiquée"], ["E", "Les signes neurologiques centraux sont absents dans l’intoxication aux carbamates"]], "key": ["C"], "p": {"A": ["F", "Seuls les OP inhibent [[irréversiblement]] la cholinestérase ; les carbamates l'inhibent réversiblement."], "B": ["F", "Les oximes ne sont [[pas systématiques]] pour les carbamates ; elles visent les OP avant le vieillissement de l'enzyme."], "C": ["T", "Les carbamates provoquent une inhibition **réversible** et plus courte de la cholinestérase."], "D": ["F", "L'atropine est au contraire l'[[antidote]] des effets muscariniques des OP et des carbamates."], "E": ["F", "Des signes neurologiques **centraux** sont possibles aussi avec les carbamates."]}, "fmt": "QCS", "o": [["of2/o_2025-23_0.png", 2]]}, {"id": "2025-24", "exam": "2025", "label": "Juin 2025", "n": 24, "stem": "Quels sont les signes cliniques évocateurs d’un syndrome muscarinique dans ce contexte ?", "case": "2025-c1", "tables": [], "imgs": [], "c": "pest", "s": ["p8-22"], "t": [], "g": "Syndrome muscarinique (parasympathique) :\n• **myosis** ;\n• **hypersécrétions** : salivation, larmoiement, sueurs, bronchorrhée ;\n• **bradycardie** ;\n• diarrhée, vomissements, mictions. Fasciculations = nicotinique ; convulsions et coma = central.", "warn": [], "type": "single", "opts": [["A", "Myosis, hypersalivation, bradycardie"], ["B", "Fasciculations, crampes musculaires, tachycardie"], ["C", "Convulsions, coma"], ["D", "Hyperthermie, mydriase"], ["E", "Hyperglycémie, polyurie"]], "key": ["A"], "p": {"A": ["T", "**Myosis, hypersalivation, bradycardie** sont des signes muscariniques typiques."], "B": ["F", "Fasciculations, crampes et tachycardie sont des signes [[nicotiniques]]."], "C": ["F", "Convulsions et coma sont des signes [[centraux]]."], "D": ["F", "Mydriase et hyperthermie évoquent un syndrome **anticholinergique** ; le muscarinique donne un **myosis**."], "E": ["F", "Hyperglycémie et polyurie ne font pas partie du syndrome muscarinique."]}, "fmt": "QCS", "o": [["of2/o_2025-24_0.png", 4], ["of2/o_2025-24_1.png", 3]]}, {"id": "2025-25", "exam": "2025", "label": "Juin 2025", "n": 25, "stem": "Concernant les effets nicotiniques observés lors d’une intoxication aiguë aux organophosphorés, quelle affirmation est correcte ?", "case": "2025-c1", "tables": [], "imgs": [], "c": "pest", "s": ["p8-22"], "t": [], "g": "Effets nicotiniques des OP :\n• stimulation de la **jonction neuromusculaire** et des ganglions ;\n• **fasciculations, crampes**, puis **paralysie** (dont muscles respiratoires) ;\n• **tachycardie, HTA** possibles ;\n• ils apparaissent **après** les muscariniques et peuvent être **mortels**.", "warn": [], "type": "single", "opts": [["A", "Ils apparaissent généralement avant les effets muscariniques"], ["B", "Ils se manifestent par une hypersécrétion bronchique, bradycardie et myosis"], ["C", "Ils résultent de la stimulation de la jonction neuromusculaire et du système nerveux autonome, provoquant fasciculations, crampes, paralysie rapide des muscles respiratoires, tachycardie et hypertension artérielle"], ["D", "Ils ne concernent que le SNC et se traduisent uniquement par des convulsions"], ["E", "Ils ne sont jamais responsables de décès lors d’intoxication sévère"]], "key": ["C"], "p": {"A": ["F", "Ce sont les effets [[muscariniques]] qui apparaissent en premier."], "B": ["F", "Hypersécrétion bronchique, bradycardie et myosis sont des signes **muscariniques**."], "C": ["T", "Ils résultent de la stimulation de la **jonction neuromusculaire** et du système autonome : fasciculations, paralysie, tachycardie, HTA."], "D": ["F", "Les effets centraux forment un **troisième groupe** ; les nicotiniques sont périphériques."], "E": ["F", "La paralysie des muscles respiratoires est une [[cause de décès]] majeure."]}, "fmt": "QCS", "o": [["of2/o_2025-25_0.png", 4]]}, {"id": "2025-26", "exam": "2025", "label": "Juin 2025", "n": 26, "stem": "Parmi les complications suivantes, laquelle n’est PAS typiquement associée à une intoxication aiguë sévère aux organophosphorés ?", "case": "2025-c1", "tables": [], "imgs": [], "c": "pest", "s": ["p8-22", "p8-23"], "t": [], "g": "Complications d'une intoxication grave aux OP :\n• **OAP** et bronchorrhée, insuffisance respiratoire ;\n• **rhabdomyolyse**, **insuffisance rénale aiguë** ;\n• **troubles du rythme** (QT long) ;\n• syndrome intermédiaire (24-96 h), neuropathie retardée. Pas d'hypercalcémie.", "warn": [], "type": "single", "opts": [["A", "Œdème pulmonaire"], ["B", "Rhabdomyolyse"], ["C", "Insuffisance rénale aiguë"], ["D", "Hypercalcémie"], ["E", "Troubles du rythme cardiaque"]], "key": ["D"], "p": {"A": ["T", "L'**œdème pulmonaire** (bronchorrhée) est une complication classique."], "B": ["T", "La **rhabdomyolyse** découle des fasciculations et convulsions."], "C": ["T", "L'**insuffisance rénale aiguë** complique la rhabdomyolyse et le choc."], "D": ["F", "L'[[hypercalcémie]] ne fait pas partie des complications des OP : c'est la réponse attendue."], "E": ["T", "Les **troubles du rythme** (QT allongé) sont fréquents."]}, "fmt": "QCS", "o": [["of2/o_2025-26_0.png", 4], ["of2/o_2025-26_1.png", 6]]}, {"id": "2025-27", "exam": "2025", "label": "Juin 2025", "n": 27, "stem": "Quelle est la conduite thérapeutique spécifique à instaurer en urgence chez ce patient ? (RF)", "case": "2025-c1", "tables": [], "imgs": [], "c": "pest", "s": ["p8-31", "p8-23"], "t": [], "g": "Traitement d'une intoxication aiguë aux OP :\n1. **décontamination** et protection des soignants ;\n2. **ABC**, intubation et ventilation si besoin ;\n3. **atropine** IV titrée jusqu'à assèchement bronchique ;\n4. **oximes** précoces pour les OP ;\n5. **surveillance prolongée** (≥ 48 h) : syndrome intermédiaire à 24-96 h, récidive.", "warn": [], "type": "single", "opts": [["A", "Atropine IV jusqu’à signes d’atropinisation"], ["B", "Oximes IV dans les 24 premières heures"], ["C", "Charbon activé répété"], ["D", "Intubation/trachéotomie si nécessaire"], ["E", "Surveillance de 12h"]], "key": ["E"], "p": {"A": ["T", "L'**atropine IV** est titrée jusqu'aux signes d'atropinisation (bronches sèches)."], "B": ["T", "Les **oximes** sont données au plus tôt, dans les 24 premières heures, avant le vieillissement de l'enzyme."], "C": ["T", "Le **charbon activé** peut se discuter en cas d'ingestion (retenu par la clé)."], "D": ["T", "L'**intubation** est nécessaire en cas de détresse respiratoire."], "E": ["F", "Une surveillance de [[12 h]] est insuffisante : il faut au moins 48 h, car le syndrome intermédiaire survient entre 24 et 96 h."]}, "fmt": "QCS", "o": [["of2/o_2025-27_0.png", 3], ["of2/o_2025-27_1.png", 6]]}, {"id": "2025-28", "exam": "2025", "label": "Juin 2025", "n": 28, "stem": "Concernant la réparation des intoxications professionnelles par pesticides (RF) :", "case": "2025-c1", "tables": [], "imgs": [], "c": "pest", "s": ["p8-33"], "t": [34], "g": "TMP 34 (OP et carbamates anticholinestérasiques) :\n• **groupe 1** (intoxications) ;\n• **DPC 7 jours** pour les formes aiguës ;\n• liste des travaux **indicative** ;\n• syndrome biologique : **abaissement** de l'activité cholinestérasique (sauf carbamates).", "warn": [], "type": "single", "opts": [["A", "Le numéro du tableau qui concerne la réparation des affections dues aux pesticides organophosphorés et carbamates est le Tableau n°34."], ["B", "Ce tableau appartient au groupe 1 des TMP."], ["C", "Le syndrome biologique caractéristique est une augmentation significative de l’acétylcholinestérase des globules rouges."], ["D", "Le délai de prise en charge est de 7 jours après la cessation de l’exposition pour les formes aiguës."], ["E", "La liste des travaux exposants mentionnée dans ce tableau est indicative."]], "key": ["C"], "p": {"A": ["T", "Le **tableau n° 34** répare les affections dues aux OP et carbamates."], "B": ["T", "Il appartient au **groupe 1** des TMP."], "C": ["F", "Le TMP 34 exige un [[abaissement]] de l'acétylcholinestérase, pas une augmentation. C'est la proposition fausse."], "D": ["T", "Le délai de prise en charge est de **7 jours** pour les formes aiguës."], "E": ["T", "La liste des travaux est **indicative**."]}, "fmt": "QCS", "cs": "Ouvrier agricole de 34 ans, pulvérisation d'insecticides en serre sans protection : **toxidrome cholinergique** (muscarinique, nicotinique, central) par **organophosphorés et carbamates**. Prise en charge en urgence et déclaration en AT, réparation au **TMP 34**.", "o": [["of2/o_2025-28_0.png", 8]]}, {"id": "2025-29", "exam": "2025", "label": "Juin 2025", "n": 29, "stem": "Que recherchez-vous à l’examen clinique pour conforter l’hypothèse d’une atteinte neurologique périphérique ?", "case": "2025-c2", "tables": [], "imgs": [], "c": "metaux", "s": ["p6-12"], "t": [1], "g": "Neuropathie saturnine :\n• **motrice pure**, touchant les **extenseurs** ;\n• paralysie **pseudo-radiale** : « chute du poignet », respect du long supinateur ;\n• pas de trouble sensitif net ;\n• Babinski et hypertonie sont des signes **centraux**.", "warn": [], "type": "single", "opts": [["A", "Hypertonie spastique"], ["B", "Babinski bilatéral"], ["C", "Myosis serré"], ["D", "Faiblesse des extenseurs des poignets"], ["E", "Hypoesthésie en chaussette"]], "key": ["D"], "p": {"A": ["F", "L'hypertonie spastique est un signe [[central]] (pyramidal), pas périphérique."], "B": ["F", "Le signe de Babinski est [[central]] (atteinte pyramidale)."], "C": ["F", "Le myosis évoque les **organophosphorés** ; le plomb donne une faiblesse des extenseurs."], "D": ["T", "La **faiblesse des extenseurs** des poignets est la neuropathie motrice typique du plomb."], "E": ["F", "L'hypoesthésie en chaussette est sensitive ; le plomb donne une neuropathie **motrice**."]}, "fmt": "QCS", "o": [["of2/o_2025-29_0.png", 4]]}, {"id": "2025-30", "exam": "2025", "label": "Juin 2025", "n": 30, "stem": "Que demandez-vous comme premier bilan biologique pour étayer le diagnostic d’intoxication professionnelle (RF) ?", "case": "2025-c2", "tables": [], "imgs": [], "c": "metaux", "s": ["p6-13", "p6-21"], "t": [1, 2], "g": "Bilan d'une double exposition plomb + mercure :\n• batteries → **plomb** : **plombémie** (référence), **ALA urinaire**, **PPZ** ;\n• lampes fluorescentes, instruments de mesure → **mercure** : **mercuriurie** ;\n• ± NFS, bilan rénal. La calcémie n'explore aucune des deux.", "warn": [], "type": "single", "opts": [["A", "Plombémie"], ["B", "ALA urinaire"], ["C", "PPZ"], ["D", "Calcémie"], ["E", "mercuriurie"]], "key": ["D"], "p": {"A": ["T", "La **plombémie** est le biomarqueur de référence de l'exposition au plomb."], "B": ["T", "L'**ALA urinaire** augmente par inhibition de l'ALA-déshydratase."], "C": ["T", "La **PPZ** augmente par inhibition de la ferrochélatase."], "D": ["F", "La [[calcémie]] n'explore ni le plomb ni le mercure : c'est la réponse attendue."], "E": ["T", "La **mercuriurie** explore l'exposition au mercure (lampes, instruments)."]}, "fmt": "QCS", "o": [["of2/o_2025-30_0.png", 5]]}, {"id": "2025-31", "exam": "2025", "label": "Juin 2025", "n": 31, "stem": "Que recherchez-vous comme anomalie sur la NFS pour soutenir la piste saturnine (RF) ?", "case": "2025-c2", "tables": [], "imgs": [], "c": "metaux", "s": ["p6-12"], "t": [1], "g": "Anémie saturnine :\n• **normocytaire** ou légèrement hypochrome ;\n• **régénérative** (composante hémolytique) ;\n• **granulations basophiles** des hématies ;\n• jamais mégaloblastique.", "warn": ["« Microcytaire » (A) est aussi inexact selon le cours, mais une seule réponse est attendue et une microcytose reste possible (carence martiale associée)."], "type": "single", "opts": [["A", "Anémie microcytaire"], ["B", "Anémie normochrome, normocytaire"], ["C", "Anémie mégaloblastique"], ["D", "Anémie régénérative"], ["E", "Granulations basophiles"]], "key": ["C"], "p": {"A": ["T", "Une anémie **microcytaire** / hypochrome est possible dans le saturnisme."], "B": ["T", "Une anémie **normochrome normocytaire** est classique."], "C": ["F", "L'anémie [[mégaloblastique]] n'existe pas dans le saturnisme : c'est la réponse attendue."], "D": ["T", "L'anémie peut être **régénérative** par composante hémolytique."], "E": ["T", "Les **granulations basophiles** sont le signe hématologique classique."]}, "fmt": "QCS", "o": [["of2/o_2025-31_0.png", 5]]}, {"id": "2025-3
