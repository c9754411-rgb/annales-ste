déborde, lésions à distance |\n| Patch test | négatif | positif |", "warn": [], "type": "multi", "opts": [["1", "L'atteinte irritative est collective, l'atteinte allergique est individuelle."], ["2", "L'eczéma allergique apparaît 24 à 48 heures après l'exposition chez un sujet déjà sensibilisé."], ["3", "Le patch test est positif dans la dermite irritative."], ["4", "Les lésions irritatives disparaissent 3 à 4 jours après l'arrêt de l'exposition."], ["5", "Le prurit est au premier plan dans la dermite irritative."]], "p": {"1": ["T", "**Collective** vs **individuelle**."], "2": ["T", "Délai **24-48 h**, sensibilisation préalable."], "3": ["F", "Patch test **négatif** dans la dermite irritative."], "4": ["T", "Disparition en **3-4 jours**."], "5": ["F", "Le prurit y est **peu important** ; sensation de **brûlure**."]}, "key": ["1", "2", "4"], "fmt": "QCM", "o": [["of2/o_blanc3-26_0.png", 6]]}, {"id": "blanc3-27", "exam": "blanc3", "label": "Examen blanc n°3", "n": 27, "stem": "Concernant les tests épicutanés prévus chez Mme N. A., quelles propositions sont exactes ?", "case": "blanc3-c4", "tables": [], "imgs": [], "c": "derm", "s": [], "t": [], "g": "Tests cutanés :\n| Test | Indication |\n| Patch test (épicutané) | hypersensibilité retardée : eczéma de contact |\n| Prick test | hypersensibilité immédiate : urticaire (lecture 20 min) |\n| IDR | explorations médicamenteuses |\n| Test ouvert / semi-ouvert | produits professionnels d'effet irritant ou de composition inconnus |", "warn": [], "type": "multi", "opts": [["1", "Ils sont réalisés au moins deux semaines après la guérison complète du site testé."], ["2", "Les allergènes sont appliqués sous occlusion sur la peau du dos pendant 48 heures."], ["3", "La lecture se fait de 48 à 96 heures, 30 minutes après le retrait du matériel."], ["4", "Une batterie spécifique à la coiffure peut compléter la batterie standard."], ["5", "Le prick test est l'examen de référence de l'eczéma de contact."]], "p": {"1": ["T", "Délai **≥ 2 semaines** après guérison, site indemne."], "2": ["T", "Pastilles sur le **dos**, laissées **48 h**."], "3": ["T", "Lecture **48-96 h**, **30 min** après retrait (éviter les faux négatifs)."], "4": ["T", "Batteries **spécifiques** : coiffure, colles, plastiques."], "5": ["F", "Le prick test explore l'hypersensibilité **immédiate** ; l'eczéma relève du **patch test**."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc3-27_0.png", 7]]}, {"id": "blanc3-28", "exam": "blanc3", "label": "Examen blanc n°3", "n": 28, "stem": "Une réaction avec érythème, infiltration, papules et vésicules correspond, selon le score ICDRG, à :", "case": "blanc3-c4", "tables": [], "imgs": [], "c": "derm", "s": [], "t": [], "g": "Score ICDRG :\n| Cotation | Aspect |\n| NT | non testé |\n| IR | irritation |\n| − | négatif |\n| +? | douteux, léger érythème |\n| + | érythème, infiltration, parfois papule |\n| ++ | érythème, infiltration, papule, vésicule |\n| +++ | érythème intense, vésicules coalescentes |", "warn": [], "type": "single", "opts": [["A", "+?"], ["B", "+"], ["C", "++"], ["D", "+++"], ["E", "IR"]], "p": {"A": ["F", "**+?** : réaction douteuse, léger érythème."], "B": ["F", "**+** : faible, érythème et infiltration, parfois papule."], "C": ["T", "**++** : forte réaction : érythème, infiltration, **papule, vésicule**."], "D": ["F", "**+++** : érythème intense, infiltration, **vésicules coalescentes**."], "E": ["F", "**IR** : réaction d'irritation."]}, "key": ["C"], "fmt": "QCS", "o": [["of2/o_blanc3-28_0.png", 7]]}, {"id": "blanc3-29", "exam": "blanc3", "label": "Examen blanc n°3", "n": 29, "stem": "Concernant la réparation de l'eczéma de Mme N. A. au titre du tableau n°64, quelles propositions sont exactes ?", "case": "blanc3-c4", "tables": [], "imgs": [], "c": "derm", "s": [], "t": [], "g": "TMP n°64 — lésions eczématiformes allergiques :\n• désignation : lésions **récidivant** après nouvelle exposition **ou** confirmées par un **test épicutané positif** au produit manipulé ;\n• DPC **30 jours** ; liste **limitative** ;\n• agents chimiques : persulfates alcalins, **thioglycolate d'ammonium**, cobalt, ammoniums quaternaires, acrylates… ;\n• produits végétaux : colophane, baume du Pérou, alliacées, **farines de céréales**…", "warn": [], "type": "multi", "opts": [["1", "Les persulfates alcalins figurent parmi les agents du tableau."], ["2", "Le thioglycolate d'ammonium figure parmi les agents du tableau."], ["3", "Le délai de prise en charge est de 30 jours."], ["4", "Les lésions doivent récidiver après nouvelle exposition ou être confirmées par un test épicutané positif au produit manipulé."], ["5", "La liste des travaux du tableau n°64 est indicative."]], "p": {"1": ["T", "**Persulfates alcalins** : agents chimiques du TMP 64."], "2": ["T", "**Thioglycolate d'ammonium** (permanentes)."], "3": ["T", "TMP 64 : DPC **30 j**."], "4": ["T", "Désignation exacte du tableau."], "5": ["F", "Le TMP 64 comporte une **liste limitative**."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc3-29_0.png", 10]]}, {"id": "blanc3-30", "exam": "blanc3", "label": "Examen blanc n°3", "n": 30, "stem": "Concernant la prévention dans ce salon, quelles propositions sont exactes ?", "case": "blanc3-c4", "tables": [], "imgs": [], "c": "derm", "s": [], "t": [], "g": "Prévention des dermatoses professionnelles :\n• **collective** : réduire le contact, **substituer**, circuit fermé, automatisation, ventilation, études de poste ;\n• **individuelle** : gestes corrects, lavage des mains près du poste, **crèmes** après le travail ;\n• **médicale** : VE (écarter les **atopiques** des postes à risque), VP (signes d'intolérance, écartement éventuel) ;\n• épidémiologie : 50-70 % des MP ; **80 % irritatives, 20 % allergiques**.", "warn": [], "type": "multi", "opts": [["1", "À l'embauche, on écarte les sujets aux antécédents de dermatite atopique des postes exposant aux allergisants et aux irritants."], ["2", "Il faut réduire le contact des travailleurs avec les produits irritants ou allergisants."], ["3", "L'hydratation des mains par des crèmes après le travail fait partie de la prévention individuelle."], ["4", "La substitution de certaines molécules fait partie de la prévention technique."], ["5", "Les dermatoses professionnelles sont majoritairement allergiques."]], "p": {"1": ["T", "La peau **atopique** est vulnérable."], "2": ["T", "Premier axe de la prévention **collective**."], "3": ["T", "**Hydrater et assouplir** les mains après le travail."], "4": ["T", "**Substituer** les molécules chimiques."], "5": ["F", "Elles sont **80 % irritatives** et **20 % allergiques**."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "cs": "Coiffeuse de 27 ans, atopique, persulfates et thioglycolate sans gants : **eczéma de contact allergique** (type IV, bords émiettés, paupières par manuportage, rythme professionnel) ; apprentie : **dermite irritative** (collective, bords nets, brûlure). **Patch tests** ≥ 2 semaines après guérison, lecture 48-96 h ; **++** = papules et vésicules. **TMP n°64**, DPC **30 j**, liste limitative.", "o": [["of2/o_blanc3-30_0.png", 8]]}, {"id": "blanc3-31", "exam": "blanc3", "label": "Examen blanc n°3", "n": 31, "stem": "Concernant la lecture de cet audiogramme, quelles propositions sont exactes ?", "case": "blanc3-c5", "tables": [], "imgs": [], "c": "bruit", "s": [], "t": [], "g": "Lecture de l'audiogramme :\n| Oreille | 500 | 1000 | 2000 | 4000 | 8000 Hz |\n| Droite | 20 | 20 | 65 | 70 | 50 |\n| Gauche | 20 | 25 | 50 | 70 | 55 |\n• chute nette à partir de 2000 Hz, maximum à **4000 Hz**, remontée à 8000 Hz.", "warn": [], "type": "multi", "opts": [["1", "Les conductions aérienne et osseuse sont superposées."], ["2", "Il existe une encoche à 4000 Hz avec remontée à 8000 Hz."], ["3", "Les fréquences graves et médiums (500-1000 Hz) sont peu atteintes, autour de 20 dB."], ["4", "L'atteinte est unilatérale."], ["5", "L'écart entre les tracés traduit une composante de transmission."]], "p": {"1": ["T", "CA = CO : surdité de **perception**."], "2": ["T", "**Scotome à 4 kHz**, remontée à 8 kHz."], "3": ["T", "OD 20/20, OG 20/25 dB à 500 et 1000 Hz."], "4": ["F", "L'atteinte est **bilatérale** et quasi symétrique."], "5": ["F", "Les tracés sont **superposés**."]}, "key": ["1", "2", "3"], "fmt": "QCM", "o": [["of2/o_blanc3-31_0.png", 4]]}, {"id": "blanc3-32", "exam": "blanc3", "label": "Examen blanc n°3", "n": 32, "stem": "À quel stade de la surdité professionnelle correspond ce tableau ?", "case": "blanc3-c5", "tables": [], "imgs": [], "c": "bruit", "s": [], "t": [], "g": "Stades de la surdité professionnelle :\n| Stade | Audiométrie | Retentissement |\n| 1 | scotome > 30 dB à 4000 Hz | aucun |\n| 2 | 50-60 dB à 4000 ; 30 dB à 2000 Hz | fait répéter, pas de gêne sociale nette |\n| 3 | extension à 1000 et 8000 ; 30 dB à 1000 Hz | gêne sociale et professionnelle, acouphènes |\n| 4 | 100-110 dB à 4000 ; ≈ 70 dB à 1000 Hz | voix normale non perçue, handicap |", "warn": [], "type": "single", "opts": [["A", "Stade 1."], ["B", "Stade 2."], ["C", "Stade 3."], ["D", "Stade 4."], ["E", "Presbyacousie isolée."]], "p": {"A": ["F", "Le déficit ne se limite plus à 4000 Hz : il atteint 2000 Hz."], "B": ["T", "L'encoche s'étend à **2000 Hz** (≥ 30 dB), **1000 Hz préservé**, gêne débutante : **stade 2**."], "C": ["F", "Au stade 3, la perte atteint 30 dB à **1000 Hz**."], "D": ["F", "Toutes les fréquences seraient atteintes."], "E": ["F", "L'**encoche à 4 kHz** et l'exposition orientent vers le bruit."]}, "key": ["B"], "fmt": "QCS", "o": [["of2/o_blanc3-32_0.png", 4]]}, {"id": "blanc3-33", "exam": "blanc3", "label": "Examen blanc n°3", "n": 33, "stem": "Concernant le second audiogramme après un mois d'arrêt d'exposition, quelles propositions sont exactes ?", "case": "blanc3-c5", "tables": [], "imgs": [], "c": "bruit", "s": [], "t": [], "g": "Fatigue auditive et surdité :\n• **fatigue auditive** : élévation **temporaire** du seuil, surtout vers 4000 Hz, récupération partielle entre deux postes ;\n• répétée, elle devient **permanente** ;\n• surdité professionnelle : bilatérale, symétrique, cochléaire, **irréversible**, **ne s'aggrave plus** à l'arrêt.", "warn": [], "type": "multi", "opts": [["1", "Il permet de distinguer une fatigue auditive d'une surdité permanente."], ["2", "Son aspect similaire traduit l'absence de récupération, donc l'irréversibilité."], ["3", "La fatigue auditive est le plus souvent localisée autour de 4000 Hz."], ["4", "La surdité professionnelle continue habituellement à s'aggraver après l'arrêt de l'exposition."], ["5", "Réalisé un mois après l'arrêt, il peut servir d'audiométrie de confirmation."]], "p": {"1": ["T", "La **fatigue auditive** est une élévation **temporaire** du seuil."], "2": ["T", "Pas de récupération : atteinte **cochléaire définitive**."], "3": ["T", "Elle est **le plus souvent localisée autour de 4000 Hz**."], "4": ["F", "Elle **cesse d'évoluer** à l'arrêt de l'exposition."], "5": ["T", "Fenêtre de **3 semaines à 1 an**."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc3-33_0.png", 3]]}, {"id": "blanc3-34", "exam": "blanc3", "label": "Examen blanc n°3", "n": 34, "stem": "Quel est le déficit auditif réglementaire à retenir ?", "case": "blanc3-c5", "tables": [], "imgs": [], "c": "bruit", "s": [], "t": [], "g": "Calcul du déficit auditif (TMP n°42) :\n**DA = [2 × (500 Hz) + 4 × (1000 Hz) + 3 × (2000 Hz) + 1 × (4000 Hz)] / 10**\n• calculé pour **chaque oreille** ; on retient la **meilleure oreille** ;\n• reconnaissance si **DA ≥ 35 dB**.", "warn": [], "type": "single", "opts": [["A", "36 dB."], ["B", "38,5 dB."], ["C", "37,25 dB."], ["D", "43,75 dB."], ["E", "Moins de 35 dB."]], "p": {"A": ["T", "OD = (2×20 + 4×20 + 3×65 + 70) / 10 = 38,5 dB ; OG = (2×20 + 4×25 + 3×50 + 70) / 10 = **36 dB** ; meilleure oreille : **gauche, 36 dB**."], "B": ["F", "C'est le DA de l'oreille **droite**, la plus atteinte."], "C": ["F", "C'est la moyenne des deux oreilles."], "D": ["F", "C'est la moyenne arithmétique simple de l'OD."], "E": ["F", "36 dB dépasse de justesse le seuil."]}, "key": ["A"], "fmt": "QCS", "o": [["of2/o_blanc3-34_0.png", 7]]}, {"id": "blanc3-35", "exam": "blanc3", "label": "Examen blanc n°3", "n": 35, "stem": "Concernant la reconnaissance de cette surdité au titre du tableau n°42, quelles propositions sont exactes ?", "case": "blanc3-c5", "tables": [], "imgs": [], "c": "bruit", "s": [], "t": [], "g": "TMP n°42 — vérification :\n| Condition | Cas |\n| DA ≥ 35 dB meilleure oreille | 36 dB : rempli |\n| Confirmation 3 semaines - 1 an après arrêt | 1 mois : rempli |\n| DPC 1 an | à respecter |\n| Exposition ≥ 1 an | 35 ans |\n| Liste limitative | travaux à vérifier |", "warn": [], "type": "multi", "opts": [["1", "Le critère de 35 dB sur la meilleure oreille est rempli de justesse."], ["2", "Le délai de prise en charge est d'1 an."], ["3", "La durée d'exposition minimale est remplie."], ["4", "La profession doit figurer dans la liste limitative des travaux."], ["5", "Un déficit de plus de 40 dB sur la meilleure oreille est exigé."]], "p": {"1": ["T", "36 dB ≥ **35 dB**."], "2": ["T", "DPC **1 an**."], "3": ["T", "35 ans ≥ **1 an**."], "4": ["T", "Liste **limitative**."], "5": ["F", "Le seuil est de **35 dB**."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc3-35_0.png", 7]]}, {"id": "blanc3-36", "exam": "blanc3", "label": "Examen blanc n°3", "n": 36, "stem": "Quels éléments faut-il considérer pour écarter ou discuter d'autres causes ?", "case": "blanc3-c5", "tables": [], "imgs": [], "c": "bruit", "s": [], "t": [], "g": "Éléments à rechercher :\n• traumatisme crânien ou auriculaire ;\n• maladie générale (HTA, diabète) ;\n• antécédents d'oreille, surdité familiale ;\n• **médicaments ototoxiques** ;\n• co-expositions : **CO, solvants** ;\n• loisirs bruyants ; âge (presbyacousie).", "warn": [], "type": "multi", "opts": [["1", "L'absence d'antécédent familial et ORL rend une surdité héréditaire moins probable."], ["2", "L'absence de médicament ototoxique écarte une ototoxicité médicamenteuse."], ["3", "La superposition des tracés écarte une atteinte de transmission."], ["4", "À 51 ans, une presbyacousie associée doit être discutée."], ["5", "Les colles et vernis n'ont aucun intérêt dans l'analyse."]], "p": {"1": ["T", "Élément déjà fourni par le cas."], "2": ["T", "Pas d'**aminosides**."], "3": ["T", "CA = CO."], "4": ["T", "Âge **> 50 ans** : facteur individuel, association possible."], "5": ["F", "Les **solvants** fragilisent l'oreille interne : co-exposition à rechercher."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc3-36_0.png", 3]]}, {"id": "blanc3-37", "exam": "blanc3", "label": "Examen blanc n°3", "n": 37, "stem": "Concernant la protection auditive de ce menuisier et de l'atelier, quelles propositions sont exactes ?", "case": "blanc3-c5", "tables": [], "imgs": [], "c": "bruit", "s": [], "t": [], "g": "Protection contre le bruit :\n• **source** : machines moins bruyantes, silencieux ;\n• **propagation** : éloignement, traitement acoustique, cloisonnement, **encoffrement**, écrans ;\n• **récepteur** : cabine, rotation, **PICB** (coquilles, bouchons avec arceau, préformés, à façonner, moulés) ;\n• **> 85 dB(A)** : formation, information, affichage.", "warn": [], "type": "multi", "opts": [["1", "Les protecteurs passifs comprennent les coquilles, les bouchons avec arceau, préformés, à façonner ou moulés sur mesure."], ["2", "Les travailleurs exposés à plus de 85 dB(A) doivent recevoir une formation sur le bruit et l'usage des protecteurs."], ["3", "Le port obligatoire des protections auditives fait l'objet d'un affichage réglementé."], ["4", "Les protecteurs individuels dispensent de réduire le bruit à la source."], ["5", "L'encoffrement des machines et le traitement acoustique du local agissent sur la propagation."]], "p": {"1": ["T", "**4 familles** de PICB passifs."], "2": ["T", "Formation et information **au-delà de 85 dB(A)**."], "3": ["T", "**Affichage réglementé**."], "4": ["F", "Les mesures **collectives** sont **prioritaires**."], "5": ["T", "Actions sur la **propagation**."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "cs": "Menuisier de 51 ans, 35 ans de machines à bois, protections irrégulières : **surdité de perception bilatérale** (CA = CO, encoche à 4 kHz), **stade 2** (2000 Hz atteint, 1000 Hz préservé). Second audiogramme similaire à 1 mois : **irréversible**. DA : OD 38,5, OG **36 dB** (meilleure oreille, ≥ 35 de justesse). **TMP n°42**. Presbyacousie associée à discuter.", "o": [["of2/o_blanc3-37_0.png", 6]]}, {"id": "blanc3-38", "exam": "blanc3", "label": "Examen blanc n°3", "n": 38, "stem": "Concernant les déchets anatomiques et les déchets assimilés aux DASRI, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "bio", "s": [], "t": [], "warn": [], "g": "DAS — cas particuliers :\n• **déchets anatomiques** : organes, membres, fragments (blocs, accouchements) ;\n• **assimilés aux DASRI** : biopsies non reconnaissables, **placentas**, **produits sanguins** non utilisés ou périmés ;\n• **assimilés aux DMA** : couches et serviettes de patients **non infectés**.", "type": "multi", "opts": [["1", "Les déchets anatomiques sont des organes, membres ou fragments issus des blocs opératoires et des salles d'accouchement."], ["2", "Les fragments de biopsies non reconnaissables par un non-initié sont assimilés aux DASRI."], ["3", "Les placentas issus des maternités sont assimilés aux DASRI."], ["4", "Les produits sanguins périmés ou incomplètement utilisés sont assimilés aux DASRI."], ["5", "Les couches de patients non infectés sont des DASRI."]], "p": {"1": ["T", "Définition : **organes, membres, fragments** issus des **blocs** et **salles d'accouchement**."], "2": ["T", "Déchets anatomiques **non reconnaissables** (biopsies) : **assimilés aux DASRI**."], "3": ["T", "**Placentas** : assimilés aux DASRI."], "4": ["T", "**Produits sanguins** incomplètement utilisés ou périmés : assimilés aux DASRI."], "5": ["F", "Les couches de patients **non infectés** sont **assimilées aux DMA** (filière noire)."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc3-38_0.png", 7]]}, {"id": "blanc3-39", "exam": "blanc3", "label": "Examen blanc n°3", "n": 39, "stem": "Concernant les valeurs de référence en toxicologie professionnelle, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "toxi", "s": [], "t": [], "warn": [], "g": "Valeurs de référence :\n| Repère | Mesure | Remarque |\n| VLEP | concentration dans l'air, sur 8 h ou courte durée | pas une garantie absolue |\n| VBI | indicateur biologique chez le travailleur | intègre toutes les voies |\nNi interchangeables, ni garantes d'une absence de risque pour les **cancérogènes**.", "type": "multi", "opts": [["1", "Les VLEP portent sur la concentration d'un agent dans l'air."], ["2", "Les VLEP ont une période de référence définie (8 heures ou courte durée)."], ["3", "Les valeurs biologiques d'interprétation (VBI) portent sur des indicateurs mesurés chez le travailleur."], ["4", "VLEP et VBI sont interchangeables."], ["5", "Le respect d'une VLEP garantit l'absence totale de risque pour un cancérogène."]], "p": {"1": ["T", "Les **VLEP** portent sur la **concentration dans l'air**."], "2": ["T", "Période de référence : **8 h** ou **courte durée**."], "3": ["T", "Les **VBI** portent sur des **indicateurs biologiques** chez le travailleur."], "4": ["F", "Ces repères **ne sont pas interchangeables**."], "5": ["F", "Les repères **ne garantissent pas une absence totale de risque**, notamment pour les **cancérogènes**."]}, "key": ["1", "2", "3"], "fmt": "QCM", "o": [["of2/o_blanc3-39_0.png", 7]]}, {"id": "blanc3-40", "exam": "blanc3", "label": "Examen blanc n°3", "n": 40, "stem": "Concernant la colique de plomb, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "metaux", "s": [], "t": [], "warn": [], "g": "La colique de plomb :\n• **contamination massive** (aiguë ou chronique grave) ;\n• douleur abdominale aiguë **pseudo-chirurgicale**, vomissements, arrêt du transit (pseudo-occlusion) ;\n• **apyrexie**, ventre **souple** ;\n• sueurs, pâleur, **poussée hypertensive** ; ASP : distension colique aérique ;\n• formes **atténuées** aujourd'hui les plus fréquentes.", "type": "multi", "opts": [["1", "Elle implique une contamination massive."], ["2", "Elle réalise un syndrome douloureux abdominal aigu, souvent pseudo-chirurgical."], ["3", "Le malade est fébrile avec une défense abdominale."], ["4", "Elle s'accompagne de sueurs, de pâleur et d'une poussée hypertensive."], ["5", "Aujourd'hui, les formes atténuées sont les plus fréquentes."]], "p": {"1": ["T", "La colique de plomb **implique une contamination massive**."], "2": ["T", "Syndrome **douloureux abdominal aigu**, **pseudo-chirurgical**, péri-ombilical puis diffus."], "3": ["F", "Le malade est **apyrétique** et le ventre est **souple**."], "4": ["T", "**Sueurs, pâleur, poussée hypertensive** accompagnent la crise."], "5": ["T", "Les **formes atténuées** (douleurs vagues, dyspepsie, TA modérément élevée) sont **les plus fréquentes**."]}, "key": ["1", "2", "4", "5"], "fmt": "QCM", "o": [["of2/o_blanc3-40_0.png", 3]]}, {"id": "blanc3-41", "exam": "blanc3", "label": "Examen blanc n°3", "n": 41, "stem": "Comment se forme l'ozone troposphérique ?", "case": null, "tables": [], "imgs": [], "c": "pollu", "s": [], "t": [], "warn": [], "g": "L'**ozone** : polluant **secondaire** :\n• **NOx + COV + rayonnement solaire** → O₃ ;\n• peut apparaître **loin des sources** ;\n• irritant respiratoire et oculaire, aggrave l'asthme.", "type": "single", "opts": [["A", "Il est émis directement par les pots d'échappement."], ["B", "Par réaction des oxydes d'azote et des COV sous l'effet du soleil."], ["C", "Par combustion du charbon riche en soufre."], ["D", "Par évaporation du benzène des stations-service."], ["E", "Par le chauffage au bois uniquement."]], "p": {"A": ["F", "L'ozone n'est **pas émis directement** : c'est un polluant **secondaire**."], "B": ["T", "Le cours : **oxydes d'azote + COV + soleil → ozone**."], "C": ["F", "La combustion du soufre produit du **SO₂**, polluant primaire."], "D": ["F", "Le benzène est un **COV primaire** ; seul, il ne suffit pas à former l'ozone."], "E": ["F", "Le chauffage au bois émet surtout des **particules** et des NOx."]}, "key": ["B"], "fmt": "QCS", "o": [["of2/o_blanc3-41_0.png", 12], ["of2/o_blanc3-41_1.png", 16]]}, {"id": "blanc3-42", "exam": "blanc3", "label": "Examen blanc n°3", "n": 42, "stem": "Quelles associations « examen complémentaire → maladie professionnelle recherchée » sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "atmp", "s": [], "t": [], "warn": [], "g": "Examens cités dans la colonne « désignation » :\n| Examen | Maladie |\n| FNS | anémie (saturnisme, RI) |\n| Radiographie | silicose, asbestose |\n| EFR | asthme professionnel |\n| Audiogramme | surdité |\n| Sérologie | hépatite, brucellose |\n| EMG | névrites, polynévrites |\n| Tests cutanés | eczéma |\n| TDM, anatomopathologie | cancers |", "type": "multi", "opts": [["1", "FNS → anémie du saturnisme ou des rayonnements ionisants."], ["2", "EMG → névrites et polynévrites."], ["3", "Tests cutanés → eczéma."], ["4", "Sérologie → hépatite, brucellose."], ["5", "Audiogramme → asthme professionnel."]], "p": {"1": ["T", "Le cours : **FNS** → anémie (**saturnisme, RI**)."], "2": ["T", "**EMG** → **névrites, polynévrites**."], "3": ["T", "**Tests cutanés** → **eczéma**."], "4": ["T", "**Sérologie** → **hépatite, brucellose**."], "5": ["F", "L'**audiogramme** explore la **surdité** ; l'asthme s'explore par l'**EFR**."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc3-42_0.png", 7]]}, {"id": "blanc3-43", "exam": "blanc3", "label": "Examen blanc n°3", "n": 43, "stem": "Concernant les effets sanitaires des particules fines et des oxydes d'azote, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "pollu", "s": [], "t": [], "warn": [], "g": "Effets sanitaires :\n• **particules fines** : cancers (poumon, vessie), cardiovasculaire, respiratoire, neurodéveloppement de l'enfant, diabète ;\n• **NOx** : sources diesel, poids lourds, chauffage au bois ; irritations, **asthme**, effets respiratoires et cardiovasculaires à long terme.", "type": "multi", "opts": [["1", "Les particules fines augmentent le risque de cancers du poumon et de la vessie."], ["2", "Les particules fines sont associées à des maladies cardiovasculaires et respiratoires."], ["3", "Les particules fines sont associées à une atteinte neurologique de l'enfant et au diabète."], ["4", "Les oxydes d'azote proviennent surtout du transport routier diesel et des poids lourds."], ["5", "Les oxydes d'azote n'ont aucun effet respiratoire."]], "p": {"1": ["T", "Le cours cite les **cancers (poumon, vessie)**."], "2": ["T", "**Maladies cardiovasculaires et respiratoires** : citées."], "3": ["T", "**Atteinte neurologique de l'enfant** et **diabète** sont cités."], "4": ["T", "Sources des **NOx** : **transport routier (diesel)**, poids lourds, chauffage au bois, industrie."], "5": ["F", "Les NOx provoquent **irritations, asthme**, et à long terme des **maladies respiratoires et cardiovasculaires**."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc3-43_0.png", 14], ["of2/o_blanc3-43_1.png", 15]]}, {"id": "blanc3-44", "exam": "blanc3", "label": "Examen blanc n°3", "n": 44, "stem": "Associez chaque phase de l'encéphalopathie chronique aux solvants à sa description.", "case": null, "tables": [], "imgs": [], "c": "solv", "s": [], "t": [], "warn": [], "g": "Encéphalopathie aux solvants (psycho-syndrome organique) :\n| Phase | Tableau | Évolution |\n| 1re | neurasthénique : fatigue, irritabilité, céphalées, troubles de concentration et de mémoire | réversible |\n| 2e | dysphorique : personnalité, humeur, atteinte cognitive | réversibilité incomplète |\n| 3e | démentiel | — |", "type": "match", "left": [["1", "1re phase"], ["2", "2e phase"], ["3", "3e phase"]], "right": [["a", "Syndrome neurasthénique · réversibilité complète au retrait"], ["b", "Syndrome dysphorique (modifications de la personnalité) · réversibilité incomplète"], ["c", "Syndrome démentiel"]], "corr": {"1": ["a"], "2": ["b"], "3": ["c"]}, "p": {"1": [null, "La **1re phase** est un **syndrome neurasthénique**, sans détérioration intellectuelle, **complètement réversible** : 1-a."], "2": [null, "La **2e phase** est un **syndrome dysphorique** (personnalité, humeur), à **réversibilité incomplète** : 2-b."], "3": [null, "La **3e phase** est un **syndrome démentiel** : 3-c."]}, "fmt": "Association", "o": [["of2/o_blanc3-44_0.png", 3]]}, {"id": "blanc3-45", "exam": "blanc3", "label": "Examen blanc n°3", "n": 45, "stem": "Concernant les voies de pénétration du plomb, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "metaux", "s": [], "t": [], "warn": [], "g": "Voies de pénétration du plomb :\n• **respiratoire** (principale) : vapeurs, fumées, poussières ; < 1 µm → passage alvéolo-capillaire ; 5-10 µm → dégluties ;\n• **digestive** : hygiène défaillante, **repas et tabac au poste** ;\n• **cutanée** : passage limité.", "type": "multi", "opts": [["1", "La voie respiratoire concerne les vapeurs, fumées et fines poussières."], ["2", "Les particules inférieures à 1 µm peuvent traverser la paroi alvéolo-capillaire."], ["3", "Les particules de 5 à 10 µm sont en partie dégluties vers le tube digestif."], ["4", "La voie digestive peut devenir importante en cas d'hygiène défaillante, de repas ou de tabac au poste."], ["5", "La voie digestive n'a jamais d'importance en milieu professionnel."]], "p": {"1": ["T", "Voie **respiratoire** : inhalation de **vapeurs, fumées, fines poussières**."], "2": ["T", "Particules **< 1 µm** : traversent la paroi **alvéolo-capillaire**."], "3": ["T", "Particules de **5 à 10 µm** : déversées dans le **tube digestif**."], "4": ["T", "**Hygiène défaillante**, **repas** et **tabac** sur le lieu de travail favorisent la voie digestive."], "5": ["F", "Elle peut **devenir importante** dans certaines circonstances professionnelles."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc3-45_0.png", 1]]}, {"id": "blanc3-46", "exam": "blanc3", "label": "Examen blanc n°3", "n": 46, "stem": "Concernant l'absorption du mercure, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "metaux", "s": [], "t": [], "warn": [], "g": "Absorption du mercure :\n• **respiratoire** : vapeurs, **voie principale** du mercure métallique ;\n• **digestive** : ingestion accidentelle ou volontaire, importante si composé **corrosif** ;\n• **cutanée** : accidentelle (bris de thermomètre), certains composés inorganiques.", "type": "multi", "opts": [["1", "L'inhalation de vapeurs est la principale voie d'absorption du mercure métallique."], ["2", "La voie digestive peut devenir importante après ingestion d'un composé mercuriel corrosif."], ["3", "La voie cutanée peut être accidentelle, par blessure lors du bris d'un thermomètre."], ["4", "Le mercure métallique ingéré intact est la principale cause d'intoxication professionnelle."], ["5", "Les vapeurs de mercure ne sont pas absorbées par voie pulmonaire."]], "p": {"1": ["T", "Le cours : l'**inhalation de vapeurs** est la **principale voie** pour le mercure métallique."], "2": ["T", "Un composé **corrosif** altère la perméabilité digestive : la voie digestive devient importante."], "3": ["T", "Voie **cutanée** accidentelle : **bris de thermomètre**."], "4": ["F", "La principale voie professionnelle est l'**inhalation de vapeurs**."], "5": ["F", "C'est justement la **voie respiratoire** qui est la principale."]}, "key": ["1", "2", "3"], "fmt": "QCM", "o": [["of2/o_blanc3-46_0.png", 11]]}, {"id": "blanc3-47", "exam": "blanc3", "label": "Examen blanc n°3", "n": 47, "stem": "Associez chaque source de particules nanométriques à son origine.", "case": null, "tables": [], "imgs": [], "c": "nano", "s": [], "t": [], "warn": [], "g": "Origines des nanoparticules (Pr Fernane-Nechab) :\n• **naturelles** : volcans, embruns, feux de forêt ;\n• **non intentionnelles** : particules ultrafines (diesel, soudure) ;\n• **intentionnelles** : nanoparticules **manufacturées** ;\n• définition : **1 à 100 nm** sur au moins une dimension.", "type": "match", "left": [["1", "Volcans, embruns, feux de forêt"], ["2", "Fumées de diesel et de soudage"], ["3", "Nanoparticules manufacturées"]], "right": [["a", "Origine naturelle"], ["b", "Origine non intentionnelle (particules ultrafines)"], ["c", "Origine intentionnelle"]], "corr": {"1": ["a"], "2": ["b"], "3": ["c"]}, "p": {"1": [null, "**Volcans, embruns, feux de forêt** : nanoparticules **naturelles** : 1-a."], "2": [null, "**Diesel, soudage** : particules **ultrafines non intentionnelles** : 2-b."], "3": [null, "Les **nanoparticules manufacturées** sont **intentionnelles** : 3-c."]}, "fmt": "Association", "o": [["of2/o_blanc3-47_0.png", 4]]}, {"id": "blanc3-48", "exam": "blanc3", "label": "Examen blanc n°3", "n": 48, "stem": "Quels secteurs exposent aux solvants ?", "case": null, "tables": [], "imgs": [], "c": "solv", "s": [], "t": [], "warn": [], "g": "Sources d'exposition aux solvants :\n• pétrole, pétrochimie ; **peintures, laques** ; **cosmétiques, parfums** ; **encres** ; **pesticides** ;\n• **nettoyage à sec** ; **caoutchouc, plastiques** ;\n• usages : **diluer**, dissoudre, dégraisser, extraire, nettoyer.", "type": "multi", "opts": [["1", "L'industrie pétrolière et la pétrochimie."], ["2", "L'industrie de la peinture et de la laque."], ["3", "L'industrie cosmétique, du parfum et des encres d'imprimerie."], ["4", "Le nettoyage à sec et les industries du caoutchouc et des plastiques."], ["5", "Les solvants servent uniquement à dégraisser les métaux."]], "p": {"1": ["T", "**Pétrole et pétrochimie** : cités."], "2": ["T", "**Peinture et laque** : citées."], "3": ["T", "**Cosmétique, parfum, encres d'imprimerie** : cités."], "4": ["T", "**Nettoyage à sec**, **caoutchouc et plastiques** : cités."], "5": ["F", "Ils servent aussi à **diluer** (encres, peintures), extraire, nettoyer…"]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc3-48_0.png", 2]]}, {"id": "blanc3-49", "exam": "blanc3", "label": "Examen blanc n°3", "n": 49, "stem": "Concernant les protecteurs individuels contre le bruit (PICB) et l'information des travailleurs, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "bruit", "s": [], "t": [], "warn": [], "g": "PICB passifs, 4 familles :\n1. **à coquilles** (serre-tête) ;\n2. **bouchon avec arceau** ;\n3. bouchons **préformés** ou **à façonner** ;\n4. **moulés individualisés**.\nLes PICB doivent être **adaptés et confortables** ; au-delà de **85 dB(A)** : information, formation, signalisation.", "type": "multi", "opts": [["1", "Les PICB à coquilles (serre-tête) constituent une famille de PICB passifs."], ["2", "Les bouchons préformés et les bouchons à façonner sont des PICB passifs."], ["3", "Il existe des bouchons moulés individualisés (sur mesure)."], ["4", "Les travailleurs exposés à plus de 85 dB(A) par jour doivent recevoir une information et une formation."], ["5", "Un PICB est efficace même s'il est inconfortable et porté de façon intermittente."]], "p": {"1": ["T", "Famille 1 : PICB **à coquilles** (serre-tête)."], "2": ["T", "Bouchons **préformés / prémoulés** et **à façonner**."], "3": ["T", "Bouchon **moulé individualisé** sur mesure."], "4": ["T", "Au-delà de **85 dB(A)** d'exposition quotidienne : **formation et information**."], "5": ["F", "Les PICB doivent être **adaptés et confortables** : un port intermittent réduit fortement la protection."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc3-49_0.png", 6]]}, {"id": "blanc3-50", "exam": "blanc3", "label": "Examen blanc n°3", "n": 50, "stem": "Quels micro-organismes sont classés cancérogènes par le CIRC ?", "case": null, "tables": [], "imgs": [], "c": "bio", "s": [], "t": [], "warn": [], "g": "Agents biologiques cancérogènes (CIRC) cités :\n• **Helicobacter pylori** ;\n• **VIH** ;\n• **VHB**, **VHC** ;\n• **virus d'Epstein-Barr** ;\n• + **aflatoxines** (mycotoxines) par ingestion.", "type": "multi", "opts": [["1", "Helicobacter pylori."], ["2", "Le VIH."], ["3", "Les virus des hépatites B et C."], ["4", "Le virus d'Epstein-Barr."], ["5", "Le bacille tétanique."]], "p": {"1": ["T", "**H. pylori** est cité."], "2": ["T", "Le **VIH** est cité."], "3": ["T", "**VHB** et **VHC** sont cités."], "4": ["T", "**EBV** est cité."], "5": ["F", "Le tétanos est une **endotoxine** / infection, pas un agent cancérogène cité."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc3-50_0.png", 4]]}, {"id": "blanc3-51", "exam": "blanc3", "label": "Examen blanc n°3", "n": 51, "stem": "Quels troubles caractérisent la phase d'installation de l'atteinte du système nerveux central dans l'hydrargyrisme ?", "case": null, "tables": [], "imgs": [], "c": "metaux", "s": [], "t": [], "warn": [], "g": "Hydrargyrisme — atteinte du SNC (installation) :\n• troubles du **caractère** (irritabilité, timidité excessive, labilité émotionnelle) ;\n• **mémoire**, concentration, perturbation psychomotrice ;\n• **insomnie**, nervosité, négligence ;\n• **tests psychométriques** : **allongement** du temps de réaction, mémoire verbale et visuelle altérées.", "type": "multi", "opts": [["1", "Des troubles du caractère et de la personnalité, avec irritabilité."], ["2", "Une timidité excessive et une labilité émotionnelle."], ["3", "Des troubles de la mémoire et des difficultés de concentration."], ["4", "Une insomnie et une négligence du travail et de la famille."], ["5", "Un raccourcissement du temps de réaction aux tests psychométriques."]], "p": {"1": ["T", "**Troubles du caractère et de la personnalité**, **irritabilité**."], "2": ["T", "**Timidité excessive**, **labilité émotionnelle**."], "3": ["T", "**Mémoire** et **concentration** altérées."], "4": ["T", "**Insomnie**, **négligence** du travail et de la famille."], "5": ["F", "Les tests montrent un **allongement** du temps de réaction."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc3-51_0.png", 12]]}, {"id": "blanc3-52", "exam": "blanc3", "label": "Examen blanc n°3", "n": 52, "stem": "Concernant la dose équivalente et la dose efficace, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "ri", "s": [], "t": [], "warn": [], "g": "Dose équivalente et dose efficace :\n• expriment le **risque biologique** (Sv) ;\n• pondérées par le **type de rayonnement** et la **radiosensibilité des tissus** (w_T) ;\n• la **dose efficace** est comparée à la **limite annuelle** ;\n• en pratique, on mesure des **grandeurs opérationnelles Hp(d)**.", "type": "multi", "opts": [["1", "Elles cherchent à exprimer le risque biologique, pas seulement l'énergie déposée."], ["2", "Elles tiennent compte du type de rayonnement (α ≠ γ)."], ["3", "Elles tiennent compte du tissu irradié (moelle ≠ peau)."], ["4", "Elles s'expriment en sievert (Sv)."], ["5", "La dose efficace est la grandeur mesurée directement par le dosimètre."]], "p": {"1": ["T", "En radioprotection, on exprime le **risque biologique**, pas seulement l'énergie."], "2": ["T", "Le risque dépend du **type de rayonnement** (α ≠ γ)."], "3": ["T", "Le risque dépend du **tissu irradié** (moelle ≠ peau)."], "4": ["T", "Unité : **sievert (Sv)**."], "5": ["F", "Les grandeurs de protection sont **difficiles à mesurer directement** : le dosimètre mesure **Hp(d)**."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc3-52_0.png", 3]]}, {"id": "blanc3-53", "exam": "blanc3", "label": "Examen blanc n°3", "n": 53, "stem": "Parmi les agents suivants, lesquels disposent d'un tableau de MP réparant l'asthme ou les affections respiratoires professionnelles ?", "case": null, "tables": [], "imgs": [], "c": "asthme", "s": [], "t": [], "warn": [], "g": "Exemples de tableaux réparant l'asthme professionnel (16 / 85) :\n• **isocyanates organiques** ; **enzymes protéolytiques** ; **résines époxydiques** ;\n• **phénylhydrazine** ; **furfural** ; **méthacrylate de méthyle** ;\n• **poussières de carbures métalliques frittés** ;\n• **affections respiratoires de mécanisme allergique** (tableau général) ;\n• le **RADS** relève de l'**accident du travail**.", "type": "multi", "opts": [["1", "Les isocyanates organiques."], ["2", "Les enzymes protéolytiques."], ["3", "Les résines époxydiques et leurs constituants."], ["4", "Le méthacrylate de méthyle."], ["5", "Le furfural et l'alcool furfurylique."]], "p": {"1": ["T", "Tableau des **AP provoquées par les isocyanates organiques**."], "2": ["T", "Tableau des **AP provoquées par les enzymes protéolytiques**."], "3": ["T", "Tableau des **MP provoquées par les résines époxydiques**."], "4": ["T", "Tableau des **AP provoquées par le méthacrylate de méthyle**."], "5": ["T", "Tableau des **AP provoquées par le furfural et l'alcool furfurique**."]}, "key": ["1", "2", "3", "4", "5"], "fmt": "QCM", "o": [["of2/o_blanc3-53_0.png", 19]]}, {"id": "blanc3-54", "exam": "blanc3", "label": "Examen blanc n°3", "n": 54, "stem": "Concernant les notions de danger, d'exposition et de risque, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "toxi", "s": [], "t": [], "warn": [], "g": "Danger, exposition, risque :\n• **danger** : propriété de l'agent ;\n• **exposition** : concentration, durée, fréquence, voie ; **dose interne** : quantité absorbée ;\n• **risque** = danger × scénario d'exposition ;\n• **évaluation en 4 étapes** :\n1. identifier le danger ;\n2. caractériser la relation dose-effet ;\n3. apprécier l'exposition ;\n4. caractériser le risque.", "type": "multi", "opts": [["1", "Le danger est la propriété d'un agent susceptible de causer un dommage."], ["2", "L'exposition décrit le contact : concentration, durée, fréquence et voie."], ["3", "La dose interne est la quantité qui pénètre dans l'organisme."], ["4", "La seule présence d'un produit dangereux suffit à définir le risque."], ["5", "L'évaluation du risque comporte quatre étapes."]], "p": {"1": ["T", "Définition du cours : le **danger** est une **propriété** de l'agent."], "2": ["T", "L'**exposition** = **concentration, durée, fréquence, voie**."], "3": ["T", "La **dose interne** = quantité qui **pénètre** dans l'organisme."], "4": ["F", "Le **risque** dépend du **danger et du scénario d'exposition**, **non de la seule présence** du produit."], "5": ["T", "**Quatre étapes** : identifier le danger, relation dose-effet, apprécier l'exposition, caractériser le risque."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc3-54_0.png", 2]]}, {"id": "blanc3-55", "exam": "blanc3", "label": "Examen blanc n°3", "n": 55, "stem": "Concernant les traumatismes sonores aigus, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "bruit", "s": [], "t": [], "warn": [], "g": "Traumatisme sonore aigu :\n• exposition **brutale** de la cochlée, bruit **impulsionnel** ou continu bref, parfois **unique** ;\n• **réversible** (élévation temporaire du seuil) ou **irréversible** selon l'énergie ;\n• **acouphènes, hypoacousie, hyperacousie douloureuse** ;\n• ≠ **surdité professionnelle** chronique (élévation permanente, symétrique).", "type": "multi", "opts": [["1", "Ils résultent de l'exposition brutale de la cochlée à une pression acoustique excessive."], ["2", "Ils peuvent être dus à des bruits impulsionnels ou à des bruits continus de courte durée."], ["3", "Les atteintes peuvent être réversibles ou irréversibles selon l'énergie reçue."], ["4", "La symptomatologie associe acouphènes, hypoacousie et hyperacousie douloureuse."], ["5", "Ils nécessitent toujours une exposition de plusieurs années."]], "p": {"1": ["T", "Définition : **exposition brutale** de la cochlée à une **pression acoustique excessive**."], "2": ["T", "Bruits **impulsionnels** ou **continus de courte durée**, parfois uniques (explosion)."], "3": ["T", "Selon l'**énergie** : **réversibles** (élévation temporaire du seuil) ou **irréversibles**."], "4": ["T", "Triade : **acouphènes, hypoacousie, hyperacousie douloureuse**."], "5": ["F", "Une exposition **unique et brève** suffit (explosion)."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc3-55_0.png", 3]]}, {"id": "blanc3-56", "exam": "blanc3", "label": "Examen blanc n°3", "n": 56, "stem": "Concernant la classification des pesticides selon leur cible, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "pest", "s": [], "t": [], "warn": [], "g": "Pesticides selon la cible :\n• **insecticides** (OC, OP, carbamates, pyréthrinoïdes…) ;\n• **herbicides** (paraquat, diquat, chlorophénoxys) ;\n• **rodenticides**, **fongicides**, **hélicides / molluscicides**, **acaricides** ;\n• **carbamates** : inhibition **réversible** des cholinestérases ; **OP** : inhibition de l'acétylcholinestérase.", "type": "multi", "opts": [["1", "Les rodenticides visent les rongeurs."], ["2", "Les fongicides visent les champignons et moisissures parasites."], ["3", "Les hélicides et molluscicides visent les mollusques."], ["4", "Les acaricides visent les acariens."], ["5", "Les carbamates provoquent une inhibition irréversible des cholinestérases."]], "p": {"1": ["T", "**Rodenticides** : rats, souris, mulots."], "2": ["T", "**Fongicides** : champignons, moisissures."], "3": ["T", "**Hélicides / molluscicides** : mollusques (limaces)."], "4": ["T", "**Acaricides** : acariens."], "5": ["F", "Les **carbamates** provoquent une inhibition **réversible**, et sont moins toxiques."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc3-56_0.png", 2]]}, {"id": "blanc3-57", "exam": "blanc3", "label": "Examen blanc n°3", "n": 57, "stem": "Associez chaque maladie professionnelle à son groupe de tableaux et au type de liste de travaux.", "case": null, "tables": [], "imgs": [], "c": "atmp", "s": [], "t": [], "warn": [], "g": "Groupes de tableaux et listes de travaux :\n| Groupe | Contenu | Liste |\n| 1 | intoxications (Pb, Hg, Cd, As, Cr, Ni…) | **indicative** (« ouverte ») |\n| 2 | infections (hépatites, brucellose…) | **limitative** |\n| 3 | ambiances et attitudes (bruit, vibrations…) | **limitative** |", "type": "match", "left": [["1", "Saturnisme (plomb)"], ["2", "Brucellose"], ["3", "Surdité professionnelle"], ["4", "Hépatite virale professionnelle"], ["5", "Intoxication par le chrome"]], "right": [["a", "Groupe 1 · liste indicative"], ["b", "Groupe 2 · liste limitative"], ["c", "Groupe 3 · liste limitative"]], "corr": {"1": ["a"], "2": ["b"], "3": ["c"], "4": ["b"], "5": ["a"]}, "p": {"1": [null, "Les **intoxications** (Pb, Hg, Cd, As, Cr, Ni) sont au **groupe 1**, liste **indicative** : 1-a."], "2": [null, "Les **infections** (brucellose) sont au **groupe 2**, liste **limitative** : 2-b."], "3": [null, "Les **ambiances et attitudes** (bruit) sont au **groupe 3**, liste **limitative** : 3-c."], "4": [null, "L'**hépatite** est une infection : **groupe 2**, liste limitative : 4-b."], "5": [null, "Le **chrome** est un toxique : **groupe 1**, liste indicative : 5-a."]}, "fmt": "Association", "o": [["of2/o_blanc3-57_0.png", 7]]}, {"id": "blanc3-58", "exam": "blanc3", "label": "Examen blanc n°3", "n": 58, "stem": "Associez chaque secteur exposant à la silice à l'opération la plus dangereuse.", "case": null, "tables": [], "imgs": [], "c": "pneumo", "s": [], "t": [], "warn": [], "g": "Sources d'exposition à la silice :\n| Secteur | Opérations à risque |\n| Mines, travaux souterrains | roche, tunnels, barrages |\n| Carrières | broyage, concassage |\n| Fonderies | décochage, ébarbage, meulage, sablage (silicose en quelques années) |", "type": "match", "left": [["1", "Mines et travaux souterrains"], ["2", "Carrières"], ["3", "Fonderies"]], "right": [["a", "Travaux sur roche, percement de tunnels et construction de barrages"], ["b", "Broyage et concassage"], ["c", "Décochage, ébarbage, meulage et sablage"]], "corr": {"1": ["a"], "2": ["b"], "3": ["c"]}, "p": {"1": [null, "**Mines et travaux souterrains** : travaux sur **roche**, **tunnels**, **barrages** : 1-a."], "2": [null, "**Carrières** : risque important au **broyage** et au **concassage** : 2-b."], "3": [null, "**Fonderies** : **décochage, ébarbage, meulage, sablage** : 3-c."]}, "fmt": "Association", "o": [["of2/o_blanc3-58_0.png", 2]]}, {"id": "blanc3-59", "exam": "blanc3", "label": "Examen blanc n°3", "n": 59, "stem": "Concernant le travail posté, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "hor", "s": [], "t": [], "warn": [], "g": "Travail posté :\n• **équipes successives**, heures **variables** selon un cycle ;\n• **continu** (24/24, 7/7), **semi-continu** (arrêt en fin de semaine), **discontinu** (2 × 8) ;\n• inclut souvent la **nuit** ;\n• effets : désynchronisation, sommeil, vigilance.", "type": "multi", "opts": [["1", "C'est une organisation en équipes successives imposant des heures variables."], ["2", "Il peut être continu, semi-continu ou discontinu."], ["3", "Il fait partie des horaires atypiques."], ["4", "Il n'a aucun effet sur les rythmes biologiques."], ["5", "Il peut inclure des périodes de travail de nuit."]], "p": {"1": ["T", "Le cours : **équipes successives**, **heures variables** selon un cycle."], "2": ["T", "Formes : **continu** (24 h/24), **semi-continu**, **discontinu**."], "3": ["T", "Le travail posté est une forme **classique** d'horaire atypique."], "4": ["F", "Les horaires variables perturbent les **rythmes circadiens** et le sommeil."], "5": ["T", "Le travail posté **inclut souvent** des nuits (cycle 3 × 8, 2 × 12…)."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc3-59_0.png", 1]]}, {"id": "blanc3-60", "exam": "blanc3", "label": "Examen blanc n°3", "n": 60, "stem": "Associez chaque classe de particules à sa taille et à sa profondeur de pénétration.", "case": null, "tables": [], "imgs": [], "c": "pollu", "s": [], "t": [], "warn": [], "g": "Particules : taille et pénétration :\n| Classe | Taille | Pénétration |\n| PM10 | ≤ 10 µm | voies aériennes supérieures |\n| PM2,5 | ≤ 2,5 µm | alvéoles |\n| PM0,1 | ≤ 0,1 µm | sang |\nSources : construction, industrie, chauffage au bois, diesel.", "type": "match", "left": [["1", "PM10"], ["2", "PM2,5"], ["3", "PM0,1"]], "right": [["a", "≤ 10 µm · voies aériennes supérieures"], ["b", "≤ 2,5 µm · atteignent les alvéoles"], ["c", "≤ 0,1 µm · passage dans le sang"]], "corr": {"1": ["a"], "2": ["b"], "3": ["c"]}, "p": {"1": [null, "**PM10** (≤ 10 µm) : **voies aériennes supérieures** : 1-a."], "2": [null, "**PM2,5** (≤ 2,5 µm) : **alvéoles** : 2-b."], "3": [null, "**PM0,1** (≤ 0,1 µm) : **passage dans le sang** : 3-c."]}, "fmt": "Association", "o": [["of2/o_blanc3-60_0.png", 14]]}], "cases": {"2026b-c1": [{"p": "Cas clinique N°1 — Monsieur H. A., 52 ans, travaille depuis 27 ans dans une entreprise de mécanique lourde et de fabrication de pièces métalliques. Il consulte en médecine du travail pour gêne auditive progressive, acouphènes bilatéraux, difficultés à comprendre les conversations en atelier et fatigue importante en fin de journée."}, {"p": "Son parcours professionnel montre plusieurs expositions successives :"}, {"p": "– pendant 8 ans : poste de **meulage, polissage et ébarbage de pièces métalliques** ;"}, {"p": "– pendant 11 ans : conduite d’une machine de **découpage, sciage et tronçonnage métallique** ;"}, {"p": "– pendant 5 ans : travail près de **compresseurs et groupes électrogènes** ;"}, {"p": "– depuis 3 ans : poste de finition avec **outils vibrants**, solvants de dégraissage et bruit intermittent élevé."}, {"p": "L’entreprise est ancienne. Les machines ne sont pas encoffrées. Les murs sont nus, sans traitement acoustique. Les travailleurs portent parfois des (...) mais sans formation correcte. Monsieur (...) protections auditives pour communiquer (...)."}, {"p": "Les mesures sonométriques montrent :"}, {"p": "• niveau sonore moyen : 92 dB(A) sur 8 heures ;"}, {"p": "• pics impulsionnels répétés lors du martelage : 132 à 137 dB(C) ;"}, {"p": "• exposition simultanée aux vibrations main-bras ;"}, {"p": "• exposition ancienne à des solvants aromatiques."}, {"p": "Audiométrie tonale, oreille droite :"}, {"tbl": [["Fréquence", "500 Hz", "1000 Hz", "2000 Hz", "4000 Hz"], ["Perte auditive", "20 dB", "35 dB", "45 dB", "70 dB"]]}, {"p": "Audiométrie tonale, oreille gauche :"}, {"tbl": [["Fréquence", "500 Hz", "1000 Hz", "2000 Hz", "4000 Hz"], ["Perte auditive", "25 dB", "40 dB", "50 dB", "75 dB"]]}], "2026b-c2": [{"p": "Cas clinique N°2 — M. A.B., 41 ans, consulte pour une fièvre évoluant depuis 6 jours, associée à une asthénie marquée, des céphalées, des sueurs nocturnes, des myalgies diffuses et des nausées."}, {"p": "Il rapporte une toux sèche intermittente, sans hémoptysie, ainsi qu’une perte d’appétit récente."}, {"p": "À l’examen, l’état général est altéré. La température est à 39 °C. On note une discrète sensibilité de l’hypochondre droit, une coloration subictérique des conjonctives et quelques râles bronchiques diffus. Il n’existe pas de syndrome méningé."}, {"p": "Le bilan initial montre une thrombopénie modérée, une perturbation modérée du bilan hépatique, un syndrome inflammatoire biologique et une créatinine légèrement augmentée."}, {"p": "Le patient travaille depuis plusieurs années dans un secteur exposant potentiellement au risque biologique. L’intitulé exact du poste, les tâches récentes et les circonstances d’exposition ne sont pas encore précisés."}], "2026b-c3": [{"p": "Cas clinique N°3 — M. K.R., 58 ans, ancien ouvrier polyvalent, consulte pour une toux chronique évoluant depuis plusieurs mois, associée à une dyspnée d’effort, une asthénie et un amaigrissement. Il rapporte quelque crachats striés de sang. Il est ancien fumeur, sevré depuis 6 ans, avec un tabagisme estimé à 12 paquets-années."}, {"p": "L’examen retrouve une altération (...) quelques râles bronchiques diffus."}, {"p": "La radiographie thoracique mo(...) pulmonaire mal systématisée avec (...) images fibreuses bilatérales discrètes."}, {"p": "Le bilan initial montre un syndrome inflammatoire modéré. La recherche de BK est demandée. Le scanner thoracique est en attente."}, {"p": "Le patient a travaillé plus de 30 ans dans des ateliers industriels anciens, poussiéreux, avec fumées, solvants, métaux et travaux de découpe ou de nettoyage de pièces."}, {"p": "Le port de protection respiratoire était irrégulier."}, {"p": "À ce stade, plusieurs diagnostics restent possibles : tuberculose, cancer bronchique tabagique, pneumoconiose compliquée ou cancer broncho-pulmonaire d’origine professionnelle."}], "2026b-c4": [{"p": "Cas clinique N°4 — M. H.D., 62 ans, consulte pour des épisodes récidivants d’hématurie macroscopique intermittente depuis 3 mois, associés à une pollakiurie et à des brûlures mictionnelles modérées."}, {"p": "Il rapporte une asthénie récente, sans fièvre franche. Il est ancien fumeur, sevré depuis 8 ans, avec un tabagisme estimé à 20 paquets-années."}, {"p": "L’examen clinique est pauvre. Le toucher rectal retrouve une prostate modérément augmentée de volume, régulière. Il n’existe pas de douleur lombaire importante. L’ECBU initial retrouve une leucocyturie modérée, sans germe clairement identifié. L’échographie montre un épaississement irrégulier de la paroi vésicale. Une cystoscopie est programmée."}, {"p": "Le patient a travaillé pendant plus de 25 ans dans plusieurs ateliers industriels : teinture, impression textile, manipulation de pigments, nettoyage de cuves et travau(x) occasionnels dans une unité de caoutchouc. Les produits manipulés ne sont pas précisément connus. (...) gants et des protections était irré(gulier)."}, {"p": "À ce stade, plusieurs hypothèses (...) infection urinaire chronique, (...) prostatique, cancer vésical tabagique ou cancer de la vessie d’origine professionnelle."}], "2026b-c5": [{"p": "Cas clinique N°5 — Monsieur T. B., 59 ans, originaire de Annaba, ancien ouvrier métallurgiste, consulte pour une toux chronique productive avec hémoptysies modérées, dyspnée d’effort, altération de l’état général, perte de poids de 5 kg et asthénie évoluant depuis 6 mois."}, {"p": "Il est sevré tabagique depuis 4 ans, avec un tabagisme estimé à 10 paquets-années."}, {"p": "À l’anamnèse professionnelle détaillée, ou curriculum laboris, il rapporte avoir travaillé pendant 33 ans dans une usine de traitement de surface et d’alliages métalliques à Souk Ahras. Son activité principale consistait à souder, polir et nettoyer des pièces métalliques, notamment des pièces en acier inoxydable, nickelées ou soumises à un chromage électrolytique."}, {"p": "Les ateliers étaient vétustes, sans aspiration efficace des fumées et sans protection respiratoire adaptée. Il mentionne également qu’il élève des pigeons et pratique régulièrement des travaux de jardinage, bien qu’il ressente une gêne respiratoire."}, {"p": "À côté de l’entreprise, il existe une petite société de taille de pierre où les travailleurs manipulent quotidiennement des matériaux poussiéreux."}], "2026b-c6": [{"p": "**Bilan clinique et paraclinique initial**"}, {"p": "• Auscultation : râles crépitants diffus"}, {"p": "• Radiographie thoracique : opacités hilaires bilatérales avec infiltration périphérique"}, {"p": "• Recherche d’amiante : négative"}, {"p": "• Marqueurs tumoraux : non spécifiques"}], "2026b-c7": [{"p": "**Explorations complémentaires**"}, {"p": "• Cytologie : cellules malpighiennes atypiques"}, {"p": "• Scanner thoracique : masse de 4,5 cm au lobe supérieur droit avec adénopathies hilaires"}, {"p": "• Fibroscopie bronchique + biopsie : carcinome épidermoïde infiltrant"}, {"p": "• TDM thoraco-abdomino-pelvienne et IRM cérébrale : absence de métastases"}], "2026b-c8": [{"p": "**Traitement entrepris**"}, {"p": "• Lobectomie supérieure droite"}, {"p": "• Chimiothérapie adjuvante"}], "2026a-c1": [{"p": "Cas N° 1 : Mme K, 32 ans, manipulatrice en électroradiologie depuis 7 ans, est affectée au scanner. Elle est également appelée plusieurs fois par semaine pour la radiologie mobile (réanimation, urgences, néonatologie). Depuis environ 18 mois, elle participe fréquemment à des actes scanner-guidés (ponctions/biopsies), avec maintien de champs, repositionnement du patient et aide à la mise en place du matériel à proximité du faisceau."}, {"p": "Depuis 8 mois, elle présente des lésions cutanées progressives au dos de la main droite et au niveau des 2e–3e doigts, évoquant une radiodermite chronique. La manipulatrice est inquiète et demande : « Est-ce que je risque un cancer ? »"}, {"p": "Le médecin du travail, à l’analyse du poste et de la dosimétrie, conclut à une surexposition localisée avec dépassement de la limite annuelle cristallin (Hp(3) > 150 mSv/an) et dépassement de la limite annuelle peau/extrémités (Hp(0,07) > 500 mSv/an), imposant une enquête, des mesures correctives immédiates et un suivi médical adapté."}], "2026a-c2": [{"p": "Cas N° 2 : M. A., 44 ans, menuisier depuis 18 ans, consulte son médecin généraliste pour des troubles auditifs évoluant depuis environ 2 ans : acouphènes vespéraux, sensation intermittente d’oreilles « bouchées » et surtout difficulté d’intelligibilité en ambiance bruyante. Le patient apporte un audiogramme réalisé récemment chez un ORL. Il précise qu’il travaille dans un atelier de menuiserie fermé et réverbérant, avec plusieurs machines en fonctionnement simultané (scie circulaire, rabotdégauchisseuse, ponceuse à bande) et des bruits impulsionnels (cloueuse). Il reconnaît un port irrégulier des PICB (gêne, chaleur, difficulté de communication)."}, {"p": "En tant que médecin généraliste, l’objectif est de soupçonner et documenter une atteinte auditive possiblement d’origine professionnelle, d’éliminer les causes évidentes accessibles en soins primaires, de rechercher les signes d’alerte, puis d’organiser une orientation spécialisée et la traçabilité médico-légale."}, {"p": "Audiométrie tonale liminaire montre comme suit : (CA = CO)"}, {"tbl": [["Fréquence (Hz)", "125", "250", "500", "1000", "2000", "4000", "8000"], ["OD", "10", "10", "20", "35", "50", "70", "60"], ["OG", "10", "10", "15", "35", "45", "65", "55"]]}], "2026a-c3": [{"p": "Cas N° 3 : M.K., 58 ans, menuisier, 32 ans d’ancienneté dans le même atelier. Il consulte son médecin généraliste pour des symptômes ORL évoluant depuis 5 mois. Il décrit :"}, {"p": "• une obstruction nasale surtout à droite, devenue permanente,"}, {"p": "• une rhinorrhée parfois purulente, parfois claire,"}, {"p": "• des épisodes d’épistaxis “minimes” mais répétées,"}, {"p": "• une diminution de l’odorat + épisodes de cacosmie,"}, {"p": "• des céphalées fronto-orbitaires droites inhabituelles."}, {"p": "Il a reçu à deux reprises un traitement “sinusite” (lavages + antibiotique + décongestionnant) avec amélioration transitoire puis récidive rapide. En plus, depuis 3 semaines : larmoiement droit et sensation de gêne à l’angle interne de l’œil."}, {"p": "Contexte professionnel : ponçage/usinage, poussières de bois importantes, aspiration insuffisante, nettoyage par soufflette, port du masque irrégulier."}, {"p": "Examen au cabinet :"}, {"p": "• pas de fièvre, état général correct,"}, {"p": "• fosse nasale droite : muqueuse inflammatoire, visualisation difficile ; présence d’un bourgeon/polype saignant au contact (examen limité)."}], "2026a-c4": [{"p": "Cas N° 4 : Monsieur H., 58 ans, ancien ouvrier industriel, consulte pour une dyspnée d’effort progressive, une toux sèche, et une asthénie, installées depuis plusieurs années. Il rapporte 25 ans de travail dans la fabrication de matériaux de construction et l’entretien de chaudières industrielles. Il n’a jamais fumé. À l’examen, on retrouve des râles crépitants bilatéraux aux bases pulmonaires, un hippocratisme digital, sans cyanose. La radiographie thoracique montre des opacités interstitielles diffuses, prédominant aux bases, associées à des plaques pleurales calcifiées. La TDM thoracique objective des images en rayon de miel aux bases, et un épaississement pleural. Les EFR montrent un syndrome restrictif avec diminution de la DLCO. Aucun antécédent de tuberculose n’est rapporté, mais le patient évoque des travaux occasionnels de sablage."}], "2025-c1": [{"p": "Cas clinique 1 : Monsieur R., 34 ans, ouvrier agricole, est admis aux urgences suite à une perte de connaissance survenue sur son lieu de travail. Selon ses collègues, il pulvérisait un mélange d’insecticides (organophosphorés et carbamates) dans une serre mal ventilée, sans équipement de protection adéquat. L’exposition aurait duré environ 2 heures. Il a été retrouvé inconscient, présentant des sueurs abondantes, une salivation excessive et des convulsions."}, {"p": "À l’arrivée aux urgences (environ 45 minutes après l’incident) :"}, {"p": "⎯ Examen clinique :"}, {"p": "- Coma (Glasgow 6) ; Myosis serré, hypersalivation, larmoiement"}, {"p": "- Fasciculations musculaires diffuses, crampes, paralysie flasque des Mbres inférieurs"}, {"p": "- Bradypnée avec cyanose, râles bronchiques, bradycardie (45 bpm), hypotension (80/40 mmHg)"}, {"p": "- Incontinence urinaire et fécale ; Température : 38,2°C"}, {"p": "⎯ Antécédents :"}, {"p": "Aucun antécédent médical connu ; Non-fumeur, pas de prise de médicaments réguliers"}, {"p": "⎯ Examens complémentaires :"}, {"p": "- Gaz du sang : acidose métabolique sévère"}, {"p": "- Dosage des cholinestérases plasmatiques : activité effondrée à 10% de la valeur de base"}, {"p": "- ECG : bradyarythmie, allongement du QT"}, {"p": "- TDM cérébrale : normale"}, {"p": "- Recherche de métabolites urinaires en cours"}], "2025-c2": [{"p": "Cas clinique 2 : Monsieur Y, 52 ans, a travaillé 18 ans dans le recyclage de batteries (manipulation, broyage, fonte) puis 12 ans dans la fabrication de lampes fluorescentes et d’instruments de mesure. Il n’a jamais porté de protection respiratoire ni de gants. Il consulte pour fatigue, troubles de la mémoire, irritabilité, tremblements des mains aggravés à l’effort, hypersialorrhée, goût métallique, et éruptions cutanées prurigineuses des plis. Son entourage note un changement de caractère, une tendance à l’isolement, des oublis fréquents. À l’examen : pâleur, TA 155/100, tremblement intentionnel des doigts, démarche instable, hypersialorrhée, gingivite avec liseré grisâtre, faiblesse des extenseurs des poignets. L’EMG montre un ralentissement de la conduction nerveuse. Les bilans montrent : ALA urinaire > 20 mg/g créat, et une excrétion urinaire d’un métal lourd à 90 µg/L (N < 20)."}], "2025-c3": [{"p": "Cas clinique 3 : Monsieur T., 46 ans, ouvrier depuis 20 ans dans une usine de fabrication de colles industrielles, travaille dans un atelier mal ventilé, exposé quotidiennement à des solvants aromatiques (principalement benzène, toluène, xylène). Il ne porte que rarement les équipements de protection individuelle, notamment lors du nettoyage des cuves et du transfert de solvants. Depuis 6 mois, il présente une asthénie majeure, des céphalées, des douleurs osseuses diffuses, des épisodes fébriles, des ecchymoses spontanées, des gingivorragies et une pâleur cutanéo-muqueuse. Il consulte en urgence après un malaise avec épistaxis abondante et fièvre à 39,2°C."}, {"p": "⎯ À l’examen :"}, {"p": "- Pâleur cutanéo-muqueuse, purpura pétéchial, ecchymoses multiples sur les membres, hématome fessier."}, {"p": "- Gingivite nécrotico-hémorragique, angine ulcéro-nécrotique."}, {"p": "- Température : 39,2°C, TA : 92/54 mmHg, FC : 122 bpm, SpO2 : 96%."}, {"p": "- Dyspnée modérée, râles crépitants bilatéraux."}, {"p": "- Confusion, somnolence, désorientation temporo-spatiale, myoclonies."}, {"p": "⎯ Antécédents professionnels :"}, {"p": "- Exposition continue à des concentrations atmosphériques de benzène mesurées à 48 ppm (VME recommandée < 1 ppm)."}, {"p": "- Durée d’exposition : 20 ans, pics fréquents > 100 ppm lors de nettoyage des cuves."}, {"p": "⎯ Examens complémentaires :"}, {"p": "- Radiographie thoracique : infiltrats alvéolaires bilatéraux."}, {"p": "- Scanner cérébral : normal."}, {"p": "- ECG : tachycardie sinusale, extrasystoles, QT allongé."}, {"p": "- EEG : ralentissement diffus."}, {"p": "- Hémocultures : positives à Pseudomonas aeruginosa."}], "2025-c4": [{"p": "Cas clinique N°4 : Monsieur Y., 38 ans, ouvrier dans une usine de fabrication de chaussures, travaille depuis 14 ans dans un atelier mal ventilé, exposé quotidiennement à des colles riches en n-hexane (mesures atmosphériques : 350–1200 ppm, pics > 1500 ppm). Il ne porte pas systématiquement d’équipements de protection. Depuis 8 mois, il présente une fatigabilité, des crampes, des douleurs et engourdissements des membres inférieurs, puis une faiblesse progressive des jambes, des troubles de la marche et des chutes. Depuis 3 semaines, il note une aggravation rapide avec atteinte des membres supérieurs, troubles de la vision (baisse d’acuité, dyschromatopsie), et une dyspnée d’effort."}, {"p": "⎯ À l’examen :"}, {"p": "- déficit moteur symétrique prédominant aux membres inférieurs (force 2/5), aréflexie, troubles sensitifs distaux, steppage, amyotrophie jambière, troubles de la discrimination des couleurs, réflexes ostéotendineux abolis."}, {"p": "- polypnée, crépitants aux bases, SpO2 91%."}, {"p": "- amaigrissement, asthénie majeure, troubles de la concentration, irritabilité. érythème, desquamation des mains."}, {"p": "⎯ Examens complémentaires :"}, {"p": "EMG : diminution marquée de la vitesse de conduction sensitive et motrice, signes de dégénérescence axonale."}, {"p": "Bilan biologique :"}, {"p": "- ASAT : 85 UI/L (N < 40), ALAT : 93 UI/L (N < 45)"}, {"p": "- Urée : 0,68 g/L (N : 0,17–0,43), Créatinine : 132 µmol/L (N < 110)"}, {"p": "- 2,5-hexanedione urinaire : 3,8 mg/L (N < 0,4)"}, {"p": "- NFS : normale"}, {"p": "IRM cérébrale : atrophie corticale diffuse, hypersignaux T2 de la substance blanche."}, {"p": "Ophtalmologie : altération maculaire légère, perturbation de la vision des couleurs."}, {"p": "Évolution : Aggravation rapide avec quadriplégie flasque, paralysie partielle des muscles respiratoires nécessitant une ventilation non invasive, récupération incomplète après arrêt de l’exposition."}], "2025-c5": [{"p": "Cas clinique 5 : Monsieur L., 64 ans, ancien ouvrier polyvalent, a travaillé 35 ans dans la construction navale, la métallurgie et l’entretien industriel. Il a occupé de nombreux postes : soudeur, calorifugeur, sableur, peintre industriel, opérateur sur fours et maintenance de chaudières. Il rapporte des expositions variées : amiante (isolation, calorifugeage), silice (sablage), chrome (peintures anticorrosion), nickel, hydrocarbures aromatiques polycycliques, poussières métalliques, solvants, et fumées de soudage. Il a également été fumeur (30 PA), a arrêté il y a 8 ans."}, {"p": "Depuis 6 mois, il présente une toux sèche, une dyspnée d’effort, une hémoptysie intermittente, une perte de poids de 7 kg et une asthénie croissante. L’examen clinique retrouve des râles crépitants à droite, un hippocratisme digital et des adénopathies sus-claviculaires."}, {"p": "Examens complémentaires :"}, {"p": "- Radiographie thoracique : opacité hilaire droite, épaississement pleural, micronodules bilatéraux."}, {"p": "- Scanner thoracique : masse lobaire supérieure droite de 5,2 cm, adénopathies médiastinales, plaques pleurales calcifiées, images de fibrose interstitielle."}, {"p": "- Fibroscopie bronchique : lésion endobronchique, biopsie réalisée."}, {"p": "- Anatomo-pathologie : carcinome épidermoïde bronchique infiltrant."}, {"p": "- Bilan d’extension : métastases hépatiques."}, {"p": "- Dossier professionnel : curriculum laboris incomplet, fiches d’exposition manquantes, expositions multiples, absence de port systématique d’EPI."}], "2025-c6": [{"p": "Cas clinique 6 : Monsieur K., 58 ans, a travaillé 27 ans dans l’extraction de minerais, le broyage de roches et la construction de tunnels. Il a occupé plusieurs postes, parfois non déclarés, et n’a jamais bénéficié d’un suivi médical systématique. Il consulte pour toux chronique, dyspnée d’effort, amaigrissement de 7 kg en 9 mois, douleurs thoraciques, et épisodes fébriles intermittents. Il a des antécédents de bronchites à répétition et fume 12 cigarettes par jour depuis 20 ans."}, {"p": "⎯ Examens complémentaires :"}, {"p": "Radiographie thoracique : opacités micronodulaires diffuses, épaississement pleural, prédominance aux sommets."}, {"p": "Scanner thoracique : fibrose interstitielle, masses pseudo-tumorales, adénopathies hilaires, masse lobaire supérieure droite de 3,9 cm."}, {"p": "Fibroscopie bronchique : lésion endobronchique, biopsie réalisée."}, {"p": "Anatomo-pathologie : carcinome épidermoïde bronchique infiltrant."}, {"p": "Spirométrie : syndrome restrictif sévère."}, {"p": "Dossier professionnel : historique incomplet, expositions multiples à des poussières minérales, absence de port systématique d’EPI."}], "2025-c7": [{"p": "Cas clinique 7 : Monsieur S., 56 ans, a travaillé 29 ans dans la fabrication de meubles, puis 8 ans dans la galvanoplastie industrielle. Il a occupé des postes variés : ponçage, sciage, vernissage, polissage de pièces métalliques, maintenance d’équipements. Il n’a jamais bénéficié d’un suivi médical systématique, a changé plusieurs fois d’employeur, et n’a jamais porté d’EPI adaptés. Il consulte pour obstruction nasale chronique, épistaxis, céphalées frontales, douleurs orbito-nasales et perte de l’odorat évoluant depuis 7 mois."}, {"p": "⎯ Antécédents : Tabagisme modéré, pas d’alcool, pas d’ATCD familial de cancer."}, {"p": "⎯ Examens complémentaires :"}, {"p": "- Scanner des sinus : masse ethmoïdale droite de 3,5 cm, extension au sinus maxillaire, lyse osseuse."}, {"p": "- Biopsie endonasale : tumeur maligne peu différenciée."}, {"p": "- IRM cérébrale : envahissement du toit de l’ethmoïde, contact avec la dure-mère."}, {"p": "- NFS : hémoglobine 13,1 g/dL, leucocytes 7 200/mm³, plaquettes 210 000/mm³."}, {"p": "- Dossier professionnel : historique incomplet, expositions multiples à des poussières organiques et métalliques, traçabilité partielle, absence de port systématique d’EPI."}], "2025-c8": [{"p": "Cas clinique 8 : Monsieur A., 51 ans, menuisier en atelier de fabrication de meubles depuis 35 ans, réalise la conception, la taille, le façonnage, le polissage et l’assemblage de pièces en bois. Il utilise régulièrement des machines bruyantes et porte des protecteurs auditifs de façon irrégulière. Il ne présente pas d’antécédent ORL ou familial, ni de prise médicamenteuse ototoxique. Depuis 3 ans, il note une baisse progressive de l’audition, avec acouphènes récents. Un audiogramme montre un déficit bilatéral, prédominant sur les fréquences aiguës. Après un arrêt d’exposition d’un mois, un nouvel audiogramme montre un aspect similaire."}], "2025-c9": [{"p": "Cas clinique 9 : Madame F., 45 ans, travaille depuis 20 ans dans différents secteurs : 8 ans en imprimerie (encres, solvants), 5 ans dans l’agroalimentaire (manipulation de produits alimentaires et détergents), puis 7 ans comme infirmière (désinfectants, gants, solutions antiseptiques). Depuis 9 mois, elle présente des lésions cutanées récidivantes : érythème, vésicules, fissures et prurit, localisés aux mains, poignets, avant-bras, parfois visage et cou. Les lésions s’aggravent certains jours, s’améliorent en vacances, mais persistent parfois malgré l’éviction temporaire du travail. Elle utilise parfois des crèmes hydratantes, rarement des gants, et rapporte un terrain atopique. À l’examen : plaques érythémato-vésiculeuses, croûtes, fissures sur les mains ; quelques lésions sèches sur le visage ; discrète conjonctivite. Un collègue présente des symptômes proches. Madame F. craint de perdre son emploi."}], "2025-c10": [{"p": "Cas clinique 10 : Monsieur R., 59 ans, ancien manipulateur radio dans un service de radiologie, puis technicien de maintenance d’appareils de radiothérapie, consulte pour des lésions cutanées chroniques évoluant depuis plusieurs années. Il rapporte une peau sèche, amincie, moins souple, avec des zones blanchâtres, des télangiectasies, quelques ulcérations chroniques sur le dos des mains et avant-bras, et une chute progressive des poils sur ces zones. Il signale une aggravation après des traumatismes minimes. Il ressent parfois des douleurs, des picotements, et une diminution de la sensibilité locale. Pas d’antécédent familial dermatologique. Il a travaillé 25 ans sans toujours porter de gants plombés ni respecter strictement les écrans de protection. Pas de pathologie générale connue."}], "blanc1-c1": [{"p": "Cas clinique N°1 — Mme K. S., 29 ans, infirmière au service des urgences depuis 4 ans. À 2 h du matin, en fin de garde, elle se pique profondément l'index gauche avec l'aiguille creuse qu'elle venait d'utiliser pour un prélèvement veineux, en essayant de la recapuchonner. Le patient source, toxicomane connu, a un statut sérologique inconnu. Le collecteur d'aiguilles du chariot était plein et placé à l'autre bout de la salle."}, {"p": "Elle est vaccinée contre l'hépatite B (3 doses) mais n'a jamais contrôlé son taux d'anticorps anti-HBs. Elle se présente en médecine du travail 6 heures plus tard, après avoir terminé sa garde."}], "blanc1-c2": [{"p": "Cas clinique N°2 — M. B. R., 47 ans, maçon depuis 22 ans, gâche le ciment à la main sans gants. Depuis 3 ans, il présente un prurit intense des doigts, débutant autour des ongles de l'index et du médius de la main droite, avec des poussées qui s'améliorent nettement pendant ses congés d'été."}, {"p": "À l'examen : face dorsale des mains œdémateuse, épiderme épaissi et hyperkératosique, callosités, érosions et crevasses ; quelques lésions croûteuses jaunâtres. Il n'a pas d'antécédent d'atopie."}], "blanc1-c3": [{"p": "Cas clinique N°3 — Mme A. N., 38 ans, infirmière en réanimation, travaille en horaires postés de nuit (12 h) depuis 9 ans, avec 4 à 5 nuits par semaine. Elle consulte pour une fatigue permanente, une irritabilité, des difficultés de concentration et deux erreurs de préparation de médicaments en fin de nuit le mois dernier."}, {"p": "Elle dort le jour, 4 à 5 heures, d'un sommeil fragmenté, dans une chambre exposée au bruit de la rue. Elle signale une prise de poids de 8 kg en 3 ans, des épigastralgies et une consommation de 6 cafés par nuit."}], "blanc1-c4": [{"p": "Cas clinique N°4 — M. D. Y., 31 ans, a travaillé 6 ans dans un atelier de sablage de jeans (« délavage ») avec un jet de sable sous pression, dans un local fermé, sans aspiration ni masque. Il consulte pour une dyspnée d'effort d'aggravation rapide, une toux sèche et un amaigrissement de 7 kg."}, {"p": "La radiographie thoracique montre des opacités nodulaires multiples bilatérales prédominant aux sommets, avec des adénopathies hilaires. L'EFR montre un syndrome restrictif. Un collègue du même atelier est décédé l'an dernier d'une insuffisance respiratoire."}], "blanc1-c5": [{"p": "Cas clinique N°5 — M. L. H., 42 ans, technicien de maintenance, quitte son travail à 17 h. Il fait un détour de 10 minutes pour récupérer sa fille à l'école, comme chaque jour, puis rentre chez lui. Sur ce trajet, sa voiture est percutée : fracture de la jambe droite."}, {"p": "Il est arrêté 3 mois. À la reprise, il garde une raideur de la cheville. Six mois plus tard, la douleur réapparaît et nécessite une nouvelle intervention."}], "blanc1-c6": [{"p": "Cas clinique N°6 — M. F. O., 24 ans, apprenti boulanger depuis 3 ans dans une boulangerie artisanale, pèse et verse la farine à la main dans le pétrin, sans masque. Depuis un an, il présente des éternuements, une rhinorrhée et un larmoiement au fournil, puis, depuis 4 mois, des crises de dyspnée sifflante en fin de matinée."}, {"p": "Les symptômes disparaissent pendant ses congés et réapparaissent dès la reprise ; il ne note aucune variation saisonnière. L'examen clinique et l'EFR réalisés en consultation, un jour de repos, sont normaux."}], "blanc2-c1": [{"p": "Cas clinique N°1 — M. B. S., 47 ans, a travaillé 19 ans comme opérateur dans une unité de rectification des benzols d'une raffinerie. Il assurait aussi le dégraissage de pièces métalliques avec un solvant contenant du benzène et se lavait régulièrement les mains avec ce même produit. Il fumait et prenait ses repas au poste. Il a été muté il y a 2 ans à un poste administratif."}, {"p": "Il consulte pour une asthénie intense, des vertiges, des épistaxis, des gingivorragies, des ecchymoses spontanées et des angines à répétition depuis quelques mois. À l'examen : pâleur cutanéo-muqueuse, purpura des membres inférieurs, stomatite."}, {"p": "FNS : Hb 7,6 g/dl ; GB 1 900/mm³ (PNN 650/mm³) ; plaquettes 22 000/mm³. Biopsie ostéomédullaire : moelle hypocellulaire à prédominance lymphocytaire, le tissu graisseux remplaçant le tissu hématopoïétique."}], "blanc2-c2": [{"p": "Cas clinique N°2 — M. D. K., 39 ans, travaille depuis 11 ans dans une entreprise de rénovation d'ouvrages métalliques. Il décape au chalumeau et gratte d'anciennes peintures au minium de plomb sur des charpentes de ponts. Il ne porte aucune protection respiratoire, mange et fume sur le chantier."}, {"p": "Il est admis aux urgences pour des douleurs abdominales très vives, d'abord péri-ombilicales puis diffuses, avec vomissements et arrêt du transit. Il est apyrétique, le ventre est souple, il est pâle et en sueurs ; TA 175/100 mmHg. L'ASP montre une distension colique aérique. On note un liseré gingival bleu ardoisé. Il se plaint depuis des mois d'asthénie, d'irritabilité et de troubles de la mémoire. Il « fait les cornes » quand on lui demande de relever les doigts de la main droite."}, {"p": "Bilan : Hb 11,4 g/dl, anémie normochrome normocytaire régénérative ; nombreuses hématies à granulations basophiles ; plombémie 820 µg/L ; ALA-U 24 mg/g de créatinine."}], "blanc2-c3": [{"p": "Cas clinique N°3 — M. R. T., 48 ans, chaudronnier depuis 24 ans dans un atelier de construction métallique (martelage, rivetage, meulage). L'atelier comporte 4 machines produisant chacune 86 dB(A). Il porte rarement ses bouchons. Il a reçu un traitement par aminosides il y a 10 ans pour une infection grave."}, {"p": "Il consulte car il fait répéter ses interlocuteurs et ne comprend plus ce qui se dit quand plusieurs personnes parlent ; il signale des acouphènes. L'otoscopie est normale."}, {"p": "L'audiométrie tonale est reproduite ci-dessous (tracé noir : conduction aérienne ; tracé rouge : conduction osseuse) ; un recrutement est présent. L'audiométrie vocale montre un déficit plus marqué que l'audiométrie tonale."}, {"img": "aud_b2.png"}], "blanc2-c4": [{"p": "Cas clinique N°4 — Mme L. F., 34 ans, agent d'hygiène au bloc opératoire depuis 5 ans. En fin de programme, elle comprime un sac noir pour le fermer et se pique la paume avec une aiguille creuse souillée de sang, jetée par erreur dans ce sac. Le même jour, en nettoyant une table d'opération, elle reçoit une projection de sang dans l'œil droit."}, {"p": "Elle n'a reçu que deux doses de vaccin contre l'hépatite B et son rappel antitétanique n'est pas à jour. Elle se présente au service de médecine du travail une heure après la piqûre."}], "blanc3-c1": [{"p": "Cas clinique N°1 — M. S. M., 63 ans, retraité depuis 4 ans. Il a travaillé 28 ans dans une usine de fibrociment (fabrication de plaques ondulées et de conduites), puis 6 ans dans un atelier de garnitures de freins. Ancien fumeur (30 paquets-années), sevré depuis 10 ans."}, {"p": "Il consulte pour une dyspnée d'effort progressive, une douleur thoracique droite persistante et un amaigrissement de 8 kg en 4 mois. La radiographie thoracique montre un épanchement pleural droit de grande abondance et des plaques pleurales bilatérales partiellement calcifiées."}, {"p": "Le scanner thoracique montre un épaississement pleural droit circonférentiel, irrégulier et mamelonné, avec rétraction de l'hémithorax, et des plaques calcifiées an
