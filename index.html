<style>

}

  --bg:#0c0e1c; --surface:#161a31; --surface2:#1d2240; --ink:#eceefe; --muted:#a2a8cc; --line:#2b3157;
  --navy:#120f3a; --navy2:#272263; --sky:#38bdf8; --skyink:#04202f; --good:#3ecf6b; --goodbg:#11331f; --bad:#ff5c5c; --badbg:#3b1518;
  --sel:#3a3112; --selb:#f2b705; --kw:#ff5c86; --bn:#5cb6ff; --vio:#a78bfa; --t1:#5a4512; --t2:#0f4a3a; --t3:#33285e; --t4:#5a2234; --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c0e1c; --surface:#161a31; --surface2:#1d2240; --ink:#eceefe; --muted:#a2a8cc; --line:#2b3157;
  --navy:#120f3a; --navy2:#272263; --sky:#38bdf8; --skyink:#04202f; --good:#3ecf6b; --goodbg:#11331f; --bad:#ff5c5c; --badbg:#3b1518;
  --sel:#3a3112; --selb:#f2b705; --kw:#ff5c86; --bn:#5cb6ff; --vio:#a78bfa; --t1:#5a4512; --t2:#0f4a3a; --t3:#33285e; --t4:#5a2234; --shadow:none; color-scheme:dark;}
*{box-sizing:border-box}
html{font-size:clamp(16px,0.45vw + 14px,18.5px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Roboto,system-ui,sans-serif;line-height:1.45;min-height:100dvh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
/* header */
.hdr{position:sticky;top:0;z-index:20;background:radial-gradient(1200px 120px at 20% 0,var(--hdrg) 0,transparent 60%),linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;
  padding:8px max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.hdr .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--orange),#ef4444);display:grid;place-items:center;flex:none;font-weight:900;font-size:.95rem;letter-spacing:-.03em}
.hdr .tt{flex:1;min-width:0;line-height:1.15}

.hdr .tt span{font-size:.76rem;color:#c9c6ff}
.hbtn{background:rgba(255,255,255,.1);border:0;border-radius:10px;width:36px;height:36px;display:grid;place-items:center;font-size:1.05rem;color:#fff;flex:none}
.copy{font-size:9.5px;color:#9b98c9;white-space:nowrap;align-self:flex-end;margin-bottom:2px}
.wrap{max-width:1180px;margin:0 auto;padding:16px max(14px,env(safe-area-inset-right)) 40px max(14px,env(safe-area-inset-left))}
.muted{color:var(--muted)}
/* home */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media(min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile>div{min-width:0} .tile b.txt{font-size:1.05rem;line-height:1.15;overflow-wrap:anywhere}
@media(max-width:620px){table.st{font-size:.8rem} table.st th,table.st td{padding:.4em .2em} .cnt{min-width:1.6em;height:1.6em}}
.tile{border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);font-weight:700}
.tile .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.55);flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
:root[data-theme="dark"] .tile .ic{background:rgba(255,255,255,.08)}
.hbtn svg,.ib svg{display:block} .hbtn{transition:background .15s} .hbtn:hover{background:rgba(255,255,255,.2)}
.tile b{font-size:1.75rem;font-weight:900;line-height:1;display:block}
.tile span{font-size:.85rem}
.t1{background:var(--t1)} .t2{background:var(--t2)} .t3{background:var(--t3)} .t4{background:var(--t4)}
.grid2{display:grid;gap:16px}

.card{background:var(--surface);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.sec{font-weight:900;font-size:1.12rem;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px;margin:0 0 12px}

.seg{display:flex;border-radius:12px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);flex-wrap:wrap}

.pick{position:relative}
.pickbtn{width:100%;display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:.65em .9em;text-align:left;font-weight:700}

.drop{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.25);overflow:hidden}

.go{width:100%;margin-top:16px;border:0;border-radius:14px;padding:.85em;font-weight:900;font-size:1.08rem;color:#fff;background:linear-gradient(90deg,var(--navy2),var(--acc3));box-shadow:0 8px 20px var(--accsh)}
.go[disabled]{opacity:.5}
.btn{border:0;border-radius:10px;padding:.55em 1em;font-weight:700;display:inline-flex;align-items:center;gap:.45em;justify-content:center;background:var(--surface2);border:1px solid var(--line)}
.btn.navy{background:var(--navy);color:#fff;border-color:var(--navy)}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.donut{--p:0;width:150px;aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--good) 0 calc(var(--g)*1%),var(--bad) 0 calc((var(--g) + var(--r))*1%),#c6c9d6 0);display:grid;place-items:center;flex:none}

.qz{display:grid;grid-template-columns:1fr;gap:14px;max-width:1180px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-right)) 30px max(12px,env(safe-area-inset-left))}
@media(min-width:900px){.qz{grid-template-columns:150px 1fr}}
.side{display:none}
@media(min-width:900px){.side{display:flex;flex-direction:column;position:sticky;top:66px;height:calc(100dvh - 80px);background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}}
.side .lst{flex:1;overflow:auto;padding:4px 0}
.qn{display:flex;align-items:center;gap:6px;width:100%;border:0;background:transparent;padding:.55em .9em;font-weight:700;color:var(--muted);font-size:.95rem;border-left:3px solid transparent}

.qn.ok .s{color:var(--good)} .qn.ko .s{color:var(--bad)} .qn.an .s{color:var(--sky)}
.timers{border-top:1px solid var(--line);padding:10px 12px;font-size:.86rem;text-align:center;background:var(--surface2)}

.timers .o{color:var(--orange);font-weight:700}
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
@media(min-width:900px){.strip{display:none}}
.sq{flex:none;min-width:2.3rem;height:2.3rem;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:.85rem;color:var(--muted)}
.sq.cur{border-color:var(--sky);color:var(--sky);box-shadow:0 0 0 2px var(--sky) inset}
.sq.ok{background:var(--good);border-color:var(--good);color:#fff} .sq.ko{background:var(--bad);border-color:var(--bad);color:#fff} .sq.an{background:var(--sky);border-color:var(--sky);color:#fff}
.sess{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sess h2{margin:0;font-size:1.02rem;font-weight:900;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess small{display:block;color:var(--orange);font-weight:700;font-size:.78rem}
.mtimer{font-size:.82rem;font-weight:700;white-space:nowrap}
@media(min-width:900px){.mtimer{display:none}}
.qhead{display:flex;gap:10px;align-items:flex-start}
.qhead .tt{flex:1}
.qtitle{font-weight:900;text-decoration:underline;text-underline-offset:4px;margin-bottom:6px;font-size:1.02rem}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--sky);color:var(--skyink);font-weight:800;font-size:.72rem;padding:.32em .7em;border-radius:8px;text-transform:uppercase;letter-spacing:.02em}
.pill.o{background:var(--orange);color:#231600} .pill.v{background:var(--vio);color:#fff} .pill.rf{background:var(--bad);color:#fff} .pill.rep{background:var(--surface2);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--orange)} .pill.rep b{color:var(--orange)}
.icons{display:flex;gap:4px}
.ib{border:0;background:var(--surface2);border-radius:9px;width:34px;height:34px;display:grid;place-items:center;font-size:1rem}
.ib.on{background:var(--orange);color:#1b1300}
.casebox{margin-top:10px;background:linear-gradient(0deg,var(--surface2),var(--surface2));border-left:4px solid var(--orange);border-radius:12px;padding:10px 14px;font-size:.95rem}
.casebox summary{cursor:pointer;font-weight:800;color:var(--orange2);list-style:none}
.casebox summary::-webkit-details-marker{display:none}
.casebox p{margin:.45em 0}
table.t{border-collapse:collapse;font-size:.86rem;margin:.4em 0;background:var(--surface);width:100%}
table.t td,table.t th{border:1px solid var(--line);padding:.3em .45em;text-align:center}
table.t tr:first-child td,table.t th{background:var(--surface2);font-weight:700}
.tscroll{overflow-x:auto}
.stem{margin-top:10px;font-weight:700;font-size:1.08rem;line-height:1.42;background:var(--surface);border-radius:12px}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.opt{width:100%;text-align:left;display:flex;align-items:flex-start;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:11px;padding:.6em .8em;font-size:1.04rem;line-height:1.38;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.opt .k{font-weight:900;min-width:1.4em;color:var(--navy2)}
:root[data-theme="dark"] .opt .k{color:var(--sky)}
.opt .tx{flex:1}
.opt .mk{font-weight:900;font-size:1.2rem;line-height:1}
.opt.sel{background:var(--sel);border-color:var(--selb);font-weight:700}
.opt.ok{background:var(--good);border-color:var(--good);color:#fff;font-weight:700} .opt.ok .k{color:#fff}
.opt.ko{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:700} .opt.ko .k{color:#fff}
.opt.miss{border-color:var(--good);border-width:2px;background:var(--goodbg)} .opt.miss .mk{color:var(--good)}

.why{display:block;margin-top:6px;padding:7px 10px;border-radius:9px;background:var(--surface);color:var(--ink);font-weight:400;font-size:.92rem;line-height:1.42}
.opt.ok .why,.opt.ko .why{background:rgba(255,255,255,.95);color:#161a33}
.whyb{display:inline-block;margin-top:4px;font-size:.78rem;font-weight:800;color:var(--sky)}
.opt.ok .whyb,.opt.ko .whyb{color:#fff}
.vT{color:var(--good);font-weight:900} .vF{color:var(--bad);font-weight:900}
.opt.ok .why .vT,.opt.ko .why .vT{color:#1f8b3a} .opt.ok .why .vF,.opt.ko .why .vF{color:#d32f2f}
.kw{color:var(--kw);font-weight:900}
.bn{color:var(--bn);font-weight:800}
.opt.ok .why .kw,.opt.ko .why .kw{color:#d6123f} .opt.ok .why .bn,.opt.ko .why .bn{color:#0b6fc4}
/* match */
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.legend span{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:.3em .6em;font-size:.88rem}
.legend b{color:var(--vio);margin-right:.3em}
.mrow{background:var(--surface);border:1.5px solid var(--line);border-radius:11px;padding:.55em .8em;display:flex;flex-direction:column;gap:6px}
.mrow.ok{border-color:var(--good);background:var(--goodbg)} .mrow.ko{border-color:var(--bad);background:var(--badbg)}
.mrow .tx{font-weight:700}
.mchips{display:flex;gap:5px;flex-wrap:wrap}

.mc.good{background:var(--good);border-color:var(--good);color:#fff}
.mc.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.nav{display:flex;gap:8px;align-items:center;margin-top:14px}
.nav .sp{flex:1;display:flex;justify-content:center}

.verdict.ok{background:var(--goodbg);color:var(--good)} .verdict.ko{background:var(--badbg);color:var(--bad)}
.comm{margin-top:14px}
.comm h3{margin:0 0 10px;font-size:1.05rem;text-decoration:underline;text-underline-offset:4px;display:flex;gap:8px;align-items:center}
.gx{font-size:1rem;line-height:1.55}
.alist div{padding:5px 0;border-bottom:1px dashed var(--line)}
.alist div:last-child{border-bottom:0}
.cap{margin-top:12px}
.cap img{display:block;width:100%;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:zoom-in;margin-top:6px}
.tmp{margin-top:12px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.tmp .th{display:flex;align-items:center;gap:8px;padding:.55em .8em;background:var(--surface2);font-weight:800;color:var(--navy2)}
:root[data-theme="dark"] .tmp .th{color:var(--sky)}
.tmp .th button{margin-left:auto}
.tmp img{display:block;width:100%;background:#fff;cursor:zoom-in}
.note{font-size:.88rem;border-radius:10px;padding:.5em .8em;background:var(--sel);margin-top:10px}
.notes textarea{width:100%;min-height:80px;border:1.5px solid var(--line);border-radius:10px;padding:.6em;background:var(--surface2);color:var(--ink);font:inherit;margin-top:8px}
.zoom{position:fixed;inset:0;z-index:60;background:rgba(5,6,20,.97);overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:14px}
.zoom{flex-direction:column;align-items:center;cursor:zoom-out;padding-top:64px}
.zoom img{max-width:none;width:100%;max-width:min(1400px,100%);background:#fff;border-radius:8px;margin:0 auto;cursor:default;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.zbar{position:fixed;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));display:flex;gap:8px;z-index:61}
.zb{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;backdrop-filter:blur(8px)}
.zb:hover{background:rgba(255,255,255,.28)} .zb.zx{background:#ef4444}
.zhint{color:#cfd2ec;font-size:.8rem;margin:10px 0 0}

.bar{height:10px;border-radius:9px;background:var(--surface2);overflow:hidden;flex:1}

.wl{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem;cursor:pointer}

.qz main{min-width:0}
@media(max-width:620px){.hdr{gap:8px}.hdr .logo{width:32px;height:32px;font-size:.8rem;border-radius:10px}
 .hdr .tt b{white-space:normal;font-size:.86rem;line-height:1.15}.hdr .tt span{font-size:.7rem}.hbtn{width:32px;height:32px;font-size:.9rem}}
.foot{text-align:center;color:var(--muted);font-size:.6rem;margin-top:22px;opacity:.75}
.hdr .logo{background:#fff;border-radius:50%;padding:2px;overflow:hidden}

/* verdict border instead of words */

/* sessions */
.lk{background:none;border:0;color:var(--sky);font-weight:800;font-size:.82rem;cursor:pointer;padding:0;text-transform:none;letter-spacing:0}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:14px;margin-top:14px}
.scard{margin:0!important}
.sch{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.sch b{display:block;font-size:1.02rem;line-height:1.3}.sch span{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}
.ib{border:0;background:none;font-size:1.4rem;line-height:1;color:var(--orange);cursor:pointer;padding:2px 4px}
.scb{display:flex;gap:16px;align-items:center;margin-top:12px;flex-wrap:wrap}
.scb .donut{width:120px;font-size:.95rem}
.scr{flex:1;min-width:190px}
.sct{font-size:2rem;font-weight:900;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--bad)}
.mdl{position:fixed;inset:0;z-index:80;background:rgba(10,12,30,.55);display:grid;place-items:center;padding:16px}
.mbox{background:var(--surface);color:var(--ink);border-radius:16px;padding:22px;width:min(100%,460px);max-height:92dvh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mbox h3{margin:0;font-size:1.3rem}
.btn.mb{display:block;width:100%;margin:8px 0;text-align:center;background:var(--surface);border:1.5px solid var(--line);color:var(--ink);font-weight:700}
.btn.mb small{display:block;font-weight:500;opacity:.75;font-size:.78rem}
.btn.mb.mg{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.btn.mb.mr{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.mb.ms{color:var(--sky);border-color:color-mix(in srgb,var(--sky) 45%,transparent)}
.btn.mb.mbad{color:var(--orange2);border-color:color-mix(in srgb,var(--orange) 50%,transparent)}
.btn.mb.mx{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.mb[disabled]{opacity:.4}
.mor{text-align:center;color:var(--muted);font-size:.82rem;margin:10px 0 2px}
.casebox summary{display:flex;align-items:center;gap:6px}.casebox .cst{margin-left:auto;font-size:.78rem;font-weight:700;color:var(--muted)}

<script>
const DATA = {"q": [{"id": "2026b-01", "exam": "2026b", "label": "Mai 2026", "n": 1, "stem": "Parmi les propositions suivantes, lesquelles sont exactes concernant la responsabilité de l’employeur ?", "case": null, "tables": [], "imgs": [], "c": "intro", "s": ["p2-14", "p2-32"], "t": [], "g": "Responsabilité de l'employeur en santé au travail (loi 88-07) :\n• il **organise et finance** la médecine du travail et libère les travailleurs pour les visites ;\n• il met en œuvre la **prévention technique et organisationnelle** ;\n• il **préside la CPHS** (commission paritaire d'hygiène et de sécurité) ;\n• cette responsabilité est **non transférable** : le médecin du travail conseille, il ne décide pas à sa place.", "warn": [], "type": "multi", "opts": [["1", "La santé au travail est une obligation légale de l’employeur."], ["2", "La préservation de la santé des travailleurs est à la charge de l’employeur."], ["3", "L’employeur doit mettre en œuvre les prestations de médecine du travail et la prévention."], ["4", "L’employeur peut transférer ces responsabilités au médecin du travail."], ["5", "L’employeur assure la présidence de la CPHS."]], "p": {"1": ["T", "La santé et la sécurité au travail sont une **obligation légale** de l'employeur, posée par la loi 88-07 relative à l'hygiène, la sécurité et la médecine du travail."], "2": ["T", "Préserver la santé des travailleurs est **à la charge de l'employeur** : c'est lui qui organise et finance la médecine du travail."], "3": ["T", "Il doit mettre en place les **prestations de médecine du travail** (service autonome, inter-organismes ou convention) et la prévention des risques."], "4": ["F", "La responsabilité de l'employeur est [[non transférable]] : le médecin du travail est un **conseiller**, l'employeur reste responsable de la prévention."], "5": ["T", "La CPHS est **présidée par l'employeur** ou son représentant ; le médecin du travail y participe comme conseiller."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_2026b-01_0.png", 3]]}, {"id": "2026b-02", "exam": "2026b", "label": "Mai 2026", "n": 2, "stem": "Quelles missions correspondent à la médecine du travail selon la loi 88-07 ?", "case": null, "tables": [], "imgs": [], "c": "intro", "s": ["p2-22"], "t": [], "g": "Missions de la médecine du travail (art. 12, loi 88-07), moyen mnémotechnique P-P-I-A-M-É :\n• **P**romouvoir le bien-être physique et mental ; **P**révenir les AT et MP ;\n• **I**dentifier et surveiller les facteurs de risque ;\n• **A**dapter le **travail à l'homme** et chaque homme à sa tâche ;\n• **M**aintenir dans l'emploi (réduire l'invalidité, prolonger la vie active) ; **É**valuer la santé.", "warn": [], "type": "multi", "opts": [["1", "Préserver la santé physique et mentale des travailleurs."], ["2", "Prévenir les accidents du travail et les maladies professionnelles."], ["3", "Adapter l’homme au travail à et chaque homme à sa tâche."], ["4", "Réduire les cas d’invalidité et prolonger la vie active."], ["5", "Remplacer le médecin contrôleur pour vérifier les arrêts maladie."]], "p": {"1": ["T", "Préserver et promouvoir la santé **physique et mentale** des travailleurs est la première finalité de l'article 12."], "2": ["T", "**Prévenir les AT et les MP** et protéger les travailleurs de tout dommage à leur santé fait partie des missions."], "3": ["F", "La loi dit adapter le [[travail à l'homme]] et chaque homme à sa tâche ; « adapter l'homme au travail » inverse la formule (piège déjà tombé en 2024 et janvier 2026)."], "4": ["T", "La loi vise à **réduire les cas d'invalidité** et à assurer une prolongation de la vie active des travailleurs."], "5": ["F", "Contrôler les arrêts maladie est le rôle du [[médecin contrôleur]] de la CNAS ; le médecin du travail ne vérifie jamais les arrêts."]}, "key": ["1", "2", "4"], "fmt": "QCM", "o": [["of2/o_2026b-02_0.png", 7]]}, {"id": "2026b-03", "exam": "2026b", "label": "Mai 2026", "n": 3, "stem": "Concernant la salariée enceinte et la demande de l’employeur, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "intro", "s": ["p2-32"], "t": [], "g": "Secret médical et aptitude :\n• le médecin du travail est tenu au **secret médical**, y compris vis-à-vis de l'employeur ;\n• l'employeur reçoit la **fiche d'aptitude** : apte, apte avec restrictions, inapte, aménagements ;\n• le **diagnostic** et les résultats restent dans le DMST, confidentiel ;\n• ni l'employeur ni le service RH ne peuvent lever ce secret.", "warn": [], "type": "multi", "opts": [["1", "Le médecin du travail est soumis au secret médical."], ["2", "Il peut transmettre à l’employeur l’avis d’aptitude ou les restrictions."], ["3", "Il ne doit pas communiquer le diagnostic médical détaillé à la hiérarchie."], ["4", "La fiche d’aptitude doit contenir la conclusion d’aptitude, pas les détails cliniques."], ["5", "Le secret médical peut être levé à la demande du service RH."]], "p": {"1": ["T", "Le médecin du travail est soumis au **secret médical** comme tout médecin, même s'il est salarié de l'entreprise."], "2": ["T", "Il peut transmettre l'**avis d'aptitude** et les restrictions (ex. éviter tel produit pendant la grossesse) sans dévoiler la cause médicale."], "3": ["T", "Le **diagnostic** ne sort jamais du cabinet médical : la hiérarchie ne connaît que les conséquences sur le poste."], "4": ["T", "La fiche d'aptitude porte la **conclusion**, pas les détails cliniques ; ceux-ci restent dans le dossier médical en santé au travail."], "5": ["F", "Le [[service RH]] ne peut pas lever le secret médical ; seule la loi prévoit des dérogations précises, jamais une demande administrative."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_2026b-03_0.png", 10]]}, {"id": "2026b-04", "exam": "2026b", "label": "Mai 2026", "n": 4, "stem": "Quels travailleurs de l’entreprise relèvent d’une surveillance périodique spéciale ou particulière ?", "case": null, "tables": [], "imgs": [], "c": "intro", "s": ["p2-31"], "t": [], "g": "Visite particulière ou spéciale (décret 93-120) : au moins **2 fois par an** pour :\n• les travailleurs **fortement exposés** et les **postes de sécurité** ;\n• les **moins de 18 ans** et **plus de 55 ans** ;\n• la **femme enceinte** et la mère d'un enfant de **moins de 2 ans** ;\n• les handicapés et malades chroniques, le personnel de restauration. Les autres : au moins 1 fois par an.", "warn": [], "type": "multi", "opts": [["1", "Travailleurs exposés à des risques professionnels importants."], ["2", "Travailleurs affectés à des postes de sécurité."], ["3", "Travailleurs âgés de plus de 55 ans."], ["4", "Femmes enceintes et mères d’un enfant de moins de 2 ans."], ["5", "Tous les travailleurs administratifs sans risque particulier uniquement tous les 10 ans."]], "p": {"1": ["T", "Les travailleurs exposés à des **risques importants** (bruit, toxiques, RI…) relèvent de la surveillance médicale particulière."], "2": ["T", "Les **postes de sécurité** (conducteurs, grutiers…) exigent une surveillance renforcée car une défaillance met d'autres personnes en danger."], "3": ["T", "Les travailleurs de **plus de 55 ans** (et de moins de 18 ans) font partie des catégories à surveillance semestrielle."], "4": ["T", "La **femme enceinte** et la mère d'un enfant de **moins de 2 ans** bénéficient d'une surveillance particulière."], "5": ["F", "Une visite « tous les [[10 ans]] » n'existe pas : tout travailleur, même administratif, a une visite périodique **au moins annuelle**."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_2026b-04_0.png", 8]]}, {"id": "2026b-05", "exam": "2026b", "label": "Mai 2026", "n": 5, "stem": "Quelle proposition est inexacte concernant la vaccination ?", "case": null, "tables": [], "imgs": [], "c": "intro", "s": ["p2-23", "p2-33"], "t": [], "g": "Vaccination en milieu de travail :\n• elle fait partie du volet **médical** du médecin du travail (obligatoires et recommandées) ;\n• certaines sont **obligatoires** pour les catégories exposées (hépatite B chez le personnel de santé) ;\n• d'autres sont **recommandées** selon le risque : grippe, hépatite A, rage, leptospirose, brucellose ;\n• elle **complète** la prévention collective et individuelle, elle ne la remplace jamais.", "warn": [], "type": "single", "opts": [["A", "Le médecin du travail assure les vaccinations obligatoires et recommandées."], ["B", "Les vaccinations remplacent les mesures de protection collective."], ["C", "Certaines vaccinations sont imposées pour des catégories particulièrement exposées."], ["D", "L’hépatite B peut être obligatoire pour le personnel hospitalier selon le cours."], ["E", "Grippe, hépatite A, rage, leptospirose ou brucellose peuvent être recommandées selon les risques."]], "key": ["B"], "p": {"A": ["T", "Le médecin du travail assure les **vaccinations obligatoires et recommandées** selon les risques du poste."], "B": ["F", "La vaccination est un [[complément]] : elle ne remplace jamais la protection collective (hygiène, confinement, EPI). C'est la proposition inexacte."], "C": ["T", "Certaines vaccinations sont **imposées** par la réglementation aux catégories particulièrement exposées."], "D": ["T", "L'**hépatite B** est obligatoire pour le personnel de santé exposé au sang (arrêté du 25/04/2000)."], "E": ["T", "Grippe, hépatite A, rage, leptospirose ou brucellose sont **recommandées** selon l'activité (égoutiers, vétérinaires, abattoirs…)."]}, "fmt": "QCS", "o": [["of2/o_2026b-05_0.png", 12]]}, {"id": "2026b-06", "exam": "2026b", "label": "Mai 2026", "n": 6, "stem": "Associer chaque situation au niveau de prévention correspondant.", "case": null, "tables": [], "imgs": [], "c": "intro", "s": ["p2-33"], "t": [], "g": "Les trois niveaux de prévention :\n• **primaire** : empêcher la maladie (supprimer, substituer, former avant exposition) ;\n• **secondaire** : dépister tôt, avant les signes (audiométrie, biométrologie) ;\n• **tertiaire** : limiter les séquelles, adapter le poste, maintenir dans l'emploi.", "warn": [], "type": "match", "left": [["1", "Suppression ou substitution d’un solvant toxique."], ["2", "Audiométrie périodique chez les salariés exposés au bruit."], ["3", "Aménagement du poste d’un salarié ayant une lombalgie chronique pour éviter la perte d’emploi."], ["4", "Formation au port des EPI avant exposition."]], "right": [["a", "Prévention primaire"], ["b", "Prévention secondaire"], ["c", "Prévention tertiaire"]], "p": {"1": [null, "Supprimer ou substituer un solvant agit **avant toute exposition** : c'est la prévention primaire (a), en tête de la hiérarchie."], "2": [null, "L'audiométrie périodique **dépiste** une atteinte encore infraclinique : prévention secondaire (b)."], "3": [null, "Aménager le poste d'un travailleur déjà malade pour éviter la perte d'emploi relève du **tertiaire** (c)."], "4": [null, "Former au port des EPI **avant l'exposition** empêche le dommage : prévention primaire (a)."]}, "fmt": "Association", "corr": {"1": ["a"], "2": ["b"], "3": ["c"], "4": ["a"]}, "o": [["of2/o_2026b-06_0.png", 13]]}, {"id": "2026b-07", "exam": "2026b", "label": "Mai 2026", "n": 7, "stem": "Concernant le burn-out de la collègue, quelle proposition est inexacte ?", "case": null, "tables": [], "imgs": [], "c": "atmp", "s": ["p5-21", "p19-33"], "t": [], "g": "Maladie à caractère professionnel (MCP), art. 68 de la loi 83-13 :\n• affection que l'on estime **liée au travail** mais **non inscrite** dans un tableau ;\n• sa déclaration est une **obligation pour tout médecin** ;\n• elle sert à la **veille** et à faire **évoluer les tableaux** ;\n• elle n'ouvre **pas droit à indemnisation** (contrairement à la MP reconnue).", "warn": ["Les propositions 2 à 4 sont en partie illisibles."], "type": "pick", "opts": [["1", "Une MCP est une affection liée à un risque professionnel mais non inscrite dans les tableaux de MP indemnisables."], ["2", "Elle peut être liée à des condit(...)"], ["3", "Tout médecin a l’obligation de d(...)"], ["4", "La déclaration de cette MCP ouvre (...) indemnisation."], ["5", "La déclaration de MCP contribue à la prévention et à l’évolution des tableaux."]], "key": ["4"], "p": {"1": ["T", "C'est la définition : risque professionnel suspecté, mais affection **absente des tableaux** de MP indemnisables."], "2": ["T", "Le burn-out est lié aux **conditions de travail** (risques psychosociaux) : il peut donc être déclaré en MCP."], "3": ["T", "Tout médecin, et pas seulement le médecin du travail, a l'**obligation de déclarer** une MCP."], "4": ["F", "La déclaration de MCP n'ouvre [[pas droit à indemnisation]] ; seule une MP reconnue au titre d'un tableau est réparée. C'est la proposition inexacte."], "5": ["T", "Les déclarations de MCP alimentent la **prévention** et servent à créer ou modifier des tableaux."]}, "fmt": "QCS", "o": [["of2/o_2026b-07_0.png", 7], ["of2/o_2026b-07_1.png", 9]]}, {"id": "2026b-08", "exam": "2026b", "label": "Mai 2026", "n": 8, "stem": "Associer chaque groupe à sa caractéristique.", "case": null, "tables": [], "imgs": [], "c": "atmp", "s": ["p5-22"], "t": [], "g": "Les 85 tableaux de MP (arrêté du 05/05/1996) en 3 groupes :\n• **groupe 1** : 56 tableaux d'**intoxications** aiguës ou chroniques, listes de travaux souvent **indicatives** ;\n• **groupe 2** : 16 tableaux d'**infections microbiennes**, listes **limitatives** ;\n• **groupe 3** : 13 tableaux d'**ambiances et attitudes** de travail (bruit, vibrations), listes **limitatives**.", "warn": [], "type": "match", "left": [["1", "Groupe 1"], ["2", "Groupe 2"], ["3", "Groupe 3"]], "right": [["a", "Manifestations morbides d’intoxications aiguës ou chroniques ; listes de travaux indicatives"], ["b", "Maladies résultant d’ambiance et attitude de travail ; listes de travaux limitatives"], ["c", "Infections microbiennes ; listes de travaux limitatives"]], "p": {"1": [null, "Le groupe 1 regroupe les **intoxications** (plomb, mercure, benzène…) avec des listes de travaux indicatives : 1-a."], "2": [null, "Le groupe 2 rassemble les **infections microbiennes** (tuberculose, hépatites, leptospirose) avec listes limitatives : 2-c."], "3": [null, "Le groupe 3 concerne les **ambiances et attitudes** de travail (surdité, vibrations) avec listes limitatives : 3-b."]}, "fmt": "Association", "corr": {"1": ["a"], "2": ["c"], "3": ["b"]}, "o": [["of2/o_2026b-08_0.png", 7]]}, {"id": "2026b-09", "exam": "2026b", "label": "Mai 2026", "n": 9, "stem": "Le médecin conseil propose une IPP médicale de 8 %. Quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "atmp", "s": ["p5-33"], "t": [], "g": "Incapacité permanente partielle (IPP) après consolidation :\n• IPP **< 10 %** → **capital** forfaitaire, versé **une seule fois**, non révisable ;\n• IPP **≥ 10 %** → **rente mensuelle**, **révisable** (aggravation ou amélioration) ;\n• majoration « taux social » de 1 à 10 % possible si IPP ≥ 10 % ;\n• ici, IPP de 8 % → la victime reçoit un **capital**.", "warn": [], "type": "match", "left": [["1", "Une IPP > 10 %"], ["2", "Une IPP < 10 %"]], "right": [["a", "Versé en une seule fois."], ["b", "Mensuel et révisable."], ["i", "ouvre droit à un capital représentatif."], ["ii", "ouvre droit à une rente mensuelle."]], "p": {"1": [null, "Au-delà de 10 %, la victime perçoit une **rente mensuelle**, révisable selon l'évolution : 1 → b, ii."], "2": [null, "En dessous de 10 %, la réparation est un **capital** versé en une seule fois : 2 → a, i. C'est le cas de cette victime (8 %)."]}, "fmt": "Association", "corr": {"1": ["b", "ii"], "2": ["a", "i"]}, "o": [["of2/o_2026b-09_0.png", 12]]}, {"id": "2026b-10", "exam": "2026b", "label": "Mai 2026", "n": 10, "stem": "Associer chaque phase du syndrome psycho-organique aux solvants à sa description.", "case": null, "tables": [], "imgs": [], "c": "solv", "s": ["p7-23"], "t": [], "g": "Syndrome psycho-organique aux solvants, trois phases :\n• **phase 1 neurasthénique** : fatigue, céphalées, irritabilité, troubles de concentration, **réversible** ;\n• **phase 2 dysphorique** (encéphalopathie légère) : humeur et mémoire altérées, réversibilité **incomplète** ;\n• **phase 3 démentielle** : détérioration cognitive majeure, **séquelles définitives**.", "warn": [], "type": "match", "left": [["1", "Phase 1 neurasthénique"], ["2", "Phase 2 dysphorique/encéphalopathie légère"], ["3", "Phase 3 démentielle"]], "right": [["a", "Troubles de l’humeur et/ou altération cognitive modérée, réversibilité incomplète"], ["b", "Fatigue, irritabilité, céphalées, troubles de concentration sans détérioration intellectuelle certaine"], ["c", "Détérioration cognitive multiple, aphasie/apraxie/agnosie possibles, lésion définitive"]], "p": {"1": [null, "La phase neurasthénique associe des troubles subjectifs **sans détérioration intellectuelle** certaine, réversibles après retrait : 1-b."], "2": [null, "La phase dysphorique comporte des troubles de l'humeur et une altération cognitive modérée, à **réversibilité incomplète** : 2-a."], "3": [null, "La phase démentielle donne une détérioration cognitive multiple (aphasie, apraxie, agnosie), **lésion définitive** : 3-c."]}, "fmt": "Association", "corr": {"1": ["b"], "2": ["a"], "3": ["c"]}, "o": [["of2/o_2026b-10_0.png", 3]]}, {"id": "2026b-11", "exam": "2026b", "label": "Mai 2026", "n": 11, "stem": "Quels éléments orientent vers une polynévrite liée au n-hexane ? (RF)", "case": null, "tables": [], "imgs": [], "c": "solv", "s": ["p7-22"], "t": [], "g": "Polynévrite au n-hexane (TMP 58) :\n• exposition : colles, solvants (chaussure, maroquinerie), métabolisé en **2,5-hexanedione** neurotoxique ;\n• clinique : troubles **sensitifs distaux** (paresthésies, crampes) puis **déficit moteur** des membres inférieurs ;\n• EMG : baisse des vitesses de conduction, **atteinte axonale** ;\n• c'est par définition une atteinte **périphérique**.", "warn": [], "type": "pick", "opts": [["1", "Exposition à des colles contenant n-hexane."], ["2", "Troubles sensitifs des membres inférieurs : froid, douleurs, crampes."], ["3", "Fatigabilité et perte de force musculaire."], ["4", "EMG montrant réduction des vitesses de conduction et atteinte axonale."], ["5", "Atteinte exclusivement centrale sans signe périphérique."]], "key": ["5"], "p": {"1": ["T", "Les **colles riches en n-hexane** (chaussure, cuir) sont la source classique d'exposition."], "2": ["T", "Les **troubles sensitifs distaux** des membres inférieurs (froid, douleurs, crampes) sont les premiers signes."], "3": ["T", "La **fatigabilité** et la perte de force traduisent l'atteinte motrice qui suit les troubles sensitifs."], "4": ["T", "L'**EMG** confirme la neuropathie : réduction des vitesses de conduction et signes d'atteinte axonale."], "5": ["F", "Une polynévrite est par définition une atteinte du nerf [[périphérique]] ; une atteinte « exclusivement centrale » l'exclut. C'est la proposition fausse."]}, "fmt": "QCS", "o": [["of2/o_2026b-11_0.png", 3]]}, {"id": "2026b-12", "exam": "2026b", "label": "Mai 2026", "n": 12, "stem": "Associer chaque toxique à sa catégorie.", "case": null, "tables": [], "imgs": [], "c": "toxi", "s": ["p4-14", "p7-11"], "t": [], "g": "Classer les agents toxiques :\n• **minéraux** : métaux (plomb, mercure, cadmium, arsenic) ;\n• **organiques** : hydrocarbures et solvants (benzène, toluène) ;\n• **organo-métalliques** : métal lié à un radical organique (méthyl-mercure, plomb tétraéthyle) ;\n• **solvants oxygénés** : alcools, cétones (acétone), esters, éthers.", "warn": [], "type": "match", "left": [["1", "Plomb"], ["2", "Benzène"], ["3", "Méthyl-mercure"], ["4", "Acétone"]], "right": [["a", "Toxique minéral"], ["b", "Toxique organique"], ["c", "Toxique organo-métallique"], ["d", "Solvant organique oxygéné"]], "p": {"1": [null, "Le **plomb** est un métal : toxique **minéral** (1-a)."], "2": [null, "Le **benzène** est un hydrocarbure aromatique : toxique **organique** (2-b)."], "3": [null, "Le **méthyl-mercure** associe un métal et un radical méthyle : toxique **organo-métallique** (3-c)."], "4": [null, "L'**acétone** est une cétone, famille des **solvants oxygénés** (4-d)."]}, "fmt": "Association", "corr": {"1": ["a"], "2": ["b"], "3": ["c"], "4": ["d"]}, "o": [["of2/o_2026b-12_0.png", 2], ["of2/o_2026b-12_1.png", 17]]}, {"id": "2026b-13", "exam": "2026b", "label": "Mai 2026", "n": 13, "stem": "Associer chaque produit ou effet à la bonne catégorie principale.", "case": null, "tables": [], "imgs": [], "c": "toxi", "s": ["p4-14"], "t": [], "g": "Effets des agents chimiques au contact :\n• **corrosif** : destruction irréversible des tissus (acide fluorhydrique) ;\n• **irritant** : réaction locale en général réversible ;\n• **sensibilisant** : allergie après sensibilisation (chrome, nickel → eczéma de contact) ;\n• **CMR** : cancérogène, mutagène ou reprotoxique ; un produit peut cumuler plusieurs dangers.", "warn": ["Le latex est aussi un allergène (urticaire) : E se défend. Le regroupement « acide chromique ou sels de nickel » vise les sensibilisants, d'où A."], "type": "match", "left": [["1", "Acide fluorhydrique"], ["2", "Acide chromique ou sels de nickel"], ["3", "Gants en latex"], ["4", "Amiante, chrome, sels de nickel"]], "right": [["a", "Corrosif"], ["b", "Sensibilisant/allergisant"], ["c", "Irritant"], ["d", "CMR"]], "p": {"1": [null, "L'acide fluorhydrique provoque des brûlures profondes et une destruction tissulaire : **corrosif** (1-a)."], "2": [null, "L'acide chromique et les sels de nickel sont des allergènes de contact classiques : **sensibilisants** (2-b)."], "3": [null, "Les gants en latex sont retenus comme **irritants** dans la clé (dermite d'occlusion) ; retenir que le latex est aussi un allergène immédiat (3-c)."], "4": [null, "Amiante, chrome VI et nickel sont **cancérogènes** du groupe 1 du CIRC : CMR (4-d)."]}, "fmt": "Association", "corr": {"1": ["a"], "2": ["b"], "3": ["c"], "4": ["d"]}, "o": [["of2/o_2026b-13_0.png", 2]]}, {"id": "2026b-14", "exam": "2026b", "label": "Mai 2026", "n": 14, "stem": "Associer correctement.", "case": null, "tables": [], "imgs": [], "c": "toxi", "s": ["p4-23"], "t": [], "g": "Deux mécanismes de l'intoxication chronique :\n• **accumulation du toxique** : on élimine moins qu'on absorbe, la charge corporelle monte jusqu'au seuil clinique (exemple : **plomb**, stocké dans l'os) ;\n• **accumulation de l'effet** : le toxique s'élimine, mais les **lésions s'additionnent** à chaque exposition (exemple : **sulfure de carbone, CS₂**).", "warn": [], "type": "match", "left": [["1", "Accumulation du toxique"], ["2", "Accumulation de l’effet"]], "right": [["a", "La quantité éliminée est inférieure à la quantité absorbée à chaque exposition."], ["b", "Le toxique ne s’accumule pas forcément, mais les effets répétés s’additionnent."], ["c", "Exemple classique : plomb."], ["d", "Exemple classique : CS₂."]], "p": {"1": [null, "Dans l'accumulation du toxique, la quantité éliminée est inférieure à la quantité absorbée ; exemple type : le **plomb** (1 → a, c)."], "2": [null, "Dans l'accumulation de l'effet, le toxique ne s'accumule pas forcément mais les effets répétés s'additionnent ; exemple : le **CS₂** (2 → b, d)."]}, "fmt": "Association", "corr": {"1": ["a", "c"], "2": ["b", "d"]}, "o": [["of2/o_2026b-14_0.png", 9]]}, {"id": "2026b-15", "exam": "2026b", "label": "Mai 2026", "n": 15, "stem": "Associer chaque phase à sa description.", "case": null, "tables": [], "imgs": [], "c": "cancer", "s": ["p14-11"], "t": [], "g": "Les trois étapes de la cancérogenèse :\n• **initiation** : lésion **irréversible de l'ADN** d'une cellule normale (agent génotoxique) ;\n• **promotion** : **prolifération** des cellules initiées sous l'effet de facteurs répétés ;\n• **progression** : angiogenèse, **invasion** et pouvoir métastatique.\nAttention à l'ordre de la liste : 2 = progression, 3 = promotion.", "warn": [], "type": "match", "left": [["1", "Initiation"], ["2", "Progression"], ["3", "Promotion"]], "right": [["a", "Altération irréversible du génome d’une cellule normale"], ["b", "Prolifération progressive de cellules mutées sous l’effet de facteurs répétés"], ["c", "Angiogenèse, invasion et acquisition du pouvoir métastatique"]], "p": {"1": [null, "L'initiation est l'altération **irréversible du génome** d'une cellule normale (1-a)."], "2": [null, "La progression correspond à l'**angiogenèse**, l'invasion et l'acquisition du pouvoir métastatique (2-c)."], "3": [null, "La promotion est la **prolifération progressive** des cellules mutées sous l'effet de facteurs répétés (3-b)."]}, "fmt": "Association", "corr": {"1": ["a"], "2": ["c"], "3": ["b"]}, "o": [["of2/o_2026b-15_0.png", 2]]}, {"id": "2026b-16", "exam": "2026b", "label": "Mai 2026", "n": 16, "stem": "Parmi les éléments suivants, lesquels sont compatibles avec une surdité professionnelle liée au bruit ?", "case": "2026b-c1", "tables": [], "imgs": [], "c": "bruit", "s": ["p15-21", "p15-22"], "t": [], "g": "Caractères de la surdité professionnelle au bruit :\n• surdité de **perception pure**, par lésion **cochléaire** (CA = CO) ;\n• **bilatérale** et généralement **symétrique** ;\n• début par une **encoche à 4 000 Hz** ;\n• installation **progressive**, **irréversible**, qui ne s'aggrave plus après l'arrêt de l'exposition.", "warn": [], "type": "multi", "opts": [["1", "Surdité de perception pure par atteinte cochléaire."], ["2", "Atteinte bilatérale et généralement symétrique."], ["3", "Encoche ou scotome initial prédominant autour de 4000 Hz."], ["4", "Surdité de mixte avec Rinne négatif."], ["5", "Installation progressive et insidieuse."]], "p": {"1": ["T", "Le bruit détruit les cellules ciliées de la **cochlée** : surdité de perception pure."], "2": ["T", "L'atteinte est **bilatérale et symétrique** car les deux oreilles reçoivent le même bruit."], "3": ["T", "Le scotome initial siège autour de **4 000 Hz**, zone la plus fragile de la cochlée."], "4": ["F", "Une surdité [[mixte]] avec Rinne négatif traduit une composante de **transmission**, absente dans la surdité au bruit (perception pure)."], "5": ["T", "L'installation est **lente et insidieuse**, sur des années d'exposition."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_2026b-16_0.png", 3]]}, {"id": "2026b-17", "exam": "2026b", "label": "Mai 2026", "n": 17, "stem": "Quels facteurs aggravent la nocivité du bruit dans ce cas ?", "case": "2026b-c1", "tables": [], "imgs": [], "c": "bruit", "s": ["p15-13", "p15-14"], "t": [], "g": "Facteurs de nocivité du bruit :\n• la **dose** : niveau × durée × répétition (85 dB(A) = alerte, 90 dB(A) = danger) ;\n• les **fréquences aiguës** (> 1 000 Hz), plus lésionnelles que les graves ;\n• les **bruits impulsionnels** (chocs, martelage) ;\n• les **coexpositions** ototoxiques (solvants, vibrations, CO, médicaments).", "warn": [], "type": "multi", "opts": [["1", "Intensité moyenne supérieure au seuil de nocivité."], ["2", "Bruits aigus de fréquence supérieure à 1000 Hz."], ["3", "Bruits impulsionnels avec émergence importante."], ["4", "Répétition quotidienne de traumatismes sonores."], ["5", "Exposition à un bruit à 50 dB(A)."]], "p": {"1": ["T", "92 dB(A) sur 8 h dépasse la **cote de danger** (90 dB(A)) : la dose est lésionnelle."], "2": ["T", "Les **sons aigus** (> 1 000 Hz) sont plus traumatisants pour la cochlée que les graves."], "3": ["T", "Les **bruits impulsionnels** (132-137 dB(C) au martelage) aggravent fortement l'atteinte."], "4": ["T", "La **répétition quotidienne** des traumatismes sonores cumule la dose au fil des années."], "5": ["F", "Le seuil de nocivité est de **85 dB(A)** (alerte) ; [[50 dB(A)]] correspond à un bureau calme, non lésionnel."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_2026b-17_0.png", 3], ["of2/o_2026b-17_1.png", 2]]}, {"id": "2026b-18", "exam": "2026b", "label": "Mai 2026", "n": 18, "stem": "Quel est le déficit auditif de l’oreille droite ?", "case": "2026b-c1", "tables": [], "imgs": [], "c": "bruit", "s": ["p15-32"], "t": [42], "g": "Déficit auditif (DA) selon le TMP 42 :\n• formule : **DA = [2 × 500 + 4 × 1000 + 3 × 2000 + 1 × 4000] / 10** ;\n• le coefficient le plus fort (4) va sur **1 000 Hz**, fréquence de la parole ;\n• oreille droite : (2×20 + 4×35 + 3×45 + 70) / 10 = 385 / 10 = **38,5 dB**.", "warn": [], "type": "single", "opts": [["A", "28,5 dB"], ["B", "34,5 dB"], ["C", "38,5 dB"], ["D", "42,5 dB"], ["E", "70 dB"]], "key": ["C"], "p": {"A": ["F", "28,5 dB est trop bas : avec les coefficients 2-4-3-1 on obtient (40 + 140 + 135 + 70) / 10 = **38,5 dB**."], "B": ["F", "34,5 dB vient d'une erreur de coefficients ; le calcul correct donne **38,5 dB**."], "C": ["T", "Juste : 40 + 140 + 135 + 70 = 385, divisé par 10 = **38,5 dB**."], "D": ["F", "42,5 dB : le coefficient 4 doit aller sur **1 000 Hz** (35 dB), ce qui donne 38,5 dB."], "E": ["F", "70 dB est la perte à **4 000 Hz** seule ; le déficit moyen pondéré est de **38,5 dB**."]}, "fmt": "QCS", "o": [["of2/o_2026b-18_0.png", 4], ["of2/o_2026b-18_1.png", 7]]}, {"id": "2026b-19", "exam": "2026b", "label": "Mai 2026", "n": 19, "stem": "Quel est le déficit auditif de l’oreille gauche et quelle conclusion médico-légale peut-on tirer ?", "case": "2026b-c1", "tables": [], "imgs": [], "c": "bruit", "s": ["p15-32"], "t": [42], "g": "Interprétation médico-légale de l'audiogramme :\n• oreille gauche : (2×25 + 4×40 + 3×50 + 75) / 10 = 435 / 10 = **43,5 dB** ;\n• la réparation se juge sur la **meilleure oreille**, c'est-à-dire le **DA le plus bas** : OD = 38,5 dB ;\n• 38,5 dB ≥ **35 dB** : le critère médical du TMP 42 est rempli ;\n• calcul toujours sur **500, 1000, 2000 et 4000 Hz**.", "warn": [], "type": "multi", "opts": [["1", "DA gauche = 43,5 dB."], ["2", "La meilleure oreille est l’oreille droite avec 38,5 dB."], ["3", "Le seuil réglementaire de 35 dB sur la meilleure oreille est dépassé."], ["4", "Le déficit est insuffisant pour discuter une MP."], ["5", "Le calcul doit porter sur les fréquences 500, 1000, 2000 et 4000 Hz."]], "p": {"1": ["T", "Oreille gauche : 50 + 160 + 150 + 75 = 435, soit **43,5 dB**."], "2": ["T", "La meilleure oreille est celle qui a le **plus petit déficit** : la droite avec 38,5 dB."], "3": ["T", "Le seuil réglementaire est de **35 dB sur la meilleure oreille** ; 38,5 dB le dépasse."], "4": ["F", "Le déficit de la meilleure oreille (**38,5 dB**) [[dépasse]] le seuil de **35 dB** : la MP peut être discutée."], "5": ["T", "Le calcul réglementaire porte sur les fréquences **500, 1000, 2000 et 4000 Hz**."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_2026b-19_0.png", 7]]}, {"id": "2026b-20", "exam": "2026b", "label": "Mai 2026", "n": 20, "stem": "Quel stade de surdité professionnelle correspond le mieux à ce cas ?", "case": "2026b-c1", "tables": [], "imgs": [], "c": "bruit", "s": ["p15-22"], "t": [], "g": "Les 4 stades de la surdité professionnelle :\n• **1er** : encoche isolée à 4 000 Hz, **sans gêne** ;\n• **2e** : encoche approfondie, extension vers 2 000 Hz, gêne dans le bruit, 1 000 Hz préservé ;\n• **3e** : extension vers **1 000 Hz** et 8 000 Hz, **gêne sociale** nette, fait répéter ;\n• **4e** : surdité profonde, toutes fréquences, perte de la voix normale, handicap.", "warn": [], "type": "multi", "opts": [["1", "Premier stade : scotome isolé à 4000 Hz sans gêne sociale."], ["2", "Deuxième stade : scotome à 4000 Hz profond, extension vers 2000 Hz, le sujet fait répéter."], ["3", "Troisième stade : atteinte importante, extension vers 1000 et 8000 Hz, gêne sociale nette."], ["4", "Quatrième stade : surdité profonde avec toutes les fréquences atteintes et perte de la voix normale."], ["5", "Fatigue auditive totalement réversible."]], "p": {"1": ["F", "Au 1er stade, l'encoche à 4 000 Hz est **isolée et sans gêne** ; ici 1 000 Hz est déjà touché."], "2": ["F", "Au 2e stade, l'encoche s'étend vers 2 000 Hz mais [[1 000 Hz]] reste normal ; ici il est à 35-40 dB."], "3": ["T", "**1 000 Hz** est atteint (35-40 dB) et le patient a du mal à comprendre en atelier : 3e stade."], "4": ["F", "Le 4e stade est une surdité **profonde** avec perte de la voix normale ; ici la voix est encore perçue."], "5": ["F", "La fatigue auditive est [[réversible]] après repos ; ici le déficit est installé et irréversible."]}, "key": ["3"], "fmt": "QCM", "o": [["of2/o_2026b-20_0.png", 4]]}, {"id": "2026b-21", "exam": "2026b", "label": "Mai 2026", "n": 21, "stem": "Quels diagnostics doivent être discutés devant une surdité de perception chez ce patient ?", "case": "2026b-c1", "tables": [], "imgs": [], "c": "bruit", "s": ["p15-23"], "t": [], "g": "Diagnostics différentiels d'une surdité de perception :\n• **presbyacousie** (âge, pas d'encoche nette, peut s'associer) ;\n• **maladie de Ménière** (vertiges, fluctuations) ;\n• **schwannome vestibulaire** (atteinte asymétrique ou unilatérale → IRM) ;\n• surdités **toxiques** : aminosides, solvants, CO ; surdité brusque, traumatisme.", "warn": ["Aucune combinaison proposée ne correspond à 1, 2, 3, 5 : question probablement mal construite, à signaler."], "type": "multi", "opts": [["1", "Presbyacousie."], ["2", "Maladie de Ménière."], ["3", "Schwannome vestibulaire, surtout en cas d’atteinte unilatérale."], ["4", "Otite mixte avec cause principale d’une encoche bilatérale à 4000 Hz."], ["5", "Surdité toxique médicamenteuse ou chimique."]], "p": {"1": ["T", "La **presbyacousie** est le premier différentiel à 52 ans et peut s'ajouter à la surdité professionnelle."], "2": ["T", "La **maladie de Ménière** donne une surdité de perception fluctuante avec vertiges."], "3": ["T", "Le **schwannome vestibulaire** doit être éliminé surtout si l'atteinte est asymétrique ou unilatérale."], "4": ["F", "Une [[otite]] donne une surdité de **transmission** ; elle n'explique jamais une encoche bilatérale à 4 000 Hz."], "5": ["T", "Les surdités **toxiques** (aminosides, solvants, CO) sont à rechercher, d'autant que le patient a été exposé aux solvants."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_2026b-21_0.png", 4]]}, {"id": "2026b-22", "exam": "2026b", "label": "Mai 2026", "n": 22, "stem": "Quels éléments peuvent aggraver ou fragiliser l’oreille interne dans ce cas ?", "case": "2026b-c1", "tables": [], "imgs": [], "c": "bruit", "s": ["p15-13"], "t": [], "g": "Facteurs qui fragilisent l'oreille interne et potentialisent le bruit :\n• **solvants aromatiques** (toluène, styrène, xylène) ;\n• **vibrations** ;\n• **médicaments ototoxiques** (aminosides) ;\n• intensité du bruit > **85-90 dB(A)**, CO, certains métaux.", "warn": [], "type": "multi", "opts": [["1", "Exposition aux solvants aromatiques."], ["2", "Exposition aux vibrations."], ["3", "Antécédent de traitement par aminosides."], ["4", "Bruit chronique supérieur à 85–90 dB(A)."], ["5", "Travail administratif silencieux isolé."]], "p": {"1": ["T", "Les **solvants aromatiques** sont ototoxiques et aggravent les lésions dues au bruit."], "2": ["T", "Les **vibrations** main-bras potentialisent l'atteinte cochléaire."], "3": ["T", "Les **aminosides** sont ototoxiques : un antécédent de traitement fragilise l'oreille."], "4": ["T", "Un bruit chronique **> 85-90 dB(A)** est en lui-même lésionnel."], "5": ["F", "Un travail [[silencieux]] ne fragilise pas l'oreille ; il protège au contraire de la dose sonore."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_2026b-22_0.png", 3]]}, {"id": "2026b-23", "exam": "2026b", "label": "Mai 2026", "n": 23, "stem": "Quels effets extra-auditifs peuvent être liés à l’exposition chronique au bruit ?", "case": "2026b-c1", "tables": [], "imgs": [], "c": "bruit", "s": ["p15-24"], "t": [], "g": "Effets extra-auditifs du bruit :\n• **accidents** : masquage des alarmes, mauvaise communication, baisse d'attention ;\n• **stress**, irritabilité, troubles du **sommeil**, fatigue ;\n• **baisse des performances cognitives** ;\n• associations **cardiovasculaires**, dont l'HTA.", "warn": [], "type": "multi", "opts": [["1", "Masquage des signaux d’alerte et augmentation du risque d’accident."], ["2", "Perturbation de la communication verbale."], ["3", "Hypertension artérielle et stress."], ["4", "Troubles du sommeil et fatigue chronique."], ["5", "Performances cognitives par stimulation sonore."]], "p": {"1": ["T", "Le bruit **masque les signaux d'alerte** et augmente le risque d'accident du travail."], "2": ["T", "Il **perturbe la communication verbale** et oblige à crier ou à retirer les protecteurs."], "3": ["T", "Le bruit chronique est associé à l'**HTA** et au **stress**."], "4": ["T", "Il entraîne des **troubles du sommeil** et une fatigue chronique."], "5": ["F", "Le bruit [[diminue]] les performances cognitives ; la proposition le présente comme une stimulation, c'est faux."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_2026b-23_0.png", 5]]}, {"id": "2026b-24", "exam": "2026b", "label": "Mai 2026", "n": 24, "stem": "Quelles mesures relèvent prioritairement de la prévention collective ?", "case": "2026b-c1", "tables": [], "imgs": [], "c": "bruit", "s": ["p15-31"], "t": [], "g": "Prévention du bruit, toujours **collective d'abord** :\n1. **à la source** : machines moins bruyantes, maintenance, silencieux ;\n2. sur la **propagation** : encoffrement, écrans, cloisons, traitement acoustique, éloignement ;\n3. **organisation** : rotation, limitation de durée ;\n4. **PICB** en complément seulement.", "warn": [], "type": "multi", "opts": [["1", "Réduction du bruit à la source."], ["2", "Encoffrement des machines."], ["3", "Traitement acoustique des locaux."], ["4", "Éloignement ou cloisonnement des sources."], ["5", "Distribution de bouchons d’oreille comme seule mesure, sans action technique."]], "p": {"1": ["T", "**Réduire le bruit à la source** est la mesure prioritaire de la hiérarchie de prévention."], "2": ["T", "L'**encoffrement** des machines limite la propagation : c'est une mesure collective technique."], "3": ["T", "Le **traitement acoustique** des murs et plafonds réduit la réverbération dans l'atelier."], "4": ["T", "**Éloigner ou cloisonner** les sources bruyantes protège tous les travailleurs du local."], "5": ["F", "Des bouchons [[seuls]], sans action technique, relèvent de la protection **individuelle** : ils ne suffisent jamais."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_2026b-24_0.png", 6]]}, {"id": "2026b-25", "exam": "2026b", "label": "Mai 2026", "n": 25, "stem": "Quelles mesures sont adaptées à ce poste ?", "case": "2026b-c1", "tables": [], "imgs": [], "c": "bruit", "s": ["p15-31"], "t": [], "g": "Organisation et protection individuelle face au bruit :\n• **rotation** entre postes bruyants et calmes, **limitation** de la durée d'exposition ;\n• travaux bruyants **hors des heures de base** pour réduire le nombre d'exposés ;\n• **PICB** adaptés, confortables, avec **formation** ;\n• port **continu** : retirer les PICB même quelques minutes fait chuter fortement leur efficacité.", "warn": [], "type": "multi", "opts": [["1", "Rotation entre postes bruyants et non bruyants."], ["2", "Limitation de la durée d’exposition aux bruits dangereux."], ["3", "Travaux bruyants hors des heures de travail de base pour réduire le nombre d’exposés."], ["4", "PICB adaptés, confortables, avec formation à leur utilisation."], ["5", "Retrait libre des PICB dès qu’une communication verbale est nécessaire."]], "p": {"1": ["T", "La **rotation** répartit et réduit la dose de bruit reçue par chaque travailleur."], "2": ["T", "**Limiter la durée** d'exposition aux bruits dangereux diminue la dose (règle des 3 dB)."], "3": ["T", "Programmer les travaux bruyants **hors des heures de base** réduit le nombre de personnes exposées."], "4": ["T", "Des PICB **adaptés et confortables**, avec formation au port, augmentent leur port effectif."], "5": ["F", "Le [[retrait]] des PICB, même bref, annule une grande partie de leur atténuation ; il faut des protecteurs compatibles avec la communication."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_2026b-25_0.png", 6]]}, {"id": "2026b-26", "exam": "2026b", "label": "Mai 2026", "n": 26, "stem": "Quels éléments font partie de la surveillance médicale des travailleurs exposés au bruit ? (RF)", "case": "2026b-c1", "tables": [], "imgs": [], "c": "bruit", "s": ["p15-25"], "t": [], "g": "Surveillance médicale des exposés au bruit :\n• à l'embauche : **antécédents otologiques**, otoscopie, **audiométrie de référence** ;\n• visite spéciale **au moins semestrielle** au-delà de 85 dB(A) ;\n• audiométries répétées et comparées pour un **dépistage précoce** ;\n• le but est d'agir avant le stade de gêne.", "warn": [], "type": "pick", "opts": [["1", "Visite médicale avant affectation à un poste bruyant."], ["2", "Audiométrie uniquement après apparition d’une surdité sévère."], ["3", "Recherche d’antécédents otologiques."], ["4", "Audiométrie tonale de référence, idéalement avant exposition au bruit."], ["5", "Surveillance médicale spéciale au moins semestrielle en cas d’exposition > 85 dB(A)."]], "key": ["2"], "p": {"1": ["T", "Une visite **avant affectation** permet de juger l'aptitude et de faire l'audiogramme de référence."], "2": ["F", "L'audiométrie sert au [[dépistage précoce]] (dès l'embauche puis régulièrement), pas seulement au stade de surdité sévère."], "3": ["T", "Rechercher les **antécédents otologiques** (otites, traumatismes, ototoxiques) aide à interpréter les audiogrammes."], "4": ["T", "L'audiométrie **de référence** avant exposition sert de base de comparaison."], "5": ["T", "Au-delà de **85 dB(A)**, la surveillance médicale spéciale est au moins **semestrielle**."]}, "fmt": "QCS", "o": [["of2/o_2026b-26_0.png", 6]]}, {"id": "2026b-27", "exam": "2026b", "label": "Mai 2026", "n": 27, "stem": "Quelles conditions sont nécessaires pour reconnaître cette surdité comme maladie professionnelle selon le tableau n°42 ? (RF)", "case": "2026b-c1", "tables": [], "imgs": [], "c": "bruit", "s": ["p15-32"], "t": [42], "g": "Conditions de reconnaissance au TMP 42 :\n• **médicales** : déficit bilatéral de perception par lésion cochléaire, irréversible, **≥ 35 dB** sur la meilleure oreille ;\n• **confirmation** par une audiométrie faite **3 semaines à 1 an** après l'arrêt de l'exposition ;\n• **administratives** : DPC 1 an, durée d'exposition 1 an (30 jours pour les propulseurs) ;\n• **professionnelles** : travaux d'une liste **limitative**.", "warn": ["Les propositions 1 et 2 sont en partie illisibles."], "type": "pick", "opts": [["1", "Déficit audiométrique bilatéral (...) cochléaire."], ["2", "Déficit irréversible ne s’aggravant (...) de l’exposition."], ["3", "Déficit moyen d’au moins 35 dB sur la meilleure oreille selon la formule réglementaire."], ["4", "Confirmation par une nouvelle audiométrie entre 3 semaines et 1 an après cessation de l’exposition au bruit lésionnel."], ["5", "Liste des travaux limitative, permettant de reconnaître tout emploi exposé même non inscrit."]], "key": ["5"], "p": {"1": ["T", "Le déficit doit être **bilatéral**, de perception, par lésion **cochléaire**."], "2": ["T", "Il doit être **irréversible** et ne plus s'aggraver après l'arrêt de l'exposition."], "3": ["T", "Le déficit moyen doit atteindre **au moins 35 dB** sur la meilleure oreille, selon la formule réglementaire."], "4": ["T", "Une nouvelle audiométrie entre **3 semaines et 1 an** après l'arrêt confirme le caractère définitif."], "5": ["F", "Une liste [[limitative]] ne reconnaît **que les travaux inscrits** ; elle ne peut pas reconnaître un emploi non inscrit. C'est la proposition fausse."]}, "fmt": "QCS", "o": [["of2/o_2026b-27_0.png", 7]]}, {"id": "2026b-28", "exam": "2026b", "label": "Mai 2026", "n": 28, "stem": "Quelle conduite est la plus adaptée chez ce travailleur ? (RF)", "case": "2026b-c1", "tables": [], "imgs": [], "c": "bruit", "s": ["p15-31", "p15-33"], "t": [], "g": "Conduite devant une surdité professionnelle confirmée :\n• **soustraire** le travailleur au bruit lésionnel (mutation) ;\n• avis **ORL** et audiométrie de confirmation ;\n• renforcer la **prévention collective** pour les collègues ;\n• **tracer** les audiogrammes et engager la **déclaration**.", "warn": [], "type": "pick", "opts": [["1", "Mutation vers un poste non exposé au bruit lésionnel."], ["2", "Maintien au poste traçabilité des audiogrammes."], ["3", "Évaluation ORL spécialisée et confirmation audiométrique."], ["4", "Renforcement de la prévention collective dans l’atelier."], ["5", "Conservation et traçabilité des audiogrammes."]], "key": ["2"], "p": {"1": ["T", "La **mutation** vers un poste non bruyant stoppe l'aggravation, car la surdité cesse d'évoluer à l'arrêt de l'exposition."], "2": ["F", "Le [[maintien au poste]] bruyant aggrave la surdité ; il faut éloigner le travailleur du bruit lésionnel."], "3": ["T", "L'avis **ORL** élimine les autres causes et la nouvelle audiométrie confirme le déficit."], "4": ["T", "L'atelier n'est pas encoffré : il faut **renforcer la prévention collective** pour protéger les autres."], "5": ["T", "**Conserver** les audiogrammes assure la traçabilité et appuie la déclaration de MP."]}, "fmt": "QCS", "o": [["of2/o_2026b-28_0.png", 6], ["of2/o_2026b-28_1.png", 7]]}, {"id": "2026b-29", "exam": "2026b", "label": "Mai 2026", "n": 29, "stem": "Quelles situations peuvent empêcher la reconnaissance en maladie professionnelle ? (RF)", "case": "2026b-c1", "tables": [], "imgs": [], "c": "bruit", "s": ["p15-32", "p15-34"], "t": [42], "g": "La reconnaissance au TMP 42 échoue si une seule condition manque :\n• audiogramme **non confirmé** après cessation ;\n• DA **< 35 dB** sur la meilleure oreille ;\n• **DPC** (1 an) dépassé ou **durée d'exposition** < 1 an ;\n• travail **non inscrit** dans la liste limitative.", "warn": [], "type": "pick", "opts": [["1", "Audiogramme non confirmé après cessation de l’exposition."], ["2", "Déficit moyen sur la meilleure oreille inférieur à 35 dB."], ["3", "Délai de prise en charge dépassé."], ["4", "Durée d’exposition insuffisante."], ["5", "Présence d’un travail inscrit dans la liste limitative avec déficit confirmé supérieur à 35 dB."]], "key": ["5"], "p": {"1": ["T", "Sans audiogramme de **confirmation** 3 semaines à 1 an après l'arrêt, l'irréversibilité n'est pas prouvée."], "2": ["T", "Un DA **< 35 dB** sur la meilleure oreille ne remplit pas le critère médical."], "3": ["T", "Si la première constatation dépasse le **DPC d'1 an** après la fin de l'exposition, la présomption tombe."], "4": ["T", "Une **durée d'exposition** inférieure à 1 an ne remplit pas la condition administrative."], "5": ["F", "Un travail inscrit avec un déficit confirmé > 35 dB [[réunit toutes les conditions]] : il permet la reconnaissance, il ne l'empêche pas."]}, "fmt": "QCS", "cs": "Mécanicien de 52 ans, 27 ans d'ateliers bruyants (meulage, tronçonnage, compresseurs, outils vibrants) : **surdité de perception bilatérale** avec scotome à 4 000 Hz. Démarche : confirmer le DA après éviction, vérifier les conditions du **TMP 42** et renforcer la prévention du bruit.", "o": [["of2/o_2026b-29_0.png", 7]]}, {"id": "2026b-30", "exam": "2026b", "label": "Mai 2026", "n": 30, "stem": "Devant ce tableau, quels éléments devez-vous rechercher en priorité à l’interrogatoire professionnel ?", "case": "2026b-c2", "tables": [], "imgs": [], "c": "bio", "s": ["p16-13", "p16-14"], "t": [], "g": "Interrogatoire professionnel devant un syndrome infectieux chez un travailleur :\n• **eaux usées, égouts, rongeurs** → leptospirose ;\n• **animaux d'élevage**, placenta, lait cru → brucellose ;\n• **AES** (piqûre, coupure, projection) → hépatites virales, VIH ;\n• **patients tousseurs**, locaux mal ventilés → tuberculose.", "warn": [], "type": "multi", "opts": [["1", "Travail récent en égouts, collecteurs, eaux usées ou milieu humide souillé."], ["2", "Contact avec bovins, ovins, caprins, placenta, avortons ou lait cru."], ["3", "AES : piqûre, coupure ou projection de sang/produit biologique humain."], ["4", "Contact répété avec patients tousseurs ou locaux fermés mal ventilés."], ["5", "Repas personnel suspect, sans lien avec l’activité professionnelle."]], "p": {"1": ["T", "Le travail en **égouts ou eaux usées** expose à la leptospirose (urine de rongeurs)."], "2": ["T", "Le contact avec **bovins, ovins, placenta, lait cru** expose à la brucellose."], "3": ["T", "Un **AES** expose aux hépatites B et C et au VIH."], "4": ["T", "Le contact répété avec des **tousseurs** dans des locaux fermés expose à la tuberculose."], "5": ["F", "Un repas personnel n'a [[pas de lien professionnel]] : il ne relève pas de l'interrogatoire professionnel."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_2026b-30_0.png", 5], ["of2/o_2026b-30_1.png", 6]]}, {"id": "2026b-31", "exam": "2026b", "label": "Mai 2026", "n": 31, "stem": "Quels examens demandez-vous pour discuter les principales étiologies professionnelles possibles ?", "case": "2026b-c2", "tables": [], "imgs": [], "c": "bio", "s": ["p16-14"], "t": [], "g": "Un examen ciblé pour chaque hypothèse infectieuse professionnelle :\n• leptospirose → **MAT** (test de micro-agglutination) ± ELISA, PCR précoce ;\n• brucellose → **Wright** ± hémocultures ;\n• hépatites → **sérologies VHB, VHC** ± VIH ;\n• tuberculose → **radiographie/TDM** et recherche de **BK**.", "warn": [], "type": "multi", "opts": [["1", "Sérologie leptospirose : MAT ± ELISA."], ["2", "Séroagglutination de Wright ± hémocultures."], ["3", "Sérologies VHB, VHC ± VIH selon contexte."], ["4", "Radiographie/TDM thoracique et recherche de BK si suspicion."], ["5", "Dosage isolé des IgE totales en priorité."]], "p": {"1": ["T", "La **MAT** ± ELISA est la sérologie de référence de la leptospirose."], "2": ["T", "La **séroagglutination de Wright** et les hémocultures explorent la brucellose."], "3": ["T", "Les **sérologies VHB, VHC** (± VIH) explorent une contamination par le sang."], "4": ["T", "L'**imagerie thoracique** et la recherche de **BK** explorent la tuberculose."], "5": ["F", "Les [[IgE totales]] explorent l'atopie et n'orientent vers aucune infection professionnelle."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_2026b-31_0.png", 9]]}, {"id": "2026b-32", "exam": "2026b", "label": "Mai 2026", "n": 32, "stem": "Après interrogatoire, le patient précise qu’il a travaillé 10 jours auparavant dans un collecteur d’eaux usées partiellement inondé, avec contact avec boues et eaux stagnantes. Des rongeurs étaient signalés. Il portait des gants détériorés et avait de petites lésions cutanées aux mains. Quel diagnostic retenez-vous en priorité ?", "case": "2026b-c2", "tables": [], "imgs": [], "c": "bio", "s": ["p16-13"], "t": [], "g": "Leptospirose professionnelle :\n• contamination par l'**urine de rongeurs**, via l'eau ou la boue, à travers une **peau lésée** ou les muqueuses ;\n• incubation de **1 à 2 semaines** (ici 10 jours) ;\n• tableau : fièvre, myalgies, puis atteinte **hépato-rénale** (subictère, créatinine ↑) et thrombopénie ;\n• réparée par le **TMP 19**.", "warn": [], "type": "multi", "opts": [["1", "Leptospirose professionnelle."], ["2", "Brucellose professionnelle."], ["3", "Hépatite virale professionnelle par AES."], ["4", "Contamination cutanéo-muqueuse par milieu souillé."], ["5", "Tuberculose professionnelle."]], "p": {"1": ["T", "Eaux usées, rongeurs, plaies, 10 jours d'incubation et atteinte hépato-rénale : tableau typique de **leptospirose**."], "2": ["F", "La brucellose suppose un contact avec des **animaux d'élevage** ou leurs produits ; ici l'exposition est l'eau souillée."], "3": ["F", "Une hépatite professionnelle suppose un **AES** (piqûre, coupure par du sang) ; il n'y en a pas ici."], "4": ["T", "La porte d'entrée est **cutanéo-muqueuse** : petites plaies des mains au contact de l'eau et des boues souillées."], "5": ["F", "La tuberculose suppose un contact avec des **tousseurs bacillifères** ; aucun contage ici."]}, "key": ["1", "4"], "fmt": "QCM", "o": [["of2/o_2026b-32_0.png", 6]]}, {"id": "2026b-33", "exam": "2026b", "label": "Mai 2026", "n": 33, "stem": "Prévention Quelles mesures de prévention doivent être proposées dans l’entreprise ?", "case": "2026b-c2", "tables": [], "imgs": [], "c": "bio", "s": ["p16-21"], "t": [], "g": "Prévention de la leptospirose en milieu de travail :\n• **évaluer** le risque (réservoir, tâches, fréquence) ;\n• **dératisation** et entretien des lieux ;\n• **EPI étanches** : gants, bottes, combinaison, protection oculaire ;\n• **hygiène** : protéger les plaies, lavage, douche, tenue dédiée ; **formation**. Pas de transmission interhumaine.", "warn": [], "type": "multi", "opts": [["1", "Évaluer le risque : réservoir, tâches, modalités, durée et fréquence d’exposition."], ["2", "Porter des EPI adaptés : gants étanches, bottes, combinaison, lunettes/visière."], ["3", "Protéger les plaies, lavage des mains, douche, tenue dédiée, ne pas manger/fumer mains souillées."], ["4", "Isolement respiratoire systématique des collègues et dépistage TB de toute l’équipe."], ["5", "Lutte contre les rongeurs, entretien des lieux, formation des travailleurs."]], "p": {"1": ["T", "**Évaluer le risque** (réservoir, tâches, durée, fréquence) est la première étape de toute prévention."], "2": ["T", "Les **EPI étanches** empêchent le contact de la peau et des muqueuses avec l'eau souillée."], "3": ["T", "Protéger les **plaies** et respecter l'**hygiène** coupe la porte d'entrée cutanée."], "4": ["F", "La leptospirose ne se transmet [[pas d'homme à homme]] : l'isolement respiratoire et le dépistage TB de l'équipe sont inutiles."], "5": ["T", "La **lutte contre les rongeurs** supprime le réservoir ; la formation fait adopter les bons gestes."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_2026b-33_0.png", 4]]}, {"id": "2026b-34", "exam": "2026b", "label": "Mai 2026", "n": 34, "stem": "Réparation en Algérie Concernant la réparation en maladie professionnelle en Algérie, quelles propositions sont exactes ?", "case": "2026b-c2", "tables": [], "imgs": [], "c": "bio", "s": ["p16-33"], "t": [19], "g": "Réparation de la leptospirose en Algérie :\n• infection microbienne → **groupe 2** des TMP, liste de travaux **limitative** ;\n• **TMP 19** : leptospirose (égoutiers, eaux usées, abattoirs, pisciculture…) ;\n• le **TMP 24** concerne la brucellose ;\n• la contamination se fait par l'**eau souillée**, aucun AES n'est exigé.", "warn": [], "type": "multi", "opts": [["1", "La leptospirose relève du groupe des infections microbiennes."], ["2", "Elle est réparée au titre du tableau n°19."], ["3", "Le tableau n°24 est retenu en priorité."], ["4", "Les égoutiers et travailleurs des eaux usées sont des professions exposées."], ["5", "Sans AES, elle ne peut pas être reconnue comme maladie professionnelle."]], "p": {"1": ["T", "La leptospirose est une **infection microbienne** : elle appartient au groupe 2."], "2": ["T", "Elle est réparée au titre du **tableau n° 19**."], "3": ["F", "Le tableau [[24]] est celui de la **brucellose**, pas de la leptospirose."], "4": ["T", "Les **égoutiers** et travailleurs des eaux usées figurent dans la liste des travaux."], "5": ["F", "La contamination passe par l'**eau ou la boue souillée** ; l'[[AES]] n'est pas une condition du TMP 19."]}, "key": ["1", "2", "4"], "fmt": "QCM", "cs": "Homme de 41 ans, fièvre, myalgies, subictère, thrombopénie et atteinte rénale, travaillant dans un secteur à risque biologique : tableau de **leptospirose** (contact avec eaux souillées), réparable par le **TMP 19** (groupe 2, liste limitative).", "o": [["of2/o_2026b-34_0.png", 9]]}, {"id": "2026b-35", "exam": "2026b", "label": "Mai 2026", "n": 35, "stem": "Quels éléments du curriculum laboris sont les plus pertinents pour orienter l’origine professionnelle ?", "case": "2026b-c3", "tables": [], "imgs": [], "c": "cancer", "s": ["p14-31", "p14-23"], "t": [], "g": "Le curriculum laboris reconstitue :\n• la **chronologie** complète des postes, durées, tâches et procédés ;\n• les **agents** cancérogènes (fumées de soudage, chrome, nickel, silice, amiante, HAP) ;\n• les **conditions** : poussières, ventilation, captage, protections respiratoires ;\n• le tabac est noté, mais il **n'exclut jamais** une origine professionnelle.", "warn": [], "type": "multi", "opts": [["1", "Chronologie complète des postes, durées, tâches et procédés utilisés."], ["2", "Exposition à fumées de soudage, chromage, nickelage, silice, amiante ou HAP."], ["3", "Notion d’ateliers poussiéreux, ventilation, captage et protections respiratoires."], ["4", "Histologie tumorale avant de rechercher les expositions anciennes."], ["5", "Tabagisme faible, qui suffit à exclure une origine professionnelle."]], "p": {"1": ["T", "La **chronologie complète** des postes et des tâches est la base de tout curriculum laboris."], "2": ["T", "Rechercher les **agents cancérogènes pulmonaires** connus (chrome VI, nickel, silice, amiante, HAP)."], "3": ["T", "Les **conditions** (poussières, ventilation, captage, masque) donnent l'intensité réelle de l'exposition."], "4": ["F", "L'[[histologie]] relève du diagnostic, pas du curriculum laboris, et ne doit pas précéder la recherche d'expositions anciennes."], "5": ["F", "Un tabagisme, même faible, n'[[exclut]] jamais l'origine professionnelle ; tabac et agents professionnels peuvent s'additionner."]}, "key": ["1", "2", "3"], "fmt": "QCM", "o": [["of2/o_2026b-35_0.png", 3], ["of2/o_2026b-35_1.png", 6]]}, {"id": "2026b-36", "exam": "2026b", "label": "Mai 2026", "n": 36, "stem": "Quels diagnostics restent raisonnablement discutables à ce stade ?", "case": "2026b-c3", "tables": [], "imgs": [], "c": "cancer", "s": ["p12-15", "p14-21"], "t": [], "g": "Hypothèses devant toux, hémoptysie, amaigrissement et images pulmonaires chez un ancien ouvrier exposé :\n• **cancer broncho-pulmonaire** professionnel ;\n• **tuberculose** (d'autant plus si silicose) ;\n• **pneumoconiose** compliquée ;\n• cancer favorisé par le **tabac**. Toutes restent possibles avant le scanner et le BK.", "warn": [], "type": "multi", "opts": [["1", "Cancer broncho-pulmonaire professionnel."], ["2", "Tuberculose pulmonaire."], ["3", "Pneumoconiose compliquée ou pathologie liée aux poussières minérales."], ["4", "Cancer bronchique favorisé par le tabac."], ["5", "Leucémie benzénique révélée par une opacité pulmonaire isolée."]], "p": {"1": ["T", "Les expositions aux métaux, fumées et poussières rendent un **CBP professionnel** plausible."], "2": ["T", "La **tuberculose** est à éliminer (BK demandé), surtout sur un terrain de pneumoconiose."], "3": ["T", "Les images fibreuses et les ateliers poussiéreux évoquent une **pneumoconiose** compliquée."], "4": ["T", "Un tabagisme de 12 PA peut favoriser un **cancer bronchique**, éventuellement associé à une cause professionnelle."], "5": ["F", "Une [[leucémie]] ne se révèle pas par une opacité pulmonaire isolée ; le benzène donne des hémopathies, pas d'image thoracique."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_2026b-36_0.png", 8]]}, {"id": "2026b-37", "exam": "2026b", "label": "Mai 2026", "n": 37, "stem": "Parmi les associations suivantes, lesquelles sont correctes ?", "case": "2026b-c3", "tables": [], "imgs": [], "c": "cancer", "s": ["p14-21", "p14-22"], "t": [], "g": "Couples agent → cancer (localisations sentinelles) :\n• **chrome VI** → poumon, sinus ; **nickel** → ethmoïde/sinus et poumon ;\n• **amiante** → mésothéliome et poumon ;\n• **poussières de bois** → adénocarcinome de l'ethmoïde ;\n• **benzène** → leucémies (TMP 4), pas de cancer bronchique.", "warn": [], "type": "multi", "opts": [["1", "Chrome VI — cancer broncho-pulmonaire et cancers naso-sinusiens."], ["2", "Nickel — cancer de l’ethmoïde/sinus et cancer bronchique primitif."], ["3", "Amiante — mésothéliome pleural et cancer broncho-pulmonaire."], ["4", "Benzène — cancer bronchique primitif après inhalation de fumées métalliques."], ["5", "Poussières de bois — cancer primitif de l’ethmoïde et des sinus."]], "p": {"1": ["T", "Le **chrome VI** donne des CBP et des cancers naso-sinusiens (TMP 10 ter)."], "2": ["T", "Le **nickel** donne des cancers de l'ethmoïde et des sinus et des CBP (TMP 37)."], "3": ["T", "L'**amiante** donne le mésothéliome pleural et le CBP (TMP 30)."], "4": ["F", "Le [[benzène]] donne des **leucémies** (TMP 4), pas de cancer bronchique."], "5": ["T", "Les **poussières de bois** donnent l'adénocarcinome de l'ethmoïde (TMP 47)."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_2026b-37_0.png", 8]]}, {"id": "2026b-38", "exam": "2026b", "label": "Mai 2026", "n": 38, "stem": "Après interrogatoire, on retrouve : soudage d’acier inoxydable, chromage électrolytique intermittent, polissage de pièces nickelées, atelier voisin de taille de pierre, anciennes opérations de calorifugeage, absence de captage. Quelles interprétations sont justes ?", "case": "2026b-c3", "tables": [], "imgs": [], "c": "cancer", "s": ["p14-21", "p14-23"], "t": [], "g": "Chaque exposition du curriculum désigne un agent plausible :\n• soudage inox et chromage → **chrome VI** et **nickel** ;\n• atelier voisin de taille de pierre → **silice** ;\n• calorifugeage → **amiante** ;\n• le tabac modéré n'élimine rien, et l'absence de métastases ne prouve aucune origine.", "warn": [], "type": "multi", "opts": [["1", "Chrome VI et nickel sont plausibles en cas de soudage inox et traitement de surface."], ["2", "La silice peut expliquer des images fibreuses et une confusion avec pneumoconiose/tuberculose."], ["3", "L’amiante reste à discuter devant anciennes opérations de calorifugeage."], ["4", "Le tabac modéré élimine la responsabilité professionnelle."], ["5", "L’absence de métastases suffit à prouver l’origine professionnelle."]], "p": {"1": ["T", "Le soudage d'acier **inoxydable** et le traitement de surface libèrent chrome VI et nickel."], "2": ["T", "La **silice** explique des images fibreuses et peut faire confondre avec une pneumoconiose ou une tuberculose."], "3": ["T", "Le **calorifugeage** ancien est une source classique d'exposition à l'amiante."], "4": ["F", "Un tabac modéré n'[[élimine]] pas la responsabilité professionnelle ; les causes peuvent s'additionner."], "5": ["F", "L'absence de métastases ne [[prouve]] aucune origine ; elle renseigne seulement sur le stade."]}, "key": ["1", "2", "3"], "fmt": "QCM", "o": [["of2/o_2026b-38_0.png", 5]]}, {"id": "2026b-39", "exam": "2026b", "label": "Mai 2026", "n": 39, "stem": "Quels éléments sont nécessaires ou fortement contributifs pour argumenter une origine professionnelle ?", "case": "2026b-c3", "tables": [], "imgs": [], "c": "cancer", "s": ["p14-31"], "t": [], "g": "Argumenter l'origine professionnelle d'un cancer :\n• un **cancer primitif** prouvé histologiquement ;\n• une **exposition reconstituée** : durée, intensité, fréquence, **latence** ;\n• une **concordance agent – organe cible – tableau** ;\n• les marqueurs tumoraux et le tabac ne tranchent jamais.", "warn": [], "type": "multi", "opts": [["1", "Confirmation histologique d’un cancer primitif."], ["2", "Reconstitution des expositions avec durée, intensité, fréquence et latence."], ["3", "Concordance entre agent suspecté, organe cible et tableau de MP."], ["4", "Marqueurs tumoraux positifs, suffisants pour prouver l’imputabilité."], ["5", "Exclusion systématique du diagnostic si le patient a fumé."]], "p": {"1": ["T", "La **confirmation histologique** d'un cancer primitif est indispensable."], "2": ["T", "La reconstitution des expositions, avec la **latence**, montre que l'exposition est compatible."], "3": ["T", "La **concordance** entre l'agent, l'organe atteint et un tableau permet la reconnaissance."], "4": ["F", "Les [[marqueurs tumoraux]] n'ont aucune valeur d'imputabilité."], "5": ["F", "Le tabac n'est jamais un motif d'[[exclusion]] systématique de l'origine professionnelle."]}, "key": ["1", "2", "3"], "fmt": "QCM", "o": [["of2/o_2026b-39_0.png", 8], ["of2/o_2026b-39_1.png", 7]]}, {"id": "2026b-40", "exam": "2026b", "label": "Mai 2026", "n": 40, "stem": "Quelles mesures relèvent d’une prévention correcte des cancers professionnels chimiques ?", "case": "2026b-c3", "tables": [], "imgs": [], "c": "cancer", "s": ["p14-33"], "t": [], "g": "Prévention des cancers professionnels chimiques, dans l'ord
