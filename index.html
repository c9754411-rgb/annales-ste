re :\n1. **substituer** le cancérogène ;\n2. **vase clos** et **captage à la source** si on ne peut pas substituer ;\n3. **limiter** le nombre d'exposés et **baliser** les zones ;\n4. hygiène, formation, **traçabilité** ; surveillance **pendant et après** l'exposition ; EPI en complément.", "warn": [], "type": "multi", "opts": [["1", "Substitution du cancérogène si possible."], ["2", "Captage à la source et travail en vase clos si substitution impossible."], ["3", "Limitation du nombre de travailleurs exposés et balisage des zones."], ["4", "Surveillance médicale pendant et après exposition."], ["5", "Port d’un masque simple uniquement lors des symptômes respiratoires."]], "p": {"1": ["T", "La **substitution** supprime le danger : c'est la priorité absolue."], "2": ["T", "Le **vase clos** et le **captage à la source** limitent l'émission quand on ne peut pas substituer."], "3": ["T", "**Limiter le nombre d'exposés** et baliser les zones réduit la population à risque."], "4": ["T", "La surveillance se poursuit **après l'exposition** (post-professionnelle) car les cancers sont tardifs."], "5": ["F", "Un masque simple porté « [[si symptômes]] » arrive trop tard et ne filtre pas les cancérogènes."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_2026b-40_0.png", 7]]}, {"id": "2026b-41", "exam": "2026b", "label": "Mai 2026", "n": 41, "stem": "Si le cancer broncho-pulmonaire primitif est confirmé, quelles correspondances TMP/exposition sont correctes ?", "case": "2026b-c3", "tables": [], "imgs": [], "c": "cancer", "s": ["p14-32"], "t": [30, 37, 44], "g": "CBP primitif indemnisable en Algérie :\n• **TMP 10 ter** (chrome), **TMP 30** (amiante), **TMP 37** (nickel), **TMP 44** (oxydes de fer) ;\n• aussi **TMP 6** (RI) et **TMP 20** (arsenic) ;\n• le **TMP 4** (benzène) répare des **hémopathies**, pas de CBP.", "warn": [], "type": "multi", "opts": [["1", "TMP n°10 ter."], ["2", "TMP n°30."], ["3", "TMP n°37."], ["4", "TMP n°44."], ["5", "TMP n°4 pour cancer broncho-pulmonaire."]], "p": {"1": ["T", "Le **TMP 10 ter** répare les cancers broncho-pulmonaires par les chromates."], "2": ["T", "Le **TMP 30** répare le CBP primitif dû à l'amiante (DPC 30 ans)."], "3": ["T", "Le **TMP 37** répare les cancers du nickel : poumon et ethmoïde."], "4": ["T", "Le **TMP 44** (oxydes de fer, sidérose) comporte le CBP."], "5": ["F", "Le [[TMP 4]] (benzène) répare leucémies et aplasies, pas de cancer broncho-pulmonaire."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "cs": "Ancien ouvrier de 58 ans, 30 ans d'ateliers poussiéreux (fumées, métaux), tabagisme modéré : toux, hémoptysies, amaigrissement. Il faut éliminer la tuberculose, puis rattacher un **CBP** à une exposition professionnelle et au tableau adapté (chrome, amiante, nickel…).", "o": [["of2/o_2026b-41_0.png", 8], ["of2/o_2026b-41_1.png", 5]]}, {"id": "2026b-42", "exam": "2026b", "label": "Mai 2026", "n": 42, "stem": "Quels éléments du curriculum laboris sont les plus pertinents pour orienter une origine professionnelle ?", "case": "2026b-c4", "tables": [], "imgs": [], "c": "cancer", "s": ["p14-21", "p14-22"], "t": [15], "g": "Cancer de la vessie d'origine professionnelle :\n• agents : **amines aromatiques** (benzidine, 2-naphtylamine, dérivés de l'aniline) ;\n• secteurs : **teinture, textile, caoutchouc, cuir, peinture, pigments** ;\n• **voie cutanée** importante (mains nues, vêtements souillés) ;\n• documenter durée, fréquence, ancienneté et conditions réelles.", "warn": [], "type": "multi", "opts": [["1", "Exposition à amines aromatiques, colorants, benzidine ou dérivés de l’aniline."], ["2", "Activité dans teinture, textile, caoutchouc, cuir, peinture ou pigments."], ["3", "Durée, fréquence, ancienneté et conditions réelles d’exposition."], ["4", "Exposition isolée à la silice comme cause classique du cancer vésical."], ["5", "Manipulation à mains nues, vêtements souillés ou défaut d’hygiène."]], "p": {"1": ["T", "Les **amines aromatiques** (benzidine, colorants, aniline) sont les cancérogènes vésicaux de référence."], "2": ["T", "Teinture, textile, **caoutchouc**, cuir et pigments sont les secteurs exposants classiques."], "3": ["T", "**Durée, fréquence, ancienneté** et conditions d'exposition permettent d'apprécier la dose."], "4": ["F", "La [[silice]] est un cancérogène **pulmonaire**, pas vésical."], "5": ["T", "La manipulation à **mains nues** et les vêtements souillés traduisent une exposition cutanée importante."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_2026b-42_0.png", 6]]}, {"id": "2026b-43", "exam": "2026b", "label": "Mai 2026", "n": 43, "stem": "Devant ce tableau, quels diagnostics doivent être discutés avant conclusion ?", "case": "2026b-c4", "tables": [], "imgs": [], "c": "cancer", "s": ["p14-31"], "t": [], "g": "Devant une hématurie de l'adulte, éliminer avant de conclure :\n• une **tumeur vésicale** primitive (paroi épaissie) ;\n• une **infection** urinaire chronique ;\n• une **lithiase** ;\n• une **pathologie prostatique**.", "warn": [], "type": "multi", "opts": [["1", "Tumeur vésicale primitive."], ["2", "Infection urinaire chronique ou cystite récidivante."], ["3", "Lithiase urinaire."], ["4", "Pathologie prostatique associée."], ["5", "Mésothéliome péritonéal d’emblée prioritaire."]], "p": {"1": ["T", "L'épaississement irrégulier de la paroi fait suspecter une **tumeur vésicale** primitive."], "2": ["T", "La leucocyturie oriente aussi vers une **infection urinaire chronique** ou une cystite récidivante."], "3": ["T", "La **lithiase** urinaire est une cause classique d'hématurie."], "4": ["T", "La prostate augmentée de volume impose d'éliminer une **pathologie prostatique**."], "5": ["F", "Le [[mésothéliome péritonéal]] n'est pas une cause d'hématurie ; il n'a pas sa place ici."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_2026b-43_0.png", 6]]}, {"id": "2026b-44", "exam": "2026b", "label": "Mai 2026", "n": 44, "stem": "Parmi les associations suivantes, lesquelles sont correctes ?", "case": "2026b-c4", "tables": [], "imgs": [], "c": "cancer", "s": ["p14-21"], "t": [], "g": "Couples agent → organe à retenir :\n• **amines aromatiques → vessie** (TMP 15) ;\n• **bois → ethmoïde** (TMP 47) ;\n• **benzène → leucémies** (TMP 4) ;\n• **chrome VI → poumon** ; **amiante → plèvre et poumon** : aucun des deux n'est cancérogène vésical.", "warn": [], "type": "multi", "opts": [["1", "Amines aromatiques — cancer de la vessie."], ["2", "Poussières de bois — cancer primitif de l’ethmoïde et des sinus."], ["3", "Chrome VI — cancer typique et exclusif de la vessie."], ["4", "Benzène — leucémies plutôt que cancer vésical."], ["5", "Amiante — cancer vésical typique en première intention."]], "p": {"1": ["T", "Les **amines aromatiques** sont les cancérogènes de la **vessie**."], "2": ["T", "Les **poussières de bois** donnent le cancer primitif de l'ethmoïde et des sinus."], "3": ["F", "Le [[chrome VI]] donne des cancers broncho-pulmonaires ; il n'est pas cancérogène vésical."], "4": ["T", "Le **benzène** donne des **leucémies** plutôt qu'un cancer vésical."], "5": ["F", "L'[[amiante]] donne mésothéliome et CBP, pas de cancer de la vessie."]}, "key": ["1", "2", "4"], "fmt": "QCM", "o": [["of2/o_2026b-44_0.png", 8]]}, {"id": "2026b-45", "exam": "2026b", "label": "Mai 2026", "n": 45, "stem": "Quel élément permet de confirmer le diagnostic de tumeur vésicale ?", "case": "2026b-c4", "tables": [], "imgs": [], "c": "cancer", "s": ["p14-31"], "t": [], "g": "Diagnostic d'une tumeur vésicale :\n• seule l'**histologie** confirme : **cystoscopie + biopsie** et examen anatomopathologique ;\n• ECBU, toucher rectal et syndrome inflammatoire orientent mais ne prouvent rien ;\n• le tabac est un **facteur de risque**, pas une preuve.", "warn": [], "type": "multi", "opts": [["1", "ECBU stérile."], ["2", "Toucher rectal montrant une prostate régulière."], ["3", "Cystoscopie avec biopsie et examen anatomopathologique."], ["4", "Syndrome inflammatoire modéré."], ["5", "Antécédent de tabagisme."]], "p": {"1": ["F", "Un ECBU stérile élimine une infection mais ne prouve pas une tumeur ; seule la **biopsie** le fait."], "2": ["F", "Le toucher rectal explore la **prostate** ; la tumeur vésicale se prouve par cystoscopie et biopsie."], "3": ["T", "La **cystoscopie avec biopsie** et l'anatomopathologie confirment la tumeur."], "4": ["F", "Un syndrome inflammatoire n'est pas spécifique ; la preuve est **histologique**."], "5": ["F", "Le tabac est un [[facteur de risque]] de cancer vésical, pas une preuve diagnostique."]}, "key": ["3"], "fmt": "QCM", "o": [["of2/o_2026b-45_0.png", 1]]}, {"id": "2026b-46", "exam": "2026b", "label": "Mai 2026", "n": 46, "stem": "Après interrogatoire détaillé, on retrouve une exposition prolongée à des colorants azoïques, benzidine et dérivés de l’aniline, sans aspiration efficace, avec manipulation à mains nues et vêtements souillés. Quels arguments renforcent l’origine professionnelle ?", "case": "2026b-c4", "tables": [], "imgs": [], "c": "cancer", "s": ["p14-31"], "t": [], "g": "Arguments en faveur d'un cancer vésical professionnel :\n• exposition **prolongée** à des amines aromatiques (benzidine, colorants azoïques) ;\n• **latence** compatible (souvent > 10-20 ans) ;\n• exposition **cutanée** ou manuportée ;\n• ni le tabac ni une leucocyturie n'excluent l'origine professionnelle.", "warn": [], "type": "multi", "opts": [["1", "Exposition prolongée à des amines aromatiques."], ["2", "Latence compatible avec un cancer professionnel."], ["3", "Tabagisme excluant l’origine professionnelle."], ["4", "Voie cutanée ou manuportée possible."], ["5", "Leucocyturie prouvant l’origine infectieuse exclusive."]], "p": {"1": ["T", "Une exposition **prolongée** aux amines aromatiques est l'argument principal."], "2": ["T", "Une **latence** longue, compatible avec un cancer professionnel, renforce l'imputabilité."], "3": ["F", "Le tabac n'[[exclut]] pas l'origine professionnelle ; les deux facteurs peuvent coexister."], "4": ["T", "La **voie cutanée** (mains nues, vêtements souillés) explique une dose interne élevée."], "5": ["F", "Une leucocyturie ne [[prouve]] pas une cause infectieuse exclusive ; elle peut accompagner une tumeur."]}, "key": ["1", "2", "4"], "fmt": "QCM", "o": [["of2/o_2026b-46_0.png", 2], ["of2/o_2026b-46_1.png", 6]]}, {"id": "2026b-47", "exam": "2026b", "label": "Mai 2026", "n": 47, "stem": "Quelles mesures relèvent d’une prévention adaptée aux cancérogènes chimiques responsables de cancers vésicaux ?", "case": "2026b-c4", "tables": [], "imgs": [], "c": "cancer", "s": ["p14-33"], "t": [], "g": "Prévention des cancers vésicaux chimiques :\n• **substitution** des amines aromatiques ;\n• **système clos** ou captage à la source ;\n• **gants adaptés**, hygiène stricte, vestiaires séparés (les amines **passent la peau**) ;\n• **surveillance** médicale et **traçabilité** des expositions.", "warn": [], "type": "multi", "opts": [["1", "Substitution des produits cancérogènes si possible."], ["2", "Travail en système clos ou captage à la source."], ["3", "Gants adaptés, hygiène stricte et vestiaires séparés."], ["4", "Surveillance médicale et traçabilité des expositions."], ["5", "Manipulation à mains nues autorisée si exposition courte."]], "p": {"1": ["T", "**Substituer** les produits cancérogènes supprime le danger."], "2": ["T", "Le **système clos** ou le captage à la source limite l'émission."], "3": ["T", "**Gants adaptés**, hygiène et vestiaires séparés empêchent la contamination cutanée et le transfert."], "4": ["T", "La **surveillance médicale** et la **traçabilité** permettent le suivi et la reconnaissance ultérieure."], "5": ["F", "Les amines aromatiques traversent la peau : aucune manipulation à [[mains nues]] n'est acceptable, même brève."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_2026b-47_0.png", 7]]}, {"id": "2026b-48", "exam": "2026b", "label": "Mai 2026", "n": 48, "stem": "Si une tumeur vésicale primitive est confirmée avec exposition professionnelle compatible, quelles propositions sont exactes ?", "case": "2026b-c4", "tables": [], "imgs": [], "c": "cancer", "s": ["p14-32"], "t": [15], "g": "Réparation d'une tumeur vésicale professionnelle :\n• amines aromatiques → **TMP 15** (DPC 30 ans) ;\n• le **TMP 30** concerne l'amiante, le **TMP 10 ter** les chromates ;\n• conditions : maladie désignée, **DPC respecté**, **travaux** conformes au tableau.", "warn": [], "type": "multi", "opts": [["1", "Les amines aromatiques relèvent du TMP n°15."], ["2", "Le TMP n°30 est celui des cancers vésicaux dus aux colorants."], ["3", "Le délai de prise en charge doit être respecté."], ["4", "Le poste exposant doit correspondre aux travaux prévus par le tableau."], ["5", "Le TMP n°10 ter est le tableau principal des tumeurs vésicales par benzidine."]], "p": {"1": ["T", "Les amines aromatiques et leurs dérivés sont réparés par le **TMP 15**."], "2": ["F", "Le [[TMP 30]] est le tableau de l'**amiante**, pas des colorants."], "3": ["T", "Le **délai de prise en charge** doit être respecté entre fin d'exposition et constatation."], "4": ["T", "Le poste doit correspondre aux **travaux** listés dans le tableau."], "5": ["F", "Le [[TMP 10 ter]] concerne les cancers par **chromates** (poumon), pas la vessie."]}, "key": ["1", "3", "4"], "fmt": "QCM", "cs": "Homme de 62 ans, hématurie et épaississement vésical, 25 ans en teinture, impression textile et caoutchouc : **cancer de vessie** lié aux **amines aromatiques**, réparable par le **TMP 15** (DPC 30 ans) après enquête d'exposition.", "o": [["of2/o_2026b-48_0.png", 7], ["of2/o_2026b-48_1.png", 6]]}, {"id": "2026b-49", "exam": "2026b", "label": "Mai 2026", "n": 49, "stem": "Parmi les agents suivants, lesquels sont classés CIRC groupe 1 ?", "case": "2026b-c5", "tables": [], "imgs": [], "c": "cancer", "s": ["p14-13"], "t": [], "g": "Classification du CIRC :\n• **groupe 1** = cancérogène avéré : chrome VI, nickel, formaldéhyde, **trichloroéthylène** (rein), benzène, amiante, silice ;\n• **2A** = probable ; **2B** = possible (acétaldéhyde) ; **3** = inclassable ;\n• le CIRC classe le **danger** (force des preuves), pas la puissance ni le risque individuel.", "warn": ["Le polycopié 2026-2027 précise « trichloréthylène = groupe 1, et non 2A » ; un ancien support le classait 2A (réponse B)."], "type": "multi", "opts": [["1", "Composés du chrome hexavalent"], ["2", "Composés du nickel"], ["3", "Acétaldéhyde"], ["4", "Trichloréthylène"], ["5", "Formaldéhyde"]], "p": {"1": ["T", "Les composés du **chrome hexavalent** sont classés groupe 1."], "2": ["T", "Les composés du **nickel** sont classés groupe 1."], "3": ["F", "L'[[acétaldéhyde]] est classé **2B** (peut-être cancérogène), pas groupe 1."], "4": ["T", "Le **trichloroéthylène** est groupe 1 (cancer du rein) depuis 2014 : piège classique."], "5": ["T", "Le **formaldéhyde** est groupe 1 (nasopharynx, leucémies)."]}, "key": ["1", "2", "4", "5"], "fmt": "QCM", "o": [["of2/o_2026b-49_0.png", 3]]}, {"id": "2026b-50", "exam": "2026b", "label": "Mai 2026", "n": 50, "stem": "Parmi ces substances classées CIRC groupe 1, lesquelles sont susceptibles de provoquer des cancers broncho-pulmonaires ?", "case": "2026b-c5", "tables": [], "imgs": [], "c": "cancer", "s": ["p14-21"], "t": [], "g": "Agents du groupe 1 et cancer broncho-pulmonaire :\n• **chrome VI**, **nickel**, **silice cristalline** → CBP ;\n• **formaldéhyde** → nasopharynx ;\n• **benzène** → leucémies.\nLes choix D et E sont illisibles.", "warn": ["Les propositions D et E sont illisibles ; la bonne combinaison est 1 + 2 + 5."], "type": "multi", "opts": [["1", "Chrome VI"], ["2", "Nickel"], ["3", "Formaldéhyde"], ["4", "Benzène"], ["5", "Silice cristalline"]], "p": {"1": ["T", "Le **chrome VI** est un cancérogène pulmonaire reconnu."], "2": ["T", "Le **nickel** donne des cancers broncho-pulmonaires (et de l'ethmoïde)."], "3": ["F", "Le [[formaldéhyde]] donne surtout le cancer du **nasopharynx**."], "4": ["F", "Le [[benzène]] donne des **leucémies**, pas de CBP."], "5": ["T", "La **silice cristalline** est classée groupe 1 pour le cancer du poumon."]}, "key": ["1", "2", "5"], "fmt": "QCM", "o": [["of2/o_2026b-50_0.png", 3], ["of2/o_2026b-50_1.png", 4]]}, {"id": "2026b-51", "exam": "2026b", "label": "Mai 2026", "n": 51, "stem": "Quelles hypothèses doivent être envisagées devant ce tableau ?", "case": "2026b-c6", "tables": [], "imgs": [], "c": "pneumo", "s": ["p11-11", "p11-31"], "t": [], "g": "Hypothèses à envisager, chacune liée à un élément du dossier :\n• métaux (chromage, nickel) → **CBP professionnel** ;\n• taille de pierre voisine → **silicose** et **tuberculose** ;\n• adénopathies hilaires bilatérales → **sarcoïdose** ;\n• élevage de pigeons → **pneumopathie d'hypersensibilité**.", "warn": [], "type": "multi", "opts": [["1", "Cancer broncho-pulmonaire d’origine professionnelle"], ["2", "Silicose chronique compliquée"], ["3", "Tuberculose pulmonaire"], ["4", "Embolie pulmonaire chronique"], ["5", "Sarcoïdose"], ["6", "Pneumopathie d’hypersensibilité liée aux pigeons"]], "p": {"1": ["T", "33 ans de chromage, nickelage et soudage inox : le **CBP professionnel** est en tête."], "2": ["T", "L'exposition à la poussière de la taille de pierre fait discuter une **silicose**."], "3": ["T", "Hémoptysie et amaigrissement imposent d'éliminer une **tuberculose**."], "4": ["F", "Rien n'oriente vers une [[embolie pulmonaire]] chronique (pas de facteur thrombotique, pas de signe évocateur)."], "5": ["T", "Des opacités hilaires bilatérales doivent faire évoquer une **sarcoïdose**."], "6": ["T", "L'élevage de **pigeons** expose aux antigènes aviaires : PHS (poumon des éleveurs d'oiseaux)."]}, "key": ["1", "2", "3", "5", "6"], "fmt": "QCM", "o": [["of2/o_2026b-51_0.png", 11]]}, {"id": "2026b-52", "exam": "2026b", "label": "Mai 2026", "n": 52, "stem": "Parmi ces éléments, lequel renforce le plus l’hypothèse d’un cancer professionnel ?", "case": "2026b-c7", "tables": [], "imgs": [], "c": "cancer", "s": ["p14-11"], "t": [], "g": "Le cancer professionnel n'a **pas de signature** :\n• ni histologique, ni topographique, ni clinique ;\n• c'est le **métier** et l'**exposition reconstituée** qui argumentent l'origine ;\n• ici : alliages, chromage électrolytique, soudage inox.", "warn": [], "type": "multi", "opts": [["1", "Type histologique"], ["2", "Localisation lobaire"], ["3", "Métier dans les alliages métalliques, le chromage et le soudage inox"], ["4", "Absence de métastases"], ["5", "Vie en milieu urbain"]], "p": {"1": ["F", "Aucun type histologique n'est [[spécifique]] d'une origine professionnelle."], "2": ["F", "Aucune localisation lobaire n'est propre aux CBP professionnels ; c'est le **métier** qui argumente."], "3": ["T", "Le travail dans les **alliages, le chromage et le soudage inox** désigne directement les cancérogènes en cause."], "4": ["F", "L'absence de métastases renseigne le **stade**, pas la cause."], "5": ["F", "Vivre en ville n'oriente pas vers le travail ; l'argument est le **poste**."]}, "key": ["3"], "fmt": "QCM", "o": [["of2/o_2026b-52_0.png", 5]]}, {"id": "2026b-53", "exam": "2026b", "label": "Mai 2026", "n": 53, "stem": "En tenant compte de l’exposition professionnelle, du type histologique et de la localisation tumorale, quel est le diagnostic professionnel le plus probable ?", "case": "2026b-c7", "tables": [], "imgs": [], "c": "cancer", "s": ["p14-22"], "t": [], "g": "Diagnostic professionnel le plus probable :\n• **chromage électrolytique** pendant 33 ans → exposition majeure au **chrome VI** ;\n• carcinome épidermoïde, primitif (bilan d'extension négatif) ;\n• tableau : **TMP 10 ter** ;\n• nickel et silice restent des expositions secondaires.", "warn": ["Le nickel (A) est aussi plausible (pièces nickelées, TMP 37) ; la question 54 confirme que le chromage oriente vers le chrome."], "type": "multi", "opts": [["1", "Cancer broncho-pulmonaire lié au nickel"], ["2", "Cancer broncho-pulmonaire lié à la silice"], ["3", "Cancer broncho-pulmonaire lié au chrome VI"], ["4", "Métastases pulmonaires secondaires à un autre cancer primitif"], ["5", "Cancer broncho-pulmonaire exclusivement tabagique"]], "p": {"1": ["F", "Le nickel est plausible, mais l'exposition dominante du poste est le **chromage**."], "2": ["F", "La silice vient de l'entreprise **voisine** : exposition secondaire, moins probable."], "3": ["T", "Le **chromage électrolytique** prolongé expose au chrome VI : c'est le diagnostic le plus probable."], "4": ["F", "Le bilan d'extension [[exclut]] les métastases : la tumeur est primitive."], "5": ["F", "Un tabac de 10 PA ne permet pas de parler de cancer « exclusivement » tabagique face à 33 ans d'exposition."]}, "key": ["3"], "fmt": "QCM", "o": [["of2/o_2026b-53_0.png", 5], ["of2/o_2026b-53_1.png", 1]]}, {"id": "2026b-54", "exam": "2026b", "label": "Mai 2026", "n": 54, "stem": "Quel critère rend plus probable l’implication du chrome VI plutôt que du nickel ?", "case": "2026b-c7", "tables": [], "imgs": [], "c": "cancer", "s": ["p14-22"], "t": [], "g": "Départager chrome VI et nickel :\n• c'est le **poste** qui désigne l'agent : le **chromage électrolytique** expose au chrome VI ;\n• l'histologie (ici épidermoïde) et la localisation ne sont spécifiques d'aucun agent ;\n• une exposition combinée ne fait pas pencher d'un côté.", "warn": [], "type": "multi", "opts": [["1", "Localisation au lobe supérieur"], ["2", "Type histologique : adénocarcinome"], ["3", "Poste de chromage électrolytique prolongé"], ["4", "Absence de métastases cérébrales"], ["5", "Exposition combinée au chrome et au nickel"]], "p": {"1": ["F", "Le lobe supérieur n'oriente vers aucun agent ; c'est le poste de chromage qui le fait."], "2": ["F", "L'histologie est [[épidermoïde]] (pas adénocarcinome), et aucun type n'est spécifique d'un agent."], "3": ["T", "Le **chromage électrolytique** prolongé expose directement au chrome VI."], "4": ["F", "L'absence de métastases ne départage pas chrome et nickel."], "5": ["F", "Une exposition combinée ne désigne pas un agent plutôt que l'autre."]}, "key": ["3"], "fmt": "QCM", "o": [["of2/o_2026b-54_0.png", 5], ["of2/o_2026b-54_1.png", 1]]}, {"id": "2026b-55", "exam": "2026b", "label": "Mai 2026", "n": 55, "stem": "Parmi les affirmations suivantes, lesquelles relèvent de la prévention primaire des risques liés au chrome VI ?", "case": "2026b-c8", "tables": [], "imgs": [], "c": "cancer", "s": ["p14-33"], "t": [], "g": "Prévention primaire du chrome VI (avant toute maladie) :\n• **substitution** par une alternative moins toxique ;\n• **captage à la source** des aérosols et fumées ;\n• **formation** des travailleurs ;\n• la surveillance biologique est **secondaire** ; le travail à mains nues est interdit.", "warn": [], "type": "multi", "opts": [["1", "Substitution du chrome VI par une alternative moins toxique"], ["2", "Captage à la source des polluants"], ["3", "Surveillance biologique après exposition"], ["4", "Formation spécifique des travailleurs exposés"], ["5", "Travail à mains nues autorisé si durée inférieure à 1 heure"]], "p": {"1": ["T", "La **substitution** du chrome VI supprime le danger : prévention primaire."], "2": ["T", "Le **captage à la source** réduit l'émission avant l'inhalation."], "3": ["F", "La surveillance biologique dépiste une imprégnation déjà présente : prévention [[secondaire]]."], "4": ["T", "La **formation** fait adopter les bons gestes avant l'exposition : prévention primaire."], "5": ["F", "Le chrome VI est cancérogène et sensibilisant : le travail à [[mains nues]] n'est jamais autorisé."]}, "key": ["1", "2", "4"], "fmt": "QCM", "o": [["of2/o_2026b-55_0.png", 7]]}, {"id": "2026b-56", "exam": "2026b", "label": "Mai 2026", "n": 56, "stem": "Quelles sont les conditions requises pour qu’un cancer soit reconnu comme maladie professionnelle selon le système des tableaux en Algérie ?", "case": "2026b-c8", "tables": [], "imgs": [], "c": "atmp", "s": ["p5-23"], "t": [], "g": "Reconnaissance d'un cancer par le système des tableaux (présomption d'origine) :\n• maladie **inscrite** dans un tableau, diagnostic **confirmé** (histologique pour un cancer) ;\n• **DPC** respecté ;\n• **travaux** conformes à la liste (indicative ou limitative) ;\n• l'**IPP** intervient après, pour fixer l'indemnisation.", "warn": [], "type": "multi", "opts": [["1", "L’affection doit correspondre à une maladie inscrite dans un tableau de maladie professionnelle"], ["2", "Le délai de prise en charge doit être respecté"], ["3", "Le diagnostic doit être médicalement confirmé, notamment histologiquement pour un cancer"], ["4", "Le patient doit obligatoirement avoir une IPP supérieure à 10 % pour que la maladie soit reconnue"], ["5", "L’exposition professionnelle doit correspondre aux travaux mentionnés dans le tableau, selon le caractère indicatif ou limitatif de la liste"]], "p": {"1": ["T", "L'affection doit figurer dans un **tableau** de maladie professionnelle."], "2": ["T", "Le **délai de prise en charge** doit être respecté."], "3": ["T", "Le diagnostic doit être **confirmé**, histologiquement pour un cancer."], "4": ["F", "L'[[IPP]] n'est pas une condition de reconnaissance : elle sert ensuite à calculer la réparation."], "5": ["T", "L'exposition doit correspondre aux **travaux** du tableau, selon le caractère indicatif ou limitatif."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_2026b-56_0.png", 7], ["of2/o_2026b-56_1.png", 8]]}, {"id": "2026b-57", "exam": "2026b", "label": "Mai 2026", "n": 57, "stem": "Quelles pièces doivent être fournies pour la déclaration d’une maladie professionnelle selon la procédure algérienne ?", "case": "2026b-c8", "tables": [], "imgs": [], "c": "atmp", "s": ["p5-24"], "t": [], "g": "Dossier de déclaration d'une MP (à adresser à la CNAS par la victime) :\n• **AT16** : déclaration de maladie professionnelle ;\n• **AT17** : certificat médical initial ;\n• **AT18** : attestation de travail / reconstitution de carrière et d'exposition ;\n• l'AT4 (guérison ou consolidation) vient en fin d'évolution ; l'AT01 concerne l'accident du travail.", "warn": [], "type": "multi", "opts": [["1", "Certificat médical initial AT17"], ["2", "Certificat de consolidation AT4"], ["3", "Attestation de travail ou attestation d’exposition AT18"], ["4", "Formulaire de déclaration de maladie professionnelle AT16"], ["5", "Déclaration d’accident du travail AT01"]], "p": {"1": ["T", "L'**AT17** est le certificat médical initial de maladie professionnelle."], "2": ["F", "Le certificat de [[consolidation]] (AT4) est établi en fin d'évolution, pas à la déclaration."], "3": ["T", "L'**AT18** atteste les emplois et expositions du travailleur."], "4": ["T", "L'**AT16** est le formulaire de déclaration de maladie professionnelle."], "5": ["F", "L'[[AT01]] est la déclaration d'**accident du travail** faite par l'employeur."]}, "key": ["1", "3", "4"], "fmt": "QCM", "cs": "Métallurgiste de 59 ans, 33 ans de soudage et de chromage (nickel, **chrome VI**) sans protection : **carcinome épidermoïde** du lobe supérieur droit, sans métastase, traité par lobectomie. Imputabilité au chrome (TMP 10 ter), prévention primaire et dossier de déclaration (certificat, attestation d'exposition).", "o": [["of2/o_2026b-57_0.png", 9]]}, {"id": "2026b-58", "exam": "2026b", "label": "Mai 2026", "n": 58, "stem": "Classer correctement les effets suivants.", "case": null, "tables": [], "imgs": [], "c": "ri", "s": ["p9-22"], "t": [6], "g": "Effets biologiques des rayonnements ionisants :\n• **déterministes** (réactions tissulaires) : **seuil**, gravité qui croît avec la dose → radiodermite, cataracte, syndrome d'irradiation aiguë ;\n• **stochastiques** : **sans seuil**, probabilité qui croît avec la dose, gravité indépendante → cancers, effets héréditaires.", "warn": [], "type": "match", "left": [["1", "Radiodermite"], ["2", "Cataracte radio-induite"], ["3", "Cancer radio-induit"], ["4", "Syndrome d’irradiation aiguë"], ["5", "Effets héréditaires théoriques"]], "right": [["a", "Effets déterministes ou réactions tissulaires"], ["b", "Effets stochastiques"]], "p": {"1": [null, "La **radiodermite** est une réaction tissulaire à seuil : déterministe (a)."], "2": [null, "La **cataracte** radio-induite est un effet déterministe (a)."], "3": [null, "Le **cancer** radio-induit est un effet stochastique (b)."], "4": [null, "Le **syndrome d'irradiation aiguë** survient à forte dose avec seuil : déterministe (a)."], "5": [null, "Les **effets héréditaires** sont aléatoires et sans seuil : stochastiques (b)."]}, "fmt": "Association", "corr": {"1": ["a"], "2": ["a"], "3": ["b"], "4": ["a"], "5": ["b"]}, "o": [["of2/o_2026b-58_0.png", 7]]}, {"id": "2026b-59", "exam": "2026b", "label": "Mai 2026", "n": 59, "stem": "Concernant le syndrome d’irradiation aiguë, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "ri", "s": ["p9-22", "p9-14"], "t": [], "g": "Syndrome d'irradiation aiguë :\n• irradiation **externe forte** du corps entier ;\n• **prodromes** : nausées, vomissements, asthénie ;\n• **latence** trompeuse ;\n• phase d'état selon la dose : forme **hématopoïétique** (cytopénies, infections, hémorragies), digestive, neurologique.", "warn": ["La fin des propositions 4 et 5 et les choix D, E sont illisibles."], "type": "multi", "opts": [["1", "Il survient après irradiation corps entier ou quasi corps entier à forte dose."], ["2", "Il peut comporter une phase prodromique avec nausées, vomissements et asthénie."], ["3", "Il comporte toujours une contamination interne."], ["4", "La forme hématopoïétique peut donner leucopénie, thrombopénie, infections (...)"], ["5", "Une phase de latence peut (...)"]], "p": {"1": ["T", "Il survient après une irradiation **corps entier** ou quasi entier à forte dose."], "2": ["T", "La phase **prodromique** associe nausées, vomissements et asthénie dans les heures suivantes."], "3": ["F", "Une irradiation externe suffit : la contamination interne n'est [[pas obligatoire]]."], "4": ["T", "La forme **hématopoïétique** donne leucopénie, thrombopénie, infections et hémorragies."], "5": ["T", "Une phase de **latence** peut faire croire à tort à une amélioration."]}, "key": ["1", "2", "4", "5"], "fmt": "QCM", "o": [["of2/o_2026b-59_0.png", 6]]}, {"id": "2026b-60", "exam": "2026b", "label": "Mai 2026", "n": 60, "stem": "Associer les phases de l’eczéma à leur description.", "case": null, "tables": [], "imgs": [], "c": "derm", "s": ["p13-13"], "t": [], "g": "Les phases de l'eczéma aigu :\n• **érythémateuse** : rougeur, aspect granité ;\n• **vésiculeuse** : vésicules, prurit intense, contours mal limités ;\n• **suintante** : rupture des vésicules ;\n• **croûteuse** : dessiccation, puis guérison sans cicatrice. Eczéma chronique : squames, fissures, lichénification.", "warn": [], "type": "match", "left": [["1", "Phase érythémateuse"], ["2", "Phase vésiculeuse"], ["3", "Phase suintante"], ["4", "Phase croûteuse"]], "right": [["a", "Peau rouge vif, aspect granité"], ["b", "Vésicules augmentées, prurit important, contours mal limités"], ["c", "Rupture des vésicules avec écoulement clair"], ["d", "Dessiccation du liquide avec croûtes puis guérison sans cicatrice"]], "p": {"1": [null, "La phase **érythémateuse** donne une peau rouge vif d'aspect granité (1-a)."], "2": [null, "La phase **vésiculeuse** montre des vésicules qui augmentent, avec prurit et contours flous (2-b)."], "3": [null, "La phase **suintante** correspond à la rupture des vésicules avec écoulement clair (3-c)."], "4": [null, "La phase **croûteuse** voit le liquide sécher en croûtes, puis la peau guérit sans cicatrice (4-d)."]}, "fmt": "Association", "corr": {"1": ["a"], "2": ["b"], "3": ["c"], "4": ["d"]}, "o": [["of2/o_2026b-60_0.png", 5]]}, {"id": "2026a-01", "exam": "2026a", "label": "Janvier 2026", "n": 1, "stem": "(RF) Article 12 - Loi 88-07 :", "case": null, "tables": [], "imgs": [], "c": "intro", "s": ["p2-22"], "t": [], "g": "Art. 12 de la loi 88-07 : la médecine du travail, préventive essentiellement et curative accessoirement, vise à :\n• promouvoir le **bien-être** physique et mental et les capacités de travail ;\n• **prévenir** les risques et **identifier** les facteurs de risque pour les réduire ;\n• **adapter le travail à l'homme** et chaque homme à sa tâche ;\n• contribuer à la **sauvegarde de l'environnement**.", "warn": [], "type": "single", "opts": [["A", "Vise à promouvoir et maintenir le bien-être physique et mental des travailleurs et à élever leurs capacités de travail et de création."], ["B", "Prévenir les risques professionnels (AT, MP, atteintes à la santé)."], ["C", "Repérer et suivre les facteurs de risque au travail pour les réduire/éliminer."], ["D", "Adapter le poste au travailleur et l’homme au travail."], ["E", "Contribue à la sauvegarde de l’environnement par rapport à l’homme et à la nature."]], "key": ["D"], "p": {"A": ["T", "La loi vise à promouvoir et maintenir le **bien-être physique et mental** des travailleurs et leurs capacités de travail et de création."], "B": ["T", "**Prévenir les risques professionnels** (AT, MP, toute atteinte à la santé) est une mission de l'article 12."], "C": ["T", "**Repérer et suivre** les facteurs de risque au travail pour les réduire ou les éliminer fait partie des missions."], "D": ["F", "La loi dit adapter le [[travail à l'homme]] et chaque homme à sa tâche ; « adapter l'homme au travail » est l'inversion piège. C'est la proposition fausse."], "E": ["T", "La médecine du travail contribue à la **sauvegarde de l'environnement** par rapport à l'homme et à la nature."]}, "fmt": "QCS", "rep": [["2025", 1], ["2024", 1]], "o": [["of2/o_2026a-01_0.png", 7]]}, {"id": "2026a-02", "exam": "2026a", "label": "Janvier 2026", "n": 2, "stem": "(RF) La visite médicale d’embauchage (VE) :", "case": null, "tables": [], "imgs": [], "c": "intro", "s": ["p2-31", "p2-32"], "t": [], "g": "Visite d'embauche :\n• le médecin ouvre le **DMST** (dossier médical en santé au travail), confidentiel, complété à chaque visite ;\n• il remet à l'employeur une **fiche d'aptitude** (apte, restrictions, aménagements) ;\n• cette fiche ne contient **ni antécédents ni résultats** d'examens ;\n• elle peut être présentée à l'inspection du travail.", "warn": [], "type": "single", "opts": [["A", "À la VE, le médecin du travail constitue un dossier médical individuel (DMST) complété aux examens ultérieurs."], ["B", "Le DMST est confidentiel et ne peut être communiqué qu’au médecin du travail inspecteur compétent."], ["C", "À l’issue de la VE, une fiche destinée à l’employeur est établie et doit pouvoir être présentée à l’inspection du travail."], ["D", "La fiche d’aptitude comporte les antécédents et les résultats détaillés des examens cliniques/paracliniques, et elle est archivée dans le DMST."], ["E", "La VE apprécie l’aptitude au poste et peut proposer des aménagements/restrictions."]], "key": ["D"], "p": {"A": ["T", "Le **DMST** est ouvert à l'embauche puis complété à chaque examen ultérieur."], "B": ["T", "Le DMST est **confidentiel** : seul le médecin du travail inspecteur compétent peut y accéder."], "C": ["T", "La **fiche destinée à l'employeur** doit pouvoir être présentée à l'inspection du travail."], "D": ["F", "La fiche d'aptitude ne porte que la **conclusion** ; antécédents et résultats détaillés restent [[dans le DMST]], sous secret. C'est la proposition fausse."], "E": ["T", "La visite d'embauche apprécie l'**aptitude** et peut proposer des aménagements ou restrictions."]}, "fmt": "QCS", "o": [["of2/o_2026a-02_0.png", 10]]}, {"id": "2026a-03", "exam": "2026a", "label": "Janvier 2026", "n": 3, "stem": "(RF) Les visites médicales périodiques (VP) :", "case": null, "tables": [], "imgs": [], "c": "intro", "s": ["p2-31"], "t": [], "g": "Les visites périodiques (décret 93-120) :\n• **programmées** : au moins **1 fois/an**, au moins **2 fois/an** pour les catégories particulières ;\n• contenu : entretien, examen clinique, examens paracliniques adaptés au risque ;\n• but : **maintien de l'aptitude** et **dépistage** précoce ;\n• la visite faite à la demande du travailleur s'appelle la visite **spontanée**.", "warn": [], "type": "single", "opts": [["A", "Tout travailleur bénéficie, à son initiative, d’une VMP assurée par le médecin du travail, intégrée dans son suivi en entreprise."], ["B", "Les VMP sont assurées au rythme annuel, et des visites particulières/spéciales sont organisées chaque semestre selon la nuisance et la catégorie du travailleur."], ["C", "Elles comportent un entretien portant sur les évènements de santé depuis la dernière visite, les changements du poste et l’organisation du travail, ainsi qu’un examen clinique et des examens paracliniques adaptés aux risques."], ["D", "Elles s’inscrivent tout au long de la carrière du travailleur dans l’entreprise, dans le cadre du suivi assuré par le médecin du travail."], ["E", "Elles visent à s’assurer du maintien de l’aptitude au poste occupé et à dépister précocement des affections d’origine professionnelle, non professionnelle ou relevant des maladies à déclaration obligatoire."]], "key": ["A"], "p": {"A": ["F", "Une visite faite à l'initiative du travailleur est une visite [[spontanée]], pas une visite périodique. C'est la proposition fausse."], "B": ["T", "Rythme **annuel** pour tous, **semestriel** pour les surveillances particulières (exposés, postes de sécurité…)."], "C": ["T", "Elles comportent un **entretien**, un **examen clinique** et des examens paracliniques adaptés aux risques."], "D": ["T", "Elles jalonnent **toute la carrière** du travailleur dans l'entreprise."], "E": ["T", "Elles vérifient le **maintien de l'aptitude** et dépistent les affections professionnelles ou non, et les MDO."]}, "fmt": "QCS", "o": [["of2/o_2026a-03_0.png", 8]]}, {"id": "2026a-04", "exam": "2026a", "label": "Janvier 2026", "n": 4, "stem": "(RF) La visite médicale de reprise :", "case": null, "tables": [], "imgs": [], "c": "intro", "s": ["p2-31", "p2-32"], "t": [], "g": "Visite de reprise :\n• après AT ou MP, maternité, absence **≥ 21 jours** pour maladie ou accident non professionnel, absences répétées ;\n• elle juge l'**aptitude** à reprendre et le besoin d'**adapter** le poste ;\n• elle peut aboutir à des restrictions ou à un aménagement ;\n• le médecin du travail **ne contrôle pas** les arrêts : c'est le rôle du médecin contrôleur.", "warn": [], "type": "single", "opts": [["A", "Elle a pour but d’apprécier l’aptitude à reprendre et la nécessité d’adaptation/réadaptation du poste."], ["B", "Le médecin du travail peut réduire/refuser la durée de l’arrêt de travail (ITT) s’il la juge excessive."], ["C", "Elle peut s’inscrire dans une démarche d’identification du lien travail–santé."], ["D", "Elle contribue à organiser la reprise dans des conditions compatibles avec la santé."], ["E", "Elle peut aboutir à des restrictions ou propositions d’aménagement."]], "key": ["B"], "p": {"A": ["T", "Elle apprécie l'**aptitude à reprendre** et la nécessité d'adapter ou réadapter le poste."], "B": ["F", "Le médecin du travail ne peut [[ni réduire ni refuser]] l'ITT prescrite par le médecin traitant. C'est la proposition fausse."], "C": ["T", "Elle peut aider à **identifier un lien** entre le travail et l'atteinte ayant motivé l'arrêt."], "D": ["T", "Elle organise une **reprise compatible** avec l'état de santé."], "E": ["T", "Elle peut déboucher sur des **restrictions** ou des propositions d'aménagement."]}, "fmt": "QCS", "o": [["of2/o_2026a-04_0.png", 8]]}, {"id": "2026a-05", "exam": "2026a", "label": "Janvier 2026", "n": 5, "stem": "(RF) Les examens complémentaires demandés par le médecin du travail :", "case": null, "tables": [], "imgs": [], "c": "intro", "s": ["p2-23", "p2-31"], "t": [], "g": "Examens complémentaires prescrits par le médecin du travail :\n• pour juger l'**aptitude** ou une contre-indication au poste ;\n• pour **dépister** MP et MCP, indépendamment de la reconnaissance ;\n• choisis selon le risque : biologie, imagerie, EFR, audiométrie ;\n• prescrits « **à toutes fins utiles** », à la charge de l'employeur.", "warn": [], "type": "single", "opts": [["A", "Peuvent être demandés pour éclairer l’aptitude/contre-indication au poste."], ["B", "Peuvent aider à dépister des MP/MCP indépendamment de la procédure administrative de reconnaissance."], ["C", "Peuvent inclure biologie, imagerie, EFR, audiométrie, etc."], ["D", "Seraient réservés au seul dépistage des maladies contagieuses et des MP/MCP"], ["E", "Le médecin du travail peut demander tout examen “à toutes fins utiles” et recommander des mesures adaptées."]], "key": ["D"], "p": {"A": ["T", "Ils éclairent l'**aptitude** ou la contre-indication au poste."], "B": ["T", "Ils permettent de **dépister** MP et MCP, indépendamment de la procédure de reconnaissance."], "C": ["T", "Ils comprennent **biologie, imagerie, EFR, audiométrie**, selon les risques du poste."], "D": ["F", "Ils ne sont pas [[réservés au seul]] dépistage : ils servent aussi à juger l'aptitude et à surveiller l'exposition. C'est la proposition fausse."], "E": ["T", "Le médecin peut demander tout examen **à toutes fins utiles** et recommander des mesures adaptées."]}, "fmt": "QCS", "o": [["of2/o_2026a-05_0.png", 9], ["of2/o_2026a-05_1.png", 7]]}, {"id": "2026a-06", "exam": "2026a", "label": "Janvier 2026", "n": 6, "stem": "(RJ) Parmi ces critères, certains sont indispensables à la reconnaissance d’une affection, au titre de la maladie professionnelle :", "case": null, "tables": [], "imgs": [], "c": "atmp", "s": ["p5-23"], "t": [], "g": "Reconnaissance par présomption d'origine :\n• **exposition habituelle** à un risque précis ;\n• maladie **inscrite à un tableau** ;\n• + DPC respecté et travaux conformes ;\n• la durée d'exposition n'existe que **dans certains tableaux** ; l'âge ne compte pas ; la victime n'a pas à prouver le lien causal.", "warn": ["Certains corrigés retiennent A (preuve de l’exposition) ; le système des tableaux repose sur la présomption d’origine."], "type": "multi", "opts": [["1", "l’exposition habituelle à un risque précis"], ["2", "l’existence obligatoire d’une durée d’exposition à un risque professionnel"], ["3", "l’intéressé doit apporter la preuve qu’il a été exposé au risque"], ["4", "l’âge du patient"], ["5", "l’inscription de l’affection au sein d’un tableau"]], "p": {"1": ["T", "L'**exposition habituelle** à un risque précis est indispensable."], "2": ["F", "La durée d'exposition n'est exigée que [[dans certains tableaux]] (ex. 1 an pour le TMP 42) ; elle n'est pas une condition générale."], "3": ["F", "Grâce à la présomption d'origine, la victime n'a [[pas à prouver]] le lien de causalité si les conditions du tableau sont réunies."], "4": ["F", "L'[[âge]] du patient n'est pas un critère de reconnaissance."], "5": ["T", "L'affection doit être **inscrite** dans un tableau de MP."]}, "key": ["1", "5"], "fmt": "QCM", "o": [["of2/o_2026a-06_0.png", 7], ["of2/o_2026a-06_1.png", 8]]}, {"id": "2026a-07", "exam": "2026a", "label": "Janvier 2026", "n": 7, "stem": "(RJ) En cas de carence de l'employeur, la victime peut déclarer son AT à la CNAS dans un délai maximum de :", "case": null, "tables": [], "imgs": [], "c": "atmp", "s": ["p5-13"], "t": [], "g": "Déclaration de l'accident du travail :\n• victime → employeur : **24 h** ;\n• employeur → CNAS : **48 h** (hors jours non ouvrables) ;\n• en cas de **carence** de l'employeur : la victime, ses ayants droit, le syndicat ou l'inspection peuvent déclarer dans un délai de **4 ans**.", "warn": [], "type": "single", "opts": [["A", "15 jours"], ["B", "3 mois"], ["C", "6 mois"], ["D", "4 ans"], ["E", "5 ans"]], "key": ["D"], "p": {"A": ["F", "15 jours n'est pas un délai de l'AT ; en cas de carence de l'employeur, le délai est de **4 ans**."], "B": ["F", "3 mois est le délai maximal de déclaration d'une MP, pas de l'AT en carence ; ici c'est **4 ans**."], "C": ["F", "6 mois n'est prévu nulle part ; le délai en cas de carence est de **4 ans**."], "D": ["T", "En cas de carence de l'employeur, la victime dispose de **4 ans** pour déclarer son AT à la CNAS."], "E": ["F", "5 ans dépasse le délai légal, qui est de **4 ans**."]}, "fmt": "QCS", "o": [["of2/o_2026a-07_0.png", 5]]}, {"id": "2026a-08", "exam": "2026a", "label": "Janvier 2026", "n": 8, "stem": "(RJ) L’intoxication aiguë en milieu professionnel :", "case": null, "tables": [], "imgs": [], "c": "toxi", "s": ["p4-23"], "t": [], "g": "Formes d'intoxication :\n• **aiguë** : exposition **brève**, souvent **unique**, absorption rapide et massive, signes rapides (< 24 h) ;\n• **subaiguë** : expositions répétées sur jours ou semaines ;\n• **chronique** : doses faibles prolongées, signes retardés ;\n• en milieu professionnel, la forme **la plus fréquente** est la chronique.", "warn": [], "type": "multi", "opts": [["A", "C’est la forme la plus observée en pathologie professionnelle."], ["B", "Fait suite à une exposition de courte durée à un toxique."], ["C", "Peut faire suite à une absorption rapide d’un toxique."], ["D", "Les manifestations se développent rapidement."], ["E", "Peut faire suite à une exposition unique."]], "key": ["B", "C", "D", "E"], "p": {"A": ["F", "La forme la plus observée en pathologie professionnelle est l'intoxication [[chronique]], pas l'aiguë."], "B": ["T", "L'intoxication aiguë fait suite à une exposition de **courte durée**."], "C": ["T", "Elle peut résulter d'une **absorption rapide** et massive du toxique."], "D": ["T", "Les manifestations apparaissent **rapidement**, en général dans les 24 heures."], "E": ["T", "Une **exposition unique** suffit (fuite, accident de transvasement)."]}, "fmt": "QCM", "o": [["of2/o_2026a-08_0.png", 9]]}, {"id": "2026a-09", "exam": "2026a", "label": "Janvier 2026", "n": 9, "stem": "Les maladies respiratoires liées aux fibres d’amiante sont :", "case": null, "tables": [], "imgs": [], "c": "pneumo", "s": ["p12-21", "p12-23", "p12-24"], "t": [30], "g": "Pathologies liées à l'amiante (TMP 30) :\n• **lésions pleurales bénignes** : plaques pleurales, pleurésie, épaississement ;\n• **asbestose** : fibrose interstitielle diffuse des bases ;\n• **mésothéliome** malin (plèvre, péritoine, péricarde) ;\n• **cancer broncho-pulmonaire**. La silicose est due à la silice.", "warn": [], "type": "multi", "opts": [["1", "Pleurésies bénignes et plaques pleurales"], ["2", "Asbestose"], ["3", "Silicose"], ["4", "Mésothéliome malin pleural"], ["5", "Complications immunitaires (auto-immunes)"]], "p": {"1": ["T", "Les **plaques pleurales** et la pleurésie bénigne sont les marqueurs les plus fréquents de l'exposition."], "2": ["T", "L'**asbestose** est la fibrose pulmonaire interstitielle due aux fibres d'amiante."], "3": ["F", "La [[silicose]] est due à la **silice cristalline**, pas à l'amiante."], "4": ["T", "Le **mésothéliome** malin pleural est le cancer sentinelle de l'amiante."], "5": ["F", "Les complications [[auto-immunes]] (Caplan-Colinet, Erasmus) sont associées à la **silicose**."]}, "key": ["1", "2", "4"], "fmt": "QCM", "o": [["of2/o_2026a-09_0.png", 9]]}, {"id": "2026a-10", "exam": "2026a", "label": "Janvier 2026", "n": 10, "stem": "Un mésothéliome consécutif aux poussières d'amiante peut être localisé au niveau de :", "case": null, "tables": [], "imgs": [], "c": "pneumo", "s": ["p12-24"], "t": [30], "g": "Le mésothéliome naît du **mésothélium**, séreuse qui tapisse :\n• la **plèvre** (localisation la plus fréquente) ;\n• le **péritoine** ;\n• le **péricarde** (et la vaginale testiculaire) ;\n• jamais une muqueuse (vessie, estomac). Latence longue (20-40 ans).", "warn": [], "type": "multi", "opts": [["1", "Muqueuse vésicale"], ["2", "Péritoine"], ["3", "Plèvre"], ["4", "Muqueuse gastrique"], ["5", "Péricarde"]], "p": {"1": ["F", "La [[muqueuse]] vésicale est un urothélium, pas un mésothélium : pas de mésothéliome possible."], "2": ["T", "Le **péritoine** est une séreuse mésothéliale : mésothéliome péritonéal possible."], "3": ["T", "La **plèvre** est la localisation de loin la plus fréquente."], "4": ["F", "La [[muqueuse]] gastrique n'est pas un mésothélium."], "5": ["T", "Le **péricarde** est une séreuse mésothéliale : localisation rare mais possible."]}, "key": ["2", "3", "5"], "fmt": "QCM", "o": [["of2/o_2026a-10_0.png", 12]]}, {"id": "2026a-11", "exam": "2026a", "label": "Janvier 2026", "n": 11, "stem": "Concernant les tableaux des maladies professionnelles qui réparent les cancers professionnels en Algérie : (RF)", "case": null, "tables": [], "imgs": [], "c": "cancer", "s": ["p14-32"], "t": [], "g": "Cancers professionnels réparés en Algérie :\n• **13 TMP** sur 85 comportent des cancers, tous dans le groupe 1 ou 3, **aucun dans le groupe 2** ;\n• cancers ORL : **2 TMP** (47 bois, 37 nickel) ;\n• les **cancers bronchiques** sont les **plus réparés** (amiante, chrome, nickel, arsenic, RI, fer) ;\n• listes de travaux indicatives.", "warn": [], "type": "single", "opts": [["A", "Actuellement, il existe treize (13) TMP réparant les cancers professionnels en Algérie"], ["B", "Le risque cancérogène n’apparaît dans aucun TMP de groupe 2"], ["C", "Les cancers ORL sont réparés par deux TMP"], ["D", "Les cancers bronchiques sont les moins réparés des cancers d’origine professionnelle"], ["E", "Tous les TMP réparant les cancers professionnels ont des listes indicatives des travaux"]], "key": ["D"], "p": {"A": ["T", "Il existe bien **13 tableaux** réparant des cancers en Algérie."], "B": ["T", "Aucun tableau du **groupe 2** (infections) ne vise un risque cancérogène."], "C": ["T", "Les cancers **ORL** (ethmoïde, sinus) sont réparés par **deux** tableaux : 47 (bois) et 37 (nickel)."], "D": ["F", "Les cancers bronchiques sont au contraire les [[plus réparés]] (TMP 6, 10 ter, 20, 30, 37, 44). C'est la proposition fausse."], "E": ["T", "Ces tableaux ont des **listes indicatives** de travaux."]}, "fmt": "QCS", "rep": [["2024", 21]], "o": [["of2/o_2026a-11_0.png", 7]]}, {"id": "2026a-12", "exam": "2026a", "label": "Janvier 2026", "n": 12, "stem": "Parmi ces substances, quelles sont celles qui peuvent entraîner des cancers bronchopulmonaires indemnisables ? (CRJ)", "case": null, "tables": [], "imgs": [], "c": "cancer", "s": ["p14-32"], "t": [30, 37, 44], "g": "CBP indemnisables en Algérie :\n• **RI** (TMP 6), **arsenic** (20), **amiante** (30), **nickel** (37), **oxydes de fer** (44), **chrome** (10 ter) ;\n• les **amines aromatiques** donnent la **vessie** (TMP 15) ;\n• le **chlorure de vinyle** donne l'**angiosarcome du foie** (TMP 51).", "warn": [], "type": "multi", "opts": [["1", "Les amines aromatiques"], ["2", "Les rayonnements ionisants"], ["3", "Le chlorure de vinyle"], ["4", "L’arsenic"], ["5", "L’oxyde de fer"]], "p": {"1": ["F", "Les [[amines aromatiques]] donnent des tumeurs de **vessie** (TMP 15), pas de CBP."], "2": ["T", "Les **rayonnements ionisants** réparent le CBP primitif par inhalation (TMP 6, DPC 30 ans)."], "3": ["F", "Le [[chlorure de vinyle]] donne l'**angiosarcome hépatique** (TMP 51), pas de CBP."], "4": ["T", "L'**arsenic** et ses composés minéraux donnent des CBP (TMP 20)."], "5": ["T", "Les **oxydes de fer** (TMP 44) comportent le cancer broncho-pulmonaire."]}, "key": ["2", "4", "5"], "fmt": "QCM", "o": [["of2/o_2026a-12_0.png", 8]]}, {"id": "2026a-13", "exam": "2026a", "label": "Janvier 2026", "n": 13, "stem": "Parmi les substances suivantes, quelle(s) est ou sont celle(s) connue(s) chez l'homme pour responsable(s) de cancers cutanés primitifs professionnels ?", "case": null, "tables": [], "imgs": [], "c": "cancer", "s": ["p14-21"], "t": [], "g": "Cancers cutanés primitifs professionnels :\n• **arsenic** (kératoses, carcinomes) ;\n• **rayonnements ionisants** (carcinome sur radiodermite) ;\n• **goudrons, huiles minérales, suies** (HAP) et UV.\nCadmium → rein, poumon ; silice → poumon ; trichloroéthylène → rein.", "warn": [], "type": "multi", "opts": [["1", "Arsenic"], ["2", "Cadmium"], ["3", "Corps radioactifs"], ["4", "Bioxyde de silicium"], ["5", "Trichloréthylène"]], "p": {"1": ["T", "L'**arsenic** donne kératoses et carcinomes cutanés (et CBP)."], "2": ["F", "Le [[cadmium]] touche le **rein**, le poumon et l'os, pas la peau."], "3": ["T", "Les **corps radioactifs** donnent des radiodermites qui peuvent dégénérer en carcinome."], "4": ["F", "La [[silice]] (bioxyde de silicium) est cancérogène **pulmonaire**."], "5": ["F", "Le [[trichloroéthylène]] donne le cancer du **rein**."]}, "key": ["1", "3"], "fmt": "QCM", "o": [["of2/o_2026a-13_0.png", 4], ["of2/o_2026a-13_1.png", 3]]}, {"id": "2026a-14", "exam": "2026a", "label": "Janvier 2026", "n": 14, "stem": "Chez un travailleur employé dans une entreprise fabriquant des colorants à base de benzidine, de bétanaphtylamine et de tétraméthyl-diaminodiphéxylamine, vous devez toujours rechercher une localisation carcinogénétique. Laquelle ?", "case": null, "tables": [], "imgs": [], "c": "cancer", "s": ["p14-21"], "t": [15], "g": "Amines aromatiques (benzidine, β-naphtylamine, dérivés de l'aniline) :\n• secteurs : **colorants**, teinture, caoutchouc, cuir ;\n• cible : l'**urothélium** → cancer de **vessie** ;\n• réparées par le **TMP 15** (DPC 30 ans) ;\n• surveillance urinaire (cytologie) des exposés.", "warn": [], "type": "single", "opts": [["A", "Cerveau"], ["B", "Ethmoïde"], ["C", "Poumon"], ["D", "Os"], ["E", "Vessie"]], "key": ["E"], "p": {"A": ["F", "Le cerveau n'est pas une cible des amines aromatiques ; leur cible est la **vessie**."], "B": ["F", "L'ethmoïde est la cible du **bois** et du **nickel** ; les amines donnent la vessie."], "C": ["F", "Le poumon n'est pas la cible des amines aromatiques ; elles donnent la **vessie** (TMP 15)."], "D": ["F", "L'os est la cible des **RI** (sarcome osseux) ; les amines donnent la vessie."], "E": ["T", "La **vessie** est la localisation sentinelle des amines aromatiques."]}, "fmt": "QCS", "o": [["of2/o_2026a-14_0.png", 6]]}, {"id": "2026a-15", "exam": "2026a", "label": "Janvier 2026", "n": 15, "stem": "Parmi les vaccinations suivantes quelles sont celles qui sont obligatoires chez le personnel de santé (RJ)", "case": null, "tables": [], "imgs": [], "c": "bio", "s": ["p16-21"], "t": [], "g": "Vaccinations du personnel de santé en Algérie :\n• **obligatoires** : **hépatite B** (activités exposées, arrêté du 25/04/2000) et rappels **diphtérie-tétanos** ;\n• **recommandées** selon le poste : BCG, méningocoque, grippe ;\n• la vaccination ne dispense jamais des autres mesures de prévention.", "warn": [], "type": "multi", "opts": [["1", "Le BCG"], ["2", "Le vaccin anti -méningocoque A et C"], ["3", "Le vaccin contre l’Hépatite virale B"], ["4", "Le vaccin contre la grippe"], ["5", "Les Vaccins contre la Diphtérie et le Tétanos"]], "p": {"1": ["F", "Le [[BCG]] n'est pas retenu comme obligatoire pour le personnel de santé dans la réponse attendue."], "2": ["F", "Le vaccin méningocoque A et C est [[recommandé]] selon l'exposition (laboratoires), pas obligatoire."], "3": ["T", "Le vaccin contre l'**hépatite B** est obligatoire pour le personnel exposé au sang."], "4": ["F", "La grippe est [[recommandée]] chaque année, pas obligatoire."], "5": ["T", "Les rappels **diphtérie et tétanos** font partie des vaccinations obligatoires."]}, "key": ["3", "5"], "fmt": "QCM", "o": [["of2/o_2026a-15_0.png", 5]]}, {"id": "2026a-16", "exam": "2026a", "label": "Janvier 2026", "n": 16, "stem": "Parmi les signes cliniques de syndrome classique dans les différentes phases de l’intoxication par les pesticides organophosphorés (RJ)", "case": null, "tables": [], "imgs": [], "c": "pest", "s": ["p8-22"], "t": [], "g": "Toxidrome cholinergique des organophosphorés :\n• **muscarinique** (parasympathique) : hypersécrétions, myosis (photophobie), diarrhée, bradycardie ;\n• **nicotinique** (plaque motrice) : fasciculations, crampes, paralysie ;\n• **central** : vertiges, confusion, convulsions, troubles respiratoires centraux (Cheyne-Stokes), coma.", "warn": [], "type": "match", "opts": [], "p": {"1": [null, "La respiration de **Cheyne-Stokes** traduit une atteinte des centres respiratoires : symptôme central (c)."], "2": [null, "Les **crampes musculaires** viennent de la stimulation de la plaque motrice : effet nicotinique (b)."], "3": [null, "La **diarrhée** est une hypersécrétion digestive parasympathique : effet muscarinique (a)."], "4": [null, "Le **vertige** est un symptôme nerveux central (c)."], "5": [null, "La **photophobie** est liée au myosis : effet muscarinique (a)."], "6": [null, "Les **fasciculations** traduisent l'atteinte de la jonction neuromusculaire : effet nicotinique (b)."]}, "left": [["1", "Respiration de Cheyne-Stokes"], ["2", "Crampes musculaires"], ["3", "Diarrhée"], ["4", "Vertige"], ["5", "Photophobie"], ["6", "Fasciculation"]], "right": [["a", "Effets muscariniques"], ["b", "Effets nicotiniques"], ["c", "Symptômes nerveux centraux"]], "fmt": "Association", "corr": {"1": ["c"], "2": ["b"], "3": ["a"], "4": ["c"], "5": ["a"], "6": ["b"]}, "rep": [["2024", 17]], "o": [["of2/o_2026a-16_0.png", 4]]}, {"id": "2026a-17", "exam": "2026a", "label": "Janvier 2026", "n": 17, "stem": "Les nanomatériaux sont des particules : (RF)", "case": null, "tables": [], "imgs": [], "c": "nano", "s": ["p21-11", "p21-14"], "t": [], "g": "Nanomatériaux :\n• taille de **1 à 100 nm** sur au moins une dimension ;\n• **pas de définition universelle** (définitions UE, ISO, pédagogique) ;\n• propriétés **uniques** liées à la grande surface spécifique ;\n• usages surtout **industriels** (cosmétique, BTP, électronique) ; **effets néfastes** possibles.\nQuestion RF : il faut cocher les propositions fausses.", "warn": [], "type": "multi", "opts": [["1", "Universellement bien définies"], ["2", "De dimensions inférieurs 1 nanomètres"], ["3", "Qui ont des propriétés uniques"], ["4", "Qui sont essentiellement utilisées en médecine"], ["5", "Qui peuvent avoir des effets néfastes sur la santé"]], "p": {"1": ["F", "Il n'existe [[pas de définition universelle]] des nanomatériaux."], "2": ["F", "La taille va de [[1 à 100 nm]] ; « inférieure à 1 nm » est faux."], "3": ["T", "Leur petite taille leur donne des **propriétés uniques** (surface spécifique, réactivité)."], "4": ["F", "Ils sont utilisés [[surtout dans l'industrie]] (cosmétique, BTP, électronique, textile), pas essentiellement en médecine."], "5": ["T", "Ils peuvent avoir des **effets néfastes** sur la santé (inflammation, stress oxydant)."]}, "key": ["1", "2", "4"], "fmt": "QCM", "rep": [["2024", 26]], "o": [["of2/o_2026a-17_0.png", 6]]}, {"id": "2026a-18", "exam": "2026a", "label": "Janvier 2026", "n": 18, "stem": "L’Organisation internationale de normalisation (ISO) classifie les nanomatériaux en : (RJ)", "case": null, "tables": [], "imgs": [], "c": "nano", "s": ["p21-13"], "t": [], "g": "Classification ISO des nanomatériaux, deux familles :\n• **nano-objets** : nanoparticules (3D), nanofibres/nanotubes (2D), nanofeuillets (1D) ;\n• **matériaux nanostructurés** : structure interne ou surface nanométrique ;\n• les **agrégats et agglomérats** sont rattachés aux matériaux nanostructurés.", "warn": [], "type": "multi", "opts": [["1", "Nanoobjets englobant les nanoparticules, les nanofibres et les nanofeuillets"], ["2", "Matériaux nanostructurés"], ["3", "Agrégats"], ["4", "Agglomérats"], ["5", "Particules"]], "p": {"1": ["T", "Les **nano-objets** regroupent nanoparticules, nanofibres et nanofeuillets."], "2": ["T", "Les **matériaux nanostructurés** forment la deuxième famille ISO."], "3": ["F", "Les [[agrégats]] sont rattachés aux matériaux nanostructurés, ils ne forment pas une famille ISO à part."], "4": ["F", "Les [[agglomérats]] sont aussi rattachés aux matériaux nanostructurés."], "5": ["F", "« Particules » n'est pas une famille de la classification ISO."]}, "key": ["1", "2"], "fmt": "QCM", "rep": [["2024", 27]], "o": [["of2/o_2026a-18_0.png", 11]]}, {"id": "2026a-19", "exam": "2026a", "label": "Janvier 2026", "n": 19, "stem": "Les principales voies de la démarche de prévention des effets sur la santé des nanomatériaux sont : (RJ)", "case": null, "tables": [], "imgs": [], "c": "nano", "s": ["p21-34", "p21-35"], "t": [], "g": "Prévention du risque nanomatériaux :\n1. **éliminer / substituer** les nanoformes ou opérations à risque ;\n2. **collectif** : vase clos, circuit fermé, automatisation, captage ;\n3. **organisation** : procédures, **nettoyage régulier**, **traçabilité** des expositions ;\n4. **EPI** adaptés (FFP3, gants, combinaison) en complément.", "warn": [], "type": "multi", "opts": [["1", "Eviter le nettoyage régulier des équipements de travail"], ["2", "Agir sur les procédés et les modes opératoires"], ["3", "Travailler en circuit fermé"], ["4", "Assurer la traçabilité de l’exposition des salariés"], ["5", "Doter les travailleurs de bavettes chirurgicales"]], "p": {"1": ["F", "Il faut au contraire un **nettoyage [[régulier]]** des équipements (à l'humide ou par aspiration filtrée)."], "2": ["T", "Agir sur les **procédés** et les modes opératoires réduit l'émission de nanoparticules."], "3": ["T", "Le **circuit fermé** empêche la mise en suspension."], "4": ["T", "La **traçabilité** de l'exposition des travailleurs permet le suivi à long terme."], "5": ["F", "Une [[bavette chirurgicale]] ne filtre pas les nanoparticules ; il faut un appareil filtrant **FFP3**."]}, "key": ["2", "3", "4"], "fmt": "QCM", "rep": [["2024", 28]], "o": [["of2/o_2026a-19_0.png", 35]]}, {"id": "2026a-20", "exam": "2026a", "label": "Janvier 2026", "n": 20, "stem": "Les concentrations de polluants dans l'air extérieur peuvent être influencées par tous ces facteurs sauf un lequel ?", "case": null, "tables": [], "imgs": [], "c": "pollu", "s": ["p10-21"], "t": [], "g": "Ce qui fait varier la concentration des polluants dans l'air :\n• **émissions** : quantité rejetée, proximité des sources ;\n• **météorologie** : vent, inversion thermique, soleil (ozone) ;\n• **relief** et activité **économique** ;\n• les caractéristiques de l'individu modifient sa **sensibilité**, pas la concentration.", "warn": [], "type": "single", "opts": [["A", "La quantité de polluants atmosphériques rejetés par les sources"], ["B", "La proximité des sources"], ["C", "Les conditions météorologiques"], ["D", "La croissance de l'économie"], ["E", "Les caractéristiques de l’individu"]], "key": ["E"], "p": {"A": ["T", "La **quantité rejetée** par les sources détermine directement la concentration."], "B": ["T", "La **proximité** des sources augmente la concentration respirée."], "C": ["T", "La **météo** (vent, inversion thermique) disperse ou piège les polluants."], "D": ["T", "La **croissance économique** augmente les émissions (industrie, transports, énergie)."], "E": ["F", "Les [[caractéristiques de l'individu]] agissent sur sa sensibilité, pas sur la concentration dans l'air : c'est l'exception demandée."]}, "fmt": "QCS", "rep": [["2025", 18], ["2024", 30]], "o": [["of2/o_2026a-20_0.png", 21]]}, {"id": "2026a-21", "exam": "2026a", "label": "Janvier 2026", "n": 21, "stem": "Les perturbateurs endocriniens environnementaux (PEE) peuvent agir sur l’organisme par un : (RJ)", "case": null, "tables": [], "imgs": [], "c": "pe", "s": ["p20-13", "p20-14"], "t": [], "g": "Mécanismes des perturbateurs endocriniens :\n• **mimétisme** (agoniste) : active le récepteur à la place de l'hormone ;\n• **blocage** (antagoniste) : empêche l'action de l'hormone ;\n• **perturbation** : modifie synthèse, transport, métabolisme ;\n• effets **complexes et peu prévisibles** : faibles doses, courbes non monotones, effets cocktails.", "warn": [], "type": "multi", "opts": [["1", "Effet mimétique"], ["2", "Effet de blocage"], ["3", "Effet perturbant"], ["4", "Mécanismes d’action prévisibles"], ["5", "Mécanisme d’action simple, bien connu"]], "p": {"1": ["T", "L'**effet mimétique** : le PE se fixe sur le récepteur et imite l'hormone."], "2": ["T", "L'**effet de blocage** : le PE occupe le récepteur et empêche l'hormone d'agir."], "3": ["T", "L'**effet perturbant** : le PE modifie la synthèse, le transport ou l'élimination des hormones."], "4": ["F", "Leurs mécanismes sont [[peu prévisibles]] (faibles doses, relations non monotones)."], "5": ["F", "Leur mécanisme n'est [[ni simple ni bien connu]] ; il reste en grande partie à l'étude."]}, "key": ["1", "2", "3"], "fmt": "QCM", "rep": [["2024", 31]], "o": [["of2/o_2026a-21_0.png", 9]]}, {"id": "2026a-22", "exam": "2026a", "label": "Janvier 2026", "n": 22, "stem": "Les anomalies du développement liées au PEE englobent :", "case": null, "tables": [], "imgs": [], "c": "pe", "s": ["p20-31"], "t": [], "g": "Effets des PE sur le développement :\n• **prématurité** ;\n• **faible poids de naissance** (croissance fœtale réduite) ;\n• troubles du **neurodéveloppement** et du **comportement** ;\n• exemple historique : le distilbène (DES) in utero.", "warn": [], "type": "multi", "opts": [["1", "Faible poids de naissance"], ["2", "Gros poids de naissance"], ["3", "Prématurité"], ["4", "Retard de dentition"], ["5", "Troubles du comportement"]], "p": {"1": ["T", "Le **faible poids de naissance** est un effet décrit des PE sur la croissance fœtale."], "2": ["F", "On décrit un [[faible]] poids de naissance, pas un gros poids."], "3": ["T", "La **prématurité** fait partie des anomalies du développement liées aux PE."], "4": ["F", "Le [[retard de dentition]] n'est pas décrit ; on retient prématurité, faible poids et troubles du comportement."], "5": ["T", "Les **troubles du comportement** traduisent l'atteinte du neurodéveloppement."]}, "key": ["1", "3", "5"], "fmt": "QCM", "rep": [["2025", 21], ["2024", 32]], "o": [["of2/o_2026a-22_0.png", 7]]}, {"id": "2026a-23", "exam": "2026a", "label": "Janvier 2026", "n": 23, "stem": "L’exposome : (RJ)", "case": null, "tables": [], "imgs": [], "c": "env", "s": ["p3-11"], "t": [], "g": "L'exposome (C. P. Wild, 2005) :\n• ensemble des expositions **non génétiques** d'un individu **de la conception à la mort** ;\n• **toutes natures** : externe générale (climat, social), externe spécifique (polluants, travail, alimentation), interne (inflammation, microbiote) ;\n• représentation **complexe et dynamique** ; à distinguer du génome.", "warn": [], "type": "multi", "opts": [["1", "Est la totalité des expositions d’un individu de sa naissance à sa mort"], ["2", "Est la totalité des expositions d’un individu de sa conception à sa mort"], ["3", "Intègre toutes les natures des expositions"], ["4", "Est une représentation complexe et dynamique des expositions"], ["5", "Ne considère que les expositions chimiques"]], "p": {"1": ["F", "L'exposome commence dès la [[conception]] (vie fœtale), pas à la naissance."], "2": ["T", "Il couvre toutes les expositions **de la conception à la mort**."], "3": ["T", "Il intègre **toutes les natures** d'exposition : chimiques, physiques, biologiques, sociales."], "4": ["T", "C'est une représentation **complexe et dynamique**, qui évolue tout au long de la vie."], "5": ["F", "Il ne se limite [[pas aux expositions chimiques]] ; il comprend aussi le bruit, le stress, l'alimentation, le climat."]}, "key": ["2", "3", "4"], "fmt": "QCM", "rep": [["2025", 22], ["2024", 33]], "o": [["of2/o_2026a-23_0.png", 9]]}, {"id": "2026a-24", "exam": "2026a", "label": "Janvier 2026", "n": 24, "stem": "La lésion présentée par Mme K relève principalement :", "case": "2026a-c1", "tables": [], "imgs": [], "c": "ri", "s": ["p9-22"], "t": [6], "g": "Radiodermite et effet déterministe :\n• **réaction tissulaire** due à la mort d'un grand nombre de cellules ;\n• **seuil** de dose ;\n• **gravité proportionnelle** à la dose ;\n• ici, dépassement de la limite peau/extrémités (Hp(0,07) > 500 mSv/an).", "warn": [], "type": "single", "opts": [["A", "D’un effet stochastique"], ["B", "D’un effet déterministe (réaction tissulaire)"], ["C", "D’un effet héréditaire obligatoire"], ["D", "D’un effet sans seuil démontré"], ["E", "D’un effet lié uniquement à la contamination interne"]], "key": ["B"], "p": {"A": ["F", "Un effet stochastique est sans seuil et donne cancers et effets héréditaires ; la radiodermite est **déterministe**."], "B": ["T", "La radiodermite est un **effet déterministe** (réaction tissulaire) avec seuil."], "C": ["F", "Aucun effet héréditaire n'est « obligatoire » ; il s'agit d'une réaction tissulaire **déterministe**."], "D": ["F", "La radiodermite a un [[seuil]] de dose ; elle n'est pas « sans seuil »."], "E": ["F", "La lésion vient d'une **irradiation externe** des mains près du faisceau, pas d'une contamination interne."]}, "fmt": "QCS", "o": [["of2/o_2026a-24_0.png", 7]]}, {"id": "2026a-25", "exam": "2026a", "label": "Janvier 2026", "n": 25, "stem": "L’argument radiobiologique le plus cohérent expliquant la différence déterministe vs stochastique est :", "case": "2026a-c1", "tables": [], "imgs": [], "c": "ri", "s": ["p9-22"], "t": [], "g": "Radiobiologie : deux devenirs après la lésion de l'ADN :\n• **mort** d'un grand nombre de cellules d'un tissu → effet **déterministe** (seuil) ;\n• **réparation imparfaite** → une cellule **survit avec une mutation** → effet **stochastique** (cancer), sans seuil ;\n• les déterministes ne sont pas toujours réversibles (cataracte, radionécrose).", "warn": [], "type": "single", "opts": [["A", "Les déterministes proviennent d’altérations génétiques dans une cellule survivante"], ["B", "Les stochastiques proviennent d’une destruction massive de cellules d’un tissu"], ["C", "Une réparation imparfaite peut laisser une cellule survivre avec mutation"], ["D", "Les stochastiques ont toujours un seuil en Gy"], ["E", "Les déterministes sont toujours réversibles"]], "key": ["C"], "p": {"A": ["F", "Les altérations génétiques d'une cellule survivante définissent l'effet [[stochastique]], pas le déterministe (inversion)."], "B": ["F", "La destruction massive de cellules définit l'effet [[déterministe]], pas le stochastique (inversion)."], "C": ["T", "Une **réparation imparfaite** peut laisser survivre une cellule mutée, point de départ d'un effet stochastique."], "D": ["F", "Les effets stochastiques n'ont [[pas de seuil]] démontré."], "E": ["F", "Les effets déterministes ne sont pas toujours réversibles : cataracte et radionécrose sont définitives."]}, "fmt": "QCS", "o": [["of2/o_2026a-25_0.png", 7]]}, {"id": "2026a-26", "exam": "2026a", "label": "Janvier 2026", "n": 26, "stem": "Chez Mme K, quel signe n’oriente pas vers une origine radio-induite chronique ? RF", "case": "2026a-c1", "tables": [], "imgs": [], "c": "ri", "s": ["p13-12", "p9-22"], "t": [], "g": "Signes de radiodermite chronique :\n• **atrophie** cutanée, peau fine et sèche ;\n• **dépilation** localisée ;\n• **télangiectasies** ;\n• **fissures** et ulcérations récidivantes sur peau fragilisée, risque de carcinome.\nDes papules urticariennes transitoires évoquent une allergie.", "warn": [], "type": "single", "opts": [["A", "Dépilation localisée"], ["E", "Papules urticariennes transitoires"], ["B", "Télangiectasies sur la zone atteinte"], ["C", "Fissures récidivantes sur peau fragilisée"], ["D", "Atrophie localisée avec peau fine"]], "key": ["E"], "p": {"A": ["T", "La **dépilation** localisée est un signe typique de radiodermite chronique."], "B": ["T", "Les **télangiectasies** sur la zone irradiée sont typiques."], "C": ["T", "Les **fissures récidivantes** sur une peau fragilisée sont typiques."], "D": ["T", "L'**atrophie** avec peau fine est le signe cardinal de la radiodermite chronique."], "E": ["F", "Des [[papules urticariennes]] transitoires évoquent une allergie, pas une atteinte radio-induite : c'est le signe qui n'oriente pas."]}, "fmt": "QCS", "o": [["of2/o_2026a-26_0.png", 6]]}, {"id": "2026a-27", "exam": "2026a", "label": "Janvier 2026", "n": 27, "stem": "Chez Mme K, quelle complication correspond le mieux à une réaction tissulaire typique, avec notion de seuil, à dépister en priorité ?", "case": "2026a-c1", "tables": [], "imgs": [], "c": "ri", "s": ["p9-22", "p9-31"], "t": [6], "g": "Complication à seuil à dépister chez une manipulatrice surexposée :\n• la **cataracte** radio-induite est un effet **déterministe** ;\n• la limite cristallin (Hp(3) > 150 mSv/an) est **dépassée** ;\n• leucémies, cancers thyroïdiens, CBP et effets héréditaires sont **stochastiques** (sans seuil).", "warn": [], "type": "single", "opts": [["A", "Leucémie radio-induite"], ["B", "Cancer thyroïdien radio-induit"], ["C", "Cataracte radio-induite"], ["D", "Effet héréditaire potentiel"], ["E", "Cancer broncho-pulmonaire radio-induit"]], "key": ["C"], "p": {"A": ["F", "La leucémie radio-induite est un effet [[stochastique]] ; la réaction tissulaire à seuil est la **cataracte**."], "B": ["F", "Le cancer thyroïdien est stochastique ; la réaction tissulaire à seuil est la **cataracte**."], "C": ["T", "La **cataracte** est déterministe et la limite cristallin est dépassée : c'est la complication à dépister."], "D": ["F", "Un effet héréditaire est stochastique ; la réaction tissulaire à seuil est la **cataracte**."], "E": ["F", "Le CBP radio-induit est stochastique ; la réaction tissulaire à seuil est la **cataracte**."]}, "fmt": "QCS", "o": [["of2/o_2026a-27_0.png", 7], ["of2/o_2026a-27_1.png", 6]]}, {"id": "2026a-28", "exam": "2026a", "label": "Janvier 2026", "n": 28, "stem": "Quelle interprétation est la plus juste ?", "case": "2026a-c1", "tables": [], "imgs": [], "c": "ri", "s": ["p9-21", "p9-13"], "t": [], "g": "Grandeurs en radioprotection :\n• **Bq** = **activité** de la source (désintégrations/s), pas la dose reçue ;\n• **Gy** = dose absorbée ; **Sv** = dose équivalente / efficace ;\n• **Hp(10)** corps entier, **Hp(0,07)** peau/extrémités, **Hp(3)** cristallin ;\n• en scopie, les **mains** près du faisceau reçoivent bien plus que le corps entier.", "warn": [], "type": "single", "opts": [["A", "Une activité élevée signifie automatiquement une dose élevée reçue par la manipulatrice"], ["B", "Une exposition corps entier faible exclut une radiodermite chronique (pas d’effet déterministe possible)"], ["C", "Il est logique d’avoir une activité élevée sans que cela traduise directement la dose reçue, et une faible exposition corps entier peut coexister avec une forte dose peau/extrémités, mesurée par une grandeur opérationnelle adaptée"], ["D", "Faible corps entier signifie absence de risque stochastique et absence de nécessité de traçabilité"], ["E", "Dose peau/extrémités très élevée s’exprime en Bq car c’est une dose locale"]], "key": ["C"], "p": {"A": ["F", "Une activité élevée ne signifie [[pas automatiquement]] une dose élevée : la dose dépend du temps, de la distance et des écrans."], "B": ["F", "Une faible dose corps entier n'exclut pas une forte dose aux **extrémités**, donc une radiodermite."], "C": ["T", "Activité ≠ dose, et faible corps entier compatible avec forte dose **peau/extrémités**, mesurée par Hp(0,07)."], "D": ["F", "Le risque stochastique existe même à faible dose (pas de seuil) et la **traçabilité** reste obligatoire."], "E": ["F", "Une dose s'exprime en [[Sv]] (ou Gy) ; le Bq mesure l'activité d'une source, jamais une dose."]}, "fmt": "QCS", "o": [["of2/o_2026a-28_0.png", 3]]}, {"id": "2026a-29", "exam": "2026a", "label": "Janvier 2026", "n": 29, "stem": "Quel enchaînement reflète le mieux le raisonnement médico-professionnel “tableau” ?", "case": "2026a-c1", "tables": [], "imgs": [], "c": "ri", "s": ["p5-23"], "t": [], "g": "Raisonnement « tableau » en maladie professionnelle :\n1. **repérer** la maladie ;\n2. la **relier** à une exposition professionnelle ;\n3. vérifier les 3 conditions : **maladie désignée**, **DPC**, **travaux** ;\n4. **constituer le dossier** (AT16, AT17, AT18). Présomption d'origine, pas de calcul de risque.", "warn": [], "type": "single", "opts": [["A", "Prouver biologiquement ⇾ calculer le risque exact ⇾ si risque > 50% alors MP"], ["B", "Repérer ⇾ lier à l’exposition pro ⇾ vérifier maladie/délai/travaux → constituer le dossier"], ["C", "Dose faible ⇾ exclure MP"], ["D", "Chronologie atypique ⇾ exclure MP"], ["E", "Tout effet tardif = effet déterministe"]], "key": ["B"], "p": {"A": ["F", "Le système des tableaux repose sur la **présomption** (maladie + DPC + travaux), pas sur un risque calculé à 50 %."], "B": ["T", "Repérer → lier à l'exposition → vérifier **maladie / délai / travaux** → constituer le dossier."], "C": ["F", "Une dose faible n'exclut pas la MP : on vérifie **maladie, délai, travaux**."], "D": ["F", "Une chronologie atypique n'exclut pas automatiquement : on confronte aux **conditions du tableau**."], "E": ["F", "Un effet tardif peut être **stochastique** (cancer), pas forcément déterministe."]}, "fmt": "QCS", "o": [["of2/o_2026a-29_0.png", 10], ["of2/o_2026a-29_1.png", 11]]}, {"id": "2026a-30", "exam": "2026a", "label": "Janvier 2026", "n": 30, "stem": "Mme K dit : « Si je ne dépasse pas la limite, alors je suis en sécurité, non ? » La réponse du médecin du travail la plus juste est :", "case": "2026a-c1", "tables": [], "imgs": [], "c": "ri", "s": ["p9-23"], "t": [], "g": "Principes de radioprotection :\n• **justification** : le bénéfice doit dépasser le risque ;\n• **optimisation (ALARA)** : exposition aussi faible que raisonnablement possible ;\n• **limitation** : les limites sont des **plafonds**, pas des objectifs ;\n• le risque stochastique n'a **pas de seuil** ; une radiodermite signe un défaut d'optimisation.", "warn": [], "type": "single", "opts": [["A", "Oui : en dessous des limites, il n’y a ni risque déterministe ni risque stochastique"], ["B", "Oui, mais uniquement pour les effets stochastiques"], ["C", "Non : les limites sont des plafonds, pas des objectifs ; il faut justification + ALARA, et la présence d’une radiodermite indique déjà un problème d’optimisation, même si le “corps entier” est bas"], ["D", "Non, car seules les limites “peau” existent ; le cristallin n’a pas de limite utile"], ["E", "Non, car toute exposition même minime entraîne forcément une radiodermite"]], "key": ["C"], "p": {"A": ["F", "Sous la limite, le risque [[stochastique]] persiste, car il n'a pas de seuil."], "B": ["F", "C'est justement pour les effets **stochastiques** qu'aucune dose n'est sans risque."], "C": ["T", "Les limites sont des **plafonds** ; il faut justification et ALARA, et la radiodermite prouve déjà un problème d'optimisation."], "D": ["F", "Le cristallin a bien une limite utile : **150 mSv/an** en Algérie."], "E": ["F", "Une exposition minime ne donne pas forcément de radiodermite, qui a un **seuil**."]}, "fmt": "QCS", "o": [["of2/o_2026a-30_0.png", 8], ["of2/o_2026a-30_1.png", 9]]}, {"id": "2026a-31", "exam": "2026a", "label": "Janvier 2026", "n": 31, "stem": "RF : Pour répondre à « Est-ce que je risque un cancer ? », le MT rappelle les caractéristiques des effets stochastiques. Quelle proposition est fausse ?", "case": "2026a-c1", "tables": [], "imgs": [], "c": "ri", "s": ["p9-22"], "t": [], "g": "Caractères des effets stochastiques :\n• **pas de seuil** démontré ;\n• **probabilité** qui augmente avec la dose cumulée ;\n• **gravité indépendante** de la dose ;\n• **latence longue** (années à décennies). Quelques heures à semaines = effets déterministes aigus.", "warn": [], "type": "single", "opts": [["A", "La latence est souvent longue"], ["B", "Le risque augmente avec la dose cumulée"], ["C", "La gravité n’est pas dose-dépendante"], ["D", "Il n’existe pas de seuil démontré"], ["E", "Ils surviennent typiquement en quelques heures à quelques semaines"]], "key": ["E"], "p": {"A": ["T", "La **latence** des effets stochastiques est longue (souvent plusieurs années)."], "B": ["T", "Le **risque augmente** avec la dose cumulée."], "C": ["T", "La **gravité** du cancer ne dépend pas de la dose reçue."], "D": ["T", "Il n'existe **pas de seuil** démontré."], "E": ["F", "Des effets en quelques heures à quelques semaines sont des effets [[déterministes]] aigus ; les stochastiques surviennent après des années. C'est la proposition fausse."]}, "fmt": "QCS", "cs": "Manipulatrice de 32 ans, actes scanner-guidés près du faisceau : **radiodermite chronique** des doigts, dépassement des limites **cristallin** et **extrémités**. Effet déterministe (seuil) : dépister la cataracte, corriger l'optimisation (ALARA) ; le risque stochastique persiste sans seuil.", "o": [["of2/o_2026a-31_0.png",
