 blanc n°2", "n": 32, "stem": "Quelles associations « maladie allergique professionnelle → réservoir » sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "bio", "s": [], "t": [], "warn": [], "g": "Allergies d'origine biologique :\n| Maladie | Réservoir | Signes |\n| Poumon du fermier | foin, fourrages, paille, céréales moisis | dyspnée, crépitants, images typiques |\n| Asthme allergique | moisissures des saucissons | toux chronique, dyspnée |\nAllergènes : **moisissures**, **actinomycètes**.", "type": "multi", "opts": [["1", "Poumon du fermier → foin, fourrages, paille, céréales moisies."], ["2", "Asthme allergique → moisissures utilisées dans la fabrication des saucissons."], ["3", "Le poumon du fermier se transmet par inhalation répétée de particules de moisissures."], ["4", "Le poumon du fermier se manifeste par une dyspnée avec râles crépitants et images radiologiques typiques."], ["5", "Ces allergies sont liées à des virus."]], "p": {"1": ["T", "Le **poumon du fermier** (pneumopathie d'hypersensibilité) : **foin, fourrages, paille, céréales moisies**."], "2": ["T", "**Asthme allergique** chez les travailleurs exposés aux **moisissures des saucissons** (trempage, brossage)."], "3": ["T", "Transmission par **inhalation répétée** de moisissures."], "4": ["T", "Symptômes : **dyspnée, râles crépitants**, images radiologiques typiques."], "5": ["F", "Elles sont liées à des **allergènes** : **moisissures**, bactéries **actinomycètes**."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc2-32_0.png", 3]]}, {"id": "blanc2-33", "exam": "blanc2", "label": "Examen blanc n°2", "n": 33, "stem": "Concernant la structure d'un tableau de maladie professionnelle, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "atmp", "s": [], "t": [], "warn": [], "g": "Structure d'un tableau de MP :\n| Colonne | Contenu |\n| Gauche | désignation de la maladie (± examens) |\n| Milieu | **délai de prise en charge (DPC)** |\n| Droite | liste des travaux (indicative ou limitative) |\n**DPC** = de la **cessation de l'exposition** à la **1re constatation médicale** ; court (aigu) ou long (chronique, cancer).", "type": "multi", "opts": [["1", "La colonne de gauche contient la désignation de la maladie."], ["2", "La colonne du milieu contient le délai de prise en charge."], ["3", "La colonne de droite contient la liste des principaux travaux susceptibles de provoquer la maladie."], ["4", "Le DPC est la période entre le début de l'exposition et la première constatation médicale."], ["5", "Un DPC long concerne plutôt les lésions chroniques et les cancers."]], "p": {"1": ["T", "Colonne de **gauche** : **désignation de la maladie** (lésions, symptômes, examens)."], "2": ["T", "Colonne du **milieu** : **DPC**."], "3": ["T", "Colonne de **droite** : **liste des travaux**."], "4": ["F", "Le DPC court de la **cessation** du travail exposant jusqu'à la **1re constatation médicale**."], "5": ["T", "**DPC court** : lésions aiguës ; **DPC long** : lésions chroniques / **cancers**."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc2-33_0.png", 7]]}, {"id": "blanc2-34", "exam": "blanc2", "label": "Examen blanc n°2", "n": 34, "stem": "Associez chaque pesticide à sa famille et à sa caractéristique.", "case": null, "tables": [], "imgs": [], "c": "pest", "s": [], "t": [], "warn": [], "g": "Classification des pesticides selon la cible :\n| Famille | Cible | Exemples |\n| Insecticides OC | insectes | DDT, lindane (persistants) |\n| Insecticides OP | insectes | parathion (très toxique), malathion (peu toxique) |\n| Carbamates | insectes | inhibition **réversible** des cholinestérases |\n| Herbicides | mauvaises herbes | paraquat (très toxique), diquat |\n| Rodenticides, fongicides, hélicides, acaricides | rongeurs, champignons, mollusques, acariens | — |", "type": "match", "left": [["1", "DDT, lindane"], ["2", "Parathion"], ["3", "Malathion"], ["4", "Paraquat"]], "right": [["a", "Insecticide organochloré · très stable, persiste dans le sol, l'eau et les aliments"], ["b", "Insecticide organophosphoré · hautement toxique"], ["c", "Insecticide organophosphoré · peu toxique"], ["d", "Herbicide · très toxique"]], "corr": {"1": ["a"], "2": ["b"], "3": ["c"], "4": ["d"]}, "p": {"1": [null, "**DDT** et **lindane** sont des **organochlorés**, chimiquement **très stables** et persistants : 1-a."], "2": [null, "Le **parathion** est un organophosphoré **hautement toxique** : 2-b."], "3": [null, "Le **malathion** est un organophosphoré **peu toxique** : 3-c."], "4": [null, "Le **paraquat** est un **herbicide très toxique** : 4-d."]}, "fmt": "Association", "o": [["of2/o_blanc2-34_0.png", 2]]}, {"id": "blanc2-35", "exam": "blanc2", "label": "Examen blanc n°2", "n": 35, "stem": "Concernant la voie cutanée de pénétration des toxiques, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "toxi", "s": [], "t": [], "warn": [], "g": "La voie cutanée :\n• majeure pour les substances **lipophiles** et les contacts **prolongés** ;\n• ↑ par : grande surface, **peau lésée**, **occlusion**, **chaleur**, certains solvants, forte concentration ;\n• la **métrologie d'ambiance** peut **sous-estimer** l'imprégnation → intérêt de la **surveillance biologique**.", "type": "multi", "opts": [["1", "Elle est importante pour les substances lipophiles."], ["2", "L'absorption augmente avec une peau lésée ou une grande surface contaminée."], ["3", "L'occlusion et la chaleur augmentent l'absorption."], ["4", "Une mesure atmosphérique bien réalisée reflète toujours l'imprégnation globale."], ["5", "Dans ce cas, la surveillance biologique est particulièrement utile."]], "p": {"1": ["T", "Voie d'entrée majeure pour les substances **lipophiles**."], "2": ["T", "Facteurs cités : **grande surface**, **peau lésée**."], "3": ["T", "**Occlusion** et **chaleur** augmentent l'absorption."], "4": ["F", "La voie cutanée explique qu'une mesure atmosphérique **peut sous-estimer** l'imprégnation globale."], "5": ["T", "La **surveillance biologique** intègre la voie cutanée : elle est alors **particulièrement utile**."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc2-35_0.png", 3]]}, {"id": "blanc2-36", "exam": "blanc2", "label": "Examen blanc n°2", "n": 36, "stem": "Associez chaque toxique à sa catégorie selon la classification.", "case": null, "tables": [], "imgs": [], "c": "toxi", "s": [], "t": [], "warn": [], "g": "Classification pratique des toxiques :\n| Critère | Catégories | Exemples |\n| Famille chimique | métaux / minéraux ; organiques ; organométalliques | Pb, As ; solvants ; méthylmercure |\n| Forme dans le milieu | gaz ; vapeurs ; particules / aérosols | CO, H₂S ; benzène ; silice, fumées |\nOn ne déduit **jamais la toxicité de la seule famille** ; la forme oriente vers les **voies** de pénétration.", "type": "match", "left": [["1", "CO, H₂S"], ["2", "Benzène (vapeurs)"], ["3", "Silice, fumées"], ["4", "Plomb, arsenic"], ["5", "Méthylmercure"]], "right": [["a", "Gaz"], ["b", "Vapeurs"], ["c", "Particules / aérosols"], ["d", "Métaux / minéraux"], ["e", "Organométalliques"]], "corr": {"1": ["a"], "2": ["b"], "3": ["c"], "4": ["d"], "5": ["e"]}, "p": {"1": [null, "**CO, H₂S** : **gaz** (forme dans le milieu) : 1-a."], "2": [null, "**Benzène** : **vapeurs** : 2-b."], "3": [null, "**Silice, fumées** : **particules / aérosols** : 3-c."], "4": [null, "**Plomb, arsenic** : **métaux / minéraux** (famille chimique) : 4-d."], "5": [null, "**Méthylmercure** : **organométallique** : 5-e."]}, "fmt": "Association", "o": [["of2/o_blanc2-36_0.png", 2]]}, {"id": "blanc2-37", "exam": "blanc2", "label": "Examen blanc n°2", "n": 37, "stem": "Concernant les insecticides organophosphorés et organochlorés, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "pest", "s": [], "t": [], "warn": [], "g": "Insecticides :\n• **organochlorés** (DDT, lindane) : **très stables**, persistants dans l'environnement ;\n• **organophosphorés** (parathion, malathion) : dérivés de l'acide phosphorique, **inhibition de l'AChE**, **cause majeure d'intoxication aiguë** ;\n• **carbamates** : inhibition **réversible**, moins toxiques.", "type": "multi", "opts": [["1", "Les organophosphorés sont des dérivés de l'acide phosphorique."], ["2", "Les organophosphorés inhibent l'acétylcholinestérase."], ["3", "Les organophosphorés sont une cause majeure d'intoxication aiguë."], ["4", "Les organochlorés sont chimiquement instables et se dégradent rapidement."], ["5", "Les carbamates sont généralement moins toxiques que les organophosphorés."]], "p": {"1": ["T", "Les **OP** dérivent de l'**acide phosphorique**."], "2": ["T", "Ils entraînent une **inhibition de l'acétylcholinestérase**."], "3": ["T", "Le cours : les OP sont une **cause majeure d'intoxication aiguë**."], "4": ["F", "Les **OC** sont au contraire **très stables** et **persistent** dans le sol, l'eau et les aliments."], "5": ["T", "Les **carbamates** : inhibition **réversible**, **moins toxiques**."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc2-37_0.png", 2]]}, {"id": "blanc2-38", "exam": "blanc2", "label": "Examen blanc n°2", "n": 38, "stem": "Concernant la radiopathologie en santé au travail, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "ri", "s": [], "t": [], "warn": [], "g": "Radiopathologie professionnelle :\n• **aiguë** (forte dose, court, accidentelle) / **chronique** (doses répétées) ;\n• **localisée** (peau, mains, cristallin) / **générale** (corps entier) ;\n• **tardive** : cancers, après latence ;\n• limite professionnelle corps entier : **20 mSv/an en moyenne**.", "type": "multi", "opts": [["1", "Les atteintes aiguës correspondent à une forte dose sur un temps court, souvent accidentelle."], ["2", "Les atteintes chroniques correspondent à des doses répétées lors d'expositions prolongées."], ["3", "On distingue des effets localisés (peau, mains, cristallin) et des effets généraux (corps entier)."], ["4", "Les effets tardifs (cancers) surviennent après une latence parfois longue."], ["5", "La limite d'exposition professionnelle corps entier est en moyenne de 50 mSv par an."]], "p": {"1": ["T", "**Aiguës** : forte dose, temps court, souvent **accidentelle**."], "2": ["T", "**Chroniques** : doses **répétées**, expositions prolongées."], "3": ["T", "Effets **localisés** vs **généraux**."], "4": ["T", "**Effets tardifs** (cancers) après une **latence** parfois longue."], "5": ["F", "Le cours retient **20 mSv/an en moyenne**."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc2-38_0.png", 6]]}, {"id": "blanc2-39", "exam": "blanc2", "label": "Examen blanc n°2", "n": 39, "stem": "Concernant les listes de travaux des tableaux de MP, quelle proposition est exacte ?", "case": null, "tables": [], "imgs": [], "c": "atmp", "s": [], "t": [], "warn": [], "g": "Listes de travaux :\n• **indicative** (groupe 1, intoxications) : **ouverte**, d'autres travaux peuvent être retenus ;\n• **limitative** (groupes 2 et 3) : seuls les **travaux listés** ouvrent droit à la présomption.", "type": "single", "opts": [["A", "Pour une liste indicative (groupe 1), le médecin peut identifier d'autres travaux ne figurant pas sur la liste."], ["B", "Pour une liste limitative, tout travail exposant est accepté même s'il n'est pas listé."], ["C", "Les tableaux du groupe 2 ont des listes indicatives."], ["D", "Le groupe 1 concerne les infections microbiennes."], ["E", "Le type de liste n'a aucune conséquence sur la reconnaissance."]], "p": {"A": ["T", "Liste **indicative** = liste **ouverte** : d'**autres travaux** peuvent être retenus."], "B": ["F", "Une liste **limitative** n'admet que les **travaux énumérés**."], "C": ["F", "Les groupes **2 et 3** ont des listes **limitatives**."], "D": ["F", "Le groupe 1 concerne les **intoxications**."], "E": ["F", "Le type de liste **conditionne** la reconnaissance des travaux."]}, "key": ["A"], "fmt": "QCS", "o": [["of2/o_blanc2-39_0.png", 7]]}, {"id": "blanc2-40", "exam": "blanc2", "label": "Examen blanc n°2", "n": 40, "stem": "Associez chaque grandeur dosimétrique à son unité et à sa signification.", "case": null, "tables": [], "imgs": [], "c": "ri", "s": [], "t": [], "warn": [], "g": "Grandeurs en radioprotection :\n| Grandeur | Unité | Sens |\n| Activité | Bq | désintégrations/s de la source |\n| Dose absorbée | Gy (1 J/kg) | énergie déposée (physique) |\n| Dose équivalente / efficace | Sv | risque biologique (rayonnement, tissu, w_T) |\n| Hp(d) | Sv | grandeur opérationnelle mesurée par les dosimètres |", "type": "match", "left": [["1", "Dose absorbée"], ["2", "Dose équivalente / efficace"], ["3", "Activité d'une source"]], "right": [["a", "Gray (Gy) · énergie déposée par unité de masse (1 Gy = 1 J/kg)"], ["b", "Sievert (Sv) · risque biologique selon le rayonnement et le tissu"], ["c", "Becquerel (Bq) · nombre de désintégrations par seconde"]], "corr": {"1": ["a"], "2": ["b"], "3": ["c"]}, "p": {"1": [null, "La **dose absorbée** s'exprime en **Gy** : **1 J/kg**, grandeur **physique** : 1-a."], "2": [null, "La **dose équivalente / efficace** s'exprime en **Sv** : elle tient compte du **type de rayonnement** et du **tissu** : 2-b."], "3": [null, "L'**activité** d'une source s'exprime en **Bq** : 3-c."]}, "fmt": "Association", "o": [["of2/o_blanc2-40_0.png", 3]]}, {"id": "blanc2-41", "exam": "blanc2", "label": "Examen blanc n°2", "n": 41, "stem": "Concernant le stress et l'épuisement professionnel, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "burn", "s": [], "t": [], "warn": [], "g": "Stress et burn-out (Dr Belkassa) :\n• charge **raisonnable** = capacité à faire face ;\n• **rupture** par contraintes excessives **ou** usure chronique des ressources ;\n• **stress** = déséquilibre **profond et durable** demandes / capacités ;\n• conséquences en retour sur le **travail** et les **relations**.", "type": "multi", "opts": [["1", "La charge de travail est raisonnable tant que la personne peut faire face aux sollicitations."], ["2", "L'équilibre est rompu quand les contraintes sont excessives."], ["3", "L'équilibre peut aussi être rompu par une usure chronique qui diminue les ressources."], ["4", "Le stress se caractérise par un déséquilibre profond et durable entre demandes et capacités."], ["5", "Le stress n'a aucune conséquence sur le travail."]], "p": {"1": ["T", "Le cours : la charge est **raisonnable** quand la personne **fait face**."], "2": ["T", "Rupture d'équilibre si **contraintes excessives**."], "3": ["T", "Ou par une **usure chronique** qui **diminue les ressources** disponibles."], "4": ["T", "**Déséquilibre profond et durable** entre **demandes et capacités** = état de **stress**."], "5": ["F", "Le stress a **en retour des conséquences sur le travail** et les relations."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc2-41_0.png", 4]]}, {"id": "blanc2-42", "exam": "blanc2", "label": "Examen blanc n°2", "n": 42, "stem": "Associez chaque agent cancérogène professionnel à sa localisation et à son tableau de réparation.", "case": null, "tables": [], "imgs": [], "c": "cancer", "s": [], "t": [], "warn": [], "g": "Agents cancérogènes → localisation → TMP :\n| Agent | Localisation | TMP |\n| Amines aromatiques | vessie | 15 |\n| Bois | ethmoïde, sinus | 47 |\n| Chlorure de vinyle | angiosarcome du foie | 51 |\n| Benzène | leucémies | 4 |\n| Amiante | mésothéliome, CBP | 30 |", "type": "match", "left": [["1", "Amines aromatiques"], ["2", "Poussières de bois"], ["3", "Chlorure de vinyle monomère"], ["4", "Benzène"], ["5", "Amiante"]], "right": [["a", "Vessie · TMP 15"], ["b", "Ethmoïde et sinus · TMP 47"], ["c", "Angiosarcome du foie · TMP 51"], ["d", "Leucémies · TMP 4"], ["e", "Mésothéliome · TMP 30"]], "corr": {"1": ["a"], "2": ["b"], "3": ["c"], "4": ["d"], "5": ["e"]}, "p": {"1": [null, "**Amines aromatiques** → **vessie**, **TMP 15** : 1-a."], "2": [null, "**Poussières de bois** → **ethmoïde / sinus**, **TMP 47** : 2-b."], "3": [null, "**Chlorure de vinyle** → **angiosarcome hépatique**, **TMP 51** : 3-c."], "4": [null, "**Benzène** → **leucémies**, **TMP 4** : 4-d."], "5": [null, "**Amiante** → **mésothéliome** (et CBP), **TMP 30** : 5-e."]}, "fmt": "Association", "o": [["of2/o_blanc2-42_0.png", 8], ["of2/o_blanc2-42_1.png", 6]]}, {"id": "blanc2-43", "exam": "blanc2", "label": "Examen blanc n°2", "n": 43, "stem": "Quels secteurs d'activité exposent aux agents biologiques ?", "case": null, "tables": [], "imgs": [], "c": "bio", "s": [], "t": [], "warn": [], "g": "Secteurs exposés aux agents biologiques :\n• **soins** et laboratoires ;\n• **agriculture** ; **agroalimentaire** ;\n• **assainissement** (éboueurs, tri, compostage, égouts, épuration) ;\n• **entretien et maintenance**.", "type": "multi", "opts": [["1", "Le milieu agricole : agriculteurs, forestiers, conducteurs d'engins agricoles."], ["2", "L'industrie agroalimentaire : transport, stockage et transformation de produits animaux ou végétaux."], ["3", "L'assainissement : éboueurs, centres de tri, égoutiers, stations d'épuration."], ["4", "L'entretien et la maintenance, y compris le personnel de nettoyage."], ["5", "Seul le secteur hospitalier est concerné."]], "p": {"1": ["T", "**Agriculture** : agriculteurs, forestiers, conducteurs d'engins."], "2": ["T", "**Agroalimentaire** : viande, poisson, œufs, lait, fruits…"], "3": ["T", "**Assainissement** : éboueurs, tri, compostage, égoutiers, stations d'épuration."], "4": ["T", "**Entretien et maintenance** : nettoyage, maintenance d'automates, électriciens, plombiers en zones à risque."], "5": ["F", "De **nombreux secteurs** sont concernés, pas seulement l'hôpital."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc2-43_0.png", 3]]}, {"id": "blanc2-44", "exam": "blanc2", "label": "Examen blanc n°2", "n": 44, "stem": "Associez chaque groupe d'allergènes d'origine animale aux professions exposées.", "case": null, "tables": [], "imgs": [], "c": "asthme", "s": [], "t": [], "warn": [], "g": "Agents d'asthme d'origine animale (Pr Kaced-Benazzouz) :\n| Agent | Professions |\n| Mammifères (cheval, bovin, porc, rongeurs) | agriculteurs, vétérinaires, animaleries, chercheurs |\n| Arthropodes (insectes, acariens de stockage, crustacés) | entomologistes, pêcheurs, industrie alimentaire |\n| Lactosérum, œuf, carmin, enzymes | agroalimentaire, détergents, pharmacie |", "type": "match", "left": [["1", "Allergènes des mammifères (cheval, bovin, rongeurs)"], ["2", "Allergènes des arthropodes (insectes, acariens de stockage, crustacés)"], ["3", "Enzymes biologiques (alcalase, trypsine)"]], "right": [["a", "Agriculteurs, vétérinaires, animaleries, chercheurs"], ["b", "Entomologistes, pêcheurs, agriculteurs, industrie alimentaire"], ["c", "Industrie des détergents, industrie pharmaceutique, agroalimentaire"]], "corr": {"1": ["a"], "2": ["b"], "3": ["c"]}, "p": {"1": [null, "**Mammifères** (cheval, bovin, porc, rongeurs) → **agriculteurs, vétérinaires, animaleries, chercheurs** : 1-a."], "2": [null, "**Arthropodes** (insectes, acariens, crustacés) → **entomologistes, pêcheurs**, agriculteurs, industrie alimentaire : 2-b."], "3": [null, "**Enzymes** → **détergents, pharmacie**, agroalimentaire : 3-c."]}, "fmt": "Association", "o": [["of2/o_blanc2-44_0.png", 14]]}, {"id": "blanc2-45", "exam": "blanc2", "label": "Examen blanc n°2", "n": 45, "stem": "Concernant la 1re phase (syndrome neurasthénique) de l'encéphalopathie aux solvants, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "solv", "s": [], "t": [], "warn": [], "g": "1re phase — **syndrome neurasthénique** :\n• fatigue, irritabilité, céphalées, sudation, nausées, tachycardie, vertiges, troubles de concentration et de mémoire ;\n• **sans** détérioration intellectuelle ni trouble de l'humeur ;\n• diagnostic **impossible avec certitude** à ce stade ;\n• **réversible** au retrait.", "type": "multi", "opts": [["1", "Elle associe fatigue, irritabilité, céphalées et troubles de la concentration."], ["2", "Elle s'accompagne d'une détérioration intellectuelle."], ["3", "Le diagnostic de psycho-syndrome organique peut être posé avec certitude à ce stade."], ["4", "Elle est complètement réversible en cas de retrait du risque."], ["5", "Elle peut comporter tachycardie et nausées."]], "p": {"1": ["T", "Signes cités : **fatigue, irritabilité, céphalées**, sudation, vertiges, **troubles de concentration**, mémoire."], "2": ["F", "Elle est **sans détérioration intellectuelle** et sans trouble de l'humeur."], "3": ["F", "Il est **impossible** à ce stade de poser le diagnostic avec un degré de certitude suffisant."], "4": ["T", "**Réversibilité complète** en cas de retrait."], "5": ["T", "**Tachycardie** et **nausées** font partie des signes cités."]}, "key": ["1", "4", "5"], "fmt": "QCM", "o": [["of2/o_blanc2-45_0.png", 3]]}, {"id": "blanc2-46", "exam": "blanc2", "label": "Examen blanc n°2", "n": 46, "stem": "Concernant la définition opérationnelle des horaires atypiques, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "hor", "s": [], "t": [], "warn": [], "g": "Horaires atypiques :\n• en dehors de la **semaine standard** ;\n• formes : **posté**, **nuit**, **fin de semaine** ;\n• **nuit** en Algérie : **21 h – 5 h**, chevauchant la période biologique du sommeil ;\n• horaire atypique dès **un marqueur** présent.", "type": "multi", "opts": [["1", "Ils désignent les organisations temporelles situées en dehors de la « semaine standard »."], ["2", "Les formes classiques sont le travail posté, le travail de nuit et le travail de fin de semaine."], ["3", "En Algérie, le travail de nuit correspond au travail effectué entre 21 h et 5 h."], ["4", "On parle d'horaire atypique dès qu'au moins un marqueur d'exposition est présent."], ["5", "Le travail de nuit ne chevauche pas la période biologique du sommeil."]], "p": {"1": ["T", "Définition : organisations **en dehors de la semaine standard**."], "2": ["T", "Formes classiques : **posté, nuit, fin de semaine**."], "3": ["T", "Algérie : travail de nuit = **21 h – 5 h**."], "4": ["T", "Logique « exposition » : **au moins un marqueur** suffit."], "5": ["F", "Le travail nocturne **chevauche la période biologique du sommeil**."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc2-46_0.png", 1]]}, {"id": "blanc2-47", "exam": "blanc2", "label": "Examen blanc n°2", "n": 47, "stem": "Concernant les acteurs de la santé au travail en Algérie, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "intro", "s": [], "t": [], "warn": [], "g": "Acteurs de la santé au travail :\n| Acteur | Rôle |\n| Service de médecine du travail | surveillance des travailleurs et des conditions de travail, conseil, alerte |\n| CPHS | analyse et prévention collective |\n| Inspection du travail | contrôle de la législation |\n| CNAS | assurance AT/MP, prévention |\n| INPRP | appui technique et institutionnel |", "type": "multi", "opts": [["1", "L'inspection du travail contrôle l'application de la législation du travail."], ["2", "La CNAS assure les AT/MP et mène des actions de prévention."], ["3", "L'INPRP apporte un appui technique et institutionnel en prévention."], ["4", "La CPHS est chargée du contrôle de la législation dans l'entreprise."], ["5", "Les structures sanitaires apportent soins, avis spécialisés et examens."]], "p": {"1": ["T", "Rôle principal de l'**inspection du travail** : **contrôle** de l'application de la législation."], "2": ["T", "La **CNAS** : assurance **AT/MP** et actions de **prévention**."], "3": ["T", "Les organismes de prévention, notamment l'**INPRP**, apportent un **appui technique et institutionnel**."], "4": ["F", "La **CPHS** fait l'**analyse et la prévention collective** ; le contrôle de la législation relève de l'inspection du travail."], "5": ["T", "**Structures sanitaires** : soins, avis spécialisés, examens."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc2-47_0.png", 6], ["of2/o_blanc2-47_1.png", 5]]}, {"id": "blanc2-48", "exam": "blanc2", "label": "Examen blanc n°2", "n": 48, "stem": "Quels risques pour la santé liés à l'usage des TIC sont ?", "case": null, "tables": [], "imgs": [], "c": "tic", "s": [], "t": [], "warn": [], "g": "Risques des TIC (plan du cours) :\n1. **TMS** ;\n2. **troubles oculaires** ;\n3. **troubles auditifs** ;\n4. **champs électromagnétiques** (exposition prolongée) ;\n5. **risques psychologiques** ;\n6. **troubles du sommeil**.", "type": "multi", "opts": [["1", "Les troubles musculosquelettiques."], ["2", "Les troubles oculaires."], ["3", "Les troubles auditifs."], ["4", "Les effets de l'exposition prolongée aux champs électromagnétiques."], ["5", "Les troubles du sommeil et les risques psychologiques."]], "p": {"1": ["T", "Premier risque cité : **TMS**."], "2": ["T", "**Troubles oculaires** cités."], "3": ["T", "**Troubles auditifs** cités (casques, écouteurs)."], "4": ["T", "**Champs électromagnétiques** : effets de l'exposition prolongée."], "5": ["T", "**Risques psychologiques** et **troubles du sommeil** sont cités."]}, "key": ["1", "2", "3", "4", "5"], "fmt": "QCM", "o": [["of2/o_blanc2-48_0.png", 1]]}, {"id": "blanc2-49", "exam": "blanc2", "label": "Examen blanc n°2", "n": 49, "stem": "Quelles sources d'exposition au plomb sont ?", "case": null, "tables": [], "imgs": [], "c": "metaux", "s": [], "t": [], "warn": [], "g": "Sources d'exposition au plomb :\n• **professionnelles** : accumulateurs, tuyaux, couvertures, munitions… ;\n• **environnementales** : saturnisme **hydrique** (tuyaux corrodés), **peintures** et poussières chez l'**enfant**.", "type": "multi", "opts": [["1", "La fabrication et la récupération d'accumulateurs."], ["2", "La fabrication de tuyaux d'évacuation d'eau et d'éléments de couverture."], ["3", "La fabrication et le maniement de munitions (plomb de chasse)."], ["4", "Le saturnisme hydrique de la population générale par corrosion de tuyaux en plomb."], ["5", "Le saturnisme de l'enfant par les peintures murales au plomb et les poussières."]], "p": {"1": ["T", "Les **accumulateurs** sont une source classique."], "2": ["T", "**Tuyaux** et **éléments de couverture** (toits, terrasses) sont cités."], "3": ["T", "**Munitions** : source citée."], "4": ["T", "**Saturnisme hydrique** : corrosion des **tuyaux en Pb**."], "5": ["T", "Les **peintures murales au plomb** et les poussières expliquent le saturnisme de l'**enfant**."]}, "key": ["1", "2", "3", "4", "5"], "fmt": "QCM", "o": [["of2/o_blanc2-49_0.png", 1]]}, {"id": "blanc2-50", "exam": "blanc2", "label": "Examen blanc n°2", "n": 50, "stem": "Selon la définition de l'OMS, quelles propositions concernant la santé environnementale sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "env", "s": [], "t": [], "warn": [], "g": "Santé environnementale (OMS) :\n• aspects de la **santé humaine** et de la **qualité de vie** ;\n• déterminés par les facteurs **physiques, chimiques, biologiques, sociaux, psychosociaux, esthétiques** ;\n• inclut la **gestion, le contrôle et la prévention** pour les **générations actuelles et futures**.", "type": "multi", "opts": [["1", "Elle comprend les aspects de la santé humaine, y compris la qualité de la vie."], ["2", "Elle prend en compte les facteurs physiques, chimiques et biologiques de l'environnement."], ["3", "Elle prend aussi en compte les facteurs sociaux, psychosociaux et esthétiques."], ["4", "Elle concerne la gestion et la prévention des facteurs environnementaux susceptibles d'affecter les générations futures."], ["5", "Elle se limite aux facteurs chimiques industriels."]], "p": {"1": ["T", "Définition OMS : aspects de la **santé humaine, y compris la qualité de la vie**."], "2": ["T", "Facteurs **physiques, chimiques, biologiques**."], "3": ["T", "Facteurs **sociaux, psychosociaux et esthétiques**."], "4": ["T", "Elle concerne la **politique et les pratiques de gestion, contrôle, prévention**, y compris pour les **générations futures**."], "5": ["F", "Elle inclut aussi les facteurs **physiques, biologiques, sociaux, psychosociaux et esthétiques**."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc2-50_0.png", 8]]}, {"id": "blanc2-51", "exam": "blanc2", "label": "Examen blanc n°2", "n": 51, "stem": "Concernant la paralysie saturnine, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "metaux", "s": [], "t": [], "warn": [], "g": "Paralysie saturnine (pseudo-radiale) :\n• début : **extenseurs des 3e et 4e doigts**, **respect du long supinateur** ;\n• signe des **cornes** ;\n• puis **main en col de cygne** / **chute du poignet** ; autres territoires possibles (extenseurs des pieds) ;\n• déficit **moteur** pur ou prédominant.", "type": "multi", "opts": [["1", "Elle débute par une paralysie des extenseurs des 3e et 4e doigts."], ["2", "Elle respecte le long supinateur."], ["3", "Le sujet « fait les cornes » quand on lui demande de relever les doigts."], ["4", "Elle évolue vers la main en col de cygne (chute du poignet)."], ["5", "Le déficit est surtout sensitif."]], "p": {"1": ["T", "Début : **extenseurs des 3e et 4e doigts**."], "2": ["T", "Le **long supinateur est respecté**."], "3": ["T", "Signe des **cornes** quand il relève les doigts."], "4": ["T", "Extension aux autres doigts : **main en col de cygne**, **chute du poignet**."], "5": ["F", "Le déficit est **seulement ou surtout moteur**."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc2-51_0.png", 4]]}, {"id": "blanc2-52", "exam": "blanc2", "label": "Examen blanc n°2", "n": 52, "stem": "Parmi les polluants suivants, lesquels font partie des sept polluants réglementés surveillés en continu ?", "case": null, "tables": [], "imgs": [], "c": "pollu", "s": [], "t": [], "warn": [], "g": "Les **7 polluants réglementés** : **SO₂, CO, NO₂, O₃, PM10, benzène, plomb**, mesurés en continu par les associations de surveillance.", "type": "multi", "opts": [["1", "Le dioxyde de soufre (SO₂)."], ["2", "Le dioxyde d'azote (NO₂)."], ["3", "Les particules PM10."], ["4", "Le benzène et le plomb."], ["5", "Le radon."]], "p": {"1": ["T", "Le **SO₂** fait partie des **sept polluants réglementés**."], "2": ["T", "Le **NO₂** en fait partie."], "3": ["T", "Les **PM10** en font partie."], "4": ["T", "Le **benzène** (C₆H₆) et le **plomb** en font partie."], "5": ["F", "Le **radon** ne fait pas partie des sept polluants réglementés de l'air extérieur cités."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc2-52_0.png", 13]]}, {"id": "blanc2-53", "exam": "blanc2", "label": "Examen blanc n°2", "n": 53, "stem": "Quelles manifestations buccales évoquent un hydrargyrisme ?", "case": null, "tables": [], "imgs": [], "c": "metaux", "s": [], "t": [], "warn": [], "g": "Gingivo-stomatite mercurielle :\n• **gingivite sèche et douloureuse** (précoce) ;\n• hypersialorrhée, **goût métallique** ;\n• gingivorragies, **parodontolyse** ;\n• **dent mercurielle** grisâtre ;\n• ≠ liseré de **Burton** (plomb).", "type": "multi", "opts": [["1", "Une gingivite sèche et douloureuse, signe précoce."], ["2", "Une hypersialorrhée avec un goût métallique."], ["3", "Des gingivorragies et une parodontolyse."], ["4", "Une coloration grisâtre uniforme des dents (dent mercurielle)."], ["5", "Un liseré de Burton bleu ardoisé."]], "p": {"1": ["T", "**Gingivite sèche et douloureuse** : **signe précoce**."], "2": ["T", "**Hypersialorrhée** et **goût métallique**."], "3": ["T", "**Gingivorragies** et **parodontolyse** (déchaussement des dents)."], "4": ["T", "**Dent mercurielle** : coloration **grisâtre uniforme**."], "5": ["F", "Le **liseré de Burton** est un signe du **plomb**."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc2-53_0.png", 12]]}, {"id": "blanc2-54", "exam": "blanc2", "label": "Examen blanc n°2", "n": 54, "stem": "Concernant l'évaluation et la prévention du risque biologique, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "bio", "s": [], "t": [], "warn": [], "g": "Prévention du risque biologique :\n• intégrée **le plus en amont possible** ;\n• **évaluer** selon la chaîne de transmission : réservoir, tâches / procédés, modalité, **durée et fréquence** ;\n• **mesures** : organisation du travail, protection **collective et individuelle**, **information et formation** ;\n• adaptées à l'activité.", "type": "multi", "opts": [["1", "La chaîne de transmission sert de fil conducteur à l'évaluation des risques."], ["2", "Il faut identifier le réservoir et les tâches ou équipements générant une exposition."], ["3", "Il faut apprécier la durée et la fréquence de l'exposition."], ["4", "La prévention associe organisation du travail, protection collective et individuelle, information et formation."], ["5", "La prévention doit être intégrée le plus tard possible, après la survenue des cas."]], "p": {"1": ["T", "Le cours : la **chaîne de transmission** est le **fil conducteur**."], "2": ["T", "**Identifier le réservoir**, les **tâches, procédés, équipements** exposants."], "3": ["T", "**Durée et fréquence** de l'exposition."], "4": ["T", "Trois axes : **organisation**, **protection collective et individuelle**, **information-formation**."], "5": ["F", "Elle doit être intégrée **le plus en amont possible**."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc2-54_0.png", 4]]}, {"id": "blanc2-55", "exam": "blanc2", "label": "Examen blanc n°2", "n": 55, "stem": "Concernant l'échelle nanométrique, quelle proposition est exacte ?", "case": null, "tables": [], "imgs": [], "c": "nano", "s": [], "t": [], "warn": [], "g": "L'échelle nanométrique :\n• **1 nm = 10⁻⁹ m** (un milliardième de mètre) ;\n• nanomatériau : **1-100 nm** sur **au moins une dimension** ;\n• repère : **cheveu ≈ 80 000 nm**.", "type": "single", "opts": [["A", "1 nm correspond à un millionième de mètre."], ["B", "Un cheveu mesure environ 80 000 nm de diamètre."], ["C", "Un nanomatériau doit avoir ses trois dimensions entre 1 et 100 nm."], ["D", "La taille nanométrique se situe entre 100 et 1 000 nm."], ["E", "Les particules ultrafines du diesel ne sont pas nanométriques."]], "p": {"A": ["F", "1 nm = **un milliardième** de mètre (10⁻⁹ m)."], "B": ["T", "Le cours : **cheveu ≈ 80 000 nm**."], "C": ["F", "Il suffit d'**au moins une dimension** à l'échelle nanométrique."], "D": ["F", "La taille nanométrique va de **1 à 100 nm**."], "E": ["F", "Ce sont des particules **ultrafines** d'origine **non intentionnelle**, à l'échelle nanométrique."]}, "key": ["B"], "fmt": "QCS", "o": [["of2/o_blanc2-55_0.png", 5]]}, {"id": "blanc2-56", "exam": "blanc2", "label": "Examen blanc n°2", "n": 56, "stem": "Concernant les perturbateurs endocriniens, quelles propositions sont exactes ?", "case": null, "tables": [], "imgs": [], "c": "pe", "s": [], "t": [], "warn": [], "g": "Perturbateurs endocriniens (Dr Chibane) :\n• historique : **« Silent spring »**, R. Carson, **1962** (pesticides) ;\n• identification **difficile** : pas de propriétés physico-chimiques communes, **pas de dose pure** ;\n• **plusieurs familles** (phtalates, alkylphénols, parabènes, PCB, HAP, pesticides…) ;\n• cibles : **reproduction, métabolisme, développement**.", "type": "multi", "opts": [["1", "Le livre « Silent spring » de Rachel Carson (1962) a été l'une des premières analyses du danger des produits chimiques sur l'environnement."], ["2", "Leur identification est difficile car ils ne partagent pas de propriétés physico-chimiques communes."], ["3", "Il n'existe pas de dose pure dans l'environnement, ce qui complique leur étude."], ["4", "Le système endocrinien régule notamment la reproduction, le métabolisme et le développement embryonnaire."], ["5", "Tous les perturbateurs endocriniens appartiennent à une seule famille chimique."]], "p": {"1": ["T", "Le cours cite **R. Carson, « Silent spring », 1962**, décrivant les effets des **pesticides**."], "2": ["T", "Identification difficile : **pas de propriétés physico-chimiques communes**."], "3": ["T", "Il **n'existe pas de dose pure** dans l'environnement."], "4": ["T", "Fonctions citées : **reproduction, métabolisme, développement embryonnaire**."], "5": ["F", "Il existe **plusieurs grandes familles** de PE."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc2-56_0.png", 3]]}, {"id": "blanc2-57", "exam": "blanc2", "label": "Examen blanc n°2", "n": 57, "stem": "Concernant le test d'éviction-réintroduction dans le diagnostic de l'asthme professionnel, quelle proposition est exacte ?", "case": null, "tables": [], "imgs": [], "c": "asthme", "s": [], "t": [], "warn": [], "g": "Éviction-réintroduction :\n• pour les **réactions retardées** et les asthmes **modérés à sévères** ;\n• arrêt de l'exposition **jusqu'à 30 jours**, puis reprise avec suivi fonctionnel (DEP, VEMS) ;\n• à distinguer du **test de provocation spécifique** en laboratoire.", "type": "single", "opts": [["A", "Il se fait pour les réactions retardées et les asthmes modérés à sévères ; l'arrêt de l'exposition peut atteindre 30 jours."], ["B", "Il est réservé aux asthmes légers à réaction immédiate."], ["C", "L'éviction ne doit jamais dépasser 48 heures."], ["D", "Il remplace l'inventaire des risques asthmogènes."], ["E", "Il se fait exclusivement en laboratoire avec la substance purifiée."]], "p": {"A": ["T", "Le cours : éviction-réintroduction pour les **réactions retardées**, **asthmes sévères ou modérés**, arrêt **jusqu'à 30 jours**."], "B": ["F", "Il concerne surtout les **réactions retardées** et les asthmes **modérés à sévères**."], "C": ["F", "L'arrêt de l'exposition peut atteindre **30 jours**."], "D": ["F", "Il ne remplace pas l'**enquête** sur le poste et les produits."], "E": ["F", "C'est le **test de provocation bronchique spécifique** qui se fait en laboratoire."]}, "key": ["A"], "fmt": "QCS", "o": [["of2/o_blanc2-57_0.png", 11]]}, {"id": "blanc2-58", "exam": "blanc2", "label": "Examen blanc n°2", "n": 58, "stem": "Concernant la phase d'imprégnation du saturnisme, quels signes peut-on retrouver ?", "case": null, "tables": [], "imgs": [], "c": "metaux", "s": [], "t": [], "warn": [], "g": "Saturnisme — phase d'**imprégnation** :\n• **liseré de Burton** (gingival bleu ardoisé, sulfure de Pb) ;\n• **taches de Gubler** (face interne des joues) ;\n• **symptômes subjectifs** : fatigabilité, baisse des performances, humeur, troubles digestifs vagues, arthralgies, myalgies ;\n• la **colique de plomb** appartient à l'intoxication **confirmée**.", "type": "multi", "opts": [["1", "Le liseré de Burton : liseré gingival bleu ardoisé à 1 mm du rebord gingival."], ["2", "Les taches de Gubler sur la face interne des joues."], ["3", "Une fatigabilité et des modifications de l'humeur."], ["4", "Des troubles digestifs vagues et des arthralgies."], ["5", "Une colique de plomb typique est obligatoire à ce stade."]], "p": {"1": ["T", "Le **liseré de Burton** traduit la présence de **sulfure de plomb** dans la salive."], "2": ["T", "Les **taches de Gubler** siègent sur la **face interne des joues**."], "3": ["T", "Symptômes **subjectifs** cités : fatigabilité, baisse des performances psychomotrices, humeur modifiée."], "4": ["T", "**Troubles digestifs vagues**, **arthralgies et myalgies** font partie des symptômes subjectifs."], "5": ["F", "La colique de plomb **implique une contamination massive** : elle relève de l'**intoxication confirmée**."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc2-58_0.png", 3]]}, {"id": "blanc2-59", "exam": "blanc2", "label": "Examen blanc n°2", "n": 59, "stem": "Quels agents peuvent fragiliser l'oreille interne et potentialiser les effets du bruit ?", "case": null, "tables": [], "imgs": [], "c": "bruit", "s": [], "t": [], "warn": [], "g": "Facteurs aggravants de l'atteinte auditive :\n• **professionnels** : solvants **aromatiques**, **CO**, **acide cyanhydrique** ;\n• **extraprofessionnels** : **aminosides**, diurétiques, salicylés, antitumoraux ;\n• **bruit + vibrations** : plus dommageable que le bruit seul.", "type": "multi", "opts": [["1", "Les solvants aromatiques."], ["2", "Le monoxyde de carbone et l'acide cyanhydrique."], ["3", "Les antibiotiques aminosides."], ["4", "Les diurétiques, les salicylés et certains antitumoraux."], ["5", "Les vibrations n'ont aucun effet additif avec le bruit."]], "p": {"1": ["T", "Le cours cite les **solvants aromatiques**."], "2": ["T", "**CO** et **acide cyanhydrique** sont cités."], "3": ["T", "Les **aminosides** (extraprofessionnels) sont cités."], "4": ["T", "**Diurétiques, salicylés, antitumoraux** sont cités."], "5": ["F", "L'exposition **combinée au bruit et aux vibrations** est **plus dommageable** que le bruit seul."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc2-59_0.png", 3]]}, {"id": "blanc2-60", "exam": "blanc2", "label": "Examen blanc n°2", "n": 60, "stem": "Associez chaque polluant à son type et à sa localisation préférentielle.", "case": null, "tables": [], "imgs": [], "c": "pollu", "s": [], "t": [], "warn": [], "g": "Polluants primaires et secondaires (Pr Fernane-Nechab) :\n| Type | Formation | Exemples | Localisation |\n| Primaires | émis par la source | SO₂, CO, benzène, plomb, particules | maximum près des sources |\n| Secondaires | réactions dans l'atmosphère | ozone, particules secondaires | parfois loin des sources |\n**Ozone** = NOx + COV + **soleil**.", "type": "match", "left": [["1", "SO₂"], ["2", "Ozone (O₃)"], ["3", "Benzène"], ["4", "Plomb"], ["5", "Particules secondaires"]], "right": [["a", "Polluant primaire · concentrations maximales près des sources"], ["b", "Polluant secondaire · formé dans l'atmosphère, peut apparaître loin des sources"]], "corr": {"1": ["a"], "2": ["b"], "3": ["a"], "4": ["a"], "5": ["b"]}, "p": {"1": [null, "Le **SO₂** est **émis directement** : polluant **primaire** : 1-a."], "2": [null, "L'**ozone** se forme dans l'atmosphère (NOx + COV + soleil) : **secondaire** : 2-b."], "3": [null, "Le **benzène** est émis directement : **primaire** : 3-a."], "4": [null, "Le **plomb** est émis directement : **primaire** : 4-a."], "5": [null, "Les **particules secondaires** se forment dans l'atmosphère : 5-b."]}, "fmt": "Association", "o": [["of2/o_blanc2-60_0.png", 12]]}, {"id": "blanc3-01", "exam": "blanc3", "label": "Examen blanc n°3", "n": 1, "stem": "Concernant les plaques pleurales de ce patient, quelles propositions sont exactes ?", "case": "blanc3-c1", "tables": [], "imgs": [], "c": "pneumo", "s": [], "t": [], "g": "Plaque pleurale :\n• plages **fibrohyalines** circonscrites, blanc ivoire, sur la **plèvre pariétale** ;\n• **marqueur d'exposition**, manifestation la plus fréquente ;\n• asymptomatique, découverte fortuite ;\n• TDM : limites nettes, ± calcifiées, multiples, bilatérales, **< 1 cm** ;\n• siège : antérolatéral (3e-5e EIC), postérolatéral (6e-10e EIC), coupoles.", "warn": [], "type": "multi", "opts": [["1", "Elles représentent la manifestation la plus fréquente de l'exposition à l'amiante."], ["2", "Elles sont considérées comme un marqueur d'exposition à l'amiante."], ["3", "Elles siègent surtout sur la plèvre viscérale."], ["4", "Elles sont presque toujours asymptomatiques, de découverte fortuite."], ["5", "Leur épaisseur dépasse habituellement 1 cm."]], "p": {"1": ["T", "La **plaque pleurale** est la manifestation **la plus fréquente**."], "2": ["T", "Les plaques sont un **marqueur d'exposition**."], "3": ["F", "Elles siègent le plus souvent sur la **plèvre pariétale**."], "4": ["T", "Presque toujours **asymptomatiques**, découverte **fortuite** sur une radiographie."], "5": ["F", "Épaisseur **< 1 cm**, souvent multiples et bilatérales."]}, "key": ["1", "2", "4"], "fmt": "QCM", "o": [["of2/o_blanc3-01_0.png", 10]]}, {"id": "blanc3-02", "exam": "blanc3", "label": "Examen blanc n°3", "n": 2, "stem": "Quel est le diagnostic le plus probable ?", "case": "blanc3-c1", "tables": [], "imgs": [], "c": "pneumo", "s": [], "t": [], "g": "Mésothéliome pleural malin — orientation :\n• épanchement pleural (**80 à 90 %** des cas) ;\n• TDM : épaississement **circonférentiel, irrégulier, mamelonné**, **rétraction** de l'hémithorax ;\n• liquide : exsudat **lymphocytaire**, **visqueux** (acide hyaluronique) ;\n• AEG, amaigrissement : signes **tardifs**.", "warn": [], "type": "single", "opts": [["A", "Mésothéliome pleural malin."], ["B", "Pleurésie asbestosique bénigne."], ["C", "Asbestose."], ["D", "Atélectasie par enroulement."], ["E", "Fibrose pleurale diffuse."]], "p": {"A": ["T", "Épanchement abondant, **épaississement circonférentiel mamelonné** avec **rétraction**, AEG, liquide **visqueux** : mésothéliome."], "B": ["F", "Elle est habituellement **peu abondante** et régresse spontanément en ≈ 3 mois."], "C": ["F", "L'asbestose est une **fibrose interstitielle** des bases, pas une atteinte pleurale mamelonnée."], "D": ["F", "Elle réalise une **opacité arrondie** sous-pleurale, sans épanchement abondant ni AEG."], "E": ["F", "Épaississement étendu de la plèvre **viscérale**, sans le caractère mamelonné ni l'AEG."]}, "key": ["A"], "fmt": "QCS", "o": [["of2/o_blanc3-02_0.png", 12]]}, {"id": "blanc3-03", "exam": "blanc3", "label": "Examen blanc n°3", "n": 3, "stem": "Concernant la confirmation du diagnostic, quelles propositions sont exactes ?", "case": "blanc3-c1", "tables": [], "imgs": [], "c": "pneumo", "s": [], "t": [], "g": "Démarche diagnostique du mésothéliome :\n• radiographie : épanchement abondant, festons, plaques ;\n• **TDM** : bilan initial et d'extension ;\n• **PET-scan** : bénin vs malin ;\n• cytologie / biopsie à l'aiguille : rendement limité ;\n• **thoracoscopie** : examen de choix, biopsies multiples (**95 %**), immunohistochimie.", "warn": [], "type": "multi", "opts": [["1", "La thoracoscopie est la technique diagnostique de choix."], ["2", "Elle permet des biopsies pleurales multiples avec un rendement d'environ 95 %."], ["3", "Le PET-scan aide à distinguer une pleurésie bénigne d'un mésothéliome."], ["4", "La cytologie pleurale a un meilleur rendement que la thoracoscopie."], ["5", "Il existe un dépistage sanguin efficace du mésothéliome."]], "p": {"1": ["T", "**Thoracoscopie** : la plus sensible et la plus spécifique."], "2": ["T", "Rendement de **95 %**, supérieur à la cytologie et à la biopsie transpariétale."], "3": ["T", "Intérêt du **PET-scan** dans ce diagnostic différentiel."], "4": ["F", "La thoracoscopie a un rendement **bien supérieur**."], "5": ["F", "Il **n'existe pas d'outil de dépistage** : seule la prévention de l'exposition est efficace."]}, "key": ["1", "2", "3"], "fmt": "QCM", "o": [["of2/o_blanc3-03_0.png", 12]]}, {"id": "blanc3-04", "exam": "blanc3", "label": "Examen blanc n°3", "n": 4, "stem": "Concernant les facteurs de risque du mésothéliome chez ce patient, quelles propositions sont exactes ?", "case": "blanc3-c1", "tables": [], "imgs": [], "c": "pneumo", "s": [], "t": [], "g": "Mésothéliome — déterminants du risque :\n• **dose cumulée** ;\n• **temps écoulé** depuis le début de l'exposition ;\n• **type de fibre** : amphiboles (crocidolite) >> chrysotile ;\n• **tabac : aucun rôle** (à l'inverse du CBP) ;\n• latence **> 15 ans**, moyenne 40 ans ; pronostic très sombre (survie médiane < 1 an).", "warn": [], "type": "multi", "opts": [["1", "Le risque augmente avec la dose cumulée d'exposition."], ["2", "Le risque augmente avec le temps écoulé depuis le début de l'exposition."], ["3", "Les amphiboles comme la crocidolite sont plus mésothéliogènes que le chrysotile."], ["4", "Son tabagisme ancien a multiplié le risque de mésothéliome."], ["5", "La latence est très longue, supérieure à 15 ans et en moyenne de 40 ans."]], "p": {"1": ["T", "Facteur : **dose cumulée**."], "2": ["T", "Facteur : **temps écoulé** depuis le début de l'exposition."], "3": ["T", "Fibres d'**amphiboles (crocidolite)** >> chrysotile."], "4": ["F", "Le tabac n'a **aucun rôle** sur le mésothéliome."], "5": ["T", "Latence **> 15 ans**, en moyenne **40 ans**."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc3-04_0.png", 12]]}, {"id": "blanc3-05", "exam": "blanc3", "label": "Examen blanc n°3", "n": 5, "stem": "Concernant les variétés d'amiante, quelles propositions sont exactes ?", "case": "blanc3-c1", "tables": [], "imgs": [], "c": "pneumo", "s": [], "t": [], "g": "Variétés d'amiante :\n| Variété | Famille | Couleur | Longueur max | Diamètre |\n| Chrysotile | serpentine | blanc | 40 mm | 0,02 µm |\n| Amosite | amphibole | brun | 70 mm | 0,1 µm |\n| Crocidolite | amphibole | bleu | 70 mm | 0,08 µm |", "warn": [], "type": "multi", "opts": [["1", "Le chrysotile est une serpentine de couleur blanche."], ["2", "La crocidolite est une amphibole de couleur bleue."], ["3", "L'amosite est une amphibole de couleur brune."], ["4", "Le chrysotile a le plus grand diamètre de fibre des trois."], ["5", "L'amiante est interdit en Algérie depuis le décret exécutif de 2009."]], "p": {"1": ["T", "**Chrysotile** : serpentine, **blanc**."], "2": ["T", "**Crocidolite** : amphibole, **bleue**."], "3": ["T", "**Amosite** : amphibole, **brune**."], "4": ["F", "Le chrysotile a la fibre **la plus fine** (0,02 µm) et la plus courte (40 mm)."], "5": ["T", "**DE du 08-10-2009** : interdiction d'utilisation, fabrication, importation et commercialisation."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc3-05_0.png", 9]]}, {"id": "blanc3-06", "exam": "blanc3", "label": "Examen blanc n°3", "n": 6, "stem": "Si un cancer broncho-pulmonaire avait été découvert chez ce patient, quelles propositions seraient exactes ?", "case": "blanc3-c1", "tables": [], "imgs": [], "c": "cancer", "s": [], "t": [], "g": "Amiante et cancer broncho-pulmonaire :\n• risque **linéaire** avec l'exposition cumulée ;\n• interaction amiante-tabac **multiplicative** ;\n• **toutes** les variétés de fibres ;\n• **tous** les types histologiques ;\n• exposition objectivée par les **corps asbestosiques** (LBA, expectoration).", "warn": [], "type": "multi", "opts": [["1", "L'interaction amiante-tabac suit un schéma approximativement multiplicatif."], ["2", "Toutes les variétés d'amiante peuvent en être à l'origine."], ["3", "Seul l'adénocarcinome est imputable à l'amiante."], ["4", "Le risque croît de façon linéaire avec l'exposition cumulée."], ["5", "La recherche de corps asbestosiques permet d'évaluer objectivement l'exposition cumulée."]], "p": {"1": ["T", "Interaction **multiplicative** amiante × tabac."], "2": ["T", "**Chrysotile et amphiboles** peuvent causer un CBP."], "3": ["F", "**Tous les types histologiques** peuvent être observés."], "4": ["T", "Risque **linéaire** avec l'exposition cumulée."], "5": ["T", "Évaluation **objective** par les **corps asbestosiques**."]}, "key": ["1", "2", "4", "5"], "fmt": "QCM", "o": [["of2/o_blanc3-06_0.png", 5], ["of2/o_blanc3-06_1.png", 1]]}, {"id": "blanc3-07", "exam": "blanc3", "label": "Examen blanc n°3", "n": 7, "stem": "Concernant la réparation de la maladie de M. S. M., quelles propositions sont exactes ?", "case": "blanc3-c1", "tables": [], "imgs": [], "c": "pneumo", "s": [], "t": [], "g": "TMP n°30 — amiante :\n| Affection | DPC |\n| Asbestose | 15 ans |\n| Lésions pleurales bénignes | 15 ans |\n| Mésothéliome (plèvre, péritoine, péricarde) | 30 ans |\n| Autres tumeurs pleurales primitives | 30 ans |\n| Cancer broncho-pulmonaire primitif | 30 ans |\nListe des travaux **indicative**.", "warn": [], "type": "multi", "opts": [["1", "Elle relève du tableau de maladie professionnelle n°30."], ["2", "Le délai de prise en charge du mésothéliome est de 30 ans."], ["3", "Le délai de prise en charge des lésions pleurales bénignes est de 15 ans."], ["4", "Retraité depuis 4 ans, il est hors délai de prise en charge."], ["5", "La liste des travaux du tableau n°30 est limitative."]], "p": {"1": ["T", "**TMP n°30** : affections consécutives à l'inhalation de poussières d'amiante."], "2": ["T", "Mésothéliome malin primitif : **30 ans**."], "3": ["T", "Lésions pleurales bénignes : **15 ans**, comme l'asbestose."], "4": ["F", "4 ans < **30 ans** : délai respecté."], "5": ["F", "Le TMP 30 comporte une **liste indicative**."]}, "key": ["1", "2", "3"], "fmt": "QCM", "o": [["of2/o_blanc3-07_0.png", 14]]}, {"id": "blanc3-08", "exam": "blanc3", "label": "Examen blanc n°3", "n": 8, "stem": "Concernant la prévention chez les ouvriers actuellement affectés au désamiantage de l'usine, quelles propositions sont exactes ?", "case": "blanc3-c1", "tables": [], "imgs": [], "c": "pneumo", "s": [], "t": [], "g": "Prévention — amiante :\n• interdiction (DE 2009) ; **déclaration** (inspection du travail, CNAS, MT, DSP) ;\n• évaluation des risques avec MT et CPHS ;\n• contrôle **≥ 1/trimestre**, **VLE 0,1 f/cm³ sur 1 h** ;\n• VE : pas de < 18 ans, intérimaires, CDD ; **TLT + EFR de référence** ;\n• VP **tous les 6 mois** (aptitude) ; **TLT + EFR annuels** ;\n• attestation d'exposition au départ ; dossier conservé **30 ans** après la retraite.", "warn": [], "type": "multi", "opts": [["1", "La valeur limite d'exposition est de 0,1 fibre/cm³ sur 1 heure de travail."], ["2", "Le taux de fibres dans l'air est contrôlé au moins une fois par trimestre par un laboratoire agréé."], ["3", "Les moins de 18 ans, les intérimaires et les CDD ne doivent pas y être affectés."], ["4", "Le dossier médical est conservé 30 ans après la mise à la retraite."], ["5", "Le téléthorax et l'EFR sont renouvelés tous les 6 mois."]], "p": {"1": ["T", "**VLE = 0,1 f/cm³ sur 1 h**."], "2": ["T", "Contrôle **au moins 1 fois par trimestre**, laboratoire **agréé**."], "3": ["T", "Interdiction : **< 18 ans, intérimaires, CDD**."], "4": ["T", "Conservation **30 ans** après la retraite."], "5": ["F", "La **fiche d'aptitude** est renouvelée tous les 6 mois ; **TLT et EFR chaque année**."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "cs": "Ouvrier retraité de 63 ans, 28 ans de fibrociment + 6 ans de freins : **plaques pleurales** (marqueur d'exposition) et **mésothéliome pleural malin** (épaississement circonférentiel mamelonné, liquide visqueux). Confirmation par **thoracoscopie** (95 %). Tabac **sans rôle**. **TMP n°30**, DPC **30 ans** (respecté). Prévention : VLE 0,1 f/cm³, TLT + EFR annuels.", "o": [["of2/o_blanc3-08_0.png", 14]]}, {"id": "blanc3-09", "exam": "blanc3", "label": "Examen blanc n°3", "n": 9, "stem": "Concernant les lésions de M. A. R., quelles propositions sont exactes ?", "case": "blanc3-c2", "tables": [], "imgs": [], "c": "ri", "s": [], "t": [], "g": "Effets déterministes vs stochastiques :\n| Critère | Déterministes | Stochastiques |\n| Seuil | oui | pas de seuil démontré |\n| Dose | la gravité augmente | la probabilité augmente |\n| Exemples | radiodermite, cataracte, aplasie, stérilité, SIA | cancers, effets héréditaires |\n| Délai | précoce (heures-semaines), parfois mois-années | toujours tardif (années-décennies) |", "warn": [], "type": "multi", "opts": [["1", "La cataracte radio-induite est un effet déterministe."], ["2", "Le seuil de la cataracte est aujourd'hui estimé autour de 0,5 Gy au cristallin."], ["3", "L'atteinte de la main traduit des expositions localisées répétées."], ["4", "La gravité de ces lésions est indépendante de la dose reçue."], ["5", "Ces deux lésions sont des effets stochastiques."]], "p": {"1": ["T", "Cataracte = **réaction tissulaire** (effet **déterministe**)."], "2": ["T", "Seuil **≈ 0,5 Gy**, plus bas qu'on ne le pensait."], "3": ["T", "**Radiodermite chronique** = expositions **répétées** localisées."], "4": ["F", "Pour les effets déterministes, la **gravité augmente avec la dose**."], "5": ["F", "Ce sont des effets **déterministes** ; les stochastiques sont les **cancers** et effets héréditaires."]}, "key": ["1", "2", "3"], "fmt": "QCM", "o": [["of2/o_blanc3-09_0.png", 7]]}, {"id": "blanc3-10", "exam": "blanc3", "label": "Examen blanc n°3", "n": 10, "stem": "Concernant l'atteinte cutanée de la main, quelles propositions sont exactes ?", "case": "blanc3-c2", "tables": [], "imgs": [], "c": "ri", "s": [], "t": [], "g": "Grandeurs opérationnelles Hp(d) :\n| Grandeur | Profondeur | Cible |\n| Hp(10) | 10 mm | corps entier |\n| Hp(3) | 3 mm | cristallin |\n| Hp(0,07) | 0,07 mm | peau, extrémités |", "warn": [], "type": "multi", "opts": [["1", "Atrophie, dépilation, télangiectasies et fissures sont typiques de la radiodermite chronique."], ["2", "Elle est un signal fort d'exposition insuffisamment maîtrisée."], ["3", "La grandeur opérationnelle adaptée à sa surveillance est Hp(0,07)."], ["4", "La grandeur opérationnelle du cristallin est Hp(10)."], ["5", "Dans la radiodermite aiguë, les lésions peuvent apparaître avec retard."]], "p": {"1": ["T", "Sémiologie de la **radiodermite chronique**."], "2": ["T", "Elle impose l'analyse du **poste**, des pratiques et de la **dosimétrie aux extrémités**."], "3": ["T", "**Hp(0,07)** : peau et extrémités."], "4": ["F", "Cristallin : **Hp(3)** ; Hp(10) = corps entier."], "5": ["T", "La symptomatologie peut être **retardée** : l'anamnèse professionnelle est essentielle."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc3-10_0.png", 6]]}, {"id": "blanc3-11", "exam": "blanc3", "label": "Examen blanc n°3", "n": 11, "stem": "Concernant la radioprotection au bloc interventionnel, quelles propositions sont exactes ?", "case": "blanc3-c2", "tables": [], "imgs": [], "c": "ri", "s": [], "t": [], "g": "Radioprotection :\n• 3 principes : **justification, optimisation (ALARA), limitation** ;\n• 3 leviers : **temps, distance, écran** ;\n• collectif d'abord : salles blindées, zonage, écrans fixes et mobiles, signalisation ;\n• EPI : tablier, **protège-thyroïde**, **lunettes plombées**, gants ;\n• interventionnel : exposition surtout par le **diffusé**.", "warn": [], "type": "multi", "opts": [["1", "La majorité de l'exposition provient du rayonnement diffusé."], ["2", "Le positionnement, l'écran suspendu et la distance sont souvent plus efficaces qu'un tablier mal utilisé."], ["3", "Les lunettes plombées réduisent la dose au cristallin."], ["4", "Les EPI priment sur la prévention collective."], ["5", "Le tablier plombé protège surtout contre le rayonnement diffusé."]], "p": {"1": ["T", "En interventionnel, le **diffusé** est la principale source."], "2": ["T", "Message clé du « bloc interventionnel »."], "3": ["T", "**Lunettes plombées** : protection du cristallin."], "4": ["F", "La **prévention collective prime** ; les EPI la complètent."], "5": ["T", "Tablier : surtout contre le **diffusé** (photons)."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc3-11_0.png", 8]]}, {"id": "blanc3-12", "exam": "blanc3", "label": "Examen blanc n°3", "n": 12, "stem": "Concernant les limites d'exposition professionnelle fixées par le décret 05-117, quelles propositions sont exactes ?", "case": "blanc3-c2", "tables": [], "imgs": [], "c": "ri", "s": [], "t": [], "g": "Limites — décret 05-117 (art. 18) :\n| Grandeur | Travailleurs | Apprentis 16-18 ans |\n| Dose efficace | 20 mSv/an (moyenne 5 ans), max 50 mSv/an | 6 mSv/an |\n| Cristallin | 150 mSv/an | 50 mSv/an |\n| Extrémités, peau | 500 mSv/an | 150 mSv/an |", "warn": [], "type": "multi", "opts": [["1", "La dose efficace est limitée à 20 mSv/an en moyenne sur 5 années consécutives."], ["2", "Elle ne doit pas dépasser 50 mSv sur une seule année."], ["3", "La dose équivalente au cristallin est limitée à 150 mSv/an."], ["4", "La dose équivalente aux extrémités et à la peau est limitée à 500 mSv/an."], ["5", "Ces limites sont des objectifs à atteindre."]], "p": {"1": ["T", "**20 mSv/an** en moyenne sur **5 ans**."], "2": ["T", "**50 mSv** au maximum sur une année."], "3": ["T", "Cristallin : **150 mSv/an**."], "4": ["T", "Extrémités / peau : **500 mSv/an**."], "5": ["F", "Ce sont des **plafonds à ne pas dépasser**, pas des objectifs."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc3-12_0.png", 9]]}, {"id": "blanc3-13", "exam": "blanc3", "label": "Examen blanc n°3", "n": 13, "stem": "Quelles limites s'appliquent à l'apprenti manipulateur de 17 ans ?", "case": "blanc3-c2", "tables": [], "imgs": [], "c": "ri", "s": [], "t": [], "g": "Moins de 18 ans et rayonnements ionisants :\n• emploi **interdit** avant 18 ans ;\n• **exception** : formation / apprentissage à partir de **16 ans**, sous conditions ;\n• limites : **6 mSv/an** (efficace), **50 mSv/an** (cristallin), **150 mSv/an** (extrémités, peau).", "warn": [], "type": "single", "opts": [["A", "Dose efficace 6 mSv/an, cristallin 50 mSv/an, extrémités et peau 150 mSv/an."], ["B", "Dose efficace 20 mSv/an, cristallin 150 mSv/an, extrémités et peau 500 mSv/an."], ["C", "Aucune : tout travail sous rayonnements est interdit avant 18 ans."], ["D", "Dose efficace 1 mSv/an, sans autre limite."], ["E", "Dose efficace 6 mSv/an, cristallin 150 mSv/an, extrémités et peau 500 mSv/an."]], "p": {"A": ["T", "Apprentis / étudiants de **16 à 18 ans** : **6 / 50 / 150 mSv/an**."], "B": ["F", "Ce sont les limites des **travailleurs**."], "C": ["F", "L'interdiction connaît une exception : la **formation / apprentissage à partir de 16 ans**, sous conditions."], "D": ["F", "Ce n'est pas la limite des apprentis."], "E": ["F", "Cristallin et extrémités sont aussi abaissés : **50** et **150 mSv/an**."]}, "key": ["A"], "fmt": "QCS", "o": [["of2/o_blanc3-13_0.png", 9]]}, {"id": "blanc3-14", "exam": "blanc3", "label": "Examen blanc n°3", "n": 14, "stem": "Concernant l'infirmière enceinte, quelles propositions sont exactes ?", "case": "blanc3-c2", "tables": [], "imgs": [], "c": "ri", "s": [], "t": [], "g": "Grossesse et rayonnements ionisants :\n• embryon / fœtus **très radiosensible** selon la période ;\n• risques : malformations majeures, retard de croissance, retard mental, microcéphalie (fortes doses) ;\n• **gestion spécifique** du poste ;\n• examens : techniques **non ionisantes**, optimisation stricte.", "warn": [], "type": "multi", "opts": [["1", "L'embryon et le fœtus constituent un groupe particulièrement vulnérable."], ["2", "Son poste de travail doit faire l'objet d'une gestion spécifique."], ["3", "Pour ses propres examens, on privilégie les techniques non ionisantes."], ["4", "Aucune mesure n'est nécessaire tant que la limite des travailleurs est respectée."], ["5", "À fortes doses, l'irradiation in utero expose à la microcéphalie et au retard mental."]], "p": {"1": ["T", "Embryon / fœtus : **très radiosensibles**."], "2": ["T", "**Gestion spécifique** du poste et des examens irradiants."], "3": ["T", "Priorité à l'**échographie et à l'IRM**."], "4": ["F", "La grossesse impose un **suivi particulier** et une **optimisation stricte**."], "5": ["T", "Risques : malformations, retard de croissance, **retard mental, microcéphalie** à fortes doses."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc3-14_0.png", 9]]}, {"id": "blanc3-15", "exam": "blanc3", "label": "Examen blanc n°3", "n": 15, "stem": "Concernant la dosimétrie de M. A. R., quelles propositions sont exactes ?", "case": "blanc3-c2", "tables": [], "imgs": [], "c": "ri", "s": [], "t": [], "g": "Surveillance dosimétrique :\n• **individuelle** : Hp(10), Hp(0,07), Hp(3) ;\n• **opérationnelle** (temps réel) : interventionnel ;\n• **de zone** : radiamètres, balises, contaminamètres ;\n• **interne** : bio-essais, anthroporadiamétrie si risque d'incorporation ;\n• but : **protéger et tracer**.", "warn": [], "type": "multi", "opts": [["1", "Le port irrégulier du dosimètre compromet à la fois la protection et la traçabilité."], ["2", "La dosimétrie opérationnelle en temps réel est utile en interventionnel."], ["3", "La dose efficace est mesurée directement par le dosimètre."], ["4", "Des bio-essais sont systématiques à son poste."], ["5", "Contrairement à la contamination, l'irradiation cesse dès qu'on s'éloigne de la source."]], "p": {"1": ["T", "La dosimétrie sert à **protéger et tracer**."], "2": ["T", "Utile en **interventionnel** et à débit de dose variable."], "3": ["F", "Le dosimètre mesure des **grandeurs opérationnelles Hp(d)**."], "4": ["F", "Ils sont indiqués en cas de **risque d'incorporation** (sources non scellées), pas pour un générateur X."], "5": ["T", "**Irradiation** : source externe ; **contamination** : exposition persistante."]}, "key": ["1", "2", "5"], "fmt": "QCM", "o": [["of2/o_blanc3-15_0.png", 9]]}, {"id": "blanc3-16", "exam": "blanc3", "label": "Examen blanc n°3", "n": 16, "stem": "Concernant la reconnaissance de la cataracte de M. A. R. en maladie professionnelle, quelles propositions sont exactes ?", "case": "blanc3-c2", "tables": [], "imgs": [], "c": "ri", "s": [], "t": [], "g": "TMP n°6 — rayonnements ionisants :\n| Famille | Exemples |\n| Hématologiques | anémie, leucopénie, thrombopénie, syndrome hémorragique |\n| Oculaires | blépharite, conjonctivite, kératite, cataracte |\n| Cutanéo-muqueuses | radiodermites aiguës / chroniques, radio-épithélite |\n| Osseuses | radionécrose, sarcome osseux |\n| Cancers | leucémies, CBP primitif par inhalation |\n• DPC : 90 j à **50 ans** ; liste **indicative**.", "warn": [], "type": "multi", "opts": [["1", "La cataracte est inscrite au tableau n°6."], ["2", "Les radiodermites sont inscrites au même tableau."], ["3", "La reconnaissance repose sur la maladie, l'exposition professionnelle et le respect du délai."], ["4", "La liste des travaux du tableau n°6 est limitative."], ["5", "Les délais de prise en charge du tableau n°6 peuvent atteindre 50 ans selon l'affection."]], "p": {"1": ["T", "Atteintes oculaires du **TMP 6** : blépharite, conjonctivite, kératite, **cataracte**."], "2": ["T", "Atteintes cutanéo-muqueuses : **radiodermites** aiguës et chroniques."], "3": ["T", "**3 conditions** : maladie listée, exposition, DPC."], "4": ["F", "La liste est **indicative**."], "5": ["T", "DPC de **90 jours à 50 ans** selon la pathologie."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "cs": "Cardiologue interventionnel de 44 ans, sans lunettes ni écran : **cataracte** et **radiodermite chronique** de la main (effets **déterministes**). Surveillance : **Hp(3)** cristallin, **Hp(0,07)** extrémités. Limites (décret 05-117) : 20 mSv/an (5 ans), 150 cristallin, 500 extrémités ; apprenti 16-18 ans : **6 / 50 / 150**. Grossesse : gestion spécifique. **TMP n°6**, liste indicative.", "o": [["of2/o_blanc3-16_0.png", 10]]}, {"id": "blanc3-17", "exam": "blanc3", "label": "Examen blanc n°3", "n": 17, "stem": "Concernant l'atteinte buccale de M. H. B., quelles propositions sont exactes ?", "case": "blanc3-c3", "tables": [], "imgs": [], "c": "metaux", "s": [], "t": [], "g": "Stomatogingivite mercurielle :\n• gingivite **sèche, douloureuse** (précoce) ;\n• **hypersialorrhée**, **goût métallique** ;\n• gingivorragies, **parodontolyse** (déchaussement) ;\n• **dents grisâtres** uniformes ;\n• TMP 2 : stomatite (toute infection de la muqueuse buccale), DPC **90 j**.", "warn": [], "type": "multi", "opts": [["1", "La gingivite sèche et douloureuse est un signe précoce."], ["2", "L'hypersialorrhée et le goût métallique font partie du tableau."], ["3", "La coloration grisâtre uniforme des dents correspond à la « dent mercurielle »."], ["4", "Un liseré gingival bleu ardoisé à 1 mm du rebord est attendu."], ["5", "Au tableau n°2, le terme « stomatite » couvre l'ensemble des infections de la muqueuse buccale."]], "p": {"1": ["T", "**Gingivite sèche et douloureuse** : signe **précoce**."], "2": ["T", "**Hypersialorrhée**, **goût métallique**."], "3": ["T", "Coloration **grisâtre uniforme** = dent mercurielle."], "4": ["F", "Le **liseré de Burton** est un signe du **plomb**."], "5": ["T", "La gingivite en est une **forme clinique particulière** ; DPC **90 jours**."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc3-17_0.png", 12]]}, {"id": "blanc3-18", "exam": "blanc3", "label": "Examen blanc n°3", "n": 18, "stem": "Concernant le tremblement, quelles propositions sont exactes ?", "case": "blanc3-c3", "tables": [], "imgs": [], "c": "metaux", "s": [], "t": [], "g": "Atteinte du SNC — hydrargyrisme :\n• **installation** : troubles du caractère, timidité excessive, irritabilité, labilité, insomnie, troubles mnésiques ;\n• **état** : **tremblement intentionnel cérébelleux** (doigts, lèvres, paupières), aggravé par stress, effort, alcool ; asynergie, adiadococinésie, nystagmus ;\n• **tardive** : ataxie cérébelleuse ;\n• TMP 2 : tremblement intentionnel et ataxie cérébelleuse, DPC **1 an**.", "warn": [], "type": "multi", "opts": [["1", "C'est le symptôme majeur et le plus caractéristique de la phase d'état."], ["2", "C'est un tremblement intentionnel de type cérébelleux."], ["3", "C'est un tremblement de repos qui disparaît au mouvement."], ["4", "Il est aggravé par le stress émotionnel, l'effort et l'alcool."], ["5", "Il peut s'associer à une asynergie, une adiadococinésie et un nystagmus."]], "p": {"1": ["T", "**Tremblement intentionnel** : symptôme majeur."], "2": ["T", "Type **cérébelleux**, intentionnel."], "3": ["F", "Il est **intentionnel**, majoré par le mouvement."], "4": ["T", "Facteurs aggravants : **stress, effort, alcool**."], "5": ["T", "Syndrome **cérébelleux** associé."]}, "key": ["1", "2", "4", "5"], "fmt": "QCM", "o": [["of2/o_blanc3-18_0.png", 12]]}, {"id": "blanc3-19", "exam": "blanc3", "label": "Examen blanc n°3", "n": 19, "stem": "Quelle est la nature la plus probable de l'atteinte rénale ?", "case": "blanc3-c3", "tables": [], "imgs": [], "c": "metaux", "s": [], "t": [], "g": "Rein et métaux :\n| Atteinte | Métal |\n| Syndrome néphrotique, glomérulopathie extramembraneuse | mercure (chronique) |\n| NTA, IRA | mercure (aigu) |\n| Toni-Debré-Fanconi (TCP), réversible | plomb (subaigu) |\n| Tubulo-interstitielle et glomérulaire, irréversible, goutte | plomb (chronique) |", "warn": [], "type": "single", "opts": [["A", "Syndrome néphrotique par glomérulopathie à dépôts extramembraneux, d'origine immunitaire."], ["B", "Tubulopathie proximale de type Toni-Debré-Fanconi."], ["C", "Nécrose tubulaire aiguë."], ["D", "Néphropathie tubulo-interstitielle chronique avec goutte."], ["E", "Néphropathie par hyperuricémie."]], "p": {"A": ["T", "Hg chronique : **syndrome néphrotique**, **glomérulopathie extramembraneuse** (action sur les **lymphocytes B**)."], "B": ["F", "C'est la **néphropathie saturnine subaiguë**."], "C": ["F", "La NTA s'observe dans l'intoxication **aiguë** par le mercure."], "D": ["F", "C'est la **néphropathie saturnine chronique**."], "E": ["F", "Profil saturnin, pas mercuriel."]}, "key": ["A"], "fmt": "QCS", "o": [["of2/o_blanc3-19_0.png", 4]]}, {"id": "blanc3-20", "exam": "blanc3", "label": "Examen blanc n°3", "n": 20, "stem": "Concernant l'atteinte oculaire, quelles propositions sont exactes ?", "case": "blanc3-c3", "tables": [], "imgs": [], "c": "metaux", "s": [], "t": [], "g": "Autres atteintes mercurielles :\n• **mercurialentis** : lampe à fente, dépôts brunâtres de la capsule antérieure, acuité conservée, couleurs perturbées, **bon pronostic** ;\n• **dermatoses** polymorphes (intérêt des tests épicutanés) ;\n• rhinite, conjonctivite ;\n• aberrations chromosomiques ; oligospermie, avortements, fœtotoxicité.", "warn": [], "type": "multi", "opts": [["1", "Il s'agit d'un mercurialentis."], ["2", "L'acuité visuelle est habituellement conservée."], ["3", "La vision des couleurs peut être perturbée."], ["4", "Son pronostic est mauvais, avec évolution vers la cécité."], ["5", "Son diagnostic repose sur l'examen à la lampe à fente."]], "p": {"1": ["T", "**Mercurialentis** : dépôts brunâtres sur la capsule antérieure."], "2": ["T", "**Acuité visuelle inchangée**."], "3": ["T", "**Vision des couleurs perturbée**."], "4": ["F", "Le mercurialentis est **courant et de bon pronostic**."], "5": ["T", "Diagnostic **à la lampe à fente**."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc3-20_0.png", 13]]}, {"id": "blanc3-21", "exam": "blanc3", "label": "Examen blanc n°3", "n": 21, "stem": "Comment interpréter le mercure urinaire à 180 µg/L ?", "case": "blanc3-c3", "tables": [], "imgs": [], "c": "metaux", "s": [], "t": [], "g": "Mercure urinaire des travailleurs exposés :\n| Valeur | Interprétation |\n| < 5 µg/L | sujet non exposé |\n| ≥ 50 µg/L | alerte : revoir la prévention |\n| ≥ 100 µg/L | excrétion excessive : écartement du poste |\n| ≥ 300 µg/L | apparition des symptômes |\nMercure sanguin des exposés : **< 2 µg/100 ml**.", "warn": [], "type": "single", "opts": [["A", "Excrétion excessive requérant l'écartement du poste de travail."], ["B", "Valeur normale d'un sujet non exposé."], ["C", "Simple niveau d'alerte imposant de revoir les mesures de prévention, sans écartement."], ["D", "Taux inférieur au seuil d'écartement."], ["E", "Niveau à partir duquel apparaissent les symptômes d'intoxication."]], "p": {"A": ["T", "**≥ 100 µg/L** : excrétion **excessive**, **écartement** du poste."], "B": ["F", "Normale : **< 5 µg/L**."], "C": ["F", "Le niveau d'alerte est **≥ 50 µg/L** ; à 180, l'écartement s'impose."], "D": ["F", "Le seuil d'écartement est **100 µg/L**."], "E": ["F", "Ce niveau est **≥ 300 µg/L**."]}, "key": ["A"], "fmt": "QCS", "o": [["of2/o_blanc3-21_0.png", 14]]}, {"id": "blanc3-22", "exam": "blanc3", "label": "Examen blanc n°3", "n": 22, "stem": "Concernant le devenir du mercure dans l'organisme, quelles propositions sont exactes ?", "case": "blanc3-c3", "tables": [], "imgs": [], "c": "metaux", "s": [], "t": [], "g": "Métabolisme du mercure :\n• **absorption** : inhalation de vapeurs (principale), digestive, cutanée (crèmes, savons) ;\n• **distribution** : oxydation en **Hg²⁺**, liaison aux groupements **SH** ; rein (TCP, anse de Henlé), cerveau, passage placentaire ;\n• **excrétion** : urines ≈ 60 %, selles ; sueur, salive, air expiré accessoires ;\n• **cible** : cerveau.", "warn": [], "type": "multi", "opts": [["1", "L'inhalation de vapeurs est la principale voie d'absorption du mercure métallique."], ["2", "Le mercure métallique, transformé en mercure ionisé, reste piégé dans le cerveau."], ["3", "L'excrétion est essentiellement urinaire, environ 60 %."], ["4", "Le mercure déjà fixé dans le cerveau est facilement éliminé par les chélateurs."], ["5", "Le cerveau est l'organe cible, bien que le mercure s'accumule aussi dans le rein et le foie."]], "p": {"1": ["T", "Voie **respiratoire** : principale pour le mercure métallique."], "2": ["T", "Hg métal traverse la **BHE**, oxydé en Hg ionisé **piégé** dans le cerveau."], "3": ["T", "Excrétion **urinaire ≈ 60 %**, lente."], "4": ["F", "L'ion Hg++ échangeable est chélatable, **à l'exception de celui fixé dans le cerveau**."], "5": ["T", "Accumulation rein-foie, mais **cerveau = organe cible**."]}, "key": ["1", "2", "3", "5"], "fmt": "QCM", "o": [["of2/o_blanc3-22_0.png", 11]]}, {"id": "blanc3-23", "exam": "blanc3", "label": "Examen blanc n°3", "n": 23, "stem": "Quelles mesures de prévention s'imposent dans cette unité ?", "case": "blanc3-c3", "tables": [], "imgs": [], "c": "metaux", "s": [], "t": [], "g": "Prévention — mercure :\n• **technique** : substitution, travail en espace clos, aspiration, propreté, pièges à mercure, **pas de surchauffe**, **TLV 25 µg/m³**, formation, hygiène, **vestiaires séparés** ;\n• **VE** : écarter gingivite / affection buccale, atteinte rénale, désordres nerveux ; Hg urinaire de référence ;\n• **VP** : tremblement, comportement, tests psychomoteurs, protéinurie 24 h ; Hg sanguin et urinaire.", "warn": [], "type": "multi", "opts": [["1", "Éviter de surchauffer les locaux."], ["2", "Contrôler régulièrement l'atmosphère, avec une TLV de 25 µg/m³ pour les vapeurs de mercure."], ["3", "À l'embauche, éviter d'exposer les sujets porteurs de gingivite, d'atteinte rénale ou de désordres nerveux."], ["4", "Surveiller périodiquement la protéinurie des 24 heures."], ["5", "Ranger les vêtements de travail et de ville dans un même vestiaire."]], "p": {"1": ["T", "La chaleur **augmente l'évaporation** du mercure."], "2": ["T", "**TLV = 25 µg/m³**."], "3": ["T", "Contre-indications : affection **buccale**, **rénale**, **nerveuse** ; mercure urinaire de référence."], "4": ["T", "Dépistage : tremblement, comportement, tests psychomoteurs, **protéinurie des 24 h**."], "5": ["F", "Il faut des **vestiaires séparés**."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "cs": "Opérateur de 45 ans en électrolyse **chlore-soude à cathode de mercure** : **stomatogingivite**, troubles du caractère, **tremblement intentionnel cérébelleux**, **syndrome néphrotique** (glomérulopathie extramembraneuse), **mercurialentis**. Hg urinaire **180 µg/L** (≥ 100) : **écartement**. Réparation : **TMP n°2**. Prévention : pas de surchauffe, TLV 25 µg/m³, vestiaires séparés.", "o": [["of2/o_blanc3-23_0.png", 14]]}, {"id": "blanc3-24", "exam": "blanc3", "label": "Examen blanc n°3", "n": 24, "stem": "Concernant les lésions de Mme N. A., quelles propositions sont exactes ?", "case": "blanc3-c4", "tables": [], "imgs": [], "c": "derm", "s": [], "t": [], "g": "Eczéma de contact allergique :\n• hypersensibilité **retardée type IV** (haptène) ;\n• deux phases : **sensibilisation** (muette) puis **révélation** ;\n• lésions érythémato-vésiculeuses, prurigineuses, suintantes, **bords émiettés** ;\n• extension au-delà du contact : **aéroportée**, **manuportée** ;\n• histologie : **spongiose**, **exocytose**.", "warn": [], "type": "multi", "opts": [["1", "Il s'agit d'un eczéma de contact allergique."], ["2", "Le mécanisme est une hypersensibilité retardée à médiation cellulaire de type IV."], ["3", "L'atteinte des paupières peut s'expliquer par un mécanisme manuporté."], ["4", "L'évolution rythmée par le travail est un argument en faveur de l'origine professionnelle."], ["5", "Le mécanisme est une réaction immédiate IgE-dépendante."]], "p": {"1": ["T", "Lésions **érythémato-vésiculeuses**, **prurigineuses**, bords **émiettés**, débordant la zone de contact : **eczéma allergique**."], "2": ["T", "**Type IV** de Gell et Coombs."], "3": ["T", "Lésions à distance : **manuportées** (mains souillées) ou **aéroportées**."], "4": ["T", "Amélioration pendant les **congés**, récidive à la reprise."], "5": ["F", "Ce serait le mécanisme d'une **urticaire** de contact, pas de l'eczéma."]}, "key": ["1", "2", "3", "4"], "fmt": "QCM", "o": [["of2/o_blanc3-24_0.png", 6]]}, {"id": "blanc3-25", "exam": "blanc3", "label": "Examen blanc n°3", "n": 25, "stem": "Quel est le diagnostic le plus probable chez l'apprentie ?", "case": "blanc3-c4", "tables": [], "imgs": [], "c": "derm", "s": [], "t": [], "g": "Dermite irritative de contact :\n• mécanisme **non immunologique** ;\n• apparition **précoce** ; **caractère collectif** ;\n• xérose, desquamation, hyperkératose, **crevasses**, prurit peu important ;\n• **bords nets**, limitée à la zone de contact ;\n• guérison **3 à 4 jours** après arrêt de l'exposition.", "warn": [], "type": "single", "opts": [["A", "Dermite irritative de contact."], ["B", "Eczéma de contact allergique."], ["C", "Urticaire de contact."], ["D", "Dermatose infectieuse mycosique."], ["E", "Gale des céréales."]], "p": {"A": ["T", "Xérose, fissures, **brûlure**, **bords nets**, limitée au **dos des mains**, **caractère collectif** : dermite **irritative**."], "B": ["F", "L'eczéma est prurigineux, vésiculeux, à bords émiettés, individuel."], "C": ["F", "L'urticaire réalise des papules œdémateuses fugaces."], "D": ["F", "Rien n'oriente vers une mycose."], "E": ["F", "Elle est due à un acarien des céréales."]}, "key": ["A"], "fmt": "QCS", "o": [["of2/o_blanc3-25_0.png", 6]]}, {"id": "blanc3-26", "exam": "blanc3", "label": "Examen blanc n°3", "n": 26, "stem": "Concernant la comparaison entre dermite irritative et eczéma allergique, quelles propositions sont exactes ?", "case": "blanc3-c4", "tables": [], "imgs": [], "c": "derm", "s": [], "t": [], "g": "Irritative vs allergique :\n| Critère | Irritative | Allergique |\n| Mécanisme | inflammation non immunologique | hypersensibilité retardée type IV |\n| Délai | précoce | 24-48 h, sensibilisation préalable |\n| Atteinte | collective | individuelle |\n| Clinique | sèche, brûlure, bords nets | vésiculeuse, prurigineuse, bords émiettés |\n| Siège | zone de contact |
