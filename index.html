2", "exam": "2025", "label": "Juin 2025", "n": 32, "stem": "Que rechercher-vous sur le bilan urinaire pour explorer l’atteinte rénale chez ce patient (RF) ?", "case": "2025-c2", "tables": [], "imgs": [], "c": "metaux", "s": ["p6-12", "p6-22"], "t": [1], "g": "Atteinte rénale du plomb et du mercure :\n• **tubulopathie proximale** : enzymurie, glycosurie, calciurie, protéinurie de faible poids moléculaire ;\n• atteinte glomérulaire : **microalbuminurie** ;\n• évolution vers la néphropathie chronique. Les cristaux d'oxalate n'ont pas de rapport.", "warn": [], "type": "single", "opts": [["A", "Recherche de cristaux d’oxalate"], ["B", "Recherche de microalbuminurie"], ["C", "Recherche d’enzymurie"], ["D", "Recherche de glycosurie"], ["E", "Recherche de calciurie"]], "key": ["A"], "p": {"A": ["F", "Les cristaux d'[[oxalate]] n'explorent pas l'atteinte rénale aux métaux : c'est la réponse attendue."], "B": ["T", "La **microalbuminurie** dépiste une atteinte glomérulaire débutante."], "C": ["T", "L'**enzymurie** traduit l'atteinte des cellules tubulaires."], "D": ["T", "La **glycosurie** (sans hyperglycémie) signe la tubulopathie proximale."], "E": ["T", "La **calciurie** fait partie de la tubulopathie."]}, "fmt": "QCS", "cs": "Homme de 52 ans, recyclage de batteries puis lampes fluorescentes : double imprégnation **plomb** (faiblesse des extenseurs, ALA urinaire élevé) et **mercure** (tremblement, gingivite, hypersialorrhée, troubles psychiques), avec atteinte rénale.", "o": [["of2/o_2025-32_0.png", 4]]}, {"id": "2025-33", "exam": "2025", "label": "Juin 2025", "n": 33, "stem": "Sur la formule numération sanguine (FNS) de ce patient, que recherchezvous principalement ?", "case": "2025-c3", "tables": [], "imgs": [], "c": "solv", "s": ["p7-22"], "t": [4], "g": "Toxicité médullaire du benzène :\n• atteinte des **trois lignées** → **pancytopénie** ;\n• anémie (pâleur), thrombopénie (purpura, gingivorragies), leucopénie (infections) ;\n• évolution possible vers **aplasie** ou **leucémie** (TMP 4).", "warn": [], "type": "single", "opts": [["A", "Polyglobulie"], ["B", "Pancytopénie"], ["C", "Hyperleucocytose"], ["D", "Thrombocytose"], ["E", "Lymphocytose isolée"]], "key": ["B"], "p": {"A": ["F", "Pas de polyglobulie : le benzène donne une **pancytopénie** (aplasie)."], "B": ["T", "Anémie + syndrome hémorragique + infections = **pancytopénie** benzénique."], "C": ["F", "Pas d'hyperleucocytose (sauf leucémie) : les leucocytes sont **bas**."], "D": ["F", "Les plaquettes sont **basses** (purpura, gingivorragies), pas élevées."], "E": ["F", "Pas de lymphocytose isolée : les **trois lignées** sont touchées."]}, "fmt": "QCS", "o": [["of2/o_2025-33_0.png", 4]]}, {"id": "2025-34", "exam": "2025", "label": "Juin 2025", "n": 34, "stem": "À l’examen de la moelle osseuse (myélogramme), qu’attendez-vous de retrouver chez ce patient ?", "case": "2025-c3", "tables": [], "imgs": [], "c": "solv", "s": ["p7-22"], "t": [], "g": "Myélogramme dans la pancytopénie benzénique :\n• moelle **hypocellulaire** (pauvre) ;\n• remplacée par du **tissu graisseux** ;\n• c'est une **aplasie médullaire** ; l'excès de blastes signerait une leucémie.", "warn": [], "type": "single", "opts": [["A", "Hypercellularité avec excès de blastes"], ["B", "Hypocellularité avec augmentation du tissu graisseux"], ["C", "Moelle normale"], ["D", "Fibrose médullaire"], ["E", "Métaplasie osseuse"]], "key": ["B"], "p": {"A": ["F", "L'excès de blastes signe une **leucémie**, autre complication ; ici la moelle est **pauvre**."], "B": ["T", "**Hypocellularité** avec augmentation du tissu graisseux : aplasie médullaire."], "C": ["F", "La moelle n'est pas normale : elle est **hypocellulaire** et graisseuse."], "D": ["F", "La fibrose médullaire n'est pas l'aspect attendu ; on attend une moelle **hypocellulaire**."], "E": ["F", "Pas de métaplasie osseuse ; on attend une moelle **hypocellulaire**."]}, "fmt": "QCS", "o": [["of2/o_2025-34_0.png", 4]]}, {"id": "2025-35", "exam": "2025", "label": "Juin 2025", "n": 35, "stem": "Quel marqueur urinaire spécifique recherchez-vous pour confirmer l’exposition professionnelle au benzène ?", "case": "2025-c3", "tables": [], "imgs": [], "c": "solv", "s": ["p7-24"], "t": [], "g": "Biométrologie des solvants :\n• **benzène** : acide **S-phénylmercapturique (S-PMA)**, le plus spécifique ; t,t-MA moins spécifique (sorbates, tabac) ;\n• **toluène** : acide hippurique ;\n• **n-hexane** : 2,5-hexanedione ;\n• dérivés nitrés : méthémoglobine.", "warn": ["C (t,t-MA) est aussi un marqueur du benzène et peut être accepté ; le cours précise que le S-PMA est le plus spécifique."], "type": "single", "opts": [["A", "Acide hippurique"], ["B", "2,5-hexanedione"], ["C", "Acide trans-trans muconique"], ["D", "Méthémoglobine"], ["E", "Acide phénylmercapturique"]], "key": ["E"], "p": {"A": ["F", "L'acide hippurique est le marqueur du [[toluène]], pas du benzène."], "B": ["F", "La 2,5-hexanedione est le marqueur du [[n-hexane]]."], "C": ["F", "Le t,t-MA est un marqueur du benzène mais moins [[spécifique]] (alimentation, tabac)."], "D": ["F", "La méthémoglobine concerne les **dérivés nitrés et aminés**, pas le benzène."], "E": ["T", "Le **S-PMA** est le marqueur urinaire le plus spécifique du benzène."]}, "fmt": "QCS", "o": [["of2/o_2025-35_0.png", 2], ["of2/o_2025-35_1.png", 5]]}, {"id": "2025-36", "exam": "2025", "label": "Juin 2025", "n": 36, "stem": "Sur le bilan hépatique, qu’attendez-vous en cas d’atteinte toxique associée ?", "case": "2025-c3", "tables": [], "imgs": [], "c": "solv", "s": ["p7-22"], "t": [], "g": "Hépatite toxique aux solvants :\n• **cytolyse** : hausse des **transaminases** ;\n• parfois cholestase ;\n• à surveiller avec les solvants halogénés et aromatiques.", "warn": [], "type": "single", "opts": [["A", "Augmentation des transaminases"], ["B", "Diminution de la bilirubine"], ["C", "Bilan hépatique strictement normal"], ["D", "Hypoalbuminémie isolée"], ["E", "Hypercholestérolémie"]], "key": ["A"], "p": {"A": ["T", "Une hépatite toxique se traduit par une **cytolyse** : transaminases augmentées."], "B": ["F", "La bilirubine ne baisse pas ; une hépatite toxique augmente les **transaminases**."], "C": ["F", "Une atteinte toxique perturbe le bilan : **cytolyse**."], "D": ["F", "Une hypoalbuminémie isolée n'est pas le signe attendu ; on attend une **cytolyse**."], "E": ["F", "L'hypercholestérolémie n'est pas liée au benzène ; on attend une **cytolyse**."]}, "fmt": "QCS", "o": [["of2/o_2025-36_0.png", 5]]}, {"id": "2025-37", "exam": "2025", "label": "Juin 2025", "n": 37, "stem": "À l’examen clinique cutané-muqueux, que recherchez-vous chez ce patient ?", "case": "2025-c3", "tables": [], "imgs": [], "c": "solv", "s": ["p7-22"], "t": [], "g": "Examen cutanéo-muqueux dans l'intoxication benzénique :\n• la **thrombopénie** donne un syndrome hémorragique : **purpura**, **ecchymoses**, **gingivorragies**, épistaxis ;\n• la leucopénie donne des infections (angine ulcéro-nécrotique) ;\n• l'anémie donne une pâleur.", "warn": [], "type": "single", "opts": [["A", "Purpura, ecchymoses, gingivorragies"], ["B", "Ictère franc"], ["C", "Lésions bulleuses"], ["D", "Mélanodermie"], ["E", "Hypertrichose"]], "key": ["A"], "p": {"A": ["T", "La thrombopénie donne **purpura, ecchymoses, gingivorragies**."], "B": ["F", "Pas d'ictère franc attendu ; la thrombopénie donne un **syndrome hémorragique**."], "C": ["F", "Pas de lésions bulleuses ; on attend un **syndrome hémorragique**."], "D": ["F", "La mélanodermie évoque l'**arsenic** ; ici on attend un syndrome hémorragique."], "E": ["F", "L'hypertrichose n'a pas de rapport ; on attend **purpura, ecchymoses, gingivorragies**."]}, "fmt": "QCS", "o": [["of2/o_2025-37_0.png", 4]]}, {"id": "2025-38", "exam": "2025", "label": "Juin 2025", "n": 38, "stem": "Concernant la réparation des MP dues au benzène selon la réglementation algérienne, (CRJ) :", "case": "2025-c3", "tables": [], "imgs": [], "c": "solv", "s": ["p7-33"], "t": [4], "g": "TMP 4 (benzène, toluène, xylènes) :\n• **groupe 1** (toxiques), liste de travaux **indicative** ;\n• répare benzène, toluène, xylènes et **tous les produits en renfermant** ;\n• **pas de durée d'exposition** exigée ;\n• DPC : leucémie **15 ans**, aplasie / cytopénies **3 ans**, accidents aigus 3 jours.", "warn": [], "type": "multi", "opts": [["A", "Le Tableau n° 4"], ["B", "La liste des travaux exposants est indicative"], ["C", "La durée d’exposition exigée et obligatoire dans ce tableau"], ["D", "Ce tableau appartient au groupe des toxiques"], ["E", "Ce tableau répare les maladies causées par le benzène, le toluène, le xylène et tous les produits en renfermant"]], "key": ["A", "B", "D", "E"], "p": {"A": ["T", "Le **tableau n° 4** répare les maladies dues au benzène."], "B": ["T", "La liste des travaux est **indicative**."], "C": ["F", "Le TMP 4 n'exige [[pas de durée d'exposition]] ; seuls des DPC sont fixés."], "D": ["T", "Il appartient au groupe des **toxiques** (groupe 1)."], "E": ["T", "Il répare les maladies causées par le **benzène, le toluène, les xylènes** et tous les produits en renfermant."]}, "fmt": "QCM", "cs": "Ouvrier de 46 ans, 20 ans de solvants aromatiques à forte concentration (benzène 48 ppm) : **pancytopénie** avec syndrome hémorragique et infections, moelle **aplasique** ; benzène confirmé par le **S-PMA**, réparation au **TMP 4**.", "o": [["of2/o_2025-38_0.png", 6]]}, {"id": "2025-39", "exam": "2025", "label": "Juin 2025", "n": 39, "stem": "Que rechercher-vous comme principal syndrome neurologique devant ce tableau ?", "case": "2025-c4", "tables": [], "imgs": [], "c": "solv", "s": ["p7-22"], "t": [58], "g": "Neurotoxicité du n-hexane :\n• **polynévrite sensitivo-motrice distale**, symétrique ;\n• prédominance aux **membres inférieurs** : steppage, aréflexie, amyotrophie ;\n• formes graves : **quadriplégie** et atteinte respiratoire ;\n• atteinte visuelle et encéphalopathie associées possibles.", "warn": [], "type": "single", "opts": [["A", "Syndrome cérébelleux"], ["B", "Polynévrite sensitivo-motrice distale"], ["C", "Myélite transverse"], ["D", "Syndrome pyramidal pur"], ["E", "Neuropathie optique isolée"]], "key": ["B"], "p": {"A": ["F", "Pas de syndrome cérébelleux dominant ; le n-hexane donne une **polynévrite sensitivo-motrice**."], "B": ["T", "**Polynévrite sensitivo-motrice distale**, symétrique, prédominant aux membres inférieurs."], "C": ["F", "Pas de myélite ; l'atteinte est **périphérique**."], "D": ["F", "Les réflexes sont abolis (périphérique), pas pyramidaux : **polynévrite**."], "E": ["F", "L'atteinte visuelle est associée, pas isolée ; le syndrome principal est la **polynévrite**."]}, "fmt": "QCS", "o": [["of2/o_2025-39_0.png", 3]]}, {"id": "2025-40", "exam": "2025", "label": "Juin 2025", "n": 40, "stem": "Quel est le métabolite urinaire spécifique utilisé comme biomarqueur d’exposition professionnelle pour ce tableau ?", "case": "2025-c4", "tables": [], "imgs": [], "c": "solv", "s": ["p7-24"], "t": [], "g": "Biomarqueur du n-hexane :\n• **2,5-hexanedione** urinaire, métabolite **neurotoxique** ;\n• ici 3,8 mg/L (N < 0,4) : forte imprégnation ;\n• acide hippurique = toluène ; t,t-MA et S-PMA = benzène.", "warn": [], "type": "single", "opts": [["A", "Acide hippurique"], ["B", "Acide trans-trans muconique"], ["C", "2,5-hexanedione"], ["D", "Méthémoglobine"], ["E", "Acide S-phénylmercapturique"]], "key": ["C"], "p": {"A": ["F", "L'acide hippurique est le marqueur du **toluène** ; pour le n-hexane : **2,5-hexanedione**."], "B": ["F", "Le t,t-MA est un marqueur du **benzène** ; pour le n-hexane : **2,5-hexanedione**."], "C": ["T", "La **2,5-hexanedione** est le métabolite neurotoxique et le biomarqueur du n-hexane."], "D": ["F", "La méthémoglobine concerne les **dérivés nitrés** ; pour le n-hexane : **2,5-hexanedione**."], "E": ["F", "Le S-PMA est le marqueur du **benzène** ; pour le n-hexane : **2,5-hexanedione**."]}, "fmt": "QCS", "o": [["of2/o_2025-40_0.png", 6], ["of2/o_2025-40_1.png", 2]]}, {"id": "2025-41", "exam": "2025", "label": "Juin 2025", "n": 41, "stem": "Quel examen complémentaire est le plus utile pour confirmer le diagnostic de neuropathie liée à cette intoxication ?", "case": "2025-c4", "tables": [], "imgs": [], "c": "solv", "s": ["p7-22"], "t": [], "g": "Confirmation de la neuropathie toxique :\n• **EMG** : ralentissement des vitesses de conduction sensitives et motrices, signes de dégénérescence **axonale** ;\n• il précise le type et la sévérité et sert au suivi.", "warn": [], "type": "single", "opts": [["A", "Scanner cérébral"], ["B", "Électromyogramme (EMG)"], ["C", "Radiographie des membres"], ["D", "Bilan immunologique"], ["E", "Échographie abdominale"]], "key": ["B"], "p": {"A": ["F", "Le scanner cérébral n'explore pas les nerfs périphériques ; la neuropathie se confirme par **EMG**."], "B": ["T", "L'**EMG** confirme la neuropathie : ralentissement des conductions et atteinte axonale."], "C": ["F", "La radiographie des membres n'explore pas les nerfs ; l'examen est l'**EMG**."], "D": ["F", "Le bilan immunologique cherche une autre cause ; l'examen de confirmation est l'**EMG**."], "E": ["F", "L'échographie abdominale n'explore pas les nerfs ; l'examen est l'**EMG**."]}, "fmt": "QCS", "o": [["of2/o_2025-41_0.png", 3]]}, {"id": "2025-42", "exam": "2025", "label": "Juin 2025", "n": 42, "stem": "Parmi les complications suivantes, laquelle est la plus redoutée lors d’une intoxication sévère par la substance incriminée ?", "case": "2025-c4", "tables": [], "imgs": [], "c": "solv", "s": ["p7-22"], "t": [], "g": "Complication redoutée du n-hexane :\n• **quadriplégie flasque** ;\n• atteinte des **muscles respiratoires** (ventilation nécessaire) ;\n• récupération souvent **incomplète** après l'arrêt de l'exposition.", "warn": [], "type": "single", "opts": [["A", "Insuffisance hépatique aiguë"], ["B", "Quadriplégie avec paralysie des muscles respiratoires"], ["C", "Insuffisance rénale terminale"], ["D", "Polyglobulie"], ["E", "Syndrome néphrotique"]], "key": ["B"], "p": {"A": ["F", "L'atteinte hépatique est modérée ; la complication redoutée est la **quadriplégie** respiratoire."], "B": ["T", "**Quadriplégie** avec paralysie des muscles respiratoires, comme dans l'évolution du cas."], "C": ["F", "L'atteinte rénale est modérée ; la complication redoutée est la **quadriplégie**."], "D": ["F", "La NFS est normale ; la polyglobulie n'est pas une complication du n-hexane."], "E": ["F", "Pas de syndrome néphrotique ; la complication redoutée est la **quadriplégie**."]}, "fmt": "QCS", "o": [["of2/o_2025-42_0.png", 3]]}, {"id": "2025-43", "exam": "2025", "label": "Juin 2025", "n": 43, "stem": "Concernant la réparation des neuropathies professionnelles dues à cette substance selon la réglementation algérienne, quelle affirmation est correcte ?", "case": "2025-c4", "tables": [], "imgs": [], "c": "solv", "s": ["p7-33"], "t": [58], "g": "TMP 58 (n-hexane) :\n• répare la **polynévrite** avec troubles électriques (EMG) ;\n• **DPC 30 jours** ;\n• liste des travaux **indicative** ;\n• pas de durée d'exposition minimale ; la **2,5-hexanedione** sert à la surveillance.", "warn": [], "type": "single", "opts": [["A", "Le Tableau n° 58 concerne spécifiquement l’intoxication professionnelle par l’hexane"], ["B", "La liste des travaux exposants est limitative"], ["C", "Seules les atteintes hépatiques sont indemnisées"], ["D", "La reconnaissance nécessite obligatoirement une exposition > 10 ans"], ["E", "Aucun biomarqueur n’est reconnu pour la surveillance"]], "key": ["A"], "p": {"A": ["T", "Le **TMP 58** concerne spécifiquement l'intoxication par l'hexane."], "B": ["F", "La liste des travaux du TMP 58 est [[indicative]], pas limitative."], "C": ["F", "C'est la **polynévrite** qui est indemnisée, pas seulement le foie."], "D": ["F", "Aucune durée d'exposition de [[10 ans]] n'est exigée."], "E": ["F", "La [[2,5-hexanedione]] est le biomarqueur reconnu pour la surveillance."]}, "fmt": "QCS", "cs": "Ouvrier de 38 ans en fabrication de chaussures, colles au **n-hexane** : **polynévrite sensitivo-motrice** distale qui s'étend aux quatre membres, EMG axonal, 2,5-hexanedione élevée. Réparation au **TMP 58** (DPC 30 jours).", "o": [["of2/o_2025-43_0.png", 6]]}, {"id": "2025-44", "exam": "2025", "label": "Juin 2025", "n": 44, "stem": "En analysant l’ensemble du dossier, quel agent professionnel est le plus incriminé dans ce type de cancer broncho-pulmonaire ?", "case": "2025-c5", "tables": [], "imgs": [], "c": "cancer", "s": ["p12-23", "p14-21"], "t": [30], "g": "Imputabilité d'un CBP chez un polyexposé :\n• **plaques pleurales calcifiées** + fibrose interstitielle = marqueurs d'exposition à l'**amiante** ;\n• calorifugeage et chaudières confirment la source ;\n• réparation : **TMP 30** (DPC 30 ans).", "warn": [], "type": "single", "opts": [["A", "Amiante"], ["B", "Silice"], ["C", "Chrome"], ["D", "Nickel"], ["E", "Hydrocarbures aromatiques polycycliques¨"]], "key": ["A"], "p": {"A": ["T", "Plaques pleurales calcifiées, fibrose et calorifugeage désignent l'**amiante**."], "B": ["F", "La silice donnerait des nodules des **sommets** ; les plaques pleurales désignent l'amiante."], "C": ["F", "Le chrome est plausible mais sans marqueur radiologique ; les plaques pleurales désignent l'**amiante**."], "D": ["F", "Le nickel est plausible mais sans marqueur ; les plaques pleurales désignent l'**amiante**."], "E": ["F", "Les HAP sont plausibles mais sans marqueur ; les plaques pleurales désignent l'**amiante**."]}, "fmt": "QCS", "cs": "Polyexposé de 64 ans (amiante, silice, chrome, nickel, HAP) et ancien fumeur, avec CBP : les **plaques pleurales calcifiées** et le calorifugeage désignent l'**amiante** (TMP 30).", "o": [["of2/o_2025-44_0.png", 8], ["of2/o_2025-44_1.png", 5]]}, {"id": "2025-45", "exam": "2025", "label": "Juin 2025", "n": 45, "stem": "Quel élément du dossier doit attirer votre attention pour l’imputabilité professionnelle du cancer ?", "case": "2025-c6", "tables": [], "imgs": [], "c": "cancer", "s": ["p12-14", "p14-23"], "t": [], "g": "Argument d'imputabilité chez un mineur avec CBP :\n• une **pneumoconiose** visible (micronodules des sommets, masses pseudo-tumorales, fibrose) prouve objectivement l'exposition aux poussières minérales ;\n• la silice est cancérogène pulmonaire (CIRC 1) ;\n• le tabac est un facteur confondant, pas un argument professionnel.", "warn": [], "type": "single", "opts": [["A", "Présence d’une fibrose interstitielle et d’opacités micronodulaires chez un travailleur exposé à des poussières minérales"], ["B", "Tabagisme modéré"], ["C", "Masse lobaire supérieure droite isolée"], ["D", "Adénopathies hilaires sans autres anomalies"], ["E", "Douleurs thoraciques fluctuantes"]], "key": ["A"], "p": {"A": ["T", "Fibrose et **micronodules** chez un exposé aux poussières minérales prouvent l'exposition."], "B": ["F", "Le tabac est un facteur **confondant**, pas un argument professionnel."], "C": ["F", "Une masse lobaire isolée n'oriente pas vers le travail ; l'argument est la **pneumoconiose** visible."], "D": ["F", "Des adénopathies hilaires ne sont pas spécifiques ; l'argument est la **pneumoconiose** visible."], "E": ["F", "Des douleurs thoraciques ne sont pas spécifiques ; l'argument est la **pneumoconiose** visible."]}, "fmt": "QCS", "o": [["of2/o_2025-45_0.png", 1], ["of2/o_2025-45_1.png", 8]]}, {"id": "2025-46", "exam": "2025", "label": "Juin 2025", "n": 46, "stem": "Quelle difficulté principale rencontrez-vous pour établir le lien professionnel dans ce dossier ?", "case": "2025-c6", "tables": [], "imgs": [], "c": "cancer", "s": ["p14-31"], "t": [], "g": "Difficultés pour établir le lien professionnel d'un cancer :\n• **expositions multiples** ;\n• **tabagisme** concomitant ;\n• **documentation** professionnelle lacunaire, absence de suivi ;\n• découverte **après la retraite**. Tous gênent : il faut les **hiérarchiser**.", "warn": [], "type": "single", "opts": [["A", "Multiplicité des expositions à différents types de poussières"], ["B", "Présence d’un tabagisme concomitant"], ["C", "Documentation professionnelle lacunaire et absence de suivi"], ["D", "Découverte du cancer après la retraite"], ["E", "Tous ces éléments compliquent l’analyse, mais il faut hiérarchiser leur poids"]], "key": ["E"], "p": {"A": ["T", "La **multiplicité** des expositions complique l'attribution à un agent."], "B": ["T", "Le **tabac** concomitant est un facteur confondant."], "C": ["T", "La **documentation lacunaire** empêche de reconstituer les expositions."], "D": ["T", "La découverte **après la retraite** éloigne de l'exposition et complique le dossier."], "E": ["T", "**Tous** ces éléments compliquent l'analyse ; le raisonnement attendu est de hiérarchiser leur poids."]}, "fmt": "QCS", "o": [["of2/o_2025-46_0.png", 1]]}, {"id": "2025-47", "exam": "2025", "label": "Juin 2025", "n": 47, "stem": "Parmi les complications pulmonaires chroniques, laquelle doit être évoquée devant ce tableau radiologique et professionnel ?", "case": "2025-c6", "tables": [], "imgs": [], "c": "pneumo", "s": ["p12-13", "p12-14"], "t": [25], "g": "Complication pulmonaire chronique chez un mineur / tunnelier :\n• micronodules et fibrose des sommets, masses pseudo-tumorales ;\n• **syndrome restrictif** sévère ;\n• → **pneumopathie interstitielle d'origine minérale** (silicose), à compliquer de TB et de cancer.", "warn": [], "type": "single", "opts": [["A", "Asthme professionnel"], ["B", "Bronchite chronique simple"], ["C", "Pneumopathie interstitielle liée à une exposition minérale"], ["D", "Emphysème centrolobulaire"], ["E", "Tuberculose pulmonaire séquellaire"]], "key": ["C"], "p": {"A": ["F", "L'asthme ne donne pas d'images nodulaires ; ici : **pneumoconiose** (silicose)."], "B": ["F", "La bronchite chronique ne donne pas de fibrose ; ici : **pneumoconiose**."], "C": ["T", "**Pneumopathie interstitielle** liée à une exposition minérale : silicose."], "D": ["F", "L'emphysème ne donne pas de micronodules ; ici : **pneumoconiose**."], "E": ["F", "La tuberculose séquellaire n'explique pas l'ensemble ; ici : **pneumoconiose** (à surveiller pour la TB)."]}, "fmt": "QCS", "cs": "Mineur et tunnelier de 58 ans, sans suivi médical, fumeur : micronodules des sommets et masses pseudo-tumorales → **pneumoconiose silicotique**, qui prouve l'exposition et sert d'argument d'imputabilité d'un cancer bronchique.", "o": [["of2/o_2025-47_0.png", 11]]}, {"id": "2025-48", "exam": "2025", "label": "Juin 2025", "n": 48, "stem": "Quel élément du dossier doit attirer votre attention pour l’imputabilité professionnelle de cette tumeur ?", "case": "2025-c7", "tables": [], "imgs": [], "c": "cancer", "s": ["p14-21"], "t": [47], "g": "Cancer de l'ethmoïde, localisation sentinelle :\n• **poussières de bois** (TMP 47) ;\n• **nickel** (TMP 37), cuir ;\n• toute tumeur de l'ethmoïde chez un exposé doit faire évoquer l'origine professionnelle.", "warn": [], "type": "single", "opts": [["A", "Masse sinusienne isolée sans autre facteur"], ["B", "Présence d’une masse ethmoïdale chez un travailleur exposé à des poussières industrielles"], ["C", "Tabagisme modéré"], ["D", "Céphalées frontales fluctuantes"], ["E", "Douleurs orbito-nasales intermittentes"]], "key": ["B"], "p": {"A": ["F", "« Sans autre facteur » ignore l'exposition ; l'argument est la **masse ethmoïdale chez un exposé**."], "B": ["T", "Une **masse ethmoïdale** chez un travailleur exposé aux poussières est une localisation sentinelle."], "C": ["F", "Le tabac n'est pas un argument d'imputabilité ; l'ethmoïde est une **localisation sentinelle** du bois."], "D": ["F", "Des céphalées ne sont pas spécifiques ; l'argument est la **localisation ethmoïdale**."], "E": ["F", "Des douleurs orbito-nasales ne sont pas spécifiques ; l'argument est la **localisation ethmoïdale**."]}, "fmt": "QCS", "o": [["of2/o_2025-48_0.png", 1], ["of2/o_2025-48_1.png", 8]]}, {"id": "2025-49", "exam": "2025", "label": "Juin 2025", "n": 49, "stem": "Quelle difficulté principale rencontrez-vous pour établir le lien professionnel dans ce dossier ?", "case": "2025-c7", "tables": [], "imgs": [], "c": "cancer", "s": ["p14-31"], "t": [], "g": "Difficulté principale dans ce dossier ORL :\n• **bois** (ameublement, 29 ans) puis **nickel et chrome** (galvanoplastie, 8 ans) ;\n• deux agents sentinelles de l'ethmoïde, deux tableaux possibles (47 et 37) ;\n• il faut **attribuer** la tumeur à un agent.", "warn": ["B (documentation lacunaire) est aussi défendable ; la multiplicité des expositions est la difficulté la plus spécifique au dossier."], "type": "single", "opts": [["A", "Présence d’un tabagisme concomitant"], ["B", "Documentation professionnelle lacunaire"], ["C", "Découverte de la tumeur après la retraite"], ["D", "Multiplicité des expositions à différents types de poussières et métaux"], ["E", "La nature histologique peu différenciée"]], "key": ["D"], "p": {"A": ["F", "Le tabac n'est pas la difficulté principale ; c'est la **multiplicité** des expositions."], "B": ["F", "La documentation lacunaire gêne, mais la difficulté principale est la **multiplicité** des expositions."], "C": ["F", "La découverte tardive gêne, mais la difficulté principale est la **multiplicité** des expositions."], "D": ["T", "**Multiplicité** des expositions (bois, nickel, chrome) : il faut choisir l'agent et le tableau."], "E": ["F", "L'histologie peu différenciée ne bloque pas l'imputabilité."]}, "fmt": "QCS", "o": [["of2/o_2025-49_0.png", 3], ["of2/o_2025-49_1.png", 1]]}, {"id": "2025-50", "exam": "2025", "label": "Juin 2025", "n": 50, "stem": "Parmi les facteurs de risque suivants, lequel est le plus fortement documenté dans la littérature pour ce type de tumeur des sinus ?", "case": "2025-c7", "tables": [], "imgs": [], "c": "cancer", "s": ["p14-21"], "t": [47], "g": "Facteur de risque le plus documenté du cancer de l'ethmoïde :\n• **poussières de bois**, surtout les **bois durs** (adénocarcinome) ;\n• aussi nickel et cuir ;\n• formaldéhyde → nasopharynx ; silice → poumon.", "warn": [], "type": "single", "opts": [["A", "Exposition à la poussière de cuir"], ["B", "Exposition à la poussière de bois"], ["C", "Exposition au chrome"], ["D", "Exposition au formaldéhyde"], ["E", "Exposition à la silice"]], "key": ["B"], "p": {"A": ["F", "Le cuir est un facteur reconnu, mais moins documenté que les **poussières de bois**."], "B": ["T", "Les **poussières de bois** (bois durs) sont le premier facteur d'adénocarcinome de l'ethmoïde."], "C": ["F", "Le chrome est moins documenté pour l'ethmoïde que les **poussières de bois**."], "D": ["F", "Le formaldéhyde donne surtout le cancer du **nasopharynx**."], "E": ["F", "La silice donne le cancer du **poumon**, pas de l'ethmoïde."]}, "fmt": "QCS", "o": [["of2/o_2025-50_0.png", 8], ["of2/o_2025-50_1.png", 5]]}, {"id": "2025-51", "exam": "2025", "label": "Juin 2025", "n": 51, "stem": "Sur le plan mécanistique, quelle étape de la cancérogenèse est la plus directement liée à l’exposition chronique à la poussière de bois ou au nickel ?", "case": "2025-c7", "tables": [], "imgs": ["aud-000.jpg"], "c": "cancer", "s": ["p14-11"], "t": [], "g": "Cancérogenèse et agents génotoxiques :\n• **initiation** : altération **irréversible de l'ADN** d'une cellule normale ;\n• bois et nickel sont des **initiateurs** ;\n• promotion (prolifération) et progression (invasion) viennent ensuite.", "warn": [], "type": "single", "opts": [["A", "La phase d’initiation, avec altération de l’ADN"], ["B", "La phase de promotion, par action hormonale"], ["C", "La phase de progression, par angiogenèse"], ["D", "La phase de réparation, par apoptose"], ["E", "La phase d’inflammation aiguë"]], "key": ["A"], "p": {"A": ["T", "Bois et nickel sont des **initiateurs** : ils altèrent l'ADN d'une cellule normale."], "B": ["F", "La promotion n'est pas l'effet direct ici ; bois et nickel agissent à l'**initiation**."], "C": ["F", "La progression (angiogenèse, invasion) vient après ; l'étape liée est l'**initiation**."], "D": ["F", "La « réparation » n'est pas une phase de la cancérogenèse ; l'étape liée est l'**initiation**."], "E": ["F", "Il n'y a pas d'inflammation aiguë ; l'étape liée est l'**initiation**."]}, "fmt": "QCS", "cs": "Homme de 56 ans, 29 ans d'ameublement puis 8 ans de galvanoplastie : **masse ethmoïdale** → cancer sentinelle ; la difficulté est la **multiplicité des expositions** (bois TMP 47, nickel TMP 37) ; les poussières de bois restent le facteur le plus documenté.", "o": [["of2/o_2025-51_0.png", 2]]}, {"id": "2025-52", "exam": "2025", "label": "Juin 2025", "n": 52, "stem": "Selon la formule réglementaire du TMP 42, quel calcul du déficit auditif moyen (DA) est correct pour l’oreille droite de Monsieur A.", "case": "2025-c8", "tables": [], "imgs": [], "c": "bruit", "s": ["p15-32"], "t": [42], "g": "Calcul du DA de l'oreille droite (TMP 42) :\n• seuils OD : 500 = 20, 1000 = 20, 2000 = 65, 4000 = 70 dB ;\n• **DA = (2×20 + 4×20 + 3×65 + 1×70) / 10 = 385 / 10 = 38,5 dB** ;\n• le coefficient 4 va toujours sur **1 000 Hz**.", "warn": [], "type": "multi", "opts": [["1", "DA = (2×20) + (4×65) + (3×20) + (1×70) / 10"], ["2", "DA = (2×20) + (4×20) + (3×65) + (1×70) / 10"], ["3", "DA = (2×65) + (4×20) + (3×20) + (1×70) / 10"], ["4", "DA (OD) = 43"], ["5", "DA (OD) = 38.5"]], "p": {"1": ["F", "Le 4 est mis sur [[2 000 Hz]] (65) ; il doit aller sur **1 000 Hz** (20)."], "2": ["T", "**(2×20) + (4×20) + (3×65) + (1×70)** : c'est la bonne répartition des coefficients."], "3": ["F", "Le 2 est mis sur 2 000 Hz ; il doit aller sur **500 Hz** (2×20)."], "4": ["F", "43 dB est faux ; le bon calcul donne **385 / 10 = 38,5 dB**."], "5": ["T", "**38,5 dB** : 40 + 80 + 195 + 70 = 385, divisé par 10."]}, "key": ["2", "5"], "fmt": "QCM", "cs": "Menuisier de 51 ans, 35 ans de machines bruyantes : déficit **bilatéral** sur les aigus, persistant après 1 mois d'éviction. **DA de l'OD = 38,5 dB**, avec le coefficient 4 sur 1 000 Hz.", "o": [["of2/o_2025-52_0.png", 7]]}, {"id": "2025-53", "exam": "2025", "label": "Juin 2025", "n": 53, "stem": "En interrogeant Madame F., quel élément recherchez-vous en priorité pour établir le lien professionnel de la dermatose, sachant que le terrain atopique est connu ?", "case": "2025-c9", "tables": [], "imgs": [], "c": "derm", "s": ["p13-22", "p13-23"], "t": [64], "g": "Lien professionnel d'une dermatose chez une atopique :\n• premier argument : la **chronologie** (amélioration pendant les évictions, rechute à la reprise) ;\n• puis la topographie, les produits manipulés et les **patch-tests** ;\n• l'atopie favorise mais n'exclut pas l'origine professionnelle.", "warn": [], "type": "single", "opts": [["B", "Utilisation de crèmes hydratantes à domicile"], ["C", "Présence d’antécédents familiaux de psoriasis"], ["D", "Changement de lessive récemment"], ["A", "Chronologie précise des poussées en lien avec les périodes d’éviction"], ["E", "Consommation de fruits de mer"]], "key": ["A"], "p": {"A": ["T", "La **chronologie** des poussées par rapport aux évictions est le premier argument d'origine professionnelle."], "B": ["F", "Les crèmes à domicile ne prouvent rien ; le premier argument est la **chronologie**."], "C": ["F", "Le psoriasis familial oriente vers un différentiel, pas vers le lien professionnel."], "D": ["F", "Une nouvelle lessive est une cause domestique à éliminer ; le lien pro se prouve par la **chronologie**."], "E": ["F", "Les fruits de mer n'ont pas de rapport ; le lien pro se prouve par la **chronologie**."]}, "fmt": "QCS", "o": [["of2/o_2025-53_0.png", 2]]}, {"id": "2025-54", "exam": "2025", "label": "Juin 2025", "n": 54, "stem": "À l’examen clinique, quel détail vous ferait douter d’une origine strictement professionnelle ?", "case": "2025-c9", "tables": [], "imgs": [], "c": "derm", "s": ["p13-23"], "t": [], "g": "Topographie d'une dermatose professionnelle (critère de Mathias) :\n• siège sur les **zones de contact** (mains, poignets, avant-bras) ;\n• une atteinte du visage et du cou **sans les mains** fait douter d'une origine professionnelle ;\n• fissures, croûtes et prurit sont compatibles.", "warn": [], "type": "single", "opts": [["A", "Lésions limitées aux mains et poignets"], ["B", "Lésions sur le visage et le cou, sans atteinte des mains"], ["C", "Prurit nocturne"], ["D", "Fissures profondes des paumes"], ["E", "Croûtes sur les doigts"]], "key": ["B"], "p": {"A": ["F", "Mains et poignets sont les zones de contact : c'est [[typique]] d'une origine professionnelle, pas un motif de doute."], "B": ["T", "Une atteinte du visage et du cou **sans les mains** fait douter : cause extra-professionnelle probable."], "C": ["F", "Le prurit nocturne ne départage pas ; ce qui fait douter est l'atteinte **sans les mains**."], "D": ["F", "Des fissures palmaires sont compatibles avec une dermatose professionnelle."], "E": ["F", "Des croûtes sur les doigts sont compatibles avec une dermatose professionnelle."]}, "fmt": "QCS", "o": [["of2/o_2025-54_0.png", 3]]}, {"id": "2025-55", "exam": "2025", "label": "Juin 2025", "n": 55, "stem": "Pour confirmer l’origine allergique, quel test complémentaire est le plus pertinent, mais aussi le plus sujet à faux négatif en cas de corticothérapie récente ?", "case": "2025-c9", "tables": [], "imgs": [], "c": "derm", "s": ["p13-24", "p13-13"], "t": [64], "g": "Explorer un eczéma allergique de contact :\n• **patch-test** (test épicutané) : hypersensibilité retardée de type IV ;\n• allergènes sous occlusion **48 h**, lectures à 48 h puis jusqu'à 96 h ;\n• **faux négatif** sous corticoïdes : arrêt local 1 semaine, général 1 mois ;\n• prick-test = allergie immédiate (latex).", "warn": [], "type": "single", "opts": [["A", "Dosage des IgE totales"], ["B", "Test d’éviction-réintégration"], ["C", "Patch-test épicutané"], ["D", "Prick-test"], ["E", "Biopsie cutanée"]], "key": ["C"], "p": {"A": ["F", "Les IgE totales explorent l'atopie, pas l'hypersensibilité de type IV ; l'examen est le **patch-test**."], "B": ["F", "L'éviction-réintégration est un critère clinique, pas un test d'allergie ; l'examen est le **patch-test**."], "C": ["T", "Le **patch-test** explore l'eczéma de contact et devient faussement négatif sous corticoïdes."], "D": ["F", "Le prick-test explore l'allergie [[immédiate]] (type I), pas l'eczéma."], "E": ["F", "La biopsie montre une spongiose mais n'identifie pas l'allergène ; l'examen est le **patch-test**."]}, "fmt": "QCS", "cs": "Femme de 45 ans, atopique (imprimerie, agroalimentaire, soins) : **eczéma des mains** qui s'améliore en vacances. Le lien professionnel repose sur la **chronologie** et la topographie ; l'allergène s'identifie par **patch-tests**.", "o": [["of2/o_2025-55_0.png", 6], ["of2/o_2025-55_1.png", 3]]}, {"id": "2025-56", "exam": "2025", "label": "Juin 2025", "n": 56, "stem": "Que recherchez-vous en priorité à l’interrogatoire pour orienter le diagnostic vers une pathologie professionnelle liée à l’exposition à un agent physique ?", "case": "2025-c10", "tables": [], "imgs": [], "c": "ri", "s": ["p9-13", "p9-33"], "t": [6], "g": "Orienter vers une pathologie liée aux rayonnements ionisants :\n• le **lien chronologique** entre l'exposition professionnelle (radiologie, radiothérapie) et l'apparition des lésions ;\n• puis la reconstitution du poste, de la dosimétrie et du respect de la radioprotection.", "warn": [], "type": "single", "opts": [["A", "La chronologie des lésions par rapport à l’activité professionnelle"], ["B", "La consommation de produits laitiers"], ["C", "L’existence d’un terrain atopique familial"], ["D", "L’exposition solaire de loisir"], ["E", "La prise de médicaments photosensibilisants"]], "key": ["A"], "p": {"A": ["T", "La **chronologie** des lésions par rapport à l'activité professionnelle fonde l'imputabilité."], "B": ["F", "Les produits laitiers n'ont pas de rapport ; on cherche la **chronologie** avec les RI."], "C": ["F", "L'atopie oriente vers une autre dermatose ; on cherche la **chronologie** avec les RI."], "D": ["F", "Le soleil est un diagnostic différentiel ; l'argument professionnel est la **chronologie** avec les RI."], "E": ["F", "Les photosensibilisants sont un différentiel ; l'argument professionnel est la **chronologie**."]}, "fmt": "QCS", "o": [["of2/o_2025-56_0.png", 11]]}, {"id": "2025-57", "exam": "2025", "label": "Juin 2025", "n": 57, "stem": "Que recherchez-vous à l’examen clinique pour suspecter une atteinte chronique liée à une exposition professionnelle (RF) ?", "case": "2025-c10", "tables": [], "imgs": [], "c": "ri", "s": ["p13-12"], "t": [6], "g": "Radiodermite chronique :\n• peau **sèche**, **atrophique**, amincie ;\n• **télangiectasies**, zones dépigmentées, dépilation ;\n• **ulcérations** chroniques sur les zones exposées (dos des mains) ;\n• risque de **carcinome**. Pas de purpura des membres inférieurs.", "warn": [], "type": "single", "opts": [["A", "Atrophie cutanée"], ["B", "Télangiectasies"], ["C", "Peau sèche"], ["D", "Ulcérations chroniques sur zones exposées"], ["E", "Purpura des membres inférieurs"]], "key": ["E"], "p": {"A": ["T", "L'**atrophie cutanée** est le signe cardinal de la radiodermite chronique."], "B": ["T", "Les **télangiectasies** sont typiques."], "C": ["T", "La **peau sèche**, amincie et moins souple est typique."], "D": ["T", "Des **ulcérations chroniques** sur les zones exposées sont typiques."], "E": ["F", "Un [[purpura des membres inférieurs]] n'est pas un signe de radiodermite (zones non exposées) : c'est la réponse attendue."]}, "fmt": "QCS", "o": [["of2/o_2025-57_0.png", 6]]}, {"id": "2025-58", "exam": "2025", "label": "Juin 2025", "n": 58, "stem": "Dans l’enquête professionnelle, que recherchez-vous pour étayer le diagnostic d’une pathologie liée à l’exposition aux rayonnements ionisants (RF) ?", "case": "2025-c10", "tables": [], "imgs": [], "c": "ri", "s": ["p9-13", "p9-32"], "t": [], "g": "Enquête professionnelle aux rayonnements ionisants :\n• **analyse du poste** ;\n• **durée** d'exposition cumulée ;\n• **type d'appareils** manipulés ;\n• respect de la **radioprotection** (gants plombés, écrans, dosimétrie). Les antécédents d'eczéma n'y ont pas leur place.", "warn": [], "type": "single", "opts": [["A", "L’analyse précise du poste du travail"], ["B", "Antécédents d’eczéma"], ["C", "Durée d’exposition cumulée"], ["D", "Respect des mesures de radioprotection"], ["E", "Type d’appareils manipulés"]], "key": ["B"], "p": {"A": ["T", "L'**analyse précise du poste** est le cœur de l'enquête."], "B": ["F", "Des antécédents d'[[eczéma]] n'appartiennent pas à l'enquête d'exposition aux RI : c'est la réponse attendue."], "C": ["T", "La **durée d'exposition** cumulée renseigne sur la dose."], "D": ["T", "Le **respect des mesures de radioprotection** (gants plombés, écrans) conditionne la dose aux mains."], "E": ["T", "Le **type d'appareils** (radiologie, radiothérapie) renseigne sur la nature et l'intensité de l'exposition."]}, "fmt": "QCS", "o": [["of2/o_2025-58_0.png", 9], ["of2/o_2025-58_1.png", 7]]}, {"id": "2025-59", "exam": "2025", "label": "Juin 2025", "n": 59, "stem": "Quel bilan complémentaire demanderiez-vous en priorité pour apprécier la sévérité des lésions cutanées chroniques ?", "case": "2025-c10", "tables": [], "imgs": [], "c": "ri", "s": ["p13-12"], "t": [], "g": "Bilan d'une radiodermite chronique :\n• **biopsie** des zones atrophiques ou ulcérées ;\n• elle apprécie la **sévérité** ;\n• elle recherche une **transformation maligne** (carcinome épidermoïde sur radiodermite).", "warn": [], "type": "single", "opts": [["A", "Biopsie cutanée des zones atrophiques ou ulcérées"], ["B", "Dosage des IgE totales"], ["C", "Patch-tests allergiques"], ["D", "Sérologie hépatite C"], ["E", "Dosage du potassium"]], "key": ["A"], "p": {"A": ["T", "La **biopsie** apprécie la sévérité et recherche un carcinome sur radiodermite."], "B": ["F", "Les IgE totales n'apprécient pas la sévérité ; on fait une **biopsie**."], "C": ["F", "Les patch-tests explorent l'allergie de contact ; on fait une **biopsie**."], "D": ["F", "La sérologie VHC n'a pas de rapport ; on fait une **biopsie**."], "E": ["F", "La kaliémie n'a pas de rapport ; on fait une **biopsie**."]}, "fmt": "QCS", "o": [["of2/o_2025-59_0.png", 6]]}, {"id": "2025-60", "exam": "2025", "label": "Juin 2025", "n": 60, "stem": "Après réparation, quelles mesures de prévention secondaire recommandezvous pour limiter le risque de complications évolutives (RF) ?", "case": "2025-c10", "tables": [], "imgs": [], "c": "ri", "s": ["p9-24"], "t": [], "g": "Prévention secondaire après radiodermite :\n• **surveillance dermatologique** et contrôles réguliers (dépistage du carcinome) ;\n• **auto-surveillance** ;\n• **éviter les traumatismes** de la peau fragile ;\n• pas de dermocorticoïdes au long cours, qui **aggravent l'atrophie**.", "warn": [], "type": "single", "opts": [["A", "Surveillance dermatologique régulière,"], ["B", "Éducation à l’auto-surveillance,"], ["C", "Éviction des traumatismes"], ["D", "Prescription de corticoïdes locaux à long terme"], ["E", "Contrôles médicaux régulier"]], "key": ["D"], "p": {"A": ["T", "La **surveillance dermatologique** régulière dépiste une transformation maligne."], "B": ["T", "L'**éducation à l'auto-surveillance** fait consulter dès qu'une lésion change."], "C": ["T", "**Éviter les traumatismes** protège une peau atrophique qui cicatrise mal."], "D": ["F", "Les [[corticoïdes]] locaux au long cours aggravent l'atrophie : ce n'est pas une mesure de prévention (réponse attendue)."], "E": ["T", "Des **contrôles médicaux** réguliers font partie de la prévention secondaire."]}, "fmt": "QCS", "cs": "Ancien manipulateur radio puis technicien de radiothérapie, 59 ans : **radiodermite chronique** des mains (atrophie, télangiectasies, ulcérations). Enquête sur le poste et la radioprotection, **biopsie** à la recherche d'un carcinome, surveillance dermatologique.", "o": [["of2/o_2025-60_0.png", 9]]}, {"id": "2024-01", "exam": "2024", "label": "2024", "n": 1, "stem": "L’article 12 de la loi 88/07 du 26 janvier 1988 relative à l’hygiène, à la sécurité et à la médecine du travail, stipule que la médecine du travail dont la double mission est préventive essentiellement, et curative accessoirement, a pour but de : (CRF)", "case": null, "tables": [], "imgs": [], "c": "intro", "s": ["p2-22"], "t": [], "g": "Art. 12 : la médecine du travail doit **adapter le travail à l'homme** et chaque homme à sa tâche.\n« Adapter l'homme au poste » est l'inversion classique.", "warn": [], "type": "single", "opts": [["A", "Identifier et de surveiller, en vue de réduire ou d’éliminer tous les facteurs qui, sur les lieux de travail, peuvent affecter la santé des travailleurs"], ["B", "Placer et maintenir les travailleurs dans un emploi convenant à leurs aptitudes physiologiques et psychologiques et, en règle générale, adapter l’homme au poste du travail"], ["C", "Évaluer le niveau de santé des travailleurs en milieu du travail"], ["D", "Prévenir et protéger les travailleurs des risques pouvant engendrer des accidents ou des MP et de tout dommage causé à leur santé"], ["E", "Réduire les cas d’invalidité et assurer une prolongation de la vie active des travailleurs"]], "key": ["B"], "p": {"A": ["T", "Identifier et surveiller les facteurs de risque."], "B": ["F", "La loi dit adapter le [[travail à l'homme]], pas l'homme au poste."], "C": ["T", "Évaluer le niveau de santé des travailleurs."], "D": ["T", "Prévenir et protéger des risques d'AT et de MP."], "E": ["T", "Réduire les cas d'invalidité, prolonger la vie active."]}, "fmt": "QCS", "rep": [["2026a", 1], ["2025", 1]], "o": [["of2/o_2024-01_0.png", 7]]}, {"id": "2024-02", "exam": "2024", "label": "2024", "n": 2, "stem": "Parmi les rôles du médecin du travail, à travers les visites médicales sont de : (CRF)", "case": null, "tables": [], "imgs": [], "c": "intro", "s": ["p2-23", "p2-32"], "t": [], "g": "Les visites servent à l'aptitude, au dépistage des maladies contagieuses, des MP et MCP, et à la prise en charge (curatif accessoire).\nLe médecin du travail ne contrôle **jamais** les absences.", "warn": [], "type": "single", "opts": [["A", "Déterminer l’aptitude médicale au poste de travail"], ["B", "Dépister les maladies contagieuses"], ["C", "Dépister les maladies professionnelles ou à caractère professionnel"], ["D", "Contrôler de l’absentéisme des travailleurs"], ["E", "Prendre en charge les pathologies professionnelles"]], "key": ["D"], "p": {"A": ["T", "Déterminer l'aptitude au poste."], "B": ["T", "Dépister les maladies contagieuses."], "C": ["T", "Dépister les MP et MCP."], "D": ["F", "Le contrôle de l'[[absentéisme]] relève du médecin contrôleur."], "E": ["T", "Prise en charge des pathologies professionnelles (curatif accessoire)."]}, "fmt": "QCS", "o": [["of2/o_2024-02_0.png", 7]]}, {"id": "2024-03", "exam": "2024", "label": "2024", "n": 3, "stem": "Les visites médicales de reprise ont lieu après : (CRJ)", "case": null, "tables": [], "imgs": [], "c": "intro", "s": ["p2-31"], "t": [], "g": "Visite de reprise (art. 17, décret 93-120) :\n• après AT ou MP ;\n• maternité ;\n• absence **≥ 21 jours** pour maladie ou accident non professionnel ;\n• ou absences répétées.", "warn": [], "type": "multi", "opts": [["1", "Congé de maternité"], ["2", "Abandonnement de poste du travail"], ["3", "Absence plus 15 jours pour cause de maladie ou d’accident non professionnel"], ["4", "Absences répétées pour cause de maladie non professionnelle"], ["5", "Absence pour cause de maladies professionnelles ou accidents du travail"]], "p": {"1": ["T", "Après congé de **maternité**."], "2": ["F", "L'[[abandon de poste]] n'ouvre pas de visite de reprise ; elle se fait après AT/MP, maternité, absence ≥ 21 jours ou absences répétées."], "3": ["F", "Le seuil est de [[21 jours]], pas 15."], "4": ["T", "**absences répétées** pour maladie non professionnelle."], "5": ["T", "Après **AT ou MP**."]}, "key": ["1", "4", "5"], "fmt": "QCM", "o": [["of2/o_2024-03_0.png", 8]]}, {"id": "2024-04", "exam": "2024", "label": "2024", "n": 4, "stem": "La prévention secondaire : (CRJ)", "case": null, "tables": [], "imgs": [], "c": "intro", "s": ["p2-33"], "t": [], "g": "Prévention **secondaire** :\n• dépister précocement ;\n• avant les signes cliniques ;\n• par la surveillance du milieu et la surveillance médicale.\n• Agir sur le risque = primaire ;\n• minimiser les conséquences = tertiaire.", "warn": [], "type": "multi", "opts": [["1", "Vise les facteurs de risques"], ["2", "Vise à dépister les maladies professionnelles avant qu’apparaissent des signes cliniques."], ["3", "Vise la surveillance du milieu de travail et de la santé des travailleurs"], ["4", "Vise à minimiser les conséquences des atteintes à la santé du fait du travail"], ["5", "S’exerce par la surveillance médicale des travailleurs"]], "p": {"1": ["F", "Viser les facteurs de risque relève de la prévention [[primaire]]."], "2": ["T", "**dépister** avant l'apparition des signes cliniques."], "3": ["T", "**surveillance** du milieu et de la santé."], "4": ["F", "Minimiser les conséquences relève du [[tertiaire]]."], "5": ["T", "Elle s'exerce par la **surveillance médicale**."]}, "key": ["2", "3", "5"], "fmt": "QCM", "o": [["of2/o_2024-04_0.png", 13]]}, {"id": "2024-05", "exam": "2024", "label": "2024", "n": 5, "stem": "Le médecin du travail joue son rôle de conseiller de l’organisme employeur en ce qui concerne notamment (CRF)", "case": null, "tables": [], "imgs": [], "c": "intro", "s": ["p2-23"], "t": [], "g": "Le médecin conseille l'employeur sur les conditions de travail, la protection, l'éducation sanitaire, la CPHS et l'adaptation des postes et rythmes **à la physiologie humaine**.", "warn": [], "type": "single", "opts": [["A", "L’amélioration des conditions de vie et de travail au sein de l’organisme employeur"], ["B", "La protection des travailleurs contre les nuisances"], ["C", "L’éducation du personnel dans les domaines de la santé, l’hygiène et de la sécurité en milieu de travail"], ["D", "L’adaptation des postes, des techniques et des rythmes de travail à l’exigence de l’employeur"], ["E", "La participation aux travaux et réunions trimestrielles de la commission paritaire d’hygiène et de sécurité (CPHS)"]], "key": ["D"], "p": {"A": ["T", "Amélioration des conditions de vie et de travail."], "B": ["T", "Protection contre les nuisances."], "C": ["T", "Éducation du personnel en santé, hygiène, sécurité."], "D": ["F", "On adapte à la [[physiologie humaine]], pas aux exigences de l'employeur."], "E": ["T", "Participation à la CPHS."]}, "fmt": "QCS", "o": [["of2/o_2024-05_0.png", 11]]}, {"id": "2024-06", "exam": "2024", "label": "2024", "n": 6, "stem": "La quantité absorbée par la voie respiratoire dépend de : (CRJ)", "case": null, "tables": [], "imgs": [], "c": "toxi", "s": ["p4-12", "p4-21"], "t": [], "g": "Absorption respiratoire :\n• **concentration** dans l'air ;\n• **durée** d'exposition ;\n• **forme physico-chimique** (gaz, vapeur, taille des particules) ;\n• débit ventilatoire.\nDébit splanchnique et état nutritif concernent la voie digestive.", "warn": [], "type": "multi", "opts": [["1", "Le débit sanguin dans l’aire splanchnique"], ["2", "La concentration du toxique dans l’atmosphère de travail"], ["3", "L’état nutritif"], ["4", "La durée d’exposition"], ["5", "La forme physico-chimique de la substance inhalée"]], "p": {"1": ["F", "Le débit [[splanchnique]] conditionne la voie digestive ; la voie respiratoire dépend de la **concentration**, la **durée** et la **forme** inhalée."], "2": ["T", "**concentration** atmosphérique."], "3": ["F", "L'[[état nutritif]] joue sur la voie digestive ; la voie respiratoire dépend de la **concentration**, la **durée** et la **forme**."], "4": ["T", "**durée** d'exposition."], "5": ["T", "**forme physico-chimique** (solubilité, taille)."]}, "key": ["2", "4", "5"], "fmt": "QCM", "o": [["of2/o_2024-06_0.png", 3]]}, {"id": "2024-07", "exam": "2024", "label": "2024", "n": 7, "stem": "Concernant l’accumulation de toxique (CRJ) :", "case": null, "tables": [], "imgs": [], "c": "toxi", "s": ["p4-23"], "t": [], "g": "**Accumulation du toxique** :\n• la quantité éliminée est inférieure à la quantité absorbée ;\n• la concentration monte jusqu'au seuil clinique (plomb, mercure).\nL'addition des effets est l'autre mécanisme (CS₂).", "warn": [], "type": "multi", "opts": [["1", "Le toxique s’accumule dans l’organisme"], ["2", "L’additionnement des effets engendrés par des expositions répétées"], ["3", "La concentration de toxique augmente progressivement pour atteindre le seuil susceptible d’engendrer les manifestations cliniques"], ["4", "La quantité éliminée de toxique est inférieure à la quantité absorbée"], ["5", "Le mercure est un exemple de toxique cumulatif"]], "p": {"1": ["T", "Le toxique **s'accumule**."], "2": ["F", "L'addition des effets définit l'[[accumulation de l'effet]], l'autre mécanisme."], "3": ["T", "La concentration **augmente** jusqu'au seuil clinique."], "4": ["T", "On **élimine moins** qu'on absorbe."], "5": ["T", "Le **mercure** est un toxique cumulatif (comme le plomb)."]}, "key": ["1", "3", "4", "5"], "fmt": "QCM", "o": [["of2/o_2024-07_0.png", 9], ["of2/o_2024-07_1.png", 8]]}, {"id": "2024-08", "exam": "2024", "label": "2024", "n": 8, "stem": "Le certificat médical descriptif de consolidation : (CRF)", "case": null, "tables": [], "imgs": [], "c": "atmp", "s": ["p5-31"], "t": [], "g": "Consolidation = lésions **stabilisées**, séquelles possibles (IPP), en 2 exemplaires, coïncide souvent avec la reprise.\nLa disparition des lésions définit la **guérison**.", "warn": [], "type": "single", "opts": [["A", "Établit à la suite de l’état transitoire que constitue la période de soins"], ["B", "Etabli en 02 exemplaires, dont l’un est adressé à l’organisme de SS, et l’autre remis à la victime"], ["C", "Etabli lorsqu’il y a disparition apparente des lésions traumatiques ou morbides occasionnées par l’accident"], ["D", "Matérialise le caractère permanent de l’incapacité"], ["E", "En pratique, coïncide souvent avec une reprise du travail"]], "key": ["C"], "p": {"A": ["T", "Fait suite à la période de soins."], "B": ["T", "2 exemplaires (SS et victime)."], "C": ["F", "La [[disparition des lésions]] = guérison."], "D": ["T", "Caractère permanent de l'incapacité."], "E": ["T", "Coïncide souvent avec la reprise."]}, "fmt": "QCS", "rep": [["2025", 12]], "o": [["of2/o_2024-08_0.png", 4]]}, {"id": "2024-09", "exam": "2024", "label": "2024", "n": 9, "stem": "La différence entre l’AT et la MP est que cette dernière est : (CRJ)", "case": null, "tables": [], "imgs": [], "c": "atmp", "s": ["p5-21"], "t": [], "g": "AT = fait fortuit, soudain.\n• MP = exposition **prolongée** lors de l'exercice habituel ;\n• début difficile à fixer ;\n• lien difficile à prouver.", "warn": [], "type": "multi", "opts": [["1", "La conséquence d’un fait matériel fortuit à l’origine d’une lésion corporelle"], ["2", "La conséquence d’exposition, plus ou moins prolongée, à un risque lors de l’exercice habituel de la profession"], ["3", "La preuve de relation « cause à effet » est le plus souvent facile à apporter"], ["4", "Toujours difficile de fixer le point de départ de la maladie,"], ["5", "La relation avec la profession n’est toujours facile à matérialiser"]], "p": {"1": ["F", "Le fait fortuit définit l'[[AT]]."], "2": ["T", "Exposition **prolongée** à un risque."], "3": ["F", "La preuve est [[difficile]] pour la MP."], "4": ["T", "Point de départ **difficile à fixer**."], "5": ["T", "Relation difficile à matérialiser."]}, "key": ["2", "4", "5"], "fmt": "QCM", "rep": [["2025", 11]], "o": [["of2/o_2024-09_0.png", 6]]}, {"id": "2024-10", "exam": "2024", "label": "2024", "n": 10, "stem": "Toutes ces expositions professionnelles sont en rapport avec l’hydrargyrisme, sa(uf) (...)", "case": null, "tables": [], "imgs": [], "c": "metaux", "s": ["p6-21", "p6-11"], "t": [2], "g": "Sources de **mercure** :\n• piles ;\n• tubes fluorescents ;\n• instruments de mesure ;\n• laboratoires ;\n• amalgames dentaires ;\n• extraction de l'or.\nLes batteries d'accumulateurs exposent au **plomb**.", "warn": [], "type": "single", "opts": [["A", "Industrie électrique (piles, tubes fluorescents)"], ["B", "Fabrication d’instruments de mesure de précision et de laboratoire"], ["C", "Fabrication et récupération de batteries d’accumulateurs"], ["D", "Extraction de l’or et de l’argent"], ["E", "Préparation d’amalgames dentaires"]], "key": ["C"], "p": {"A": ["T", "Industrie électrique (piles, tubes fluorescents)."], "B": ["T", "Instruments de mesure et de laboratoire."], "C": ["F", "Les [[batteries d'accumulateurs]] exposent au plomb."], "D": ["T", "Extraction de l'or et de l'argent."], "E": ["T", "Amalgames dentaires."]}, "fmt": "QCS", "o": [["of2/o_2024-10_0.png", 14]]}, {"id": "2024-11", "exam": "2024", "label": "2024", "n": 11, "stem": "Parmi ces paramètres lequel qui n’est pas recommandable pour le dépista(ge) d’intoxication saturnine ?", "case": null, "tables": [], "imgs": [], "c": "metaux", "s": ["p6-13"], "t": [1], "g": "Dépistage du saturnisme :\n• **plombémie** (référence), ALA-U, PPZ, NFS ;\n• plomburie **provoquée**.\nLa plomburie spontanée est trop variable.", "warn": [], "type": "single", "opts": [["A", "Plombémie"], ["B", "Plomburie spontanée des 24h"], ["C", "FNS"], ["D", "Delta ALAU"], ["E", "PPZ sanguin"]], "key": ["B"], "p": {"A": ["T", "Plombémie."], "B": ["F", "La plomburie [[spontanée]] est peu fiable."], "C": ["T", "NFS."], "D": ["T", "Delta-ALA urinaire."], "E": ["T", "PPZ."]}, "fmt": "QCS", "o": [["of2/o_2024-11_0.png", 5]]}, {"id": "2024-13", "exam": "2024", "label": "2024", "n": 13, "stem": "La polynévrite sensitivo-motrice est la manifestation clinique, de quel type ces toxiques professionnels ?", "case": null, "tables": [], "imgs": [], "c": "metaux", "s": ["p6-12", "p6-21", "p7-22"], "t": [], "g": "Polynévrite **sensitivo-motrice** : mercure et n-hexane.\nLe plomb donne une neuropathie **motrice pure** (pseudo-radiale) : c'est le piège.", "warn": ["Si l'on accepte toute neuropathie toxique, B (1, 2, 4) se discute ; la précision « sensitivo-motrice » oriente vers E."], "type": "multi", "opts": [["1", "Mercure"], ["2", "Plomb"], ["3", "Bois"], ["4", "n-hexane"], ["5", "Fibres d’amiante"]], "p": {"1": ["T", "Le **mercure** peut donner une polynévrite sensitivo-motrice."], "2": ["F", "Le plomb donne une neuropathie [[motrice pure]]."], "3": ["F", "Le bois ne donne pas de polynévrite ; il donne l'**adénocarcinome de l'ethmoïde**."], "4": ["T", "Le **n-hexane** est l'exemple type."], "5": ["F", "L'amiante ne donne pas de polynévrite ; il donne fibrose, plaques et **mésothéliome**."]}, "key": ["1", "4"], "fmt": "QCM", "o": [["of2/o_2024-13_0.png", 14], ["of2/o_2024-13_1.png", 4]]}, {"id": "2024-14", "exam": "2024", "label": "2024", "n": 14, "stem": "Parmi ces manifestations lors de l’exposition de différents types de solvants : (CRJ)", "case": null, "tables": [], "imgs": [], "c": "solv", "s": ["p7-22"], "t": [], "g": "Solvant → organe cible :\n• benzène → moelle (leucémie) ;\n• trichloroéthylène → cœur (troubles du rythme) ;\n• toluène → cervelet (ataxie) ;\n• CS₂ → vaisseaux (athérome) ;\n• éthylène glycol → rein.", "warn": ["Le texte de la proposition 4 et la colonne « e » sont en partie illisibles ; B est la seule combinaison cohérente."], "type": "match", "opts": [], "p": {"a": [null, "Benzène → 3 : **leucémie**."], "b": [null, "Trichloroéthylène → 2 : **troubles du rythme**."], "c": [null, "Toluène → 4 : atteinte **cérébelleuse** (proposition partiellement illisible)."], "d": [null, "CS₂ → 5 : **athéromatose**."], "e": [null, "Éthylène glycol → 1 : **insuffisance rénale**."]}, "left": [["a", "Le benzène"], ["b", "Le trichloréthylène"], ["c", "Le toluène"], ["d", "Le disulfure de carbone (CS₂)"], ["e", "L’éthylène glycol"]], "right": [["1", "Insuffisance rénale"], ["2", "Troubles du rythme"], ["3", "Leucémie"], ["4", "Atteinte (...)"], ["5", "Athéromatose"]], "fmt": "Association", "corr": {"a": ["3"], "b": ["2"], "c": ["4"], "d": ["5"], "e": ["1"]}, "o": [["of2/o_2024-14_0.png", 4]]}, {"id": "2024-15", "exam": "2024", "label": "2024", "n": 15, "stem": "Quels sont les effets des agents biologiques sur la santé ? (CRJ)", "case": null, "tables": [], "imgs": [], "c": "bio", "s": ["p16-11", "p16-14"], "t": [], "g": "Effets des agents biologiques :\n• **infectieux** ;\n• **immuno-allergiques** (asthme, PHS) ;\n• **toxiniques** (endotoxines, mycotoxines) ;\n• **cancérogènes** (VHB, VHC).\nPas d'effet « métabolique ».", "warn": [], "type": "multi", "opts": [["1", "Toxinique"], ["2", "Métabolique"], ["3", "Immunoallergique"], ["4", "Cancérogènes"], ["5", "Infectieux"]], "p": {"1": ["T", "Effets **toxiniques**."], "2": ["F", "L'effet [[métabolique]] n'est pas décrit."], "3": ["T", "Effets **immuno-allergiques**."], "4": ["T", "Effets **cancérogènes** (virus)."], "5": ["T", "Effets **infectieux**."]}, "key": ["1", "3", "4", "5"], "fmt": "QCM", "o": [["of2/o_2024-15_0.png", 1], ["of2/o_2024-15_1.png", 3]]}, {"id": "2024-16", "exam": "2024", "label": "2024", "n": 16, "stem": "Les effets muscariniques lors de l’intoxication aiguë aux pesticides organophosphorés sont : (CRJ)", "case": null, "tables": [], "imgs": [], "c": "pest", "s": ["p8-21", "p8-22"], "t": [], "g": "Effets **muscariniques** :\n• accumulation d'acétylcholine aux terminaisons **post-ganglionnaires parasympathiques** ;\n• apparaissent en premier ;\n• hypersécrétion ;\n• cèdent à l'**atropine**.", "warn": [], "type": "multi", "opts": [["1", "Dus à l’inhibition de l’enzyme acétylcholinestérase avec accumulation subséquente d’acétylcholine au niveau des fibres post ganglionnaires parasympathiques"], ["2", "Dus à l’inhibition de l’enzyme acétylcholinestérase avec accumulation subséquente d’acétylcholine au niveau de la plaque motrice (jonction neuromusculaire)"], ["3", "Apparaissent habituellement les premiers"], ["4", "Représentés par des signes d’hypersécrétion généralisée, et des troubles de la régulation nerveuse"], ["5", "Régressent sous l’effet de l’Atropine"]], "p": {"1": ["T", "Fibres post-ganglionnaires **parasympathiques**."], "2": ["F", "La plaque motrice correspond aux effets [[nicotiniques]]."], "3": ["T", "Ils apparaissent **les premiers**."], "4": ["T", "**hypersécrétion** généralisée."], "5": ["T", "Ils régressent sous **atropine**."]}, "key": ["1", "3", "4", "5"], "fmt": "QCM", "o": [["of2/o_2024-16_0.png", 4]]}, {"id": "2024-17", "exam": "2024", "label": "2024", "n": 17, "stem": "Parmi les signes cliniques de syndrome classique dans les différentes phases de l’intoxication par les pesticides organophosphorés (CRJ)", "case": null, "tables": [], "imgs": [], "c": "pest", "s": ["p8-22"], "t": [], "g": "Muscarinique :\n• diarrhée, photophobie (myosis) ;\n• nicotinique : crampes, fasciculations ;\n• central : Cheyne-Stokes, vertiges.", "warn": [], "type": "match", "opts": [], "p": {"1": [null, "Cheyne-Stokes → c : **central**."], "2": [null, "Crampes → b : **nicotinique**."], "3": [null, "Diarrhée → a : **muscarinique**."], "4": [null, "Vertige → c : **central**."], "5": [null, "Photophobie → a : **muscarinique**."], "6": [null, "Fasciculations → b : **nicotinique**."]}, "left": [["1", "Respiration de Cheyne-Stokes"], ["2", "Crampes musculaires"], ["3", "Diarrhée"], ["4", "Vertige"], ["5", "Photophobie"], ["6", "Fasciculation"]], "right": [["a", "Effets muscariniques"], ["b", "Effets nicotiniques"], ["c", "Symptômes nerveux centraux"]], "fmt": "Association", "corr": {"1": ["c"], "2": ["b"], "3": ["a"], "4": ["c"], "5": ["a"], "6": ["b"]}, "rep": [["2026a", 16]], "o": [["of2/o_2024-17_0.png", 4]]}, {"id": "2024-18", "exam": "2024", "label": "2024", "n": 18, "stem": "Lors de la silicose (CRF)", "case": null, "tables": [], "imgs": [], "c": "pneumo", "s": ["p12-13", "p12-14", "p12-15"], "t": [25], "g": "Silicose :\n• clinique **tardive et pauvre**, discordance radio-clinique (EFR souvent normales au début), diagnostic **radiologique** sur exposition documentée ;\n• complications : tuberculose, pneumothorax, Caplan-Colinet.", "warn": [], "type": "single", "opts": [["A", "Les signes cliniques sont tardifs et non spécifiques"], ["B", "Les perturbations fonctionnelles sont tardives par rapport aux signes radiolo(giques)"], ["C", "Le diagnostic est presque exclusivement clinique"], ["D", "Le pneumothorax est l’un de ces complications"], ["E", "Le syndrome de Caplan-Colinet est l’un de ces manifestations extra-thorac(iques)"]], "key": ["C"], "p": {"A": ["T", "Signes cliniques tardifs et non spécifiques."], "B": ["T", "Perturbations fonctionnelles plus tardives que les images."], "C": ["F", "Le diagnostic est [[radiologique]] (exposition + images), pas clinique."], "D": ["T", "Le pneumothorax est une complication."], "E": ["T", "Caplan-Colinet (polyarthrite rhumatoïde)."]}, "fmt": "QCS", "o": [["of2/o_2024-18_0.png", 2]]}, {"id": "2024-19", "exam": "2024", "label": "2024", "n": 19, "stem": "Lors de l’asbestose (CRF)", "case": null, "tables": [], "imgs": [], "c": "pneumo", "s": ["p12-22", "p12-23", "p12-25"], "t": [30], "g": "Asbestose :\n• fibrose interstitielle diffuse des **bases**, opacités **linéaires / réticulaires** ;\n• les plaques pleurales confirment l'exposition.\nLes nodules sont silicotiques.", "warn": [], "type": "single", "opts": [["A", "Le tableau clinique est en général pauvre"], ["B", "Les signes radiographiques sont tardifs et d’interprétation difficile"], ["C", "Elle se caractérise par une fibrose pulmonaire interstitielle"], ["D", "Les images radiologiques sont des opacités nodulaire, prédominant aux (...)"], ["E", "La présence de plaques pleurales est un élément de confirmation de l’e(xposition)"]], "key": ["D"], "p": {"A": ["T", "Tableau clinique pauvre."], "B": ["T", "Signes radiographiques tardifs."], "C": ["T", "Fibrose interstitielle."], "D": ["F", "Opacités [[linéaires]] des bases, pas nodulaires."], "E": ["T", "Plaques pleurales = marqueur d'exposition."]}, "fmt": "QCS", "o": [["of2/o_2024-19_0.png", 11]]}, {"id": "2024-20", "exam": "2024", "label": "2024", "n": 20, "stem": "Pour faire le diagnostic du caractère professionnel de l’asthme, nous de(vons) (...)", "case": null, "tables": [], "imgs": [], "c": "asthme", "s": ["p11-23"], "t": [], "g": "Asthme professionnel :\n• chronologie liée au travail ;\n• amélioration en congés ;\n• inventaire des agents ;\n• tests immunologiques ciblés.\nUne **variation saisonnière** oriente vers un asthme allergique non professionnel.", "warn": ["Énoncé en partie illisible (...) ; la question porte vraisemblablement sur l’élément qui n’en fait pas partie."], "type": "single", "opts": [["A", "La chronologie des symptômes et des variations fonctionnelles par r(apport au travail)"], ["B", "L’amélioration pendant les congés et les week-ends"], ["C", "L’existence d’une variation saisonnière"], ["D", "Inventaires des risques asthmogènes (produits manipulés)"], ["E", "Investigations immunologiques en fonction des produits manipu(lés)"]], "key": ["C"], "p": {"A": ["T", "Chronologie des symptômes et du DEP / travail."], "B": ["T", "Amélioration pendant les congés et les week-ends."], "C": ["F", "Une variation [[saisonnière]] oriente vers les pollens."], "D": ["T", "Inventaire des agents asthmogènes."], "E": ["T", "Investigations immunologiques ciblées."]}, "fmt": "QCS", "o": [["of2/o_2024-20_0.png", 11]]}, {"id": "2024-21", "exam": "2024", "label": "2024", "n": 21, "stem": "Concernant les tableaux des maladies professionnelles qui réparent les cancers professionnels en Algérie : (CRF)", "case": null, "tables": [], "imgs": [], "c": "cancer", "s": ["p14-32"], "t": [], "g": "• 13 TMP réparant des cancers ;\n• aucun dans le groupe 2 ;\n• cancers ORL : 2 TMP.\nLes cancers bronchiques sont les **plus** réparés.", "warn": [], "type": "single", "opts": [["A", "Actuellement, il existe treize (13) TMP réparant les cancers p(rofessionnels) (...)"], ["B", "Le risque cancérogène n’apparaît dans aucun TMP de group(e 2)"], ["C", "Les cancers ORL sont réparés par deux TMP"], ["D", "Les cancers bronchiques sont les moins réparés des cance(rs) (...)"], ["E", "Tous les TMP réparant les cancers professionnels ont des (listes indicatives des travaux)"]], "key": ["D"], "p": {"A": ["T", "13 TMP."], "B": ["T", "Aucun dans le groupe 2."], "C": ["T", "Deux tableaux pour les cancers ORL."], "D": ["F", "Les cancers bronchiques sont les [[plus]] réparés."], "E": ["T", "Listes indicatives."]}, "fmt": "QCS", "rep": [["2026a", 11]], "o": [["of2/o_2024-21_0.png", 7]]}, {"id": "2024-22", "exam": "2024", "label": "2024", "n": 22, "stem": "Les effets stochastiques des rayonnements ionisants se c(aractérisent) (...)", "case": null, "tables": [], "imgs": [], "c": "ri", "s": ["p9-22"], "t": [], "g": "Stochastiques : sans seuil, aléatoires, gravité indépendante de la dose, lésion **non réparée** (ou mal réparée) de l'ADN d'une cellule survivante.\nLa destruction massive des cellules = déterministe.", "warn": [], "type": "single", "opts": [["A", "Pas de dose seuil d’apparition"], ["B", "Lésion non réparée de l’ADN"], ["C", "Gravité non dépendante de la dose"], ["D", "Due à une destruction massive des cellules"], ["E", "Effets aléatoires"]], "key": ["D"], "p": {"A": ["T", "Pas de dose seuil."], "B": ["T", "Lésion de l'ADN non (ou mal) réparée."], "C": ["T", "Gravité non dose-dépendante."], "D": ["F", "La [[destruction massive]] des cellules définit l'effet déterministe."], "E": ["T", "Effets aléatoires."]}, "fmt": "QCS", "o": [["of2/o_2024-22_0.png", 7]]}, {"id": "2024-23", "exam": "2024", "label": "2024", "n": 23, "stem": "Les principes de radioprotection réunissent : (CRJ)", "case": null, "tables": [], "imgs": [], "c": "ri", "s": ["p9-23"], "t": [], "g": "Trois principes :\n• **justification** ;\n• **optimisation** (ALARA) ;\n• **limitation**.\nTemps et distance sont des moyens de protection, pas des principes.", "warn": ["La fin de la proposition c) est illisible (...) ; la bonne combinaison est 1 + 3 + 4."], "type": "pick", "opts": [["1", "La justification"], ["2", "La distance"], ["3", "La limitation"], ["4", "L’optimisation"], ["5", "Le temps d’exposition minimale"]], "key": ["1", "3", "4"], "p": {"1": ["T", "**justification**."], "2": ["F", "La [[distance]] est un moyen de protection."], "3": ["T", "**limitation**."], "4": ["T", "**optimisation**."], "5": ["F", "Le [[temps]] est un moyen de protection."]}, "fmt": "QCS", "o": [["of2/o_2024-23_0.png", 8]]}, {"id": "2024-24", "exam": "2024", "label": "2024", "n": 24, "stem": "Parmi les facteurs suivants, lequel ne cons(titue pas) (...)", "case": null, "tables": [], "imgs": [], "c": "burn", "s": ["p19-13"], "t": [], "g": "• Les facteurs de risque du burn-out sont surtout organisationnels ;\n• le **soutien** du collectif est protecteur.", "warn": [], "type": "single", "opts": [["A", "Le surengagement"], ["B", "Conflits de valeurs"], ["C", "Surcharge de travail"], ["D", "Exigences émotionnelles importante(s)"], ["E", "Présence de soutien du collectif de (travail)"]], "key": ["E"], "p": {"A": ["T", "Surengagement."], "B": ["T", "Conflits de valeurs."], "C": ["T", "Surcharge."], "D": ["T", "Exigences émotionnelles."], "E": ["F", "Le [[soutien]] du collectif protège."]}, "fmt": "QCS", "rep": [["2025", 15]], "o": [["of2/o_2024-24_0.png", 22]]}, {"id": "2024-26", "exam": "2024", "label": "2024", "n": 26, "stem": "Les nanomatériaux sont des particules : (CRF)", "case": null, "tables": [], "imgs": [], "c": "nano", "s": ["p21-11", "p21-14"], "t": [], "g": "Nanomatériaux :\n• 1 à 100 nm ;\n• pas de définition universelle ;\n• propriétés uniques ;\n• usages surtout industriels ;\n• effets néfastes possibles.", "warn": [], "type": "multi", "opts": [["1", "Universellement bien définies"], ["2", "De dimensions inférieurs à 1 nanomètres"], ["3", "Qui ont des propriétés uniques"], ["4", "Qui sont essentiellement utilisées en médecine"], ["5", "Qui peuvent avoir des effets néfastes sur la santé"]], "p": {"1": ["F", "Il n'existe [[pas de définition universelle]] des nanomatériaux."], "2": ["F", "Leur taille va de [[1 à 100 nm]], pas « inférieure à 1 nm »."], "3": ["T", "Propriétés **uniques** (grande surface spécifique, réactivité)."], "4": ["F", "Usages [[surtout industriels]] (cosmétique, BTP, électronique), pas essentiellement médicaux."], "5": ["T", "Ils peuvent avoir des **effets néfastes** sur la santé."]}, "key": ["1", "2", "4"], "fmt": "QCM", "rep": [["2026a", 17]], "o": [["of2/o_2024-26_0.png", 11]]}, {"id": "2024-27", "exam": "2024", "label": "2024", "n": 27, "stem": "L’Organisation internationale de normalisation (ISO) classifie les nanomatériaux en : (CRJ)", "case": null, "tables": [], "imgs": [], "c": "nano", "s": ["p21-13"], "t": [], "g": "ISO : **nano-objets** et **matériaux nanostructurés** (agrégats et agglomérats y sont rattachés).", "warn": [], "type": "multi", "opts": [["1", "Nanoobjets englobant les nanoparticules, les nanofibres et les nanofeuillets"], ["2", "Matériaux nanostructurés"], ["3", "Agrégats"], ["4", "Agglomérats"], ["5", "Particules"]], "p": {"1": ["T", "Nano-objets."], "2": ["T", "Matériaux nanostructurés."], "3": ["F", "Les [[agrégats]] ne forment pas une famille à part."], "4": ["F", "Les [[agglomérats]] non plus."], "5": ["F", "« particules » n'est pas une famille ISO."]}, "key": ["1", "2"], "fmt": "QCM", "rep": [["2026a", 18]], "o": [["of2/o_2024-27_0.png", 10], ["of2/o_2024-27_1.png", 11]]}, {"id": "2024-28", "exam": "2024", "label": "2024", "n": 28, "stem": "Les principales voies de la démarche de prévention des effets sur la santé des nanomatériaux sont : (CRJ)", "case": null, "tables": [], "imgs": [], "c": "nano", "s": ["p21-34"], "t": [], "g": "• Agir sur les procédés, circuit fermé, nettoyage **régulier**, traçabilité ;\n• EPI adaptés (FFP3), jamais une bavette chirurgicale.", "warn": [], "type": "multi", "opts": [["1", "Eviter le nettoyage régulier des équipements de travail"], ["2", "Agir sur les procédés et les modes opératoires"], ["3", "Travailler en circuit fermé"], ["4", "Assurer la traçabilité de l’exposition des salariés"], ["5", "Doter les travailleurs de bavettes chirurgicales"]], "p": {"1": ["F", "Le nettoyage doit être [[régulier]]."], "2": ["T", "Procédés et modes opératoires."], "3": ["T", "Circuit fermé."], "4": ["T", "Traçabilité."], "5": ["F", "La [[bavette chirurgicale]] ne protège pas."]}, "key": ["2", "3", "4"], "fmt": "QCM", "rep": [["2026a", 19]], "o": [["of2/o_2024-28_0.png", 35], ["of2/o_2024-28_1.png", 36]]}, {"id": "2024-29", "exam": "2024", "label": "2024", "n": 29, "stem": "Toutes ces substances suivantes font l’objet d’une surveillance réglementaire sauf une, laquelle ?", "case": null, "tables": [], "imgs": [], "c": "pollu", "s": ["p10-15"], "t": [], "g": "Les 7 polluants surveillés cités dans le cours :\n• SO₂ ;\n• CO ;\n• NO₂ ;\n• O₃ ;\n• PM10 ;\n• benzène ;\n• **plomb**.\nLe mercure n'en fait pas partie.", "warn": [], "type": "single", "opts": [["A", "Le dioxyde de soufre (SO2)"], ["B", "Le monoxyde de carbone (CO)"], ["C", "Le dioxyde d’azote (NO2)"], ["D", "L’ozone (O3)"], ["E", "Le mercure (Hg)"]], "key": ["E"], "p": {"A": ["T", "SO₂."], "B": ["T", "CO."], "C": ["T", "NO₂."], "D": ["T", "O₃."], "E": ["F", "Le [[mercure]] n'est pas dans la liste."]}, "fmt": "QCS", "o": [["of2/o_2024-29_0.png", 13], ["of2/o_2024-29_1.png", 17]]}, {"id": "2024-30", "exam": "2024", "label": "2024", "n": 30, "stem": "Les concentrations de polluants dans l’air extérieur peuvent être influencées par tous ces facteurs sauf un lequel ?", "case": null, "tables": [], "imgs": [], "c": "pollu", "s": ["p10-21"], "t": [], "g": "Les caractéristiques de l'individu modulent la sensibilité, pas la concentration dans l'air.", "warn": [], "type": "single", "opts": [["A", "La quantité de polluants atmosphériques rejetés par les sources"], ["B", "La proximité des sources"], ["C", "Les conditions météorologiques"], ["D", "La croissance de l’économie"], ["E", "Les caractéristiques de l’individu"]], "key": ["E"], "p": {"A": ["T", "Émissions."], "B": ["T", "Proximité."], "C": ["T", "Météo."], "D": ["T", "Économie."], "E": ["F", "L'[[individu]] ne change pas la concentration."]}, "fmt": "QCS", "rep": [["2026a "3", "5"], "fmt": "QCM", "rep": [["2026a", 22], ["2025", 21]], "o": [["of2/o_2024-32_0.png", 7]]}, {"id": "2024-33", "exam": "2024", "label": "2024", "n": 33, "stem": "L’exposome : (CRJ)", "case": null, "tables": [], "imgs": [], "c": "env", "s": ["p3-11"], "t": [], "g": "Exposome :\n• de la **conception** à la mort ;\n• toutes natures d'exposition ;\n• dynamique.", "warn": [], "type": "multi", "opts": [["1", "Est la totalité des expositions d’un individu de sa naissance à sa mort"], ["2", "Est la totalité des expositions d’un individu de sa conception à sa mort"], ["3", "Intègre toutes les natures des expositions"], ["4", "Est une représentation complexe et dynamique des expositions"], ["5", "Ne considère que les expositions chimiques"]], "p": {"1": ["F", "L'exposome commence dès la [[conception]], pas à la naissance."], "2": ["T", "**de la conception à la mort**."], "3": ["T", "Il intègre **toutes les natures** d'exposition (chimique, physique, biologique, sociale)."], "4": ["T", "C'est une représentation **complexe et dynamique**."], "5": ["F", "Il n'est [[pas limité aux expositions chimiques]], il inclut toutes les natures."]}, "key": ["2", "3", "4"], "fmt": "QCM", "rep": [["2026a", 23], ["2025", 22]], "o": [["of2/o_2024-33_0.png", 9]]}, {"id": "2024-34", "exam": "2024", "label": "2024", "n": 34, "stem": "Les interventions préventives de la santé environnementale peuvent porter sur : (CRF)", "case": null, "tables": [], "imgs": [], "c": "env", "s": ["p3-31"], "t": [], "g": "Prévention environnementale : **source → milieu → individu**.\n• La primaire peut agir sur la source, le milieu ou l'individu ;\n• secondaire (dépistage, biosurveillance) et tertiaire visent l'individu ou la collectivité.", "warn": [], "type": "single", "opts": [["A", "La source du contaminant en prévention primaire"], ["B", "Le milieu lui-même en prévention secondaire"], ["C", "L’individu ou la collectivité en prévention primaire"], ["D", "L’individu ou la collectivité en prévention secondaire"], ["E", "L’individu ou la collectivité en prévention tertiaire"]], "key": ["B"], "p": {"A": ["T", "Agir sur la source = primaire."], "B": ["F", "Agir sur le [[milieu]] relève de la prévention primaire."], "C": ["T", "Protéger l'individu avant l'effet = primaire."], "D": ["T", "Dépister chez l'individu = secondaire."], "E": ["T", "Soigner l'individu = tertiaire."]}, "fmt": "QCS", "o": [["of2/o_2024-34_0.png", 31]]}, {"id": "2024-35", "exam": "2024", "label": "2024", "n": 35, "stem": "Les gestes professionnels incriminés dans la survenue du syndrome du canal carpien sont : (CRJ)", "case": null, "tables": [], "imgs": [], "c": "tic", "s": ["p17-22"], "t": [], "g": "Gestes à risque pour le canal carpien :\n• **hyper-extension** du poignet ;\n• **hyper-flexion avec flexion des doigts** (préhension en force) ;\n• **appui** sur le talon de la main.", "warn": ["Lecture des propositions 2 à 4 difficile (illisible) et question discutée ; E est la réponse la plus défendable."], "type": "multi", "opts": [["1", "L’hyper-extension du poignet,"], ["2", "L’hyper- flexion du poignet,"], ["3", "L’hyper-flexion du poignet associée à la flexion des doigts,"], ["4", "L’hyper-flexion du poignet associée à l’extension des doigts,"], ["5", "La compression par appui sur le talon de la main."]], "p": {"1": ["T", "Hyper-extension du poignet."], "2": ["F", "L'hyper-flexion isolée n'est pas retenue : c'est l'hyper-flexion **avec flexion des doigts** qui comprime."], "3": ["T", "Hyper-flexion + **flexion des doigts**."], "4": ["F", "Avec extension des doigts la compression est moindre ; c'est la flexion **avec doigts fléchis** qui est en cause."], "5": ["T", "**appui** du talon de la main."]}, "key": ["1", "3", "5"], "fmt": "QCM", "o": [["of2/o_2024-35_0.png", 5], ["of2/o_2024-35_1.png", 7]]}, {"id": "2024-36", "exam": "2024", "label": "2024", "n": 36, "stem": "Le syndrome du canal carpien (TMS) : (CRF)", "case": null, "tables": [], "imgs": [], "c": "tic", "s": ["p17-22"], "t": [], "g": "Canal carpien :\n• compression du **nerf médian** au poignet ;\n• paresthésies des doigts I-III ;\n• ENMG utile pour le stade.\nPrédominance **féminine**.", "warn": ["Le polycopié 2026 précise que l'ENMG est utile mais **non obligatoire** : 4 serait aussi faux, et aucune combinaison ne contient 1, 3, 4, 5."], "type": "multi", "opts": [["1", "S’exprime souvent par une douleur de l’avant-bras"], ["2", "La douleur est due à la compression du nerf médian lors de son passage dans le c(anal carpien)"], ["3", "Affecte préférentiellement le membre supérieur et le rachis"], ["4", "Un électromyogramme est indispensable pour connaître le stade de la maladie"], ["5", "Le sexe masculin est un facteur individuel de TMS"]], "p": {"1": ["F", "La douleur siège à la **main** et aux doigts I-III (paresthésies nocturnes), pas « souvent » à l'avant-bras."], "2": ["T", "Compression du **nerf médian**."], "3": ["F", "Le canal carpien n'affecte pas le [[rachis]]."], "4": ["T", "L'EMG renseigne le stade."], "5": ["F", "La prédominance est [[féminine]]."]}, "key": ["1", "3", "5"], "fmt": "QCM", "o": [["of2/o_2024-36_0.png", 5]]}, {"id": "2024-37", "exam": "2024", "label": "2024", "n": 37, "stem": "Travailler en horaires atypiques : (CRJ)", "case": null, "tables": [], "imgs": [], "c": "hor", "s": ["p18-22"], "t": [], "g": "Horaires atypiques :\n• vieillissement prématuré ;\n• CIRC **2A** (travail de nuit) ;\n• plus de risque cardio-métabolique et accidentel ;\n• conflits vie privée / travail.", "warn": [], "type": "multi", "opts": [["1", "Est susceptible de favoriser le vieillissement"], ["2", "Reconnu par le CIRC comme probablement cancérigène"], ["3", "A moins de facteurs de risques cardio-vasculaires que le travail de jour"], ["4", "Rend plus difficile l’équilibre entre la vie professionnelle et la vie extra(-professionnelle)"], ["5", "Le risque accidentel est divisé par deux"]], "p": {"1": ["T", "Favorise le vieillissement."], "2": ["T", "CIRC **2A**, probablement cancérogène."], "3": ["F", "Il
