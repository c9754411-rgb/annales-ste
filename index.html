térolatérales bilatérales d'épaisseur inférieure à 1 cm. La ponction ramène un exsudat lymphocytaire d'aspect visqueux."}], "blanc3-c2": [{"p": "Cas clinique N°2 — M. A. R., 44 ans, cardiologue interventionnel depuis 12 ans, réalise environ 600 actes par an sous scopie. Il porte un tablier plombé mais jamais de lunettes plombées ni de protège-thyroïde ; l'écran suspendu est rarement utilisé. Son dosimètre est porté de façon irrégulière."}, {"p": "Il consulte pour une baisse progressive de la vision : l'examen ophtalmologique retrouve une cataracte bilatérale. Le dos de la main gauche, la plus proche du faisceau, montre une peau atrophique, une dépilation, des télangiectasies et des fissures."}, {"p": "Dans la même équipe, une infirmière de 29 ans annonce une grossesse de 6 semaines, et un apprenti manipulateur de 17 ans débute un stage de formation."}], "blanc3-c3": [{"p": "Cas clinique N°3 — M. H. B., 45 ans, opérateur depuis 16 ans dans une unité d'électrolyse chlore-soude à cathode de mercure. Les locaux sont surchauffés l'été et dépourvus d'aspiration ; il prend ses repas sur place et range ses vêtements de travail avec ses vêtements de ville."}, {"p": "Il consulte pour une gingivite sèche et douloureuse, une hypersialorrhée, un goût métallique et un déchaussement dentaire ; ses dents ont une coloration grisâtre uniforme. Son épouse rapporte une irritabilité, une timidité excessive, une insomnie et des troubles de la mémoire. L'examen retrouve un tremblement des doigts, des lèvres et des paupières, aggravé par l'émotion et l'alcool, et des œdèmes des membres inférieurs."}, {"p": "Protéinurie 4 g/24 h avec hypoalbuminémie. À la lampe à fente : dépôts brunâtres sur la capsule antérieure du cristallin, acuité visuelle normale. Mercure urinaire : 180 µg/L."}], "blanc3-c4": [{"p": "Cas clinique N°4 — Mme N. A., 27 ans, coiffeuse depuis 6 ans, réalise sans gants des décolorations à base de persulfates, des permanentes au thioglycolate d'ammonium et de nombreux shampooings. Elle a présenté une dermatite atopique dans l'enfance."}, {"p": "Depuis 8 mois, elle présente des lésions érythémato-vésiculeuses très prurigineuses, suintantes, à bords émiettés, de la pulpe des doigts et des paumes, débordant sur les avant-bras, avec des poussées sur les paupières. Les lésions s'améliorent pendant les congés et récidivent 48 heures après la reprise."}, {"p": "Son apprentie de 18 ans, embauchée il y a 3 semaines pour les shampooings, présente une sécheresse des mains avec fissures et sensation de brûlure, à bords nets, limitée au dos des mains. Plusieurs anciennes apprenties avaient présenté les mêmes lésions."}], "blanc1-c7": [{"p": "Cas clinique N°7 — M. N. A., 49 ans, ouvrier en métallurgie (emboutissage, meulage, marteau pneumatique) depuis 18 ans. Il est exposé à un bruit moyen de 92 à 95 dB(A) sur 8 h/j, avec des pics impulsionnels, et à des solvants de dégraissage de façon intermittente."}, {"p": "Depuis 2 à 3 ans, il fait répéter, il est gêné en réunion et se plaint d'acouphènes et d'une sensation d'oreilles bouchées après le travail, sans vertiges. Les tympans sont normaux. L'audiométrie vocale montre une compréhension moins bonne que ne le laisse prévoir l'audiométrie tonale."}, {"p": "Il a été muté il y a 2 mois à un poste calme. L'audiométrie tonale ci-dessous a été réalisée 2 mois après la mutation (tracé noir : conduction aérienne ; tracé rouge : conduction osseuse)."}, {"img": "aud_b1.png"}], "blanc3-c5": [{"p": "Cas clinique N°5 — M. A. K., 51 ans, menuisier depuis 35 ans dans un atelier de fabrication de meubles, réalise la taille, le façonnage, le polissage et l'assemblage de pièces en bois. Il utilise des machines bruyantes et porte ses protecteurs auditifs de façon irrégulière. Il utilise aussi des colles et des vernis."}, {"p": "Il n'a pas d'antécédent ORL ni familial et ne prend aucun médicament ototoxique. Depuis 3 ans, il note une baisse progressive de l'audition, avec des acouphènes récents."}, {"p": "Un premier audiogramme montre un déficit bilatéral prédominant sur les aigus. Après un mois d'arrêt d'exposition, un nouvel audiogramme, reproduit ci-dessous, montre un aspect similaire (tracé noir : conduction aérienne ; tracé rouge : conduction osseuse)."}, {"img": "aud_b3.png"}]}};

async function saveProgress(){

  const d=new Date(), stamp=d.toISOString().slice(0,10);
  const txt=JSON.stringify({app:'medtravail-laghouat',v:1,date:d.toISOString(),n:nDone(),data});

  if(!ok){ const u=URL.createObjectURL(new Blob([txt],{type:'application/json'})); const a=document.createElement('a'); a.href=u; a.download=fn; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); ok=true; }

      const J=(v,d)=>{ try{ return v==null?d:JSON.parse(v); }catch(e){ return d; } }, cur=k=>J(localStorage.getItem(k),null), inc=k=>J(o.data[k],null), put=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
      { const a=cur('mt_hist')||{}, b=inc('mt_hist')||{}; for(const [k,v] of Object.entries(b)) if(!a[k]||(v.at||0)>(a[k].at||0)) a[k]=v; put('mt_hist',a); }
      put('mt_fav',[...new Set([...(cur('mt_fav')||[]),...(inc('mt_fav')||[])])]);
      { const a=cur('mt_notes')||{}, b=inc('mt_notes')||{}; for(const [k,v] of Object.entries(b)){ if(!a[k]||a[k]===v||v.includes(a[k])) a[k]=v; else if(!a[k].includes(v)) a[k]=a[k]+'\n— \n'+v; } put('mt_notes',a); }
      { const a=cur('mt_hl')||{}, b=inc('mt_hl')||{}; for(const [k,L] of Object.entries(b)){ const seen=new Set((a[k]||[]).map(x=>JSON.stringify(x))); a[k]=(a[k]||[]).concat(L.filter(x=>!seen.has(JSON.stringify(x)))); } put('mt_hl',a); }
      { const a=cur('mt_flk')||{}, b=inc('mt_flk')||{}; Object.assign(a,b); put('mt_flk',a); }
      { const a=cur('mt_last'), b=inc('mt_last'); if(b&&(!a||(b.start||0)>(a.start||0))) put('mt_last',b); }
      { const a=cur('mt_sessions')||[], b=inc('mt_sessions')||[]; const M=new Map(a.map(x=>[x.start,x])); for(const x of b){ const y=M.get(x.start); if(!y||(x.last||0)>(y.last||0)) M.set(x.start,x); } put('mt_sessions',[...M.values()].sort((p,q)=>(q.last||q.start)-(p.last||p.start)).slice(0,80)); }

const norm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\*\*|\[\[|\]\]/g,'');
let SIDX=null;
function sidx(){ if(SIDX) return SIDX; SIDX=Q.map(q=>{ const cs=q.case?(DATA.cases[q.case]||[]).map(l=>l.p||'').join(' '):'';
  const parts=[['Énoncé',q.stem],...(q.opts||[]).map(([k,t])=>['Proposition '+k,t]),...(q.left||[]).map(([k,t])=>['Item '+k,t]),...Object.entries(q.p||{}).map(([k,v])=>['Explication '+k,v[1]]),['Commentaire',q.g||''],['Cas clinique',cs],['Résumé',q.cs||'']];
  return {q,parts:parts.map(([l,t])=>[l,t,norm(t)]),all:norm(parts.map(x=>x[1]).join(' ')+' '+CN[q.c])}; }); return SIDX; }
function searchQ(term){ const w=norm(term).split(/\s+/).filter(x=>x.length>1); if(!w.length) return [];
  return sidx().filter(e=>w.every(x=>e.all.includes(x))).map(e=>{ const hit=e.parts.find(p=>w.some(x=>p[2].includes(x)))||e.parts[0]; return {q:e.q,where:hit[0],text:hit[1],w}; }); }
function snippet(text,w){ const t=String(text).replace(/\*\*|\[\[|\]\]/g,''); const n=norm(t); let i=-1; for(const x of w){ i=n.indexOf(x); if(i>=0) break; }
  const a=Math.max(0,i-60), b=Math.min(t.length,(i<0?0:i)+140); let sn=(a?'…':'')+t.slice(a,b)+(b<t.length?'…':''); let h=esc(sn);
  for(const x of w){ const nn=norm(sn); let out='', k=0, j; const src=sn; let res=''; let last=0; let idx=nn.indexOf(x);
    if(idx<0) continue; res=''; last=0; while(idx>=0){ res+=esc(src.slice(last,idx))+'<mark class="sm">'+esc(src.slice(idx,idx+x.length))+'</mark>'; last=idx+x.length; idx=nn.indexOf(x,last); } res+=esc(src.slice(last)); h=res; break; }
  return h; }
function resultsHTML(){ const r=searchQ(S.gq||''); if(!(S.gq||'').trim()) return `<p class="muted">Tapez un mot-clé : amiante, 21 jours, plombémie, TMP 42, Caplan…</p>`;
  if(!r.length) return `<p class="muted">Aucun résultat pour « ${esc(S.gq)} ».</p>`;
  return `<div class="row" style="margin-bottom:10px"><b>${r.length} question${r.length>1?'s':''}</b><button class="btn green" data-a="gsgo" data-v="0" style="margin-left:auto">§play§ Réviser ces questions</button></div>`+
   r.slice(0,80).map((x,i)=>`<button class="sres" data-a="gsgo" data-v="${i}"><div class="pills"><span class="pill">${esc(x.q.label)} · Q${x.q.n}</span><span class="pill" style="background:var(--surface2);color:var(--ink)">${esc(CN[x.q.c])}</span>${x.q.case?'<span class="pill o">Cas clinique</span>':''}</div>
     <div class="sst">${esc(x.q.stem.slice(0,150))}${x.q.stem.length>150?'…':''}</div><div class="ssn"><b>${esc(x.where)} :</b> ${snippet(x.text,x.w)}</div></button>`).join('')+(r.length>80?`<p class="muted">+ ${r.length-80} autres (affinez la recherche).</p>`:'');
}

    case 'srep': S.srep=+v; S.sdel=null; render(true); return;
    case 'srepx': S.srep=null; render(true); return;
    case 'sstar': { const L=sessList(); const x=L.find(y=>y.start===+v); if(x){ x.star=!x.star; LS.set('mt_sessions',L); if(S.sess&&S.sess.start===x.start) S.sess.star=x.star; } render(true); return; }
    case 'sdel': { if(S.sdel!==+v){ S.sdel=+v; render(true); return; } const L=sessList().filter(y=>y.start!==+v); LS.set('mt_sessions',L); if(S.sess&&S.sess.start===+v){ S.sess=L[0]||null; LS.set('mt_last',S.sess); } S.sdel=null; render(true); return; }
    case 'sredo': { const x=sessList().find(y=>y.start===S.srep); S.srep=null; if(!x) return;
      if(v==='reset'){ Object.assign(x,{i:0,ans:{},sel:{},finished:false,review:false,spent:0,qstart:Date.now(),end:x.mode==='exam'?Date.now()+x.ids.length*60000:0}); delete x.endAt; S.sess=x; save(); S.view='quiz'; S.open=new Set(); render(); scrollTo(0,0); return; }
      const f={ok:i=>x.ans[i]&&x.ans[i].ok, ko:i=>x.ans[i]&&!x.ans[i].ok, un:i=>!x.ans[i], kun:i=>!(x.ans[i]&&x.ans[i].ok), all:()=>true}[v];
      const lab={ok:'Justes',ko:'Fausses',un:'Non répondues',kun:'À revoir',all:'Reprise'}[v];
      const prev=S.mode; S.mode=x.mode; newSession(x.ids.filter(f),lab+' · '+x.title); S.mode=prev; return; }
    case 'resume': if(S.sess){ S.view='quiz'; S.sess.qstart=Date.now(); render(); scrollTo(0,0);} return;
    case 'result': S.view='end'; render(); return;
    case 'home': S.view='home'; S.drop=null; render(); scrollTo(0,0); return;
    case 'opt': { const q=cur(); if(showCorr()&&s.ans[q.id]) return; if(s.mode==='exam'&&s.finished) return;
      const sel=s.sel[q.id]=s.sel[q.id]||{ch:[]}; const st=new Set(sel.ch||[]);
      if(q.type==='multi') st.has(v)?st.delete(v):st.add(v); else { if(st.has(v)) st.clear(); else { st.clear(); st.add(v); } }
      sel.ch=[...st]; if(s.mode==='exam') delete s.ans[q.id]; save(); render(true); return; }
    case 'mpick': { const q=cur(); if(showCorr()&&s.ans[q.id]) return; const [L,k]=v.split('|'); const sel=s.sel[q.id]=s.sel[q.id]||{m:{}}; sel.m=sel.m||{};
      const multi=Object.values(q.corr).some(x=>x.length>1); let g=new Set(sel.m[L]||[]);
      if(g.has(k)) g.delete(k); else { if(!multi) g.clear(); g.add(k); } sel.m[L]=[...g]; save(); render(true); return; }
    case 'validate': validate(); return;
    case 'strike': { const q=cur(); s.strk=s.strk||{}; const L=s.strk[q.id]=s.strk[q.id]||[]; const i=L.indexOf(v); if(i<0){ L.push(v); const sel=s.sel[q.id]; if(sel&&sel.ch) sel.ch=sel.ch.filter(x=>x!==v); } else L.splice(i,1); save(); render(true); return; }
    case 'why': S.open.has(v)?S.open.delete(v):S.open.add(v); render(true); return;
    case 'next': if(s.i+1<s.ids.length) go(s.i+1); else { if(s.mode==='exam'&&!s.finished){ s.endAt=Date.now(); finishExam(); } else { S.view='end'; render(); scrollTo(0,0);} } return;
    case 'prev': go(s.i-1); return;
    case 'goto': go(+v); return;
    case 'jump': S.view='quiz'; go(+v); return;
    case 'finish': s.endAt=Date.now(); finishExam(); return;
    case 'review': S.view='quiz'; go(0); return;
    case 'redo': { const l=s.ids.filter(i=>!(s.ans[i]&&s.ans[i].ok)); newSession(l,'Erreurs · '+s.title); return; }
    case 'fav': { const q=cur(); S.fav.has(q.id)?S.fav.delete(q.id):S.fav.add(q.id); LS.set('mt_fav',[...S.fav]); render(true); return; }
    case 'note': S.shownote=!S.shownote; render(true); if(S.shownote){ const na=document.getElementById('notearea'); if(na) na.focus(); } return;
    case 'tmp': { const t=+v; S.hideT.has(t)?S.hideT.delete(t):S.hideT.add(t); render(true); return; }
    case 'zoom': S.zoom=v; S.zk=100; try{history.pushState({z:1},'')}catch(e){} render(true); return;
    case 'zk': S.zk=Math.max(60,Math.min(300,(S.zk||100)+(+v)*40)); render(true); return;
    case 'noop': return;
    case 'hlrm': return;
    case 'unzoom': if(!S.zoom) return; S.zoom=null; render(true); try{ if(history.state&&history.state.z) history.back(); }catch(e){} return;
  }
}
document.addEventListener('click',async e=>{
  const pl=e.target.closest('a[data-pdf]');
  if(pl && window.claude && window.claude.use){ e.preventDefault(); const f=pl.dataset.pdf; const span=pl.querySelector('div span'); const old=span.textContent;
    try{ const dl=await window.claude.use('downloads'); if(!dl) throw 0; span.textContent='Préparation…'; const blob=await (await fetch(f)).blob(); await dl.save({filename:f,data:blob}); span.textContent=old; }
    catch(err){ span.textContent=err&&err.code==='declined'?old:'Téléchargement indisponible ici'; setTimeout(()=>{span.textContent=old},2500); } return; }
  if(S.drop && !e.target.closest('.pick')){ S.drop=null; render(true); return; }
  const el=e.target.closest('[data-a]'); if(!el||el.disabled) return;
  if(e.target.closest('summary')) return;
  if(el.dataset.a==='clr'){ act('clr',el.dataset.v,el,e); return; }
  act(el.dataset.a,el.dataset.v,el,e);
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'){ if(e.key==='Escape'){S.drop=null;render(true);} return; }
  if(e.key==='/'&&S.view!=='quiz'&&!(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')){e.preventDefault();act('nav','search');return}
  if(S.sbOpen&&e.key==='Escape'){S.sbOpen=false;render(true);return}
  if(S.zoom&&(e.key==='Escape'||e.key==='Esc')){e.preventDefault();act('unzoom');return}
  if(S.view==='flash'&&S.fl){ if(e.key===' '||e.key==='Enter'){e.preventDefault();act('fflip');return} if(e.key==='ArrowRight'){act('fnext');return} if(e.key==='ArrowLeft'){act('fprev');return}
    if(S.fl.flip&&(e.key==='1'||e.key==='2')){act('fgrade',e.key==='1'?'ko':'ok');return} return; }
  if(S.view!=='quiz') return; const q=cur();
  if(e.key==='Enter'){ e.preventDefault(); const s=S.sess; if(s.mode==='rev'&&!s.ans[q.id]) validate(); else act('next'); return; }
  if(e.key==='ArrowRight'){ act('next'); return; } if(e.key==='ArrowLeft'){ act('prev'); return; }
  if(q.type!=='match'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){ const k=e.key.toUpperCase();
    if(q.opts.some(o=>o[0]===k)) act('opt',k);
    else if(/^[1-9]$/.test(k)&&q.opts[+k-1]) act('opt',q.opts[+k-1][0]); }
});
render();
try{ const m=sessionStorage.getItem('mt_toast'); if(m){ sessionStorage.removeItem('mt_toast'); setTimeout(()=>toast(m),300); } }catch(e){}
})();
</script>
